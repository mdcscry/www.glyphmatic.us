		<style type="text/css">

			/* Emoji needs to be incuded for blocks with mixed emoji/not emoji
			   Could have brought it in from glyphmatic.us.css but that's overkill */
			@import url('https://fonts.googleapis.com/css2?family=Noto+Emoji&display=swap');

			.noto-emoji-regular {
				font-family: "Noto Emoji", sans-serif;
				font-optical-sizing: auto;
				font-weight: 400;
				font-style: normal;
			}

			table { 
					border-bottom:50px solid #110c11;
					border-radius:20px;			
			}


			div {
				display: inline;
			}

			tr.border_bottom td {
  				border-bottom:1pt dotted red;
  
			}

			[title] {
				border-bottom: 1px solid rgba(0, 0, 0, 0.2);
				border-radius:1px;
				position: relative;
			}
			body.touched [title] > * {
				user-select: none;
			}
			body.touched [title]:hover > * {
				user-select: auto
			}
			body.touched [title]:hover:after {
				font-size:.12em;
				position: absolute;
				top: 100%;
				right: 0%;
				content: attr(title);
				border: 1px solid rgba(0, 0, 0, 0.2);
				background-color: white;
				padding: 0.1em;
				z-index: 1;
			}

			body { background-color: black;color: orange }

			/* google fonts @import version doesn't have complete coverage */
			@font-face {
				font-family: 'Noto Sans Full';
				src: url('../tff/NotoSans-Regular.ttf') format('truetype');
			}

	<script type="text/javascript">

		// SINGLE GLYPH TEST MODE
		var TEST_MODE = false;
		var TEST_GLYPH = "1F383";  // Change this to the hex code you want to test
		var TEST_BLOCK = "Miscellaneous Symbols and Pictographs";  // Change this to the block name

		var cssImportRule = document.createElement('style');
		var cssFontFamilyRule = document.createElement('style');	
		var cssFontFaceRule = document.createElement('style');		
		document.getElementsByTagName('body')[0].appendChild(cssImportRule);
		document.getElementsByTagName('body')[0].appendChild(cssFontFamilyRule);
		document.getElementsByTagName('body')[0].appendChild(cssFontFaceRule);		
		var cssImportStyle = document.styleSheets[1];
		var cssImportRules=cssImportStyle.cssRules;
		var cssFontFamilyStyle = document.styleSheets[2];
		var cssFontFamilyRules=cssFontFamilyStyle.cssRules;
		var cssFontFaceStyle = document.styleSheets[3];
		var cssFontFaceRules=cssFontFaceStyle.cssRules;		

		document.body.addEventListener('touchstart', function() {
  			document.body.classList.add('touched');
		});
		//console.log("cssImportRules: "+  cssImportRules.length)

		function attach_goog_font(font){
			gf_prefix = '//fonts.googleapis.com/css?family='
            font_formatted = font.replace(/ /g,"+")
            	//console.log("font_formatted: ",font_formatted)
			newRule='@import url(https:'+ gf_prefix + font_formatted+');';
				//console.log("import: " + newRule)
			cssImportStyle.insertRule(newRule,cssImportRules.length);	
		}

		function attach_local_font(font, directory = 'tff') {
			console.log('in attach local font');
			const font_formatted = font.replace(/ /g, "");
			const style = document.createElement('style');
			const filename = directory === 'tff' ? `${font_formatted}-Regular.ttf` : `${font_formatted}.ttf`;
			style.textContent = `@font-face {font-family: "${font}"; src: url('/${directory}/${filename}');}`;
			console.log(style.textContent);
			document.head.appendChild(style);
		}

		function attach_font_family(font, spid){
			let fontStack;
			
			// Determine generic fallback based on font name
			const genericFallback = font.includes('Serif') ? 'serif' : 'sans-serif';
			console.log("Font: " + font)
			// If it's a Noto Symbols font, prepend Noto Emoji for BW emoji handling
			if (font.includes('Noto Sans Symbols') //|| font.includes('Symbola')
				|| font.includes('Noto Sans Symbols 2')) {
				fontStack = `'Noto Emoji', 'c', ${genericFallback}`;
			} else if ( font.includes('Symbola-local')) {
				console.log('in symbola logic')
				fontStack = `'${font}','Noto Sans Symbols','Noto Sans Symbols 2','Noto Emoji', ${genericFallback}`;				
			} else {
				fontStack = `'${font}', ${genericFallback}`;
			}
			
			var newRule = `font-family: ${fontStack};`;
			sid = `span#sid${spid}`;
			cssFontFamilyStyle.insertRule(`${sid} { ${newRule} }`, cssFontFamilyRules.length);
		}


		function git_the_random(seed,array){
			val = Math.round((array[seed].length-1)*Math.random())
			//console.log("val: "+val)
			return(val)
		}		

	 	function spectacular(start,number_of_glyphs) {
	 		spans_string = ''

	 		for (i=start ; i <= start+number_of_glyphs ;i++){	

	 			if (TEST_MODE) {
	 				// Use the test glyph and block
					console.log("in TEST_MODE")
	 				block = TEST_BLOCK;
	 				glyph = TEST_GLYPH;
	 				glyph_val = block_hex[block].indexOf(glyph);
	 				if (glyph_val === -1) {
	 					console.error("Test glyph not found in block!");
	 					glyph_val = 0;
	 				}
	 			} else {
	 				// Original random behavior
	 				random_number = Math.round((blocks.length-1)*Math.random())
	 				block = blocks[random_number] 

		 				//console.log(random_number)
		 				//console.log(block)
		 			glyph_val = git_the_random(block,block_hex)				
					glyph = block_hex[block][glyph_val]
	 			}
					//console.log(glyph)
				glyph_desc = block_hex_desc[block][glyph_val].replace(/ /g,"_")

				font_du_jour = get_more_spectacular(block)
				
				if (font_du_jour.split("-")[1]=='local'){
					const parts = font_du_jour.split("-");
					const fontName = parts[0];
					const directory = parts[2] || 'tff'; // defaults to 'tff' if not specified
					attach_local_font(fontName, directory);
				} else {
					attach_goog_font(font_du_jour)	
				}	
	

				attach_font_family(font_du_jour.split("-")[0],i)

		 		spans_string = spans_string + "<td><span id='sid"+ i + "' title='" + glyph + "-" + glyph_desc + "'>&#x" + glyph + ";</span></td>";
				}
			return(spans_string)
	 	}


	 	function get_more_spectacular(block){
				console.log('block: ' + block)
		 		font_array = block_lang[block]

		 		super_font_seed = Math.round((font_array.length-1)*Math.random())
		 		    //console.log("super_font_seed: " + super_font_seed)
		 		font_lookup = font_array[super_font_seed]
	 				//console.log("font_lookup: " + font_lookup)
	 				//console.log("lang_font: " + lang_font[font_lookup])	
		 		font_seed = Math.round((lang_font[font_lookup].length-1)*Math.random())
		 			//console.log("font_seed: " + 	font_seed)		 		
		 		font = lang_font[font_lookup][font_seed]
		 			//console.log("font: ",font)
	 			return(font)	
	 	}	 		

	 	function attach_a_local_file_font(font){
			if (font_du_jour.split("-")[1] == 'local') {
				const parts = font_du_jour.split("-");
				const fontName = parts[0];
				const directory = parts[2] || 'tff'; // defaults to 'tff' if not specified
				attach_local_font(fontName, directory);
			} else {
				attach_goog_font(font_du_jour);
			}
	 	}





	 	//  font = git_the_random(block,block_lang)

	      function jsWait() {
            if (typeof blockHexWait == "undefined" ||
                typeof blockHexDescWait == "undefined"  ||

        jsWait();
