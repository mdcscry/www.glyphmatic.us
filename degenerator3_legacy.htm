<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <TITLE>3.DeGenerator-TwoBlocks</TITLE>

    <STYLE type="text/css">
        @font-face {
            font-family: 'Symbols2';
            src: url('./tff/NotoSansSymbols2-Regular.ttf');
        }

        body {
            font-family: 'Symbols2';
            margin: 0;
            overflow: hidden; /* Prevent scrollbars */
            width: 100vw;    /* Ensure body takes full viewport width */
            height: 100vh;   /* Ensure body takes full viewport height */
            display: flex;   /* Use flexbox to easily arrange the two blocks */
        }

        .block {
            position: relative; /* Needed for mix-blend-mode to blend with body's background */
                                /* and could be used for nested elements if any, though none now */
            width: 50vw;        /* Each block takes half the viewport width */
            height: 100vh;      /* Each block takes full viewport height */
            display: flex;      /* Use flexbox to center character Glyph */
            align-items: center;    /* Center vertically */
            justify-content: center; /* Center horizontally */
            overflow: hidden;   /* Hide any character overflow */

            /* Transitions for smooth visual changes (optional but nice) */
            transition: background-color 10s ease, color 5s ease, font-size 1s ease;
        }

        .block-char {
            font-size: 35vw; /* Large font size, scaled by viewport width */
            line-height: 1;  /* Ensure leading is tight around the character */
            opacity: 0.8;    /* A bit of transparency to enhance blending */
            /* mix-blend-mode applied dynamically via JS */
        }
    </STYLE>
</head>

<body>

    <div id="block1" class="block">
        <span class="block-char"></span>
    </div>
    <div id="block2" class="block">
        <span class="block-char"></span>
    </div>

    const block1 = document.getElementById('block1');
    const block2 = document.getElementById('block2');

    const char1 = block1.querySelector('.block-char');
    const char2 = block2.querySelector('.block-char');

    // Function to update a block's content and style
    function updateBlock(blockElement, charElement) {
        const randomColor = mycolors[Math.round((mycolors.length - 1) * Math.random())];
        const randomBgColor = mycolors[Math.round((mycolors.length - 1) * Math.random())];
        const randomChar = '&#x' + myarray[Math.round((myarray.length - 1) * Math.random())] + ';';
        const randomBlendMode = mixBlendModes[Math.floor(Math.random() * mixBlendModes.length)];

        blockElement.style.backgroundColor = randomBgColor;
        blockElement.style.mixBlendMode = randomBlendMode; // Apply blend mode to the block itself

        charElement.style.color = randomColor;
        charElement.innerHTML = randomChar;
        // Optionally, apply blend mode to the character too, or let it inherit from parent
        // charElement.style.mixBlendMode = mixBlendModes[Math.floor(Math.random() * mixBlendModes.length)];
    }

    // Initial setup for the two blocks
    updateBlock(block1, char1);
    updateBlock(block2, char2);

    // Set intervals for continuous random changes
    window.setInterval(function() {
        updateBlock(block1, char1);
    }, fontChangeRate + Math.random() * 200); // Add a small random delay for slight desynchronization

    window.setInterval(function() {
        updateBlock(block2, char2);
    }, fontChangeRate + Math.random() * 200); // Add a small random delay for slight desynchronization
