            width: 100vw; /* Ensure body takes full viewport width */
            height: 100vh; /* Ensure body takes full viewport height */

        /* General DIV styling, overwritten by inline styles for specific elements */

    document.body.style.backgroundColor = mycolors[Math.round((mycolors.length - 1) * Math.random())];

    // Define the desired number of columns to span the viewport width
    const DESIRED_GRID_COLS = 15; // You can change this number to adjust character density

    var containerId = [];
    var containerCount = 0; // Will be calculated in createContainers()

    // Function to create and append container divs
    function createContainers() {
        // Clear existing containers if re-running (e.g., on resize)
        document.body.innerHTML = '';

        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;

        // Calculate cell dimensions. Math.floor ensures whole pixels, preventing rendering artifacts.
        const cellEffectiveWidth = Math.floor(viewportWidth / DESIRED_GRID_COLS);
        // Calculate how many rows will fit based on the calculated cell width to maintain aspect ratio
        const DESIRED_GRID_ROWS = Math.floor(viewportHeight / cellEffectiveWidth);

        // Update containerCount with the new grid dimensions
        containerCount = DESIRED_GRID_COLS * DESIRED_GRID_ROWS;

        for (let i = 0; i < containerCount; i++) {
            let containerName = 'container' + (i + 1);
            containerId[i] = document.createElement("div");
            document.body.appendChild(containerId[i]);
            containerId[i].id = containerName + '-div0';
            containerId[i].innerHTML = '&#x' + myarray[Math.round((myarray.length - 1) * Math.random())] + ';';

            // style for the parent container div
            containerId[i].style.position = 'relative';
            containerId[i].style.cssFloat = 'left'; // Float to arrange them in a grid
            containerId[i].style.opacity = 0.5;

            // Apply dynamically calculated sizes
            containerId[i].style.fontSize = cellEffectiveWidth + 'px';
            containerId[i].style.width = cellEffectiveWidth + 'px';
            containerId[i].style.height = cellEffectiveWidth + 'px'; // Keep cells square
            containerId[i].style.lineHeight = 1; // Ensures text occupies full height with font-size

            containerId[i].style.textAlign = 'center';
            containerId[i].style.color = mycolors[Math.round((mycolors.length - 1) * Math.random())];
            containerId[i].style.mixBlendMode = mixBlendModes[Math.floor(Math.random() * mixBlendModes.length)];

            var divId = [];

            for (let divCounter = 1; divCounter <= 8; divCounter++) {
                let elementName = containerName + '-div' + divCounter;
                divId[divCounter] = document.createElement("div");
                divId[divCounter].innerHTML = '&#x' + myarray[Math.round((myarray.length - 1) * Math.random())] + ';';

                containerId[i].appendChild(divId[divCounter]);
                divId[divCounter].id = elementName;
                divId[divCounter].style.position = 'absolute';
                // No cssFloat needed for absolutely positioned elements
                divId[divCounter].style.color = mycolors[Math.round((mycolors.length - 1) * Math.random())];
                divId[divCounter].style.opacity = 0.65;
                divId[divCounter].style.lineHeight = 1;
                divId[divCounter].style.fontSize = cellEffectiveWidth + 'px'; // Match parent's font size
                divId[divCounter].style.top = '0'; // Crucial for perfect overlap
                divId[divCounter].style.left = '0'; // Crucial for perfect overlap
                divId[divCounter].style.width = '100%'; // Child takes 100% of parent's width
                divId[divCounter].style.height = '100%'; // Child takes 100% of parent's height
                divId[divCounter].style.backgroundColor = 'transparent'; // Important for blend modes

                // Apply a random mix-blend-mode to each child div
                divId[divCounter].style.mixBlendMode = mixBlendModes[Math.floor(Math.random() * mixBlendModes.length)];
            }
        }
    }

    createContainers(); // Initial creation of the grid

    // Handle window resizing to re-calculate and re-render grid
    window.addEventListener('resize', function() {
        createContainers(); // Re-create all containers on resize
    });

    // Interval for updating child divs
    window.setInterval(function () {
        // Corrected calculation for random container index to match 0-indexed array use
        var rndDivContainerIndex = Math.round(Math.random() * (containerCount - 1));
        var rndDivChild = Math.round(Math.random() * 7 + 1); // 1 to 8

        // Build the element ID using the 1-based naming convention
        var elementName = 'container' + (rndDivContainerIndex + 1) + '-div' + rndDivChild;
        var node = document.getElementById(elementName);

        if (node) {
            try {
                node.style.color = mycolors[Math.round((mycolors.length - 1) * Math.random())];
                node.innerHTML = '&#x' + myarray[Math.round((myarray.length - 1) * Math.random())] + ';';
                node.style.mixBlendMode = mixBlendModes[Math.floor(Math.random() * mixBlendModes.length)];
            } catch (e) {
                console.error("Error updating element " + elementName + ": " + e.message);
            }
        }
    }, fontChangeRate); // Use fontChangeRate for the interval delay

    // Interval to update the main (div0) container's character and color occasionally
    window.setInterval(function() {
        var rndDivContainerIndex = Math.round(Math.random() * (containerCount - 1));
        var elementName = 'container' + (rndDivContainerIndex + 1) + '-div0';
        var node = document.getElementById(elementName);

        if (node) {
            try {
                node.style.color = mycolors[Math.round((mycolors.length - 1) * Math.random())];
                node.innerHTML = '&#x' + myarray[Math.round((myarray.length - 1) * Math.random())] + ';';
                node.style.mixBlendMode = mixBlendModes[Math.floor(Math.random() * mixBlendModes.length)];
            } catch (e) {
                console.error("Error updating container element " + elementName + ": " + e.message);
            }
        }
    }, fontChangeRate * 2); // Update parent containers less frequently (e.g., twice the rate)

</script>
