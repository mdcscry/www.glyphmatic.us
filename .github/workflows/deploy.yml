name: Deploy to GCS
on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - uses: google-github-actions/upload-cloud-storage@v1
        with:
          path: '.'
          destination: 'www.glyphmatic.us'
          parent: false
