<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Mask in DIV</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }

        .masked-div {
            width: 400px;
            height: 400px;
            /* The background of small om glyphs */
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 24 24" fill="%23a0a0a0"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 14c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/></svg>');
            background-repeat: repeat;
            
            /* Reference the inline SVG mask with the large om glyph */
            mask-image: url(#om-mask);
            /* Vendor prefix for broader compatibility */
            -webkit-mask-image: url(#om-mask);

            /* Ensures the large mask covers the div area */
            mask-size: cover;
            -webkit-mask-size: cover;
        }

        /* The SVG containing the mask definition should be in the HTML but can be hidden visually */
        .svg-container {
            position: absolute;
            width: 0;
            height: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div class="masked-div"></div>

    <!-- Inline SVG for the mask definition -->
    <div class="svg-container">
        <svg width="0" height="0" xmlns="http://www.w3.org/2000/svg">
            <mask id="om-mask" mask-type="luminance">
                <!-- White areas of the mask are visible; black/transparent areas are hidden -->
                <!-- The path data below is for a simple "om" glyph (modify as needed) -->
                <path fill="white" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 14c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/>
            </mask>
        </svg>
    </div>

</body>
</html>
