<!DOCTYPE html>
<html>
	<head>
		<title>Unicode Glyph Display</title>
		<style type="text/css">

			@import url('https://fonts.googleapis.com/css2?family=Noto+Emoji&display=swap');

			.noto-emoji-regular {
				font-family: "Noto Emoji", sans-serif;
				font-optical-sizing: auto;
				font-weight: 900;
				font-style: normal;
			}

			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				display: flex;
				justify-content: center;
				align-items: center;
				min-height: 100vh;
				font-size: clamp(2em, 8vw, 6em);
				padding: 20px;
				transition: background-color 0.3s ease;
			}

			.glyph-container {
				display: grid;
				grid-template-columns: repeat(4, 1fr);
				gap: 0px;
				padding: 15px;
				background-color: #FAFAD2;
				width: 37.5vw;
				height: 95vh;
				border-radius: 25px;
				overflow: hidden;
			}

			.glyph-cell {
				display: grid;
				justify-content: center;
				align-items: center;
				border-radius: 0px;
				padding: 0px;
				cursor: pointer;
				transition: all 0.2s ease;
				background: transparent;
			}

			.glyph-cell:hover {
				transform: scale(1.05);
			}

			.glyph-cell span {
				font-size: 1em;
				line-height: 1;
			}

			[title] {
				border-bottom: 0px solid rgba(255, 255, 255, 0.2);
				border-radius: 1px;
				position: relative;
			}

			body.touched [title] > span {
				user-select: none;
			}

			body.touched [title]:hover > span {
				user-select: auto
			}
			
			body.touched [title]:hover:after {
				font-size: 0.15em;
				position: absolute;
				top: 100%;
				right: 0%;
				content: attr(title);
				border: 0px solid rgba(0, 0, 0, 0.3);
				background-color: rgba(0, 0, 0, 0.8);
				color: white;
				padding: 0.2em 0.4em;
				z-index: 1;
				white-space: nowrap;
				border-radius: 4px;
			}

			@font-face {
				font-family: 'Noto Sans Full';
				src: url('../tff/NotoSans-Regular.ttf') format('truetype');
			}

		</style>
		<script type="text/JavaScript" src="../css_js/block_hex_no_punct_17.js"></script>

			// TEST MODE - set to false for production

			// Ancient hieroglyphic-like scripts
			TEST_BLOCKS = ["Linear A", "Linear B Ideograms", "Linear B Syllabary",

			// Random off-white/neutral page background colors
			let currentBgColor = '#8b6f47';

			function generatePageBackgroundColor() {
				return WEB_SAFE_COLORS[Math.floor(Math.random() * WEB_SAFE_COLORS.length)];
			}

			// Generate container background color with low contrast (~0.25) to page background
            function generateGridBackgroundColor(pageColor) {
                const rgb = hexToRgb(pageColor);
                
                // Slightly desaturate and shift brightness by ±10-15%
                const h = rgbToHsl(rgb).h;
                const s = rgbToHsl(rgb).s * 0.5; // Cut saturation in half
                const l = rgbToHsl(rgb).l + (Math.random() - 0.5) * 0.2; // Vary lightness by ±10%
                
                return hslToHex(h, s, l);
            }

            function hexToRgb(hex) {
                const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return result ? {
                    r: parseInt(result[1], 16),
                    g: parseInt(result[2], 16),
                    b: parseInt(result[3], 16)
                } : null;
            }

            function rgbToHsl(rgb) {
                let r = rgb.r / 255;
                let g = rgb.g / 255;
                let b = rgb.b / 255;
                const max = Math.max(r, g, b), min = Math.min(r, g, b);
                let h, s, l = (max + min) / 2;

                if (max === min) {
                    h = s = 0;
                } else {
                    const d = max - min;
                    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                    switch (max) {
                        case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
                        case g: h = ((b - r) / d + 2) / 6; break;
                        case b: h = ((r - g) / d + 4) / 6; break;
                    }
                }
                return { h, s, l };
            }

            function hslToHex(h, s, l) {
                const c = (1 - Math.abs(2 * l - 1)) * s;
                const x = c * (1 - Math.abs((h * 6) % 2 - 1));
                const m = l - c / 2;
                let r = 0, g = 0, b = 0;
                
                if (h < 1/6) [r, g, b] = [c, x, 0];
                else if (h < 2/6) [r, g, b] = [x, c, 0];
                else if (h < 3/6) [r, g, b] = [0, c, x];
                else if (h < 4/6) [r, g, b] = [0, x, c];
                else if (h < 5/6) [r, g, b] = [x, 0, c];
                else [r, g, b] = [c, 0, x];
                
                const toHex = (n) => {
                    const hex = Math.round((n + m) * 255).toString(16);
                    return hex.length === 1 ? '0' + hex : hex;
                };
                return '#' + toHex(r) + toHex(g) + toHex(b);
            }

			// Initialize glyph palette with 4 colors that have good contrast to container
			function initializePalette() {
				const bgColor = currentBgColor;
				const minContrast = 5;
                const maxContrast = 6;
				
				let validColors = WEB_SAFE_COLORS.filter(color => 
					getContrastRatio(color, bgColor) >= minContrast
                    && getContrastRatio(color, bgColor) <= maxContrast
				);
				
				selectedPalette = validColors
					.sort(() => Math.random() - 0.5)
					.slice(0, 4);
				
				console.log('Selected glyph palette: ' + selectedPalette);
				return selectedPalette;
			}

			function generateGlyphColor() {
				return selectedPalette[Math.floor(Math.random() * selectedPalette.length)];
			}

			// Apply random palette
			function applyPalette() {
				let pageColor = generatePageBackgroundColor();
				let gridColor = generateGridBackgroundColor(pageColor);
				
				document.body.style.backgroundColor = pageColor;
				currentBgColor = gridColor;
			}

			var cssImportRule = document.createElement('style');
			var cssFontFamilyRule = document.createElement('style');	
			var cssFontFaceRule = document.createElement('style');		
			document.getElementsByTagName('body')[0].appendChild(cssImportRule);
			document.getElementsByTagName('body')[0].appendChild(cssFontFamilyRule);
			document.getElementsByTagName('body')[0].appendChild(cssFontFaceRule);		
			var cssImportStyle = document.styleSheets[1];
			var cssImportRules = cssImportStyle.cssRules;
			var cssFontFamilyStyle = document.styleSheets[2];
			var cssFontFamilyRules = cssFontFamilyStyle.cssRules;
			var cssFontFaceStyle = document.styleSheets[3];
			var cssFontFaceRules = cssFontFaceStyle.cssRules;

			document.body.addEventListener('touchstart', function() {
  				document.body.classList.add('touched');
			});

			function attach_goog_font(font) {
				gf_prefix = '//fonts.googleapis.com/css?family='
				font_formatted = font.replace(/ /g, "+")
				newRule = '@import url(https:' + gf_prefix + font_formatted + ');';
				cssImportStyle.insertRule(newRule, cssImportRules.length);	
			}

			function attach_local_font(font, directory = 'tff') {
				const font_formatted = font.replace(/ /g, "");
				const style = document.createElement('style');
				let filename;
				if (directory === 'otf') {
					filename = `${font_formatted}-Regular.otf`;
				} else if (directory === 'tff') {
					filename = `${font_formatted}-Regular.ttf`;
				} else {
					filename = `${font_formatted}.ttf`;
				}
				style.textContent = `@font-face {font-family: "${font}"; src: url('/${directory}/${filename}');}`;
				document.head.appendChild(style);
			}

			function git_the_random(seed, array) {
				val = Math.round((array[seed].length - 1) * Math.random())
				return(val)
			}

			function generateGlyph() {
				if (TEST_MODE) {
					if (Array.isArray(TEST_BLOCKS) && TEST_BLOCKS.length > 0) {
						random_number = Math.round((TEST_BLOCKS.length - 1) * Math.random());
						block = TEST_BLOCKS[random_number];
					} else {
						block = TEST_BLOCK;
					}
			
					if (TEST_GLYPH) {
						glyph = TEST_GLYPH;
						glyph_val = block_hex[block].indexOf(glyph);
						if (glyph_val === -1) {
							console.error("Test glyph not found in block!");
							glyph_val = git_the_random(block, block_hex);
							glyph = block_hex[block][glyph_val];
						}
					} else {
						glyph_val = git_the_random(block, block_hex);
						glyph = block_hex[block][glyph_val];
					}
				} else {
					random_number = Math.round((blocks.length - 1) * Math.random())
					block = blocks[random_number] 
					glyph_val = git_the_random(block, block_hex)				
					glyph = block_hex[block][glyph_val]
				}

				glyph_desc = block_hex_desc[block][glyph_val].replace(/ /g, "_")
				font_du_jour = get_more_spectacular(block)
					
				if (font_du_jour.split("-")[1] == 'local') {
					const parts = font_du_jour.split("-");
					const fontName = parts[0];
					const directory = parts[2] || 'tff';
					attach_local_font(fontName, directory);
				} else {
					attach_goog_font(font_du_jour)	
				}	

				const fontFamily = font_du_jour.split("-")[0];
				const genericFallback = fontFamily.includes('Serif') ? 'serif' : 'sans-serif';
				let fontStack;
				
				if (fontFamily.includes('Noto Sans Symbols') 
					|| fontFamily.includes('Noto Sans Symbols 2')
					|| fontFamily.includes('BabelStone Pseudographica')
					|| fontFamily.includes('Quivira')
					|| fontFamily.includes('Everson Mono')
					|| fontFamily.includes('DejaVu')	
					|| fontFamily.includes('Segoe')	
					|| fontFamily.includes('Code2000')	
					|| fontFamily.includes('Fluent')
					|| fontFamily.includes('Open Moji')
				) {
					fontStack = `'${fontFamily}','Noto Emoji','Symbola','Noto Sans Symbols 2', ${genericFallback}`;
				} else if (fontFamily.includes('Symbola')) {
					fontStack = `'${fontFamily}','Noto Sans Symbols','Noto Sans Symbols 2','Noto Emoji','Noto Sans Math', ${genericFallback}`;
				} else {
					fontStack = `'${fontFamily}','Noto Sans Full', ${genericFallback}`;
				}

				return {
					glyph: glyph,
					desc: glyph_desc,
					fontStack: fontStack
				};
			}

	 		function get_more_spectacular(block) {
				console.log('block: ' + block)
		 		font_array = block_lang[block]
		 		super_font_seed = Math.round((font_array.length - 1) * Math.random())
		 		font_lookup = font_array[super_font_seed]
		 		font_seed = Math.round((lang_font[font_lookup].length - 1) * Math.random())
		 		font = lang_font[font_lookup][font_seed]
	 			return(font)	
	 		}

	 		function populateGrid() {
				const grid = document.getElementById('glyphGrid');
				grid.innerHTML = '';
				grid.style.backgroundColor = currentBgColor;
				grid.style.borderColor = currentBgColor;

				for (let i = 0; i < 20; i++) {
					const glyphData = generateGlyph();
					const glyphColor = generateGlyphColor();
					
					const cell = document.createElement('div');
					cell.className = 'glyph-cell';
					cell.title = glyphData.glyph + '-' + glyphData.desc;
					cell.style.backgroundColor = currentBgColor;

					const span = document.createElement('span');
					span.style.fontFamily = glyphData.fontStack;
					span.style.color = glyphColor;
					span.innerHTML = '&#x' + glyphData.glyph + ';';

					cell.appendChild(span);
					grid.appendChild(cell);
				}
			}
