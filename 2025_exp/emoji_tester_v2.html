<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../css_js/glyphmatic-fonts.css">    
    <title>Emoji Font Combo Tester</title>
    
    <!-- Replace these script tags with your actual emoji data files -->
    <script src="../css_js/emoji_versions_data2.js"></script>

    
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #1a1a1a;
            color: #e0e0e0;
        }
        
        .controls {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #2a2a2a;
            border-radius: 5px;
        }
        
        select, button {
            padding: 8px;
            margin-right: 15px;
            font-size: 14px;
            background-color: #3a3a3a;
            color: #e0e0e0;
            border: 1px solid #555;
            border-radius: 3px;
            min-width: 200px;
        }
        
        button {
            min-width: auto;
            cursor: pointer;
        }
        
        button:hover {
            background-color: #4a4a4a;
        }
        
        label {
            margin-right: 10px;
            font-weight: bold;
        }
        
        #output {
            margin-top: 20px;
        }
        
        .emoji-row {
            margin-bottom: 30px;
            padding: 15px;
            background-color: #2a2a2a;
            border-radius: 5px;
        }
        
        .emoji-header {
            font-weight: bold;
            margin-bottom: 10px;
            color: #4a9eff;
            font-size: 14px;
        }
        
        .font-samples {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
        }
        
        .emoji-sample {
            text-align: center;
            padding: 10px;
            background-color: #3a3a3a;
            border-radius: 3px;
            cursor: pointer;
            transition: background-color 0.2s;
            border: 2px solid transparent;
            position: relative;
        }
        
        .emoji-sample:hover {
            background-color: #4a4a4a;
        }
        
        .emoji-sample.clicked {
            background-color: #5a2a2a;
            border: 2px solid #ff4444;
        }
        
        .emoji-char {
            font-size: 48px;
            display: block;
            margin-bottom: 5px;
        }
        
        .font-name {
            font-size: 11px;
            color: #999;
            word-break: break-word;
        }
        
        .exclusion-area {
            margin-top: 20px;
            padding: 15px;
            background-color: #2a2a2a;
            border-radius: 5px;
        }
        
        .exclusion-area h3 {
            margin-top: 0;
            color: #ff6b6b;
        }
        
        textarea {
            width: 100%;
            min-height: 200px;
            font-family: monospace;
            font-size: 12px;
            padding: 10px;
            background-color: #1a1a1a;
            color: #e0e0e0;
            border: 1px solid #555;
            border-radius: 3px;
            box-sizing: border-box;
        }
        
        .info {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
        
        .legend {
            margin-top: 10px;
            padding: 10px;
            background-color: #2a2a2a;
            border-radius: 5px;
            font-size: 12px;
        }
        
        .legend-item {
            display: inline-block;
            margin-right: 20px;
        }
        
        .legend-box {
            display: inline-block;
            width: 15px;
            height: 15px;
            border-radius: 3px;
            margin-right: 5px;
            vertical-align: middle;
        }
        
        .block-exclude-btn {
            margin-left: 10px;
            padding: 5px 10px;
            font-size: 12px;
            min-width: auto;
        }
        
        #fontCheckboxes {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 10px;
        }
        
        .font-checkbox-item {
            display: flex;
            align-items: center;
        }
        
        .font-checkbox-item input[type="checkbox"] {
            margin-right: 5px;
            cursor: pointer;
        }
        
        .font-checkbox-item label {
            cursor: pointer;
            margin: 0;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Emoji Font Combo Tester</h1>
    
    <div class="controls">
        <label for="versionSelect">Emoji Version:</label>
        <select id="versionSelect">
            <option value="">Select emoji version...</option>
            <option value="v1_0">v1.0</option>
            <option value="v2_0">v2.0</option>
            <option value="v3_0">v3.0</option>
            <option value="v4_0">v4.0</option>
            <option value="v5_0">v5.0</option>
            <option value="v11_0">v11.0</option>
            <option value="v12_0">v12.0</option>
            <option value="v12_1">v12.1</option>
            <option value="v13_0">v13.0</option>
            <option value="v13_1">v13.1</option>
            <option value="v14_0">v14.0</option>
            <option value="v15_0">v15.0</option>
            <option value="v15_1">v15.1</option>
            <option value="v16_0">v16.0</option>
        </select>
    </div>
    
    <div class="controls" id="blockExcludeControls" style="display: none;">
        <label>Exclude entire block for:</label>
        <div id="fontCheckboxes"></div>
    </div>
    
    <div class="legend">
        <div class="legend-item">
            <span class="legend-box" style="background-color: #5a2a2a; border: 2px solid #ff4444;"></span>
            <span>Confirmed broken (clicked)</span>
        </div>
    </div>
    
    <div id="output"></div>
    
    <div class="exclusion-area">
        <h3>Excluded Emoji+Font Combinations</h3>
        <textarea id="exclusionList" placeholder="Click broken emoji+font combos to build exclusion list..."></textarea>
        <div class="info">Copy this object into your insert17.js file</div>
    </div>

    <script>
        // Wait for emoji data files to load
        function jsWait() {
            if (typeof emoji_zwj_v1_0 === 'undefined' ||
                typeof emoji_zwj_v2_0 === 'undefined' ||
                typeof emoji_zwj_v3_0 === 'undefined') {
                window.setTimeout(jsWait, 100);
            } else {
                initializeTester();
            }
        }

        function initializeTester() {
            // Map version IDs to actual emoji arrays
            const emojiData = {
                'v1_0': emoji_zwj_v1_0,
                'v2_0': emoji_zwj_v2_0,
                'v3_0': emoji_zwj_v3_0,
                'v4_0': emoji_zwj_v4_0,
                'v5_0': emoji_zwj_v5_0,
                'v11_0': emoji_zwj_v11_0,
                'v12_0': emoji_zwj_v12_0,
                'v12_1': emoji_zwj_v12_1,
                'v13_0': emoji_zwj_v13_0,
                'v13_1': emoji_zwj_v13_1,
                'v14_0': emoji_zwj_v14_0,
                'v15_0': emoji_zwj_v15_0,
                'v15_1': emoji_zwj_v15_1,
                'v16_0': emoji_zwj_v16_0
            };

            const emojiFonts = [
                'Apple Color Emoji',
                'Noto Color Emoji',
                //'Noto Color Emoji Latest',
                'Noto Emoji',
                'Open Moji 0',
                //'Open Moji 1',
                'Segoe Emoji',
                //'Fluent Emoji Color',
                //'Open Moji Color',
                'Twitter Color Emoji',
                'Open Moji Black',
                'Emoji Two'
            ];

            const versionSelect = document.getElementById('versionSelect');
            const blockExcludeControls = document.getElementById('blockExcludeControls');
            const fontCheckboxes = document.getElementById('fontCheckboxes');
            const output = document.getElementById('output');
            const exclusionList = document.getElementById('exclusionList');
            
            // New structure: { 'Font Name': { blocks: ['v14_0'], sequences: ['1F3C3-...'] } }
            const excludedCombos = {
                'Segoe Emoji': {
                    blocks: ['v14_0', 'v15_0'],
                    sequences: ['1F3C3-200D-2640', '1F9D1-200D-1F4BB']
                },
                'Emoji Two': {
                    blocks: ['v14_0'],
                    sequences: ['1F468-200D-1F37C']
                }
            };
            let currentVersion = null;

            // Create font checkboxes
            emojiFonts.forEach(font => {
                const container = document.createElement('div');
                container.className = 'font-checkbox-item';
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.id = `exclude-${font.replace(/\s/g, '-')}`;
                checkbox.dataset.font = font;
                
                checkbox.addEventListener('change', function() {
                    toggleBlockExclusion(font, this.checked);
                });
                
                const label = document.createElement('label');
                label.htmlFor = checkbox.id;
                label.textContent = font;
                
                container.appendChild(checkbox);
                container.appendChild(label);
                fontCheckboxes.appendChild(container);
            });
            
            // Populate textarea with dummy data on load
            updateExclusionList();

            function emojiToHex(emoji) {
                const codePoints = [];
                for (const char of emoji) {
                    codePoints.push(char.codePointAt(0).toString(16).toUpperCase());
                }
                return codePoints.join('-');
            }

            function isExcluded(font, emojiHex, version) {
                if (!excludedCombos[font]) return false;
                
                // Check if entire block is excluded
                if (excludedCombos[font].blocks?.includes(version)) return true;
                
                // Check if specific sequence is excluded
                return excludedCombos[font].sequences?.includes(emojiHex);
            }

            versionSelect.addEventListener('change', function() {
                currentVersion = this.value;
                output.innerHTML = '';
                
                if (!currentVersion) {
                    blockExcludeControls.style.display = 'none';
                    return;
                }
                
                blockExcludeControls.style.display = 'block';
                
                // Update checkbox states based on current exclusions
                emojiFonts.forEach(font => {
                    const checkbox = document.getElementById(`exclude-${font.replace(/\s/g, '-')}`);
                    checkbox.checked = excludedCombos[font]?.blocks?.includes(currentVersion) || false;
                });
                
                const emojis = emojiData[currentVersion] || [];
                
                if (emojis.length === 0) {
                    output.innerHTML = '<p>No emoji found for this version</p>';
                    return;
                }
                
                renderEmojis(emojis);
            });

            function toggleBlockExclusion(font, isExcluded) {
                if (!currentVersion) return;
                
                // Initialize font object if needed with proper structure
                if (!excludedCombos[font]) {
                    excludedCombos[font] = {};
                }
                if (!excludedCombos[font].blocks) {
                    excludedCombos[font].blocks = [];
                }
                if (!excludedCombos[font].sequences) {
                    excludedCombos[font].sequences = [];
                }
                
                if (isExcluded) {
                    // Add block exclusion
                    if (!excludedCombos[font].blocks.includes(currentVersion)) {
                        excludedCombos[font].blocks.push(currentVersion);
                    }
                    
                    // Remove any individual sequences from this block
                    const emojis = emojiData[currentVersion] || [];
                    const hexCodes = emojis.map(emojiToHex);
                    excludedCombos[font].sequences = excludedCombos[font].sequences.filter(
                        seq => !hexCodes.includes(seq)
                    );
                } else {
                    // Remove block exclusion
                    const blockIndex = excludedCombos[font].blocks.indexOf(currentVersion);
                    if (blockIndex > -1) {
                        excludedCombos[font].blocks.splice(blockIndex, 1);
                    }
                }
                
                // Clean up empty structures
                if (excludedCombos[font].sequences?.length === 0) {
                    delete excludedCombos[font].sequences;
                }
                if (excludedCombos[font].blocks?.length === 0) {
                    delete excludedCombos[font].blocks;
                }
                if (!excludedCombos[font].blocks && !excludedCombos[font].sequences) {
                    delete excludedCombos[font];
                }
                
                // Re-render to update visual state
                renderEmojis(emojiData[currentVersion]);
                updateExclusionList();
            }

            function renderEmojis(emojis) {
                output.innerHTML = '';
                
                emojis.forEach(emoji => {
                    const hexCode = emojiToHex(emoji);
                    
                    const row = document.createElement('div');
                    row.className = 'emoji-row';
                    
                    const header = document.createElement('div');
                    header.className = 'emoji-header';
                    header.textContent = `${emoji} — ${hexCode}`;
                    row.appendChild(header);
                    
                    const samples = document.createElement('div');
                    samples.className = 'font-samples';
                    
                    emojiFonts.forEach(font => {
                        const sample = document.createElement('div');
                        sample.className = 'emoji-sample';
                        sample.dataset.emoji = hexCode;
                        sample.dataset.font = font;
                        
                        // Check if excluded (either by block or individual sequence)
                        if (isExcluded(font, hexCode, currentVersion)) {
                            sample.classList.add('clicked');
                        }
                        
                        sample.addEventListener('click', function() {
                            toggleExclusion(hexCode, font, this);
                        });
                        
                        const charSpan = document.createElement('span');
                        charSpan.className = 'emoji-char';
                        charSpan.style.fontFamily = `"${font}", sans-serif`;
                        charSpan.textContent = emoji;
                        
                        const fontLabel = document.createElement('div');
                        fontLabel.className = 'font-name';
                        fontLabel.textContent = font;
                        
                        sample.appendChild(charSpan);
                        sample.appendChild(fontLabel);
                        samples.appendChild(sample);
                    });
                    
                    row.appendChild(samples);
                    output.appendChild(row);
                });
            }

            function toggleExclusion(emojiHex, font, element) {
                // Initialize font object if needed with proper structure
                if (!excludedCombos[font]) {
                    excludedCombos[font] = {};
                }
                if (!excludedCombos[font].blocks) {
                    excludedCombos[font].blocks = [];
                }
                if (!excludedCombos[font].sequences) {
                    excludedCombos[font].sequences = [];
                }
                
                // Check if this emoji is excluded by block rule
                const excludedByBlock = excludedCombos[font].blocks.includes(currentVersion);
                
                if (excludedByBlock) {
                    // Can't toggle individual sequences when block is excluded
                    // Remove block exclusion instead
                    const blockIndex = excludedCombos[font].blocks.indexOf(currentVersion);
                    excludedCombos[font].blocks.splice(blockIndex, 1);
                    
                    // Add all OTHER emojis in this block to sequences (inverse operation)
                    const emojis = emojiData[currentVersion] || [];
                    emojis.forEach(emoji => {
                        const hex = emojiToHex(emoji);
                        if (hex !== emojiHex && !excludedCombos[font].sequences.includes(hex)) {
                            excludedCombos[font].sequences.push(hex);
                        }
                    });
                    
                    element.classList.remove('clicked');
                } else {
                    // Toggle individual sequence
                    const index = excludedCombos[font].sequences.indexOf(emojiHex);
                    
                    if (index > -1) {
                        // Remove from exclusion
                        excludedCombos[font].sequences.splice(index, 1);
                        element.classList.remove('clicked');
                    } else {
                        // Add to exclusion
                        excludedCombos[font].sequences.push(emojiHex);
                        element.classList.add('clicked');
                    }
                }
                
                // Clean up empty structures
                if (excludedCombos[font].sequences?.length === 0) {
                    delete excludedCombos[font].sequences;
                }
                if (excludedCombos[font].blocks?.length === 0) {
                    delete excludedCombos[font].blocks;
                }
                if (!excludedCombos[font].blocks && !excludedCombos[font].sequences) {
                    delete excludedCombos[font];
                }
                
                updateExclusionList();
            }

            function updateExclusionList() {
                if (Object.keys(excludedCombos).length === 0) {
                    exclusionList.value = '';
                    return;
                }
                
                let output = 'const exclude_emoji_font = {\n';
                
                const fonts = Object.keys(excludedCombos).sort();
                fonts.forEach((font, idx) => {
                    output += `    '${font}': {\n`;
                    
                    // Add blocks if present
                    if (excludedCombos[font].blocks?.length > 0) {
                        const blockList = excludedCombos[font].blocks
                            .sort()
                            .map(b => `'${b}'`)
                            .join(', ');
                        output += `        blocks: [${blockList}]`;
                        if (excludedCombos[font].sequences?.length > 0) {
                            output += ',';
                        }
                        output += '\n';
                    }
                    
                    // Add sequences if present
                    if (excludedCombos[font].sequences?.length > 0) {
                        const seqList = excludedCombos[font].sequences
                            .sort()
                            .map(s => `'${s}'`)
                            .join(', ');
                        output += `        sequences: [${seqList}]\n`;
                    }
                    
                    output += `    }`;
                    if (idx < fonts.length - 1) {
                        output += ',';
                    }
                    output += '\n';
                });
                
                output += '};';
                exclusionList.value = output;
            }
        }

        jsWait();
    </script>
</body>
</html>
