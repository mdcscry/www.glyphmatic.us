<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition Engine Tester</title>
<style>
    :root {
        --bg-color: #1a1a1d;
        --cell-bg-color: #2c2c34;
        --text-color: #f0f0f0;
        --border-color: #444;
        --accent-color: #61dafb;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: 'SF Mono', 'Consolas', 'Menlo', monospace;
    }
    body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 20px;
        padding: 20px;
    }
    #stage {
        width: 400px;
        height: 400px;
        display: flex;
        justify-content: center;
        align-items: center;
        border: 5px solid var(--border-color);
        background-color: var(--cell-bg-color);
        border-radius: 15px;
        perspective: 1200px; /* For 3D transforms */
    }
    #glyph {
        font-size: 250px;
        line-height: 1;
        transform-style: preserve-3d;
        backface-visibility: hidden;
        transition: none; /* Animations will be handled by classes */
    }
    #metadata-display {
        position: fixed;
        bottom: 10px;
        left: 10px;
        width: calc(100% - 20px);
        max-width: 600px;
        background: rgba(0,0,0,0.7);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 15px;
        font-size: 0.8rem;
        max-height: 25vh;
        overflow-y: auto;
    }
    #captureBtn {
        position: fixed;
        bottom: 20px;
        right: 20px;
        padding: 10px 20px;
        background-color: var(--accent-color);
        color: #000;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
    }
</style>
</head>
<body>
    <div id="stage">
        <span id="glyph">&#x2728;</span>
    </div>

    <div id="metadata-display">
        <pre>Press a key (1-0, q-p, a-l, z-m) to test a transition. Use Arrow Keys to scroll.</pre>
    </div>

    <button id="captureBtn">Capture Transition</button>

    <script src="../js_glyph/emoji_versions_data2.js"></script> <!-- For glyphs -->
    <script src="../js_funct/transition_engine.js"></script>

    <script>
    // Transition Tester Application
    document.addEventListener('DOMContentLoaded', () => {
        const glyphElement = document.getElementById('glyph');
        const metadataDisplay = document.getElementById('metadata-display');
        const captureBtn = document.getElementById('captureBtn');

        if (!glyphElement || !metadataDisplay || !captureBtn) {
            console.error('Required HTML elements not found!');
            return;
        }

        // Build emoji data from versioned files
        const emojiData = [];
        const emojiArrays = [
            'emoji_zwj_v1_0', 'emoji_zwj_v2_0', 'emoji_zwj_v3_0', 'emoji_zwj_v4_0',
            'emoji_zwj_v5_0', 'emoji_v8_0_skintones', 'emoji_zwj_v11_0', 'emoji_zwj_v12_0',
            'emoji_zwj_v12_1', 'emoji_zwj_v13_0', 'emoji_zwj_v13_1', 'emoji_zwj_v14_0',
            'emoji_zwj_v15_0', 'emoji_zwj_v15_1', 'emoji_zwj_v16_0', 'emoji_zwj_v17_0'
        ];

        emojiArrays.forEach(arrName => {
            if (typeof window[arrName] !== 'undefined' && Array.isArray(window[arrName])) {
                window[arrName].forEach(emojiStr => {
                    emojiData.push({
                        hex: [...emojiStr].map(char => char.codePointAt(0).toString(16)).join('-')
                    });
                });
            }
        });

        if (emojiData.length === 0) {
            console.warn('No emoji data loaded, using fallback glyphs');
            emojiData.push({ hex: '2728' }); // Sparkles
        }

        console.log(`Loaded ${emojiData.length} emojis`);

        // Initialize TransitionEngine
        const engine = new TransitionEngine({
            count: 40,
            prefix: 'tester-transition',
            durationMin: 1.5,
            durationMax: 3.0
        });

        let currentTransitionIndex = -1;
        let isAnimating = false;

        function displayMetadata(data) {
            const prettyJSON = JSON.stringify(data, null, 2);
            metadataDisplay.innerHTML = `<pre>${prettyJSON}</pre>`;
        }

        function applyTransition(index) {
            if (isAnimating || index < 0 || index >= engine.transitions.length) {
                return;
            }

            isAnimating = true;
            currentTransitionIndex = index;

            const transitionData = engine.transitions[index];
            displayMetadata(transitionData);

            const outClassName = `${transitionData.name}-out`;
            const inClassName = `${transitionData.name}-in`;

            // Start the 'out' animation
            glyphElement.className = outClassName;

            // Wait for the 'out' animation to finish
            setTimeout(() => {
                // Change the glyph content
                const randomEmoji = emojiData[Math.floor(Math.random() * emojiData.length)];
                glyphElement.innerHTML = `&#x${randomEmoji.hex.replace(/-/g, ';&#x')};`;

                // Apply the 'in' animation
                glyphElement.className = inClassName;

                // Wait for the 'in' animation to finish
                setTimeout(() => {
                    glyphElement.className = '';
                    isAnimating = false;
                }, transitionData.in.duration * 1000);

            }, transitionData.out.duration * 1000);
        }

        // Keyboard controls
        const keyMap = {
            // Top row
            '1': 0, '2': 1, '3': 2, '4': 3, '5': 4, '6': 5, '7': 6, '8': 7, '9': 8, '0': 9,
            // QWERTY row
            'q': 10, 'w': 11, 'e': 12, 'r': 13, 't': 14, 'y': 15, 'u': 16, 'i': 17, 'o': 18, 'p': 19,
            // Home row
            'a': 20, 's': 21, 'd': 22, 'f': 23, 'g': 24, 'h': 25, 'j': 26, 'k': 27, 'l': 28,
            // Bottom row
            'z': 29, 'x': 30, 'c': 31, 'v': 32, 'b': 33, 'n': 34, 'm': 35,
        };

        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();

            if (keyMap.hasOwnProperty(key)) {
                const index = keyMap[key];
                applyTransition(index);
            }
            // Arrow key navigation
            else if (key === 'arrowright' || key === 'arrowup') {
                e.preventDefault();
                let nextIndex = currentTransitionIndex + 1;
                if (nextIndex >= engine.transitions.length) {
                    nextIndex = 0;
                }
                applyTransition(nextIndex);
            } else if (key === 'arrowleft' || key === 'arrowdown') {
                e.preventDefault();
                let prevIndex = currentTransitionIndex - 1;
                if (currentTransitionIndex === -1) {
                    prevIndex = 0;
                } else if (prevIndex < 0) {
                    prevIndex = engine.transitions.length - 1;
                }
                applyTransition(prevIndex);
            }
        });

        // Capture button
        captureBtn.addEventListener('click', () => {
            if (currentTransitionIndex !== -1) {
                const dataToCapture = engine.transitions[currentTransitionIndex];
                console.log('--- CAPTURED TRANSITION ---');
                console.log(JSON.stringify(dataToCapture, null, 2) + ',');
                alert(`Transition ${currentTransitionIndex} metadata logged to console.`);
            } else {
                alert('No transition has been played yet to capture.');
            }
        });

        console.log('Transition Tester initialized. Press keys to test transitions!');
    });
    </script>
</body>
</html>
