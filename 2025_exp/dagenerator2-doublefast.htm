	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<TITLE>2.DaGenerator-box_elements</TITLE>

</head>


<STYLE type="text/css">

DIV   {
	      -webkit-transition-property: background-color,color,font-size;
	      -webkit-transition-duration: 10s,3s,4s;

    position:absolute;
    padding:0%;
    margin:0%;
    background:#FFFFFF;
    font-size: 15px;
    color:  #FFFFFF;

}

</STYLE>



<body style="overflow: hidden;font-family:code2000,Quivira,'Akshar Unicode',Quivira,'Akshar Unicode',Symbola,AegyptusR,'Arial Unicode MS',code2002,code2001;font-weight:900;">

<DIV id="container" style="height:100%;width:100%;"></DIV>

<script type="text/javascript">

var fontChangeRate=200;

var mycolors = [];
const colNum = 3; // Number of color variations to generate per call

/**
 * Generate a flexible color palette using HSLA values.
 * This replaces the old hardcoded array.
 */
function setColor(hue, sat, light, opa) {
    for (let colorCounter = 1; colorCounter <= colNum; colorCounter++) {
        const toSpliceColor = 'hsla(' +
            Math.round(40 * Math.random() + hue - 20) + ',' +
            Math.round(20 * Math.random() + sat - 20) + '%,' +
            (Math.round(Math.random() * 20) + light) + '%,' +
            (Math.random() * opa + .6) +
            ')';
        mycolors.push(toSpliceColor);
    }
}

// Generate the color palette
for (let i = 0; i < 12; i++) {
    setColor(Math.round(Math.random() * 340), Math.round(Math.random() * 1800), Math.round(Math.random() * 80), 1);
}

// Double line box drawing elements  
const myarray = [
    "2550", "2551", // double horizontal and vertical
    "2554", "2557", "255A", "255D", // double corners
    "2560", "2563", "2566", "2569", "256C", // double crosses
    "2552", "2553", "2555", "2556", "2558", "2559", "255B", "255C", "255E", "255F", // mixed double/single
    "2561", "2562", "2564", "2565", "2567", "2568", "256A", "256B" // mixed double/single
];

//container div
var container=document.getElementById("container");

var divId=[];


for (divCounter=1;divCounter<=15000;divCounter++){
 elementName='div'+divCounter;
 divId[divCounter] = document.createElement("div");
 divId[divCounter].innerHTML= '&#x'+myarray[Math.round((myarray.length-1)*Math.random())]+';';
 divId[divCounter].id=elementName;
 //console.log(divId[divCounter].id);
container.appendChild(divId[divCounter]);
divId[divCounter].style.position='relative';
divId[divCounter].style.cssFloat='left';
//divId[divCounter].style.color= mycolors[Math.round((mycolors.length-1)*Math.random())];
}

	window.setInterval(function(){

	for (intervLoop=1;intervLoop<=100;intervLoop++){
		rndDiv=Math.round(Math.random()*14999+1);
		  try {
		      divId[rndDiv].style.color= mycolors[Math.round((mycolors.length-1)*Math.random())];
		   } catch ( e ) {
		      console.log("Error: " + e.description + 'Value: ' + rndDiv );
           }
		}
		},Math.random()*fontChangeRate+15);


	window.setInterval(function(){

	for (intervLoop=1;intervLoop<=100;intervLoop++){
		rndDiv=Math.round(Math.random()*14999+1);
		//console.log(rndDiv);
		  try {
		      divId[rndDiv].innerHTML= '&#x'+myarray[Math.round((myarray.length-1)*Math.random())]+';';
		   } catch ( e ) {
		      console.log("Error: " + e.description + 'Value: ' + rndDiv );
           }
		}
		},Math.random()*fontChangeRate+200);





</script>
</body></html>
