<!DOCTYPE html>
<html lang="en">
<head>
    <script src="css_js/worldsymbols_min_peace.js"></script>
    <link rel="stylesheet" href="css_js/glyphtest.css">
</head>    
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glyph/Font Tester</title>

</head>
<body>

<h1>Glyph/Font Tester</h1>
<div id="output"></div>


<script>
const output = document.getElementById('output');

function parseCodePoint(codePointStr) {
    // Handle sequences like "x05D9;&#x05B0;&#x05D4;..."
    if (codePointStr.includes(';')) {
        const parts = codePointStr.split(';').filter(p => p.length > 0);
        const chars = parts.map(p => {
            const hex = p.replace(/&#x|x/g, '').trim();
            console.log('Parsing:', p, '-> hex:', hex, '-> codepoint:', parseInt(hex, 16));
            return String.fromCodePoint(parseInt(hex, 16));
        }).join('');
        console.log('Final char:', chars, 'length:', chars.length);
        return chars;
    }
    
    if (codePointStr.startsWith('x')) {
        return String.fromCodePoint(parseInt(codePointStr.substring(1), 16));
    } else {
        return String.fromCodePoint(parseInt(codePointStr));
    }
}

// Build font-to-glyphs map
const fontMap = {};

myFontSet.forEach((fontData, index) => {
    if (!fontData) return;
    
    const codePoint = fontData[0];
    const fonts = fontData.slice(1);
    
    fonts.forEach(font => {
        if (!fontMap[font]) {
            fontMap[font] = [];
        }
        fontMap[font].push(codePoint);
    });
});

// Render by font
Object.keys(fontMap).sort().forEach(font => {
    const section = document.createElement('div');
    section.className = 'font-section';
    
    const header = document.createElement('div');
    header.className = 'font-header';
    header.textContent = font;
    section.appendChild(header);
    
    const samples = document.createElement('div');
    samples.className = 'glyph-samples';
    
    fontMap[font].forEach(codePoint => {
        const char = parseCodePoint(codePoint);
        
        const sample = document.createElement('div');
        sample.className = 'glyph-sample';
        
        const charSpan = document.createElement('span');
        charSpan.className = 'glyph-char';
        charSpan.style.fontFamily = `'${font}'`;
        charSpan.textContent = char;
        
        const cpLabel = document.createElement('div');
        cpLabel.className = 'codepoint';
        cpLabel.textContent = `U+${codePoint.startsWith('x') ? codePoint.substring(1) : parseInt(codePoint).toString(16).toUpperCase()}`;
        
        sample.appendChild(charSpan);
        sample.appendChild(cpLabel);
        samples.appendChild(sample);
    });
    
    section.appendChild(samples);
    output.appendChild(section);
});
</script>


</body>
</html>
