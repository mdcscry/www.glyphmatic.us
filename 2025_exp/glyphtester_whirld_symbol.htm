<!DOCTYPE html>
<html lang="en">
<head>
    <script src="../js_glyph/whirldsymbols.js"></script>
    <link rel="stylesheet" href="../css_font/glyphmatic-fonts.css">
</head>    
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glyph/Font Tester</title>

</head>
<body>

<h1>Glyph/Font Tester</h1>
<div id="output"></div>

<script>
const output = document.getElementById('output');

function parseCodePoint(codePointStr) {
    console.log('parseCodePoint called with:', codePointStr);
    
    // Handle sequences like "x05D9;&#x05B0;&#x05D4;..."
    if (codePointStr.includes(';')) {
        const parts = codePointStr.split(';').filter(p => p.length > 0);
        const chars = parts.map(p => {
            const hex = p.replace(/&#x|x/g, '').trim();
            return String.fromCodePoint(parseInt(hex, 16));
        }).join('');
        return chars;
    }
    
    if (codePointStr.startsWith('x')) {
        return String.fromCodePoint(parseInt(codePointStr.substring(1), 16));
    } else {
        return String.fromCodePoint(parseInt(codePointStr));
    }
}

myFontSet.forEach((fontData, index) => {
    if (!fontData) return;
    
    const codePoint = fontData[0];
    const fonts = fontData.slice(1);
    
    const char = parseCodePoint(codePoint);
    
    const row = document.createElement('div');
    row.className = 'glyph-row';
    
    const header = document.createElement('div');
    header.className = 'glyph-header';
    header.textContent = codePoint.substring(0, 50);
    row.appendChild(header);
    
    const samples = document.createElement('div');
    samples.className = 'font-samples';
    
    fonts.forEach(font => {
        const sample = document.createElement('div');
        sample.className = 'glyph-sample';
        
        const charSpan = document.createElement('span');

        charSpan.className = 'glyph-char';
        charSpan.style.fontFamily = `'${font}'`;
        charSpan.textContent = char;
        
        const fontLabel = document.createElement('div');
        fontLabel.className = 'font-name';
        fontLabel.textContent = font;
        
        sample.appendChild(charSpan);
        sample.appendChild(fontLabel);
        samples.appendChild(sample);
    });
    
    row.appendChild(samples);
    output.appendChild(row);
});
</script>

</body>
</html>
