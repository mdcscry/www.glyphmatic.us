<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF.8">
    <TITLE>9.DeGenerator-EnhancedGlyphs</TITLE>
    <script src="../js_glyph/boxplot.js"></script>
    <link rel="stylesheet" href="../css/boxplot.css">    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>
<body>

    <div id="leftBlock" class="main-block"></div>
    <div id="rightBlock" class="main-block"></div>


<script type="text/javascript">

    // These arrays are expected to be defined in boxplot.js or boxplot.css
    // var mycolors = [...];
    // var myarray = [...]; // Glyph hex codes
    // var mixBlendModes = [...];

    var fontChangeRate = 6000; // Slower change rate: 6000 milliseconds (6 seconds)

    const leftBlock = document.getElementById('leftBlock');
    const rightBlock = document.getElementById('rightBlock');

    let allLayers = [];
    let themeColor; // This variable will hold the single chosen theme color


    // --- Utility functions for random values ---
    function getRandomColor() {
        return themeColor;
    }

    function getRandomColor2() {
        return themeColor2
    }   

    function getRandomColor3() {
        return themeColor3
    } 

    function getRandomRGBAColor(minAlpha = 0.01, maxAlpha = 0.1) { // Much lower alpha range for better transparency
        const r = Math.floor(Math.random() * 256);
        const g = Math.floor(Math.random() * 256);
        const b = Math.floor(Math.random() * 256);
        const a = (Math.random() * (maxAlpha - minAlpha)) + minAlpha; // Random alpha between minAlpha and maxAlpha
        return `rgba(${r},${g},${b},${a.toFixed(2)})`; // .toFixed(2) for cleaner output
    }

    function getRandomNoiseGradient() {
        const fromAngle = Math.floor(Math.random() * 360);
        const opacity1 = (Math.random() * 0.2 + 0.15).toFixed(4); // 0.15 to 0.35 - much stronger
        const opacity2 = (Math.random() * 0.3 + 0.2).toFixed(4); // 0.2 to 0.5
        const stopAngle = (Math.random() * 0.001 + 0.0005).toFixed(6);
        
        return `repeating-conic-gradient(from ${fromAngle}deg, 
            rgba(255, 255, 255, 0) 0deg ${stopAngle}deg, 
            rgba(255, 255, 255, ${opacity1}) ${stopAngle}deg ${(stopAngle * 2).toFixed(6)}deg)`;
    }

    function getRandomRadialGradient() {
        const centerX = Math.floor(Math.random() * 100);
        const centerY = Math.floor(Math.random() * 100);
        const color1 = getRandomRGBAColor(0.3, 0.6); // Much more visible
        const color2 = getRandomRGBAColor(0.2, 0.5);
        const color3 = getRandomRGBAColor(0.1, 0.4);
        
        return `radial-gradient(circle at ${centerX}% ${centerY}%, ${color1}, ${color2}, ${color3})`;
    }

    function getRandomBlendMode() {
        // Ensure mixBlendModes is defined before trying to access it
        if (typeof mixBlendModes === 'undefined' || mixBlendModes.length === 0) {
            console.warn("mixBlendModes array is not defined or is empty. Falling back to 'normal'.");
            return 'normal';
        }
        return mixBlendModes[Math.floor(Math.random() * mixBlendModes.length)];
    }

    function getRandomBorderStyle() {
      const styles = ['solid', //'dotted',
       'dashed', 'double'//, 'groove', 'ridge', 'inset', 'outset'


      ];
      return styles[Math.floor(Math.random() * styles.length)];
    }

    // This function can be used for borders on charSpan (smaller) or other elements
    function getRandomBorderWidth(max = 10) { // Max border width in px, default 3 for charSpan-like elements
        // Returns 0 to max px, including 0 for a chance of no visible border.
        return Math.floor(Math.random() * (max + 1)) + 'px'; 
    }
    
    // getRandomStrokeWidth is not used directly for webkitTextStrokeWidth anymore
    // as it's now an inline expression based on user's specific request.
    // However, it's kept here just in case for future use.
    function getRandomStrokeWidth(max = 20) { 
        return Math.floor(Math.random() * (max + 1)) + 'px'; 
    }

    function getRandomShadow() {
        const offsetX = Math.floor(Math.random() * 100) - 50; // -10px to +9px
        const offsetY = Math.floor(Math.random() * 100) - 50; // -10px to +9px
        const blur = Math.floor(Math.random() * 5)    // 0px to 4px
        const color = getRandomColor2();
        
        // 20% chance for 'none' to allow for more shadows overall.
        if (Math.random() < 0.6) { 
            return 'none'; 
        }
        return `${offsetX}px ${offsetY}px ${blur}px ${color}`;
    }

    /**
     * Creates a new layer div and appends it to the specified parent block.
     */
    function createAndAddLayer(parentBlock) {
        const layerDiv = document.createElement("div");
        layerDiv.className = "layer";

        const charSpan = document.createElement("span");
        layerDiv.appendChild(charSpan);

        parentBlock.appendChild(layerDiv);
        allLayers.push(layerDiv);
        updateLayer(layerDiv); // Apply initial random styles to this new layer
        return layerDiv;
    }

    /**
     * Updates the content and styles of a single layer.
     */
    function updateLayer(layerElement) {
        // --- Layer Div Styling ---
        
        // 40% chance for radial gradient instead of solid color
        if (Math.random() < 0.4) {
            layerElement.style.background = getRandomRadialGradient();
            console.log('Applied radial gradient:', layerElement.style.background);
            // if (Math.random() < 0.5) {
            //     layerElement.classList.add('noise-animation');
            //     const noiseGrad = getRandomNoiseGradient();
            //     layerElement.style.setProperty('--noise-gradient', noiseGrad);
            //     console.log('Applied noise gradient:', noiseGrad);
            // } else {
            //     layerElement.classList.remove('noise-animation');
            // }
        } else {
            layerElement.style.backgroundColor = getRandomRGBAColor();
            layerElement.style.background = '';
            layerElement.classList.remove('noise-animation');
        }
        
        layerElement.style.mixBlendMode = getRandomBlendMode();
        layerElement.style.opacity = .95;
        layerElement.style.border = 'none'; 

        const charSpan = layerElement.querySelector('span');
        if (charSpan) {
            // --- Character Glyph Styling --- (these remain on the glyphs)
            
            // This acts as webkitTextFillColor, using the themeColor
            charSpan.style.color = getRandomColor(); 
            charSpan.style.mixBlendMode = getRandomBlendMode(); 

            // Keeping the random border (your "outline" request)
            if (Math.random() < 0.975) { // 30% chance for no border
                charSpan.style.border = 'none';
            } else {
                const borderWidth = getRandomBorderWidth(100); // Max 3px for charSpan borders
                const borderStyle = getRandomBorderStyle();
                const borderColor = getRandomColor3();
                charSpan.style.border = `${borderWidth} ${borderStyle} ${borderColor}`;
            }

            // MODIFIED: Separating webkitTextStrokeWidth and webkitTextStrokeColor
            if (Math.random() < 0.1) { // 25% chance for no text stroke
            charSpan.style.webkitTextStrokeWidth = '0px';
            charSpan.style.webkitTextStrokeColor = 'transparent';
            } else {
            // Applying your specific stroke width logic (1px to ~3.99px)
            charSpan.style.webkitTextFillColor=getRandomColor3(); // Use themeColor for stroke color
            charSpan.style.webkitTextStrokeWidth = (Math.random() * 3 + 1) + "px"; 
            charSpan.style.webkitTextStrokeColor = getRandomColor2();
            }

            // 30% chance for noise on the glyph (AFTER stroke logic)
            if (Math.random() < 0.90) {
                charSpan.classList.add('noise-glyph');
                charSpan.style.setProperty('--glyph-noise-gradient', getRandomNoiseGradient());
                charSpan.style.webkitTextFillColor = 'transparent'; // Override fill to show noise
            } else {
                charSpan.classList.remove('noise-glyph');
            }

            // Text shadow for the charSpan
            charSpan.style.textShadow = getRandomShadow(); 

            // Ensure myarray is defined and not empty before trying to access it
            if (typeof myarray === 'undefined' || myarray.length === 0) {
                console.warn("myarray is not defined or is empty. Cannot render glyphs.");
                charSpan.innerHTML = ''; 
                layerElement.title = `Glyph HEX: N/A (myarray empty)`;
                return;
            }

            // Randomly change character HTML (lower chance for more stability)
            if (Math.random() < 0.5) { 
                const randomGlyphHex = myarray[Math.round((myarray.length - 1) * Math.random())];
                charSpan.innerHTML = `&#x${randomGlyphHex};`;
                layerElement.title = `Glyph HEX: ${randomGlyphHex}`;
            }
        }
    }

    /**
     * Sets up or re-sets up the dynamic blocks with random layers.
     */
    function setupDynamicBlocks() {
        // Clear existing layers and reset the tracking array
        leftBlock.innerHTML = '';
        rightBlock.innerHTML = '';
        allLayers = [];

        // Ensure mycolors is defined and not empty before trying to access it
        if (typeof mycolors === 'undefined' || mycolors.length === 0) {
            console.error("mycolors array is not defined or is empty. Cannot determine theme color.");
            themeColor = '#000000'; // Fallback to black
            document.body.style.backgroundColor = themeColor;
            return;
        }

        // Pick one color from mycolors to be the theme for this setup
        themeColor = mycolors[Math.round((mycolors.length - 1) * Math.random())];
        themeColor2 = mycolors[Math.round((mycolors.length - 1) * Math.random())];
        themeColor3 = mycolors[Math.round((mycolors.length - 1) * Math.random())];

        // Apply chosen theme color to body background
        document.body.style.backgroundColor = themeColor;

        // Create random number of layers for left block (e.g., 5 to 20 layers)
        const numLayersLeft = Math.floor(Math.random() * (20 - 5 + 1)) + 5;
        for (let i = 0; i < numLayersLeft; i++) {
            createAndAddLayer(leftBlock);
        }

        // Create random number of layers for right block (e.g., 5 to 20 layers)
        const numLayersRight = Math.floor(Math.random() * (20 - 5 + 1)) + 5;
        for (let i = 0; i < numLayersRight; i++) {
            createAndAddLayer(rightBlock);
        }
    }

    // --- Initial Setup ---
    setupDynamicBlocks();

    // --- Continuous Updates ---

    // Main interval: Periodically update a random layer
    window.setInterval(function() {
        if (allLayers.length > 0) {
            const randomLayerIndex = Math.floor(Math.random() * allLayers.length);
            updateLayer(allLayers[randomLayerIndex]);
        }
    }, fontChangeRate); // 6-second change rate

    // Optional: Interval to change the body background color (and thus the themeColor) less frequently
    window.setInterval(function() {
        if (typeof mycolors === 'undefined' || mycolors.length === 0) {
            console.warn("mycolors array is not defined or is empty. Cannot change theme color.");
            return;
        }
        themeColor = mycolors[Math.round((mycolors.length - 1) * Math.random())]; // Pick a new theme color
        document.body.style.backgroundColor = themeColor; // Apply to body
        // Note: Existing glyphs will only pick up the new themeColor on their next individual update.
        // If immediate propagation to all existing glyphs is needed, you would iterate `allLayers`
        // and call `updateLayer` on each after changing `themeColor`.
    }, fontChangeRate * 20); // Change body background (and themeColor) every 12 seconds
    
    // Optional: Interval to entirely re-generate the layers and their counts
    window.setInterval(function() {
        setupDynamicBlocks();
    }, fontChangeRate * 20); // Re-generate layers every 30 seconds

</script>
