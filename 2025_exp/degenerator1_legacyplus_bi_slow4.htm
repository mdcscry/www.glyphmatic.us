    <TITLE>7.DeGenerator-DynamicOverlays</TITLE>

    <STYLE type="text/css">
        @font-face {
            font-family: 'Symbols2';
            src: url('../tff/NotoSansSymbols2-Regular.ttf');
        }

        body {
            font-family: 'Symbols2';
            margin: 0;
            overflow: hidden; /* Hide scrollbars */
            width: 100vw;
            height: 100vh;
            display: flex; /* Use flexbox to arrange the two main blocks side-by-side */
            background-color: #000; /* Default body background, will be randomized by JS */
        }

        .main-block {
            position: relative; /* Establishes a positioning context for absolute layers */
            width: 50vw;        /* Each block takes half the viewport width */
            height: 100vh;      /* Each block takes full viewport height */
            overflow: hidden;   /* Clip content if layers go outside its bounds */
            /* isolation: isolate; /* Uncomment if you want layers within block to blend only among themselves */
        }

        /* Styles for the dynamically generated layers within each main-block */
        .layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;          /* Use flex for centering the child span */
            align-items: center;    /* Center content vertically */
            justify-content: center; /* Center content horizontally */
            
            /* Default values, will be overridden by JS for randomness */
            background-color: rgba(0,0,0,0); /* Start transparent for backgrounds */
            color: #fff; /* Default character color */
            mix-blend-mode: normal; /* Default blend mode */
            opacity: 1; /* Full opacity by default, transparency handled by rgba background */

            /* Transitions for smoother visual changes */
            /* Added mix-blend-mode to transitions and increased durations */
            transition: background-color 3s ease-out, color 2s ease-out, opacity 2s ease-out, mix-blend-mode 3s ease-out;
        }

        .layer > span { /* The character element itself within a layer */
            font-size: 35vw; /* Large font size, relative to the main block's width (50vw * 0.70) */
            line-height: 1;  /* Tightly wrap the character */
            position: absolute; /* Allows char styling without interfering with parent layer flexbox content */
            pointer-events: none; /* Allows clicks to pass through to underlying layers if desired */
            /* Default blend mode for character, will be randomized by JS */
            mix-blend-mode: normal;
             transition: color 2s ease-out, mix-blend-mode 3s ease-out; /* Transitions for character */
        }
    </STYLE>
</head>

    const leftBlock = document.getElementById('leftBlock');
    const rightBlock = document.getElementById('rightBlock');

    let allLayers = [];

    // --- New function to get a random RGBA color with controllable alpha ---
    function getRandomRGBAColor(minAlpha = 0.05, maxAlpha = 0.25) {
        const r = Math.floor(Math.random() * 256);
        const g = Math.floor(Math.random() * 256);
        const b = Math.floor(Math.random() * 256);
        const a = (Math.random() * (maxAlpha - minAlpha)) + minAlpha; // Random alpha between minAlpha and maxAlpha
        return `rgba(${r},${g},${b},${a.toFixed(2)})`; // .toFixed(2) for cleaner output
    }
    // --- Existing function for opaque hex colors (used for character color) ---
    function getRandomColor() {
        return mycolors[Math.round((mycolors.length - 1) * Math.random())];
    }

    function getRandomChar() {
        return '&#x' + myarray[Math.round((myarray.length - 1) * Math.random())] + ';';
    }

    function getRandomBlendMode() {
        return mixBlendModes[Math.floor(Math.random() * mixBlendModes.length)];
    }

    /**
     * Creates a new layer div and appends it to the specified parent block.
     */
    function createAndAddLayer(parentBlock) {
        const layerDiv = document.createElement("div");
        layerDiv.className = "layer";

        const charSpan = document.createElement("span");
        layerDiv.appendChild(charSpan);

        parentBlock.appendChild(layerDiv);
        allLayers.push(layerDiv);
        updateLayer(layerDiv); // Apply initial random styles to this new layer
        return layerDiv;
    }

    /**
     * Updates the content and styles of a single layer.
     */
    function updateLayer(layerElement) {
        // Randomize layer's background color (now with alpha), blend mode, and fixed opacity to 1
        layerElement.style.backgroundColor = getRandomRGBAColor(0.05, 0.25); // Use semi-transparent background
        layerElement.style.mixBlendMode = getRandomBlendMode();
        layerElement.style.opacity = 1; // Transparency is now handled by the rgba background

        const charSpan = layerElement.querySelector('span');
        if (charSpan) {
            charSpan.style.color = getRandomColor(); // Character color remains opaque
            charSpan.style.mixBlendMode = getRandomBlendMode(); // Character blends with its layer background
            if (Math.random() < 0.3) {
                charSpan.innerHTML = getRandomChar();
            }
        }
    }

    /**
     * Sets up or re-sets up the dynamic blocks with random layers.
     */
    function setupDynamicBlocks() {
        // Clear existing layers and reset the tracking array
        leftBlock.innerHTML = '';
        rightBlock.innerHTML = '';
        allLayers = [];

        // Randomize body background for new setup
        document.body.style.backgroundColor = getRandomColor();

        // Create random number of layers for left block (e.g., 5 to 20 layers)
        const numLayersLeft = Math.floor(Math.random() * (20 - 5 + 1)) + 5;
        for (let i = 0; i < numLayersLeft; i++) {
            createAndAddLayer(leftBlock);
        }

        // Create random number of layers for right block (e.g., 5 to 20 layers)
        const numLayersRight = Math.floor(Math.random() * (20 - 5 + 1)) + 5;
        for (let i = 0; i < numLayersRight; i++) {
            createAndAddLayer(rightBlock);
        }
    }

    // --- Initial Setup ---
    setupDynamicBlocks();

    // --- Event Listeners ---
    // Re-set up blocks and layers if the window is resized
    window.addEventListener('resize', setupDynamicBlocks);

    // --- Continuous Updates ---

    // Main interval: Periodically update a random layer
    window.setInterval(function() {
        if (allLayers.length > 0) {
            const randomLayerIndex = Math.floor(Math.random() * allLayers.length);
            updateLayer(allLayers[randomLayerIndex]);
        }
    }, fontChangeRate); // Uses the new 6-second change rate

    // Optional: Interval to change the body background color less frequently
    window.setInterval(function() {
        document.body.style.backgroundColor = getRandomColor();
    }, fontChangeRate * 2); // Change body background every 12 seconds
    
    // Optional: Interval to entirely re-generate the layers and their counts
    window.setInterval(function() {
        setupDynamicBlocks();
    }, fontChangeRate * 5); // Re-generate layers every 30 seconds
