<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
}
#canvas {
    display: block;
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const colors = [
    '#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', 
    '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E2',
    '#F8B739', '#52B788', '#E63946', '#A8DADC'
];

const glyphs = ['◆', '●', '■', '▲', '★', '◉', '◈', '▼', '◀', '▶'];

function randomColor() {
    return colors[Math.floor(Math.random() * colors.length)];
}

function randomGlyph() {
    return glyphs[Math.floor(Math.random() * glyphs.length)];
}

function drawRotatedRect(x, y, width, height, angle) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    
    // Draw rectangle
    ctx.fillStyle = randomColor();
    ctx.fillRect(-width/2, -height/2, width, height);
    
    // Draw border
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.strokeRect(-width/2, -height/2, width, height);
    
    // Draw glyph
    const fontSize = Math.min(width, height) * 0.6;
    ctx.font = `${fontSize}px Arial`;
    ctx.fillStyle = randomColor();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(randomGlyph(), 0, 0);
    
    ctx.restore();
}

function drawHerringbone() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const brickWidth = 100;
    const brickHeight = 40;

    // Herringbone uses pairs of bricks forming chevrons
    // Calculate the spacing for proper tiling
    const chevronHeight = brickWidth / Math.sqrt(2); // vertical spacing
    const chevronWidth = brickWidth; // horizontal spacing

    for (let row = -10; row * chevronHeight < canvas.height + chevronHeight * 10; row++) {
        for (let col = -10; col * chevronWidth < canvas.width + chevronWidth * 10; col++) {
            const baseX = col * chevronWidth;
            const baseY = row * chevronHeight;

            // Offset alternating rows for proper herringbone interlock
            const offsetX = (row % 2) * (chevronWidth / 2);

            const x = baseX + offsetX;
            const y = baseY;

            // Draw two bricks forming a V/chevron pattern
            // Left brick angled up-right
            drawRotatedRect(x - chevronWidth/4, y, brickWidth, brickHeight, Math.PI / 4);
            // Right brick angled up-left
            drawRotatedRect(x + chevronWidth/4, y, brickWidth, brickHeight, -Math.PI / 4);
        }
    }
}

drawHerringbone();

canvas.addEventListener('click', drawHerringbone);

window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    drawHerringbone();
});

</script>

</body>
</html>
