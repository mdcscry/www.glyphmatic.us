<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmission</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        
        .screen {
            flex: 1;
            padding: 40px;
            position: relative;
            overflow: hidden;
        }
        
        /* CRT screen effect */
        .screen::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.1) 0px,
                rgba(0,0,0,0.1) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 100;
        }
        
        .screen::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(
                ellipse at center,
                transparent 0%,
                rgba(0,0,0,0.3) 100%
            );
            pointer-events: none;
            z-index: 101;
        }
        
        .paper {
            position: relative;
            z-index: 1;
        }
        
        .line {
            min-height: 48px;
            font-size: 32px;
            line-height: 48px;
            color: #c0c0c0;
            white-space: nowrap;
            position: relative;
        }
        
        .line.active::after {
            content: '█';
            color: #e0e0e0;
            animation: blink 0.6s infinite;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        
        .glyph {
            display: inline-block;
            opacity: 0;
            transform: translateY(-2px);
            animation: strike 0.05s forwards;
        }
        
        @keyframes strike {
            0% { 
                opacity: 0; 
                transform: translateY(-4px) scale(1.1);
                color: #fff;
            }
            50% {
                color: #fff;
            }
            100% { 
                opacity: 1; 
                transform: translateY(0) scale(1);
                color: #c0c0c0;
            }
        }
        
        .glyph.struck {
            opacity: 1;
            transform: none;
        }
        
        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 200;
        }
        
        button {
            padding: 10px 25px;
            border: 1px solid #333;
            border-radius: 4px;
            background: #151515;
            color: #666;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        
        button:hover {
            border-color: #555;
            color: #999;
        }
        
        .status {
            position: fixed;
            top: 20px;
            right: 30px;
            font-size: 10px;
            letter-spacing: 2px;
            color: #333;
            text-transform: uppercase;
            z-index: 200;
        }
        
        .status.receiving {
            color: #663333;
        }
        
        .status.receiving::before {
            content: '● ';
            animation: pulse 0.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        
        .header {
            position: fixed;
            top: 20px;
            left: 30px;
            font-size: 10px;
            letter-spacing: 3px;
            color: #2a2a2a;
            text-transform: uppercase;
            z-index: 200;
        }
    </style>
</head>
<body>
    <div class="header">Incoming Transmission</div>
    <div class="status" id="status">Standby</div>
    
    <div class="screen">
        <div class="paper" id="paper">
            <div class="line active" id="current-line"></div>
        </div>
    </div>
    
    <div class="controls">
        <button id="start">Begin</button>
        <button id="pause">Pause</button>
        <button id="clear">Clear</button>
    </div>

    <script>
        // Extended glyph ranges
        const glyphRanges = [
            [0x2600, 0x26FF], [0x2700, 0x27BF], [0x2190, 0x21FF],
            [0x2300, 0x23FF], [0x25A0, 0x25FF], [0x2660, 0x2667],
            [0x1F0A0, 0x1F0AE], [0x1F0B0, 0x1F0BE], [0x1F0C0, 0x1F0CE],
            [0x1F300, 0x1F5FF], [0x1F600, 0x1F64F], [0x1F680, 0x1F6FF],
            [0x1F700, 0x1F77F], [0x2654, 0x265F], [0x2648, 0x2653],
            [0x10300, 0x1032F], [0x10330, 0x1034F], [0x10380, 0x1039F],
            [0x10400, 0x1044F], [0x10450, 0x1047F], [0x10480, 0x104AF],
            [0x10800, 0x1083F], [0x10900, 0x1091F], [0x10920, 0x1093F],
            [0x12000, 0x1237F], [0x13000, 0x1342F], [0x2800, 0x28FF],
            [0x2500, 0x257F], [0x2580, 0x259F], [0x2E80, 0x2EFF],
            [0xA000, 0xA48F], [0x10A0, 0x10FF], [0x0530, 0x058F],
            [0x0590, 0x05FF], [0x0600, 0x06FF], [0x0700, 0x074F],
            [0x0900, 0x097F], [0x0980, 0x09FF], [0x0A00, 0x0A7F],
            [0x0B00, 0x0B7F], [0x0B80, 0x0BFF], [0x0C00, 0x0C7F],
            [0x0D00, 0x0D7F], [0x0E00, 0x0E7F], [0x0F00, 0x0FFF],
            [0x1000, 0x109F], [0x1200, 0x137F], [0x13A0, 0x13FF],
            [0x16A0, 0x16FF], [0x1680, 0x169F], [0x1800, 0x18AF],
            [0x1900, 0x194F], [0x1D100, 0x1D1FF], [0x1D300, 0x1D35F],
            [0x1F000, 0x1F02F], [0x1F030, 0x1F09F],
            [0x4E00, 0x4FFF], // Some CJK
            [0x0370, 0x03FF], // Greek
            [0x0400, 0x04FF], // Cyrillic
        ];
        
        let glyphPool = [];
        
        function isRenderable(cp) {
            if (cp < 0x20) return false;
            if (cp >= 0xE000 && cp <= 0xF8FF) return false;
            if (cp >= 0xFE00 && cp <= 0xFE0F) return false;
            return true;
        }
        
        for (const [start, end] of glyphRanges) {
            for (let cp = start; cp <= end; cp++) {
                if (isRenderable(cp)) {
                    glyphPool.push(String.fromCodePoint(cp));
                }
            }
        }
        
        function randomGlyph() {
            return glyphPool[Math.floor(Math.random() * glyphPool.length)];
        }
        
        // Typewriter state
        const paper = document.getElementById('paper');
        const status = document.getElementById('status');
        let currentLine = document.getElementById('current-line');
        let isRunning = false;
        let timeoutId = null;
        let charsOnLine = 0;
        const maxCharsPerLine = 20;
        const maxLines = 12;
        
        // Typing rhythm - irregular, urgent
        function getNextDelay() {
            const r = Math.random();
            if (r < 0.7) {
                // Normal rapid typing
                return 80 + Math.random() * 80;
            } else if (r < 0.9) {
                // Brief pause - thinking
                return 200 + Math.random() * 200;
            } else {
                // Longer pause - something's happening
                return 400 + Math.random() * 400;
            }
        }
        
        function typeGlyph() {
            if (!isRunning) return;
            
            // Create glyph span
            const span = document.createElement('span');
            span.className = 'glyph';
            span.textContent = randomGlyph();
            
            // Insert before cursor (which is the ::after pseudo-element)
            currentLine.appendChild(span);
            charsOnLine++;
            
            // Check for line break
            if (charsOnLine >= maxCharsPerLine) {
                newLine();
            }
            
            // Schedule next glyph
            timeoutId = setTimeout(typeGlyph, getNextDelay());
        }
        
        function newLine() {
            // Remove active class from current line (removes cursor)
            currentLine.classList.remove('active');
            
            // Mark all glyphs as fully struck
            currentLine.querySelectorAll('.glyph').forEach(g => g.classList.add('struck'));
            
            // Create new line
            const newLineEl = document.createElement('div');
            newLineEl.className = 'line active';
            paper.appendChild(newLineEl);
            currentLine = newLineEl;
            charsOnLine = 0;
            
            // Remove old lines if too many
            const lines = paper.querySelectorAll('.line');
            if (lines.length > maxLines) {
                lines[0].remove();
            }
            
            // Scroll effect - keep newest line visible
            paper.scrollTop = paper.scrollHeight;
        }
        
        function start() {
            if (isRunning) return;
            isRunning = true;
            status.textContent = 'Receiving';
            status.classList.add('receiving');
            typeGlyph();
        }
        
        function pause() {
            isRunning = false;
            status.textContent = 'Paused';
            status.classList.remove('receiving');
            if (timeoutId) {
                clearTimeout(timeoutId);
                timeoutId = null;
            }
        }
        
        function clear() {
            pause();
            paper.innerHTML = '<div class="line active" id="current-line"></div>';
            currentLine = document.getElementById('current-line');
            charsOnLine = 0;
            status.textContent = 'Standby';
        }
        
        // Event listeners
        document.getElementById('start').addEventListener('click', start);
        document.getElementById('pause').addEventListener('click', pause);
        document.getElementById('clear').addEventListener('click', clear);
        
        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (isRunning) pause();
                else start();
            } else if (e.code === 'Escape') {
                clear();
            }
        });
        
        // Auto-start after a moment
        setTimeout(start, 1000);
    </script>
</body>
</html>
