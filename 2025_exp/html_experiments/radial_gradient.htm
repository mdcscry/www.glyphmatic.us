<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radial Gradient Grid</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
        }

        #grid-container {
            display: grid;
            grid-template-columns: repeat(var(--h-cells, 16), 1fr);
            grid-template-rows: repeat(var(--v-cells, 8), 1fr);
            width: 100vw;
            height: 100vh;
            gap: 0px;
            background-color: #111;
        }

        .grid-cell {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 0px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .gradient-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 0px;
            transition: opacity 10s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .glyph-char {
            z-index: 5; /* Ensure it's on top of the gradient layers */
            font-size: 4vmin; /* Responsive font size based on the smaller viewport dimension */
            color: #ffffff; /* Initial color */
            text-shadow: 0 0px 0px rgba(0,0,0,0.5);
            pointer-events: none; /* So it doesn't interfere with mouse events */
            transition: color 5s ease-in-out; /* Smooth color transition */
        }
    </style>
</head>
<body>

    <div id="grid-container"></div>

    <script>
        const gridContainer = document.getElementById('grid-container');
        const transitionTime = 5000;
        const baseHoldTime = 4000;
        const vCells = 20;
        const hCells = 30;
        let myArray = ['25C9','25CB','25CD','25CE','26AC','2609',
            '2B57','2B58'
        ];

        // Create a single, global palette of 3 colors for the entire page.
        const pagePalette = [];

        function getRandomColor() {
            const hue = Math.floor(Math.random() * 360);
            const saturation = Math.floor(Math.random() * 40) + 60;
            const lightness = Math.floor(Math.random() * 30) + 40;
            return `hsl(${hue}, ${saturation}%, ${lightness}%)`;
        }

        /**
         * Creates a radial-gradient with a limited, reused palette of 2 or 3 colors.
         */
        function generateRandomRadialGradient() {
            // 1. Define a random number of color stops for the gradient.
            const numStops = Math.floor(Math.random() * 10) + 10; // 3 to 6 stops
            const stops = [];

            // 2. Add the stops, ensuring all 3 colors from the pagePalette are used.
            for (let i = 0; i < numStops; i++) {
                // For each stop, pick a color from the global pagePalette.
                const color = pagePalette[i % pagePalette.length]; // Cycle through the 3 colors
                // Constrain the radius to be "near the center" (0% to 70%)
                const radius = Math.floor(Math.random() * 71);
                stops.push({ color, radius });
            }

            // 3. Sort all stops by radius to create a valid gradient.
            stops.sort((a, b) => a.radius - b.radius);

            const gradientString = stops.map(stop => `${stop.color} ${stop.radius}%`).join(', ');
            
            return `radial-gradient(circle, ${gradientString})`;
        }

        /**
         * Creates and manages the animation for a single grid cell.
         */
        function animateCell(cell) {
            const layer1 = document.createElement('div');
            layer1.className = 'gradient-layer';
            const layer2 = document.createElement('div');
            layer2.className = 'gradient-layer';
            cell.appendChild(layer1);
            cell.appendChild(layer2);

            let topLayer = layer1;
            let bottomLayer = layer2;

            function changeGradient() {
                // This is the corrected cross-fade logic.
                const newGradient = generateRandomRadialGradient();

                // 1. Apply the new gradient to the layer that is currently hidden on the bottom.
                bottomLayer.style.background = newGradient;

                // 2. Make the bottom layer visible (but still behind the top layer).
                bottomLayer.style.opacity = '1';

                // 3. Fade out the top layer to reveal the new gradient behind it.
                topLayer.style.opacity = '0';

                // 4. After the transition, swap their roles for the next cycle.
                const temp = topLayer;
                topLayer = bottomLayer;
                bottomLayer = temp;

                // Update the glyph on the NEW top layer
                updateGlyph(topLayer);
            }

            function updateGlyph(layer) {
                let glyphSpan = layer.querySelector('.glyph-char');
                if (!glyphSpan) {
                    glyphSpan = document.createElement('span');
                    glyphSpan.className = 'glyph-char';
                    layer.appendChild(glyphSpan);
                }
                glyphSpan.innerHTML = `&#x${myArray[Math.floor(Math.random() * myArray.length)]};`;
                glyphSpan.style.color = pagePalette[Math.floor(Math.random() * pagePalette.length)];
            }

            // Initial setup for this cell
            topLayer.style.background = generateRandomRadialGradient();
            topLayer.style.opacity = '1';
            updateGlyph(topLayer);
            bottomLayer.style.opacity = '0';

            const randomHoldTime = baseHoldTime + (Math.random() * 4000);
            setInterval(changeGradient, randomHoldTime + transitionTime);
        }

        /**
         * Creates the entire grid of animating cells.
         */
        function createGrid() {
            // Set the CSS variables from our JS constants
            gridContainer.style.setProperty('--h-cells', hCells);
            gridContainer.style.setProperty('--v-cells', vCells);

            // Populate the global palette once.
            for (let i = 0; i < 3; i++) {
                pagePalette.push(getRandomColor());
            }

            const cellCount = hCells * vCells;
            for (let i = 0; i < cellCount; i++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                gridContainer.appendChild(cell);
                
                setTimeout(() => {
                    animateCell(cell);
                }, Math.random() * 2000);
            }
        }

        createGrid();
    </script>

</body>
</html>
