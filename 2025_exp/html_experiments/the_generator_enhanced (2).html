<html>
	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
		<title>T H E   G E N E R A T O R</title>
	</head>

<body>
<div id="controls" style="position: fixed; top: 20px; right: 20px; z-index: 1000; background: rgba(0,0,0,0.7); padding: 20px; border-radius: 15px;">
    <button id="refreshBtn">Refresh T H E  G E N E R A T O R</button><br><br>
    <button id="changeCmd">Change Command</button><br><br>
    <button id="changeFontBtn">Change Google Font</button><br><br>
    <button id="changeStyleBtn">Change Style</button><br><br>
    <input type="checkbox" id="sysadminCheck"> <label for="sysadminCheck">S Y S A D M I N</label><br>
    <input type="checkbox" id="sqlCheck"> <label for="sqlCheck">S Q L</label><br>
    <input type="checkbox" id="borderCheck"> <label for="borderCheck">Add a Border</label><br>
    <input type="checkbox" id="breakCheck"> <label for="breakCheck">Add Break</label><br><br>
    <label for="bgSelect">Background:</label><br>
    <select id="bgSelect">
        <option value="black">Black</option>
        <option value="white">White</option>
        <option value="gray">Gray</option>
        <option value="random">Random</option>
    </select>
</div>

<script src="https://code.jquery.com/jquery-1.11.0.js"></script>
<script type="text/javascript">

var linkFont=[];
var outString='';
var navGlyph=[];
var json_fonts;
var current_glyph_index = 1;

// Command arrays
var all_commands = ['##','#!','/dev/null','rm -rf','kill -9','cat','man','cd','pwd','find/-','grep','||','&&','awk','chmod 777','tail -f','uptime','head','mount','sftp','scp','cron','whoami','history','.*','[a-zA-Z]',"perl -pe 's/perl/perl/g'",'!-1','~/','touch','touch touch','more','ping','less','clear','alias','sleep','who','chown','curl','shutdown','reboot','halt','ctrl-z','ctrl-c','* * * * *','UNION ALL','OUTER JOIN','COALESCE','CONCAT','REPLACE','MIN','MAX','DROP TABLE','MERGE','ALTER TABLE','INSERT','UNION','|','`whoami`'];

var sysadmin_commands = ['#!','/dev/null','rm -rf','kill -9','cat','man','cd','pwd','find/-','grep','||','&&','awk','chmod 777','tail -f','uptime','head','mount','sftp','scp','cron','whoami','history','.*','[a-zA-Z]',"perl -pe 's/perl/perl/g'",'!-1','~/','touch','touch touch','more','ping','less','clear','alias','sleep','who','chown','curl','shutdown','reboot','halt','ctrl-z','ctrl-c','* * * * *','|','`whoami`'];

var sql_commands = ['UNION ALL','OUTER JOIN','COALESCE','CONCAT','REPLACE','MIN','MAX','DROP TABLE','MERGE','ALTER TABLE','INSERT','UNION'];

$(function(){
	loadGenerator();
});

function loadGenerator() {
	$.getJSON('https://www.googleapis.com/webfonts/v1/webfonts?key=AIzaSyBPEC-k91wzgVIMm9CZSJIINd-WKmR2Wmo', function(json) {
		json_fonts = json;
		
		var cssImportRule = document.createElement('style');
		document.getElementsByTagName('body')[0].appendChild(cssImportRule);

		var cssImportStyle = document.styleSheets[0];
		var cssImportRules=cssImportStyle.cssRules;

		for (i=1;i<=json.items.length-1;i++){
			for (subsetCnt=0;subsetCnt<=json.items[i].subsets.length-1;subsetCnt++){
				if (JSON.stringify(json.items[i].subsets[subsetCnt]) == '"latin"'){
					outString+=JSON.stringify(json.items[Math.round((json.items.length-1)*Math.random())].family)+ '<br>';
					linkFont[i] = document.createElement('link');
					document.getElementsByTagName('body')[0].appendChild(linkFont[i]);
					linkFont[i].id=JSON.stringify(json.items[i].family).replace(/"/g,"")
					linkFont[i].rel = 'stylesheet';
					linkFont[i].type = 'text/css';
					linkFont[i].href = 'https://fonts.googleapis.com/css?family=' + JSON.stringify(json.items[i].family).replace(/"/g,"") ;
				}
			}
		}

		createGlyph();
		styleControls();
		bindEvents();
	});
}

function createGlyph() {
	// Clear existing glyph
	if (navGlyph[current_glyph_index]) {
		navGlyph[current_glyph_index].remove();
	}

	var mycolors=[];
	var colNum=1;

	function setColor(hue,sat,light,opa){
		for (colorCounter=1;colorCounter<=colNum;colorCounter++){
			var toSpliceColor='hsla('
			+  Math.round(Math.random()*10-20+hue) + ','
			+  Math.round(40*Math.random()+sat-20)+ '%,'
			+ (Math.round(Math.random()*20)+light) + '%,'
			+ (1)
			+ ')';
			mycolors.splice(1,0,toSpliceColor);
		}
	}

	setColor(Math.round(Math.random()*80-10),Math.round(Math.random()*1800),Math.round(Math.random()*80),1);
	setColor(Math.round(Math.random()*340),Math.round(Math.random()*800),Math.round(Math.random()*80),1);

	// Set background
	setBackground();

	// Get command array based on checkboxes
	var command_array = getActiveCommandArray();
	
	var font=JSON.stringify(json_fonts.items[Math.round((json_fonts.items.length-1)*Math.random())].family);
	var elementName='glyphmatic' + current_glyph_index;
	navGlyph[current_glyph_index] = document.createElement("div");
	document.body.appendChild(navGlyph[current_glyph_index]);
	
	var command_text = command_array[Math.round((command_array.length-1)*Math.random())];
	
	// Add break if checkbox is checked
	if (document.getElementById('breakCheck').checked) {
		command_text += '<br>';
	}
	
	navGlyph[current_glyph_index].innerHTML = command_text;
	navGlyph[current_glyph_index].id=elementName;
	navGlyph[current_glyph_index].style.position='relative';
	navGlyph[current_glyph_index].style.color= mycolors[Math.round((mycolors.length-1)*Math.random())];
	navGlyph[current_glyph_index].style.fontSize='200px';
	navGlyph[current_glyph_index].style.padding=3+ Math.round( Math.random()*15 ) + 'px';
	navGlyph[current_glyph_index].style.lineHeight= Math.random()+.3;
	navGlyph[current_glyph_index].style.fontFamily=font;
	navGlyph[current_glyph_index].style.textAlign = 'center';
	navGlyph[current_glyph_index].style.position = 'absolute';
	navGlyph[current_glyph_index].style.top = '50%';
	navGlyph[current_glyph_index].style.left = '50%';
	navGlyph[current_glyph_index].style.transform = 'translate(-50%, -50%)';
	navGlyph[current_glyph_index].style.whiteSpace = 'nowrap';

	// Style the glyphs
	navGlyph[current_glyph_index].style.textShadow=Math.round( Math.random()*5-1 ) + 'px '
									+Math.round( Math.random()*5-1 ) + 'px '
									+ mycolors[Math.round((mycolors.length-1)*Math.random())];
	navGlyph[current_glyph_index].style.webkitTextFillColor=mycolors[Math.round((mycolors.length-1)*Math.random())];
	navGlyph[current_glyph_index].style.webkitTextStrokeWidth=Math.round(Math.random()*3-1) +"px";
	navGlyph[current_glyph_index].style.webkitTextStrokeColor=mycolors[Math.round((mycolors.length-1)*Math.random())];

	// Add border if checkbox is checked
	if (document.getElementById('borderCheck').checked) {
		addRandomBorder();
	}
}

function getActiveCommandArray() {
	var sysadmin_checked = document.getElementById('sysadminCheck').checked;
	var sql_checked = document.getElementById('sqlCheck').checked;
	
	if (sysadmin_checked && sql_checked) {
		return all_commands;
	} else if (sysadmin_checked) {
		return sysadmin_commands;
	} else if (sql_checked) {
		return sql_commands;
	} else {
		return all_commands;
	}
}

function addRandomBorder() {
	var border_styles = ['solid', 'dashed', 'dotted', 'double', 'groove', 'ridge', 'inset', 'outset'];
	var border_style = border_styles[Math.floor(Math.random() * border_styles.length)];
	var border_width = Math.floor(Math.random() * 10) + 1;
	var border_color = 'hsl(' + Math.floor(Math.random() * 360) + ', ' + 
					   Math.floor(Math.random() * 100) + '%, ' + 
					   Math.floor(Math.random() * 100) + '%)';
	
	navGlyph[current_glyph_index].style.border = border_width + 'px ' + border_style + ' ' + border_color;
}

function setBackground() {
	var bg_select = document.getElementById('bgSelect').value;
	
	switch(bg_select) {
		case 'black':
			document.body.style.backgroundColor = 'black';
			break;
		case 'white':
			document.body.style.backgroundColor = 'white';
			break;
		case 'gray':
			document.body.style.backgroundColor = 'gray';
			break;
		case 'random':
			var random_color = 'hsl(' + Math.floor(Math.random() * 360) + ', ' + 
							   Math.floor(Math.random() * 100) + '%, ' + 
							   Math.floor(Math.random() * 50) + '%)';
			document.body.style.backgroundColor = random_color;
			break;
	}
}

function changeCommand() {
	var command_array = getActiveCommandArray();
	var command_text = command_array[Math.round((command_array.length-1)*Math.random())];
	
	if (document.getElementById('breakCheck').checked) {
		command_text = command_text.replace(' ', '<br>');
	}
	
	navGlyph[current_glyph_index].innerHTML = command_text;
}

function changeFont() {
	var font = JSON.stringify(json_fonts.items[Math.round((json_fonts.items.length-1)*Math.random())].family);
	navGlyph[current_glyph_index].style.fontFamily = font;
}

function changeStyle() {
	var mycolors = [];
	var colNum = 5;

	// Generate new colors
	for (var i = 0; i < colNum; i++) {
		var hue = Math.round(Math.random() * 360);
		var sat = Math.round(Math.random() * 100);
		var light = Math.round(Math.random() * 80 + 20);
		var color = 'hsla(' + hue + ',' + sat + '%,' + light + '%,1)';
		mycolors.push(color);
	}
	
	// Apply new styles
	navGlyph[current_glyph_index].style.color = mycolors[Math.round((mycolors.length-1)*Math.random())];
	navGlyph[current_glyph_index].style.textShadow = Math.round(Math.random()*5-1) + 'px ' +
													Math.round(Math.random()*5-1) + 'px ' +
													mycolors[Math.round((mycolors.length-1)*Math.random())];
	navGlyph[current_glyph_index].style.webkitTextFillColor = mycolors[Math.round((mycolors.length-1)*Math.random())];
	navGlyph[current_glyph_index].style.webkitTextStrokeWidth = Math.round(Math.random()*5) + "px";
	navGlyph[current_glyph_index].style.webkitTextStrokeColor = mycolors[Math.round((mycolors.length-1)*Math.random())];
}

function styleControls() {
	var controls = document.getElementById('controls');
	var buttons = controls.querySelectorAll('button');
	var checkboxes = controls.querySelectorAll('input[type="checkbox"]');
	var select = controls.querySelector('select');
	var labels = controls.querySelectorAll('label');
	
	// Apply random Google font to controls (ONE font for everything)
	var menu_font = JSON.stringify(json_fonts.items[Math.round((json_fonts.items.length-1)*Math.random())].family);
	
	// Get background color to determine color scheme
	var bg_color = getComputedStyle(document.body).backgroundColor;
	var main_color, background_color, text_color;
	
	if (bg_color === 'white' || bg_color === 'rgb(255, 255, 255)') {
		// White background: Blue, Red, Black scheme
		var colors = ['#0066ff', '#ff0033', '#000000'];
		main_color = colors[Math.floor(Math.random() * colors.length)];
		background_color = 'rgba(255, 255, 255, 0.9)';
		text_color = main_color;
	} else if (bg_color === 'gray' || bg_color === 'grey' || bg_color === 'rgb(128, 128, 128)') {
		// Gray background: Blue, Red, Black scheme
		var colors = ['#0066ff', '#ff0033', '#000000'];
		main_color = colors[Math.floor(Math.random() * colors.length)];
		background_color = 'rgba(200, 200, 200, 0.9)';
		text_color = main_color;
	} else {
		// Black or random background: Electric colors
		var electric_colors = ['#00ffff', '#ff00ff', '#ffff00', '#00ff00', '#ff6600'];
		main_color = electric_colors[Math.floor(Math.random() * electric_colors.length)];
		background_color = 'rgba(0, 0, 0, 0.9)';
		text_color = main_color;
	}
	
	// Apply consistent font and background to entire controls
	controls.style.fontFamily = menu_font;
	controls.style.background = background_color;
	controls.style.border = '3px solid ' + main_color;
	
	// ALL buttons get identical OUTLINE styling (no background)
	buttons.forEach(function(button) {
		button.style.backgroundColor = 'transparent';
		button.style.color = text_color;
		button.style.border = '3px solid ' + main_color;
		button.style.borderRadius = '8px';
		button.style.padding = '15px 25px';
		button.style.fontSize = '18px';
		button.style.fontWeight = 'bold';
		button.style.cursor = 'pointer';
		button.style.margin = '5px 0';
		button.style.width = '250px';
		button.style.fontFamily = menu_font;
	});
	
	// ALL checkboxes get identical styling
	checkboxes.forEach(function(checkbox) {
		checkbox.style.transform = 'scale(1.8)';
		checkbox.style.accentColor = main_color;
		checkbox.style.marginRight = '12px';
	});
	
	// Select gets consistent styling
	select.style.backgroundColor = 'transparent';
	select.style.color = text_color;
	select.style.border = '3px solid ' + main_color;
	select.style.borderRadius = '5px';
	select.style.padding = '12px';
	select.style.fontSize = '18px';
	select.style.width = '250px';
	select.style.fontFamily = menu_font;
	select.style.fontWeight = 'bold';
	
	// ALL labels get identical styling
	labels.forEach(function(label) {
		label.style.color = text_color;
		label.style.fontWeight = 'bold';
		label.style.fontSize = '18px';
		label.style.textShadow = '2px 2px 4px rgba(0,0,0,0.8)';
		label.style.marginLeft = '10px';
		label.style.fontFamily = menu_font;
	});
}

function getContrastColor(bg_color) {
	// Simple contrast function - returns white or bright color for dark backgrounds, dark color for light backgrounds
	if (bg_color.includes('rgb')) {
		// Extract RGB values and calculate brightness
		var rgb = bg_color.match(/\d+/g);
		var brightness = (parseInt(rgb[0]) * 299 + parseInt(rgb[1]) * 587 + parseInt(rgb[2]) * 114) / 1000;
		return brightness < 128 ? '#ffffff' : '#000000';
	} else if (bg_color === 'black') {
		return '#ffffff';
	} else if (bg_color === 'white') {
		return '#000000';
	} else if (bg_color === 'gray') {
		return '#ffffff';
	} else {
		return '#ffffff'; // Default to white for random colors
	}
}

function bindEvents() {
	document.getElementById('refreshBtn').addEventListener('click', function() {
		location.reload();
	});
	
	document.getElementById('changeCmd').addEventListener('click', function() {
		changeCommand();
	});
	
	document.getElementById('changeFontBtn').addEventListener('click', function() {
		changeFont();
	});
	
	document.getElementById('changeStyleBtn').addEventListener('click', function() {
		changeStyle();
	});
	
	document.getElementById('bgSelect').addEventListener('change', function() {
		setBackground();
		styleControls(); // Re-style labels for new background
	});
	
	document.getElementById('borderCheck').addEventListener('change', function() {
		createGlyph();
	});
	
	document.getElementById('sysadminCheck').addEventListener('change', function() {
		// Uncheck SQL if sysadmin is checked
		if (this.checked) {
			document.getElementById('sqlCheck').checked = false;
		}
		// Don't auto-change command - let user click Change Command button
	});
	
	document.getElementById('sqlCheck').addEventListener('change', function() {
		// Uncheck sysadmin if SQL is checked
		if (this.checked) {
			document.getElementById('sysadminCheck').checked = false;
		}
		// Don't auto-change command - let user click Change Command button
	});
	
	document.getElementById('breakCheck').addEventListener('change', function() {
		// Only update current command when break checkbox changes
		var current_text = navGlyph[current_glyph_index].innerHTML;
		if (this.checked) {
			// Add break to current text (replace first space with <br>)
			current_text = current_text.replace(' ', '<br>');
		} else {
			// Remove breaks from current text
			current_text = current_text.replace('<br>', ' ');
		}
		navGlyph[current_glyph_index].innerHTML = current_text;
	});
}

</script>
</body>
</html>
