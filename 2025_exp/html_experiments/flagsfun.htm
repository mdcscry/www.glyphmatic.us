<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flags Fun - Glyphmatic</title>

  <!-- Glyphmatic fonts -->
  <link rel="stylesheet" href="../../css_font/glyphmatic-fonts.css">
  <link rel="stylesheet" href="../../css/flagsfun.css">
  <script src="../../js_glyph/2025_block_17/block_lang_skeleton_17.js"></script>
  <script src="../../js_funct/autoFont.js"></script>
  <script src="../../js_glyph/country_glyphs.js"></script>
</head>
<body>
  <div class="flag-container" id="flagContainer"></div>
  <div class="recipe-info" id="recipeInfo" onclick="toggleRecipeInfo()">
    <div class="title"></div>
    <div class="meta-list"></div>
  </div>

  <script>
    console.log('=== Flags Fun Script Started ===');

    // Toggle recipe info expanded/collapsed
    function toggleRecipeInfo() {
      const recipeInfo = document.getElementById('recipeInfo');
      recipeInfo.classList.toggle('expanded');
    }

    // Helper to create a CSS-safe class name from a block name
    function getBlockClassName(blockName) {
      // e.g. "Basic Latin" -> "block-basic-latin"
      const standardName = getStandardBlockName(blockName);
      return 'block-' + standardName.toLowerCase().replace(/ /g, '-');
    }

    // Helper to get a display-friendly name for a block
    function getStandardBlockName(blockName) {
      if (blockName === 'Combining Forms-flag') {
        return 'Basic Latin';
      }
      if (blockName.startsWith('Arabic-')) {
        return 'Arabic';
      }
      if (blockName.startsWith('Bengali-')) {
        return 'Bengali';
      }
      return blockName;
    }

    // ===========================================
    // FLAG RECIPES - uses countries from country_glyphs.js
    // ===========================================
    let FLAG_RECIPES = [];

    let currentRecipeIndex = 0;
    let dataLoaded = false;
    let currentCountry = null;
    let currentColors = [];
    let currentAnimationId = null;

    // Get font stack for a block using AutoFont engine
    // Track warned blocks to avoid spam
    const warnedBlocks = new Set();
    function getFontForBlock(blockName) {
      const standardBlockName = getStandardBlockName(blockName);

      // Use AutoFont to select and load a single appropriate font
      const fontDuJour = AutoFont.selectFont(blockName, block_lang, lang_font);
      if (fontDuJour === 'Noto Sans-local') {
        if (!warnedBlocks.has(blockName)) {
          console.warn(`No font mapping for block: ${blockName}`);
          warnedBlocks.add(blockName);
        }
      }

      // Load the font and get proper fallback stack
      return AutoFont.loadFont(fontDuJour);
    }

    // Build flattened glyph array with block info for a country
    function getFlattenedGlyphs(countryId) {
      const glyphsData = countryGlyphs[countryId];
      if (!glyphsData) {
        console.error(`No glyphsData for country: ${countryId}`);
        return [];
      }

      console.log(`getFlattenedGlyphs for ${countryId}:`);
      const flattened = [];
      for (const blockKey of Object.keys(glyphsData)) {
        const glyphs = glyphsData[blockKey];
        if (!glyphs || !Array.isArray(glyphs)) {
          console.error(`  Block "${blockKey}" has invalid glyphs:`, glyphs);
          continue;
        }
        console.log(`  Block "${blockKey}": ${glyphs.length} glyphs`);
        for (const glyph of glyphs) {
          if (typeof glyph !== 'string') {
            console.error(`  Invalid glyph in "${blockKey}":`, glyph);
            continue;
          }
          // Check for zero-width or control characters
          const hasZeroWidth = /[\u200B-\u200F\u2028-\u202F\uFEFF]/.test(glyph);
          const hasControl = /[\x00-\x1F\x7F-\x9F]/.test(glyph);
          if (hasZeroWidth || hasControl) {
            console.warn(`  Suspicious glyph in "${blockKey}": "${glyph}" (len=${glyph.length}, codes=${[...glyph].map(c => 'U+' + c.codePointAt(0).toString(16).toUpperCase()).join(' ')})`);
          }
          flattened.push({ glyph, blockKey });
        }
      }

      // Add special glyphs with their explicit styling
      const data = countryData[countryId];
      if (data && data.specialGlyphs) {
        for (const special of data.specialGlyphs) {
          flattened.push({
            glyph: special.glyph,
            blockKey: 'Miscellaneous Symbols',
            special: true,
            background: special.background,
            color: special.color
          });
        }
      }

      console.log(`  Total flattened glyphs: ${flattened.length}`);
      return flattened;
    }

    // Cache for flattened glyphs
    let flattenedGlyphsCache = null;

    // Generate glyph text using countryGlyphs with random flag colors
    function generateGlyphText(length, colors) {
      if (!currentCountry || !countryGlyphs[currentCountry]) {
        console.error('No country set or no glyphs for country');
        return '';
      }

      // Build or use cached flattened array
      if (!flattenedGlyphsCache) {
        flattenedGlyphsCache = getFlattenedGlyphs(currentCountry);
      }

      if (flattenedGlyphsCache.length === 0) {
        console.error('No glyphs available for country');
        return '';
      }

      // Strip ALL invisible/control characters that could cause line breaks
      const stripInvisible = (str) => str.replace(/[\x00-\x1F\x7F-\x9F\u00AD\u034F\u061C\u115F\u1160\u17B4\u17B5\u180B-\u180E\u200B-\u200F\u202A-\u202E\u2028-\u202F\u2060-\u206F\u3164\uFE00-\uFE0F\uFEFF\uFFA0\uFFF0-\uFFFF]/g, '');

      let html = '';
      for (let i = 0; i < length; i++) {
        try {
          // Pick random glyph from flattened array
          const entry = flattenedGlyphsCache[Math.floor(Math.random() * flattenedGlyphsCache.length)];

          // Clean the glyph of invisible characters
          const cleanGlyph = stripInvisible(entry.glyph);

          // Get font stack for this glyph's block
          const fontStack = getFontForBlock(entry.blockKey);

          const blockClass = getBlockClassName(entry.blockKey);

          // Special glyphs have explicit colors and backgrounds
          if (entry.special) {
            html += `<span class="glyph ${blockClass} special-glyph" style="font-family: ${fontStack}; display: inline-flex; align-items: center; justify-content: center; width: .8em; height: .8em; color: ${entry.color}; background: ${entry.background}; border-radius: 50%;">${cleanGlyph}</span>`;
          } else {
            // Random color from flag
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            html += `<span class="glyph ${blockClass}" style="font-family: ${fontStack}; color: ${randomColor}; transition: color 3s ease;">${cleanGlyph}</span>`;
          }
        } catch (error) {
          // Skip failed glyphs
        }
      }
      return html;
    }

    // Animate glyph colors - slowly morph to other flag colors
    function animateGlyphColors(colors) {
      if (currentAnimationId) {
        cancelAnimationFrame(currentAnimationId);
      }

      // Exclude special glyphs from color animation
      const glyphs = document.querySelectorAll('.glyph:not(.special-glyph)');
      if (glyphs.length === 0) return;

      function morphColors() {
        // Each frame, randomly pick some glyphs to change color
        const numToChange = Math.ceil(glyphs.length * 0.002); // Change 0.2% per frame
        for (let i = 0; i < numToChange; i++) {
          const randomGlyph = glyphs[Math.floor(Math.random() * glyphs.length)];
          const newColor = colors[Math.floor(Math.random() * colors.length)];
          randomGlyph.style.color = newColor;
        }
        currentAnimationId = requestAnimationFrame(morphColors);
      }
      morphColors();
    }

    // Check if a color is white (handles various formats)
    function isWhiteColor(color) {
      const c = color.toLowerCase().trim();
      return c === '#fff' || c === '#ffffff' || c === 'white' || c === '#f4f5f8';
    }

    // Render generic flag layout with glyphs flowing around it
    function renderGenericFlag(countryId) {
      currentCountry = countryId;
      currentColors = countryColors[countryId] || ['#fff'];
      flattenedGlyphsCache = null; // Clear cache for new country

      // Add class to body if flag contains white (for hover color adjustment)
      const hasWhite = currentColors.some(isWhiteColor);
      document.body.classList.toggle('flag-has-white', hasWhite);

      console.log(`Rendering ${countryId} with colors:`, currentColors);
      console.log(`Available blocks:`, Object.keys(countryGlyphs[countryId] || {}));

      // Generate glyphs for each section
      const topGlyphs = generateGlyphText(775, currentColors);
      const leftGlyphs = generateGlyphText(1200, currentColors);
      const rightGlyphs = generateGlyphText(1200, currentColors);

      // Get flag emoji for this country
      const flagEmoji = getCountryFlagEmoji(countryId);

      const html = `
        <div class="glyph-wrapper">
          <div class="top-row">${topGlyphs}</div>
          <div class="bottom-row">
            <div class="bottom-panel bottom-panel-left">
              <div class="flag-half"></div>
              ${leftGlyphs}
            </div>
            <div class="bottom-panel bottom-panel-right">
              <div class="flag-half"></div>
              ${rightGlyphs}
            </div>
          </div>
        </div>
        <div class="flag-generic">
          <span class="flag-emoji">${flagEmoji}</span>
        </div>
      `;

      return { html, colors: currentColors };
    }

    // Main render function
    function renderRecipe(recipeIndex) {
      if (!dataLoaded) {
        console.warn('Data not loaded yet');
        return;
      }

      // Cancel any existing animation
      if (currentAnimationId) {
        cancelAnimationFrame(currentAnimationId);
        currentAnimationId = null;
      }

      // Pick random country if no specific index given, or if index is out of range
      if (recipeIndex === undefined || recipeIndex >= FLAG_RECIPES.length) {
        recipeIndex = Math.floor(Math.random() * FLAG_RECIPES.length);
      }

      currentRecipeIndex = recipeIndex;
      alphaIndex = recipeIndex; // Keep alpha index in sync
      const recipe = FLAG_RECIPES[recipeIndex];
      const container = document.getElementById('flagContainer');
      const recipeInfo = document.getElementById('recipeInfo');

      console.log(`Rendering flag: ${recipe.name}`);

      // All flags use generic layout now
      const result = renderGenericFlag(recipe.country);

      container.innerHTML = result.html;

      // Update recipe info box
      const infoColor = result.colors[Math.floor(Math.random() * result.colors.length)] || '#333';

      // Determine text color based on background brightness
      const isLight = infoColor.toLowerCase() === '#ffffff' || infoColor.toLowerCase() === '#fff' ||
                      infoColor === '#F4F5F8' || infoColor === '#ffdf00' || infoColor === '#FCDD09';
      const textColor = isLight ? '#000' : '#fff';

      recipeInfo.style.background = infoColor;
      recipeInfo.style.color = textColor;
      recipeInfo.classList.remove('expanded');

      recipeInfo.querySelector('.title').textContent = `${recipeIndex}: ${recipe.name}`;

      // Build meta list with languages and blocks
      const currentCountryData = countryData[recipe.country];
      const langData = currentCountryData?.languages || { national: [], other: [] };
      const glyphsData = countryGlyphs[recipe.country] || {};
      const rawBlocks = Object.keys(glyphsData);
      const displayBlocks = [...new Set(rawBlocks.map(getStandardBlockName))];

      const metaList = recipeInfo.querySelector('.meta-list');
      metaList.innerHTML = ''; // Clear existing

      // Function to add a new meta entry
      const addMetaEntry = (label, value) => {
        const labelDiv = document.createElement('div');
        labelDiv.className = 'meta-label';
        labelDiv.textContent = label;
        metaList.appendChild(labelDiv);
        const valueDiv = document.createElement('div');
        valueDiv.textContent = value;
        metaList.appendChild(valueDiv);
      };

      if (currentCountryData?.iso) {
        addMetaEntry('Country Code:', currentCountryData.iso);
      }
      addMetaEntry('National Language:', langData.national.join(', ') || 'N/A');
      if (langData.other && langData.other.length > 0) {
        addMetaEntry('Other:', langData.other.join(', '));
      }

      // Handle Blocks separately for interactivity
      const blocksLabel = document.createElement('div');
      blocksLabel.className = 'meta-label';
      blocksLabel.textContent = 'Blocks:';
      metaList.appendChild(blocksLabel);

      const blocksValueDiv = document.createElement('div');
      displayBlocks.forEach((blockName, i) => {
        const blockSpan = document.createElement('span');
        blockSpan.textContent = blockName;
        blockSpan.style.cursor = 'pointer';
        
        const hoverClass = 'hover-' + getBlockClassName(blockName);

        blockSpan.addEventListener('mouseover', () => document.body.classList.add(hoverClass));
        blockSpan.addEventListener('mouseout', () => document.body.classList.remove(hoverClass));
        
        blocksValueDiv.appendChild(blockSpan);
        if (i < displayBlocks.length - 1) {
          blocksValueDiv.append(', ');
        }
      });
      metaList.appendChild(blocksValueDiv);

      if (currentCountryData?.notes) {
        addMetaEntry('Notes:', currentCountryData.notes);
      }

      // Start color morphing animation
      if (result.colors.length > 0) {
        // Small delay to let DOM render
        setTimeout(() => animateGlyphColors(result.colors), 100);
      }
    }

    // Keyboard controls
    document.addEventListener('keydown', function(event) {
      const key = event.key;

      if (key >= '0' && key <= '9') {
        const index = parseInt(key);
        if (index < FLAG_RECIPES.length) {
          alphaIndex = index;
          renderRecipe(index);
        }
      } else if (key === 'ArrowRight' || key === ' ' || key === 'n') {
        // Next country
        alphaIndex = (alphaIndex + 1) % FLAG_RECIPES.length;
        renderRecipe(alphaIndex);
      } else if (key === 'ArrowLeft' || key === 'p') {
        // Previous country
        alphaIndex = (alphaIndex - 1 + FLAG_RECIPES.length) % FLAG_RECIPES.length;
        renderRecipe(alphaIndex);
      } else if (key === 'r') {
        // Random country
        renderRecipe();
      }
    });

    // Wait for data to load
    async function checkDataLoaded() {
      console.log('Waiting for country data to load...');

      // Wait for async country loading to complete
      if (window.countryDataLoaded) {
        await window.countryDataLoaded;
      }

      // Check that all required data is available
      // Note: var_block_lang comes from var_block_skeleton.js, block_lang from block_lang_skeleton_17.js
      const hasBlockLang = typeof block_lang !== "undefined" || typeof var_block_lang !== "undefined";
      const hasLangFont = typeof lang_font !== "undefined" || typeof var_lang_font !== "undefined";
      if (typeof countryGlyphs !== "undefined" &&
          typeof countryColors !== "undefined" &&
          typeof countryData !== "undefined" &&
          hasBlockLang &&
          hasLangFont &&
          typeof countries !== "undefined" &&
          countries.length > 0) {

        initialize();
      } else {
        console.log('Data not ready yet, checking again in 100ms...');
        setTimeout(checkDataLoaded, 100);
      }
    }

    // Function to get URL parameters
    function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
    }

    // Non-UN entities: territories, dependencies, and easter eggs
    const NON_UN_ENTITIES = [
      // Easter eggs
      'pirate', 'pride', 'trans',
      // Sub-national flags
      'england', 'scotland', 'wales',
      // Territories and dependencies
      'aland_islands', 'american_samoa', 'anguilla', 'antarctica', 'aruba',
      'bermuda', 'british_indian_ocean_territory', 'british_virgin_islands',
      'caribbean_netherlands', 'cayman_islands', 'christmas_island', 'cocos_islands',
      'cook_islands', 'curacao', 'falkland_islands', 'faroe_islands', 'french_guiana',
      'french_polynesia', 'french_southern_territories', 'gibraltar', 'greenland',
      'guadeloupe', 'guam', 'guernsey', 'hong_kong', 'isle_of_man', 'jersey',
      'macau', 'martinique', 'mayotte', 'montserrat', 'new_caledonia', 'niue',
      'norfolk_island', 'northern_mariana_islands', 'pitcairn_islands', 'puerto_rico',
      'reunion', 'saint_barthelemy', 'saint_martin', 'sint_maarten', 'south_georgia',
      'svalbard', 'tokelau', 'turks_and_caicos', 'us_virgin_islands', 'wallis_and_futuna',
      'western_sahara', 'taiwan', 'palestine', 'kosovo'
    ];

    let alphaMode = false;
    let alphaIndex = 0;

    // New logic to handle URL parameter
    async function initialize() {
        // Initialize AutoFont engine
        await AutoFont.init();
        console.log('All data loaded!');

        // Build base recipes from all countries
        let filteredCountries = [...countries];

        // Check for filter mode
        const mode = getQueryParam('mode');
        if (mode === 'UN') {
          filteredCountries = countries.filter(c => !NON_UN_ENTITIES.includes(c));
          console.log('UN mode: showing only UN member states');
        } else if (mode === 'NON-UN') {
          filteredCountries = countries.filter(c => NON_UN_ENTITIES.includes(c));
          console.log('NON-UN mode: showing only territories and special flags');
        }

        // Check for alpha mode
        if (getQueryParam('alpha') !== null) {
          alphaMode = true;
          filteredCountries.sort((a, b) => a.localeCompare(b));
          console.log('Alpha mode: sequential alphabetical order');
        }

        FLAG_RECIPES = filteredCountries.map(country => ({
          id: country,
          name: country.charAt(0).toUpperCase() + country.slice(1),
          country: country,
          layout: 'generic-tricolor'
        }));

        console.log('Countries available:', FLAG_RECIPES.length);
        dataLoaded = true;

        const countryCode = getQueryParam('country');
        if (countryCode) {
            const countryIndex = FLAG_RECIPES.findIndex(recipe => {
                const country = countryData[recipe.id];
                if (!country) return false;

                const code = countryCode.toLowerCase();
                const recipeIdMatch = recipe.id.toLowerCase() === code;
                const isoMatch = country.iso && country.iso.toLowerCase() === code;

                return recipeIdMatch || isoMatch;
            });
            if (countryIndex !== -1) {
                console.log(`Country from URL: ${countryCode}, index: ${countryIndex}`);
                alphaIndex = countryIndex;
                renderRecipe(countryIndex);
            } else {
                console.log(`Country code '${countryCode}' not found. Loading random country.`);
                renderRecipe(alphaMode ? 0 : undefined);
            }
        } else {
            renderRecipe(alphaMode ? 0 : undefined); // Start at beginning if alpha mode
        }
    }

    console.log('Starting data load check...');
    window.countryDataLoaded = loadCountryData('../../js_glyph');
    checkDataLoaded();
  </script>
</body>
</html>
