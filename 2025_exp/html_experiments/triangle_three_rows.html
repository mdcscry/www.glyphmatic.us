<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../css_font/glyphmatic-fonts.css">

<style>


body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #FFF;
    font-family: 'Noto Sans Symbols','Noto Sans Symbols 2','Noto Sans Math';
}
#canvas {
    display: block;
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth * 1.5;
canvas.height = window.innerHeight * 1.5;

const size = 200;
const h = size * Math.sqrt(3) / 2;
const smallSize = size / 3;
const smallH = smallSize * Math.sqrt(3) / 2;

// Letter positioning offsets (centered in big triangles)
const letterOffsetYUp = 20;      // For up-pointing triangles
const letterOffsetYDown = -17;   // For down-pointing triangles

// Color morphing state
let currentBgColor;
let targetBgColor;
let currentLineColor;
let targetLineColor;
let currentGlyphColor;
let targetGlyphColor;
let colorProgress = 0;
const colorTransitionTime = 15000; // 15 seconds per transition
let lastFrameTime = Date.now();

// Character array with hex codes for debugging rendering issues
const charData = [
    { char: '◎', hex: '0x25CE' },
    { char: '◉', hex: '0x25C9' },
    { char: '◌', hex: '0x25CC' },
    { char: '●', hex: '0x25CF' },
    { char: '◇', hex: '0x25C7' },
    { char: '◆', hex: '0x25C6' },
    { char: '△', hex: '0x25B3' },
    { char: '▲', hex: '0x25B2' },
    { char: '▽', hex: '0x25BD' },
    { char: '▼', hex: '0x25BC' },
    { char: '♢', hex: '0x2662' },
    { char: '♦', hex: '0x2666' },
    { char: '◬', hex: '0x25EC' },
    { char: '◭', hex: '0x25ED' },
    { char: '◮', hex: '0x25EE' },
    { char: '◦', hex: '0x25E6' },
    { char: '○', hex: '0x25CB' },
    { char: '▾', hex: '0x25BE' },
    { char: '▿', hex: '0x25BF' },
    { char: '▴', hex: '0x25B4' },
    { char: '▵', hex: '0x25B5' },
    { char: '▪', hex: '0x25AA' },
    { char: '▫', hex: '0x25AB' },
    { char: '🞄', hex: '0x1F784' },
    { char: '🞅', hex: '0x1F785' },
    { char: '🞆', hex: '0x1F786' },
    { char: '🞇', hex: '0x1F787' },
    { char: '🞈', hex: '0x1F788' },
    { char: '🞉', hex: '0x1F789' },
    { char: '🞊', hex: '0x1F78A' },
    { char: '🞋', hex: '0x1F78B' },
    { char: '🞠', hex: '0x1F7A0' },
    { char: '🞗', hex: '0x1F797' },
    { char: '🞘', hex: '0x1F798' },
    { char: '🞙', hex: '0x1F799' },
    { char: '🞚', hex: '0x1F79A' },
    { char: '🞛', hex: '0x1F79B' },
    { char: '🞜', hex: '0x1F79C' },
    { char: '🞝', hex: '0x1F79D' },
    { char: '🞞', hex: '0x1F79E' },
    { char: '🞟', hex: '0x1F79F' },
    { char: '🞔', hex: '0x1F794' },
    { char: '🞕', hex: '0x1F795' },
    { char: '🞖', hex: '0x1F796' },
    { char: '🟒', hex: '0x1F7D2' },
    { char: '🟓', hex: '0x1F7D3' },
    { char: '⎊', hex: '0x238A' },
    { char: '⏃', hex: '0x23C3' },
    { char: '⏚', hex: '0x23DA' },
    { char: '∆', hex: '0x2206' },
    { char: '∇', hex: '0x2207' },
    { char: '⊻', hex: '0x22BB' },
    { char: '⊼', hex: '0x22BC' },
    { char: '⊽', hex: '0x22BD' },
    { char: '⋮', hex: '0x22EE' },
    { char: '⋯', hex: '0x22EF' },
    { char: '⟁', hex: '0x27C1' },
    { char: '⧨', hex: '0x29E8' },
    { char: '⧩', hex: '0x29E9' },
    { char: '⦁', hex: '0x2981' },
    { char: '⦂', hex: '0x2982' },
    { char: '⍋', hex: '0x234B' },
    { char: '⍌', hex: '0x234C' },
    { char: '⍍', hex: '0x234D' },
    { char: '⍒', hex: '0x2352' },
    { char: '⍓', hex: '0x2353' },
    { char: '⍔', hex: '0x2354' },
    { char: '⍙', hex: '0x2359' },
    { char: '⍫', hex: '0x236B' },
    { char: '⏣', hex: '0x23E3' },
    { char: '⎔', hex: '0x2394' },
    { char: '⍢', hex: '0x2362' },
    { char: '⬮', hex: '0x2B2E' },
    { char: '⬯', hex: '0x2B2F' },
    { char: '⭖', hex: '0x2B56' },
    { char: '⮛', hex: '0x2B9B' },
    { char: '⮙', hex: '0x2B99' },
    { char: '⮝', hex: '0x2B9D' },
    { char: '⮟', hex: '0x2B9F' },
    { char: '⯌', hex: '0x2BCC' },
    { char: '⯯', hex: '0x2BEF' },
    { char: '⯭', hex: '0x2BED' },
    { char: '⯼', hex: '0x2BFC' }
];

// Pick random character on page load, stays same until page refresh
const selectedCharData = charData[Math.floor(Math.random() * charData.length)];
const currentChar = selectedCharData.char;

// Log the selected character and its hex code for debugging
console.log(`Selected character: "${selectedCharData.char}" (hex: ${selectedCharData.hex})`);
console.log(`Total characters available: ${charData.length}`);

function randomColor() {
    return {
        r: Math.floor(Math.random() * 256),
        g: Math.floor(Math.random() * 256),
        b: Math.floor(Math.random() * 256)
    };
}

// Initialize all colors to random values
currentBgColor = randomColor();
targetBgColor = randomColor();
currentLineColor = randomColor();
targetLineColor = randomColor();
currentGlyphColor = randomColor();
targetGlyphColor = randomColor();

function lerpColor(from, to, t) {
    return {
        r: Math.floor(from.r + (to.r - from.r) * t),
        g: Math.floor(from.g + (to.g - from.g) * t),
        b: Math.floor(from.b + (to.b - from.b) * t)
    };
}

function colorToString(color) {
    return `rgb(${color.r}, ${color.g}, ${color.b})`;
}

function drawTrapezoidTriangle(centerX, centerY, pointUp) {
    let topVertex, bottomLeft, bottomRight;
    let startY;

    if (pointUp) {
        topVertex = { x: centerX, y: centerY - h * 2/3 };
        bottomLeft = { x: centerX - size/2, y: centerY + h * 1/3 };
        bottomRight = { x: centerX + size/2, y: centerY + h * 1/3 };
        startY = topVertex.y + smallH * 2/3;
    } else {
        topVertex = { x: centerX, y: centerY + h * 2/3 };
        bottomLeft = { x: centerX - size/2, y: centerY - h * 1/3 };
        bottomRight = { x: centerX + size/2, y: centerY - h * 1/3 };
        startY = topVertex.y - smallH * 2/3;
    }

    function drawSmallTriangle(x, y, triPointUp) {
        const vertices = triPointUp ? [
            { x: x, y: y - smallH * 2/3 },
            { x: x - smallSize/2, y: y + smallH * 1/3 },
            { x: x + smallSize/2, y: y + smallH * 1/3 }
        ] : [
            { x: x, y: y + smallH * 2/3 },
            { x: x - smallSize/2, y: y - smallH * 1/3 },
            { x: x + smallSize/2, y: y - smallH * 1/3 }
        ];
        return vertices;
    }

    const dir = pointUp ? 1 : -1;

    drawSmallTriangle(centerX, startY, pointUp);
    const v2 = drawSmallTriangle(centerX - smallSize/2, startY + dir * smallH, pointUp);
    const v3 = drawSmallTriangle(centerX, startY + dir * smallH * 2/3, !pointUp);
    const v4 = drawSmallTriangle(centerX + smallSize/2, startY + dir * smallH, pointUp);
    drawSmallTriangle(centerX - smallSize, startY + dir * 2*smallH, pointUp);
    const v6 = drawSmallTriangle(centerX - smallSize/2, startY + dir * smallH * 5/3, !pointUp);
    const v7 = drawSmallTriangle(centerX, startY + dir * 2*smallH, pointUp);
    const v8 = drawSmallTriangle(centerX + smallSize/2, startY + dir * smallH * 5/3, !pointUp);
    drawSmallTriangle(centerX + smallSize, startY + dir * 2*smallH, pointUp);

    // Use current interpolated line color
    const lineColor = lerpColor(currentLineColor, targetLineColor, colorProgress);
    ctx.strokeStyle = colorToString(lineColor);
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(v2[1].x, v2[1].y);
    ctx.lineTo(v6[2].x, v6[2].y);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(v7[2].x, v7[2].y);
    ctx.lineTo(v8[1].x, v8[1].y);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(v3[2].x, v3[2].y);
    ctx.lineTo(v4[1].x, v4[1].y);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(topVertex.x, topVertex.y);
    ctx.lineTo(bottomLeft.x, bottomLeft.y);
    ctx.lineTo(bottomRight.x, bottomRight.y);
    ctx.closePath();
    ctx.stroke();

    // Fill trapezoids with single character (same for all positions)
    const glyphColor = lerpColor(currentGlyphColor, targetGlyphColor, colorProgress);
    ctx.fillStyle = colorToString(glyphColor);
    ctx.font = `${size / 8}px mono`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const letterSpacing = smallSize / 2.5;
    const rowSpacing = smallH / 2;

    // Fill ONLY top trapezoid with letters (0° or 180° rotation)
    const letterOffsetY = pointUp ? letterOffsetYUp : letterOffsetYDown;
    const topStartY = startY + letterOffsetY;
    for (let row = 0; row < 4; row++) {
        const numLetters = row + 1;
        const y = topStartY + row * rowSpacing * dir;
        for (let col = 0; col < numLetters; col++) {
            const x = centerX + (col - (numLetters - 1) / 2) * letterSpacing;
            ctx.fillText(currentChar, x, y);
        }
    }

    // Left and right trapezoids (120° and 240° rotations) - not filled yet
    // Left trapezoid: ~240° rotation
    // Right trapezoid: ~120° rotation
}

function drawPattern() {
    // Set background color with interpolation
    const bgColor = lerpColor(currentBgColor, targetBgColor, colorProgress);
    canvas.style.backgroundColor = colorToString(bgColor);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const startY = 100;
    const numTriangles = 15;

    // Calculate starting X to center all triangles
    const totalWidth = (numTriangles - 1) * size / 2;
    const startX = (window.innerWidth - totalWidth) / 2;

    // Row spacing: full triangle height for perfect edge sharing
    const rowSpacing = h;

    // Draw 5 rows of triangles with shared edges
    for (let row = 0; row < 5; row++) {
        const baseY = startY + row * rowSpacing;

        for (let i = 0; i < numTriangles; i++) {
            // Alternate pattern each row
            const pointUp = (row % 2 === 0) ? (i % 2 === 0) : (i % 2 === 1);
            const x = startX + i * (size / 2);
            const y = pointUp ? baseY : baseY - h / 3;

            drawTrapezoidTriangle(x, y, pointUp);
        }
    }
}

function animate() {
    const now = Date.now();
    const deltaTime = now - lastFrameTime;
    lastFrameTime = now;

    // Update color progress
    colorProgress += deltaTime / colorTransitionTime;

    // When transition completes, pick new targets
    if (colorProgress >= 1) {
        colorProgress = 0;
        currentBgColor = lerpColor(currentBgColor, targetBgColor, 1);
        currentLineColor = lerpColor(currentLineColor, targetLineColor, 1);
        currentGlyphColor = lerpColor(currentGlyphColor, targetGlyphColor, 1);
        targetBgColor = randomColor();
        targetLineColor = randomColor();
        targetGlyphColor = randomColor();
    }

    drawPattern();
    requestAnimationFrame(animate);
}

// Start the animation loop
animate();

window.addEventListener('resize', () => {
    canvas.width = window.innerWidth * 1.5;
    canvas.height = window.innerHeight * 1.5;
});

</script>
