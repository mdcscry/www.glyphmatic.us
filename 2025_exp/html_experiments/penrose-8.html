<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penrose Tiling × 8</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #1a1a2e; 
            min-height: 100vh;
            padding: 10px;
            font-family: system-ui, sans-serif;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
            height: calc(100vh - 20px);
        }
        .cell {
            position: relative;
            background: #252540;
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
        }
        .controls {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .cell:hover .controls {
            opacity: 1;
        }
        button {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            background: rgba(74, 74, 106, 0.9);
            color: white;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
        }
        button:hover { background: rgba(106, 106, 138, 0.9); }
    </style>
</head>
<body>
    <div class="grid" id="grid"></div>

    <script>
        const PHI = (1 + Math.sqrt(5)) / 2;
        
        const glyphs = [
            '☀', '★', '✦', '◆', '●', '▲', '♦', '♠', '♣', '♥',
            '✿', '❀', '✤', '✥', '❖', '⬟', '⬡', '⬢', '△', '○',
            '◇', '□', '⬠', '✶', '✹', '❋', '✺', '⚡', '☾', '☽',
            '⟡', '⟐', '◈', '❂', '✴', '✵', '❇', '❈', '✳', '✲'
        ];
        
        function randomColor() {
            const h = Math.random() * 360;
            const s = 50 + Math.random() * 30;
            const l = 45 + Math.random() * 25;
            return `hsl(${h}, ${s}%, ${l}%)`;
        }
        
        function randomGlyph() {
            return glyphs[Math.floor(Math.random() * glyphs.length)];
        }
        
        function cAdd(a, b) { return [a[0] + b[0], a[1] + b[1]]; }
        function cSub(a, b) { return [a[0] - b[0], a[1] - b[1]]; }
        function cScale(a, s) { return [a[0] * s, a[1] * s]; }
        
        function subdivideTriangles(tris) {
            const result = [];
            for (const tri of tris) {
                const [type, A, B, C] = tri;
                if (type === 0) {
                    const P = cAdd(A, cScale(cSub(B, A), 1 / PHI));
                    result.push([0, C, P, B]);
                    result.push([1, P, C, A]);
                } else {
                    const Q = cAdd(B, cScale(cSub(A, B), 1 / PHI));
                    const R = cAdd(B, cScale(cSub(C, B), 1 / PHI));
                    result.push([1, Q, R, B]);
                    result.push([0, R, Q, A]);
                    result.push([1, R, A, C]);
                }
            }
            return result;
        }
        
        function createPenroseInstance(container, index) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            const controls = document.createElement('div');
            controls.className = 'controls';
            controls.innerHTML = `
                <button data-action="unsub">−</button>
                <button data-action="sub">+</button>
                <button data-action="rand">↻</button>
            `;
            
            cell.appendChild(canvas);
            cell.appendChild(controls);
            container.appendChild(cell);
            
            let triangles = [];
            let subdivisionHistory = [];
            let tileColors = new Map();
            let tileGlyphs = new Map();
            
            function initTriangles(size) {
                triangles = [];
                subdivisionHistory = [];
                const cx = size / 2;
                const cy = size / 2;
                const radius = size * 0.48;
                
                for (let i = 0; i < 10; i++) {
                    const angle1 = (2 * Math.PI * i) / 10 - Math.PI / 2;
                    const angle2 = (2 * Math.PI * (i + 1)) / 10 - Math.PI / 2;
                    
                    const A = [cx, cy];
                    const B = [cx + radius * Math.cos(angle1), cy + radius * Math.sin(angle1)];
                    const C = [cx + radius * Math.cos(angle2), cy + radius * Math.sin(angle2)];
                    
                    if (i % 2 === 0) {
                        triangles.push([1, A, B, C]);
                    } else {
                        triangles.push([1, A, C, B]);
                    }
                }
                
                // Random initial subdivisions (1-3)
                const initialSubs = 1 + Math.floor(Math.random() * 3);
                for (let i = 0; i < initialSubs; i++) {
                    subdivisionHistory.push(JSON.parse(JSON.stringify(triangles)));
                    triangles = subdivideTriangles(triangles);
                }
            }
            
            function getTileKey(tri) {
                const cx = ((tri[1][0] + tri[2][0] + tri[3][0]) / 3).toFixed(1);
                const cy = ((tri[1][1] + tri[2][1] + tri[3][1]) / 3).toFixed(1);
                return `${tri[0]}_${cx}_${cy}`;
            }
            
            function getTriangleSize(tri) {
                const [type, A, B, C] = tri;
                const ab = Math.hypot(B[0] - A[0], B[1] - A[1]);
                const bc = Math.hypot(C[0] - B[0], C[1] - B[1]);
                const ca = Math.hypot(A[0] - C[0], A[1] - C[1]);
                return Math.min(ab, bc, ca);
            }
            
            function draw() {
                const size = Math.min(canvas.width, canvas.height);
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                for (const tri of triangles) {
                    const [type, A, B, C] = tri;
                    const key = getTileKey(tri);
                    
                    if (!tileColors.has(key)) {
                        tileColors.set(key, randomColor());
                    }
                    if (!tileGlyphs.has(key)) {
                        tileGlyphs.set(key, randomGlyph());
                    }
                    
                    ctx.beginPath();
                    ctx.moveTo(A[0], A[1]);
                    ctx.lineTo(B[0], B[1]);
                    ctx.lineTo(C[0], C[1]);
                    ctx.closePath();
                    
                    ctx.fillStyle = tileColors.get(key);
                    ctx.fill();
                    
                    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                    
                    const cx = (A[0] + B[0] + C[0]) / 3;
                    const cy = (A[1] + B[1] + C[1]) / 3;
                    const tileSize = getTriangleSize(tri);
                    const fontSize = Math.max(8, tileSize * 0.35);
                    
                    ctx.font = `${fontSize}px sans-serif`;
                    ctx.fillStyle = 'rgba(0,0,0,0.5)';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(tileGlyphs.get(key), cx, cy);
                }
            }
            
            function resize() {
                const rect = cell.getBoundingClientRect();
                const size = Math.min(rect.width, rect.height);
                canvas.width = size;
                canvas.height = size;
                
                tileColors.clear();
                tileGlyphs.clear();
                initTriangles(size);
                draw();
            }
            
            function subdivide() {
                subdivisionHistory.push(JSON.parse(JSON.stringify(triangles)));
                triangles = subdivideTriangles(triangles);
                tileColors.clear();
                tileGlyphs.clear();
                draw();
            }
            
            function unsubdivide() {
                if (subdivisionHistory.length > 0) {
                    triangles = subdivisionHistory.pop();
                    tileColors.clear();
                    tileGlyphs.clear();
                    draw();
                }
            }
            
            function randomize() {
                tileColors.clear();
                tileGlyphs.clear();
                draw();
            }
            
            controls.addEventListener('click', (e) => {
                const action = e.target.dataset.action;
                if (action === 'sub') subdivide();
                else if (action === 'unsub') unsubdivide();
                else if (action === 'rand') randomize();
            });
            
            // Initial setup
            setTimeout(resize, 50);
            
            return { resize };
        }
        
        // Create 8 instances
        const grid = document.getElementById('grid');
        const instances = [];
        
        for (let i = 0; i < 8; i++) {
            instances.push(createPenroseInstance(grid, i));
        }
        
        // Handle window resize
        window.addEventListener('resize', () => {
            instances.forEach(inst => inst.resize());
        });
    </script>
</body>
</html>
