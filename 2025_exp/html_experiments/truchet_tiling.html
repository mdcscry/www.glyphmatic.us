<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
}
#canvas {
    display: block;
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const colors = [
    '#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', 
    '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E2',
    '#F8B739', '#52B788', '#E63946', '#A8DADC'
];

const glyphs = ['◆', '●', '■', '▲', '★', '◉', '◈', '◐'];

function randomColor() {
    return colors[Math.floor(Math.random() * colors.length)];
}

function randomGlyph() {
    return glyphs[Math.floor(Math.random() * glyphs.length)];
}

// Draw a Truchet tile (quarter circles in corners)
function drawTruchetTile(x, y, size, rotation, color1, color2) {
    ctx.save();
    ctx.translate(x + size/2, y + size/2);
    ctx.rotate(rotation * Math.PI / 2);
    ctx.translate(-size/2, -size/2);
    
    // Background
    ctx.fillStyle = color1;
    ctx.fillRect(0, 0, size, size);
    
    // Draw two quarter circles
    ctx.fillStyle = color2;
    
    // Top-left quarter circle
    ctx.beginPath();
    ctx.arc(0, 0, size, 0, Math.PI/2);
    ctx.lineTo(0, 0);
    ctx.closePath();
    ctx.fill();
    
    // Bottom-right quarter circle
    ctx.beginPath();
    ctx.arc(size, size, size, Math.PI, Math.PI * 3/2);
    ctx.lineTo(size, size);
    ctx.closePath();
    ctx.fill();
    
    ctx.restore();
    
    // Draw glyph in center
    ctx.save();
    ctx.translate(x + size/2, y + size/2);
    ctx.rotate(Math.random() * Math.PI * 2);
    
    const fontSize = size * 0.4;
    ctx.font = `${fontSize}px Arial`;
    ctx.fillStyle = randomColor();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(randomGlyph(), 0, 0);
    
    ctx.restore();
}

function drawTruchetTiling() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    const tileSize = 80;
    
    for (let y = 0; y < canvas.height; y += tileSize) {
        for (let x = 0; x < canvas.width; x += tileSize) {
            const rotation = Math.floor(Math.random() * 4); // 0, 1, 2, or 3 (90° rotations)
            const color1 = randomColor();
            const color2 = randomColor();
            
            drawTruchetTile(x, y, tileSize, rotation, color1, color2);
            
            // Optional: draw tile border
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, tileSize, tileSize);
        }
    }
}

drawTruchetTiling();

canvas.addEventListener('click', drawTruchetTiling);

window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    drawTruchetTiling();
});

</script>

</body>
</html>
