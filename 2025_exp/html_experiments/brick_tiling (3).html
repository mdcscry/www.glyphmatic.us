<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
}
#canvas {
    display: block;
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const colors = [
    '#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', 
    '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E2',
    '#F8B739', '#52B788', '#E63946', '#A8DADC'
];

const glyphs = ['█', '▭'];  // Full block and outline horizontal rectangles

function randomColor() {
    return colors[Math.floor(Math.random() * colors.length)];
}

function randomGlyph() {
    return glyphs[Math.floor(Math.random() * glyphs.length)];
}

function drawBrick(x, y, width, height) {
    const bgColor = randomColor();
    const borderColor = randomColor();
    
    // Draw brick background
    ctx.fillStyle = bgColor;
    ctx.fillRect(x, y, width, height);
    
    // Draw border in different color
    ctx.strokeStyle = borderColor;
    ctx.lineWidth = 3;
    ctx.strokeRect(x, y, width, height);
    
    // Draw glyph - much bigger
    const fontSize = Math.min(width, height) * 0.9;
    const glyph = randomGlyph();
    const glyphColor = randomColor();
    const glyphBorderColor = randomColor();
    
    ctx.font = `${fontSize}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    // Draw glyph border
    ctx.strokeStyle = glyphBorderColor;
    ctx.lineWidth = 2;
    ctx.strokeText(glyph, x + width/2, y + height/2);
    
    // Draw glyph fill
    ctx.fillStyle = glyphColor;
    ctx.fillText(glyph, x + width/2, y + height/2);
}

function drawRunningBond() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, canvas.width, canvas.height);
    ctx.clip();
    
    const brickWidth = 120;
    const brickHeight = 50;
    
    // Running bond: each row is offset by half a brick width
    for (let row = 0; row * brickHeight < canvas.height; row++) {
        const y = row * brickHeight;
        const offsetX = (row % 2) * (brickWidth / 2);
        
        for (let col = -1; col * brickWidth - offsetX < canvas.width; col++) {
            const x = col * brickWidth - offsetX;
            drawBrick(x, y, brickWidth, brickHeight);
        }
    }
    
    ctx.restore();
}

drawRunningBond();

canvas.addEventListener('click', drawRunningBond);

window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    drawRunningBond();
});

</script>

</body>
</html>
