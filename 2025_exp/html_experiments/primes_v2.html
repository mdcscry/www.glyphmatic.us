<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primes</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        .line-v {
            position: absolute;
            top: 0;
            height: 100%;
            width: 1px;
            background: #d4d420;
            opacity: 0.7;
        }
        .line-h {
            position: absolute;
            left: 0;
            width: 100%;
            height: 1px;
            background: #d4d420;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container" id="container"></div>

    <script>
        const container = document.getElementById('container');
        const width = window.innerWidth;
        const height = window.innerHeight;
        
        // Sieve of Eratosthenes
        function getPrimes(max) {
            const sieve = new Array(max + 1).fill(true);
            sieve[0] = sieve[1] = false;
            
            for (let i = 2; i <= Math.sqrt(max); i++) {
                if (sieve[i]) {
                    for (let j = i * i; j <= max; j += i) {
                        sieve[j] = false;
                    }
                }
            }
            
            const primes = [];
            for (let i = 2; i <= max; i++) {
                if (sieve[i]) primes.push(i);
            }
            return primes;
        }
        
        // Scale factor
        const maxVal = Math.max(width, height) * 2;
        const primes = getPrimes(maxVal);
        
        // Vertical lines
        primes.forEach(p => {
            const x = (p / maxVal) * width;
            if (x < width) {
                const line = document.createElement('div');
                line.className = 'line-v';
                line.style.left = `${x}px`;
                container.appendChild(line);
            }
        });
        
        // Horizontal lines
        primes.forEach(p => {
            const y = (p / maxVal) * height;
            if (y < height) {
                const line = document.createElement('div');
                line.className = 'line-h';
                line.style.top = `${y}px`;
                container.appendChild(line);
            }
        });
    </script>
</body>
</html>
