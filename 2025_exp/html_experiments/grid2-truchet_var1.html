<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seamless Truchet Tiles</title>
    <style>
        :root {
            /* --- CONTROLS --- */
            /* Change this number, and everything stays perfectly aligned */
            --cell-size: 60px;
            --line-width: 14px; 
            --line-color: #4ade80;
            --bg-color: #222;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            overflow: hidden;
        }

        #grid-container {
            display: grid;
            grid-template-columns: repeat(10, var(--cell-size));
            grid-template-rows: repeat(10, var(--cell-size));
            /* No borders on container to keep it clean */
            border: 1px solid #333;
        }

        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            position: relative;
            overflow: hidden; /* Cuts off the excess line width at the edge */
            transition: transform 0.6s cubic-bezier(0.4, 0.0, 0.2, 1);
            transform-style: preserve-3d;
            will-change: transform;
        }

        .arc {
            position: absolute;
            border-radius: 50%;
            border: var(--line-width) solid var(--line-color);
            
            /* --- THE FIX --- */
            /* 1. We make the box larger than 100% by exactly one line-width.
                  This pushes the 'center' of the stroke to the edge of the cell. */
            width: calc(100% + var(--line-width));
            height: calc(100% + var(--line-width));
        }

        /* Top-Left Arc */
        .arc-1 {
            /* 2. We shift it back by half the line-width to center it */
            top: calc(-50% - (var(--line-width) / 2));
            left: calc(-50% - (var(--line-width) / 2));
        }

        /* Bottom-Right Arc */
        .arc-2 {
            bottom: calc(-50% - (var(--line-width) / 2));
            right: calc(-50% - (var(--line-width) / 2));
        }

    </style>
</head>
<body>

    <div id="grid-container"></div>

    <script>
        const gridContainer = document.getElementById('grid-container');
        const rows = 10;
        const cols = 10;
        const cells = []; 

        function createGrid() {
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');

                    const arc1 = document.createElement('div');
                    arc1.classList.add('arc', 'arc-1');

                    const arc2 = document.createElement('div');
                    arc2.classList.add('arc', 'arc-2');

                    cell.appendChild(arc1);
                    cell.appendChild(arc2);

                    // Checkerboard start
                    let rotation = 0;
                    if ((r + c) % 2 !== 0) {
                        rotation = 90;
                    }

                    cell.setAttribute('data-rotation', rotation);
                    cell.style.transform = `rotate(${rotation}deg)`;

                    gridContainer.appendChild(cell);
                    cells.push(cell);
                }
            }
        }

        function startChaos() {
            setInterval(() => {
                const randomIndex = Math.floor(Math.random() * cells.length);
                const randomCell = cells[randomIndex];

                let currentRot = parseInt(randomCell.getAttribute('data-rotation'));
                const direction = Math.random() > 0.5 ? 90 : -90;
                let newRot = currentRot + direction;

                randomCell.style.transform = `rotate(${newRot}deg)`;
                randomCell.setAttribute('data-rotation', newRot);

            }, 200); 
        }

        createGrid();
        startChaos();

    </script>
</body>
</html>
