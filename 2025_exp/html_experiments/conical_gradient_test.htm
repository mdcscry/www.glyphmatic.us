<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conic Gradient Transition</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: visible;
            background-color: #1a1a1a;
        }

        #grid-container {
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            width: 100vw;
            height: 100vh;
            gap: 0px; /* A small gap between cells */
            background-color: #111;
        }

        .grid-cell {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 0px;
            overflow: visible; /* Ensures gradients don't bleed past the rounded corners */
        }

        .gradient-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 0px;
            transition: opacity 1s ease-in-out; /* Longer transition time */
        }
    </style>
</head>
<body>

    <div id="grid-container"></div>

    <script>
        const gridContainer = document.getElementById('grid-container');
        const transitionTime = 5000; // 5 seconds for the fade (must match CSS)
        const baseHoldTime = 4000;   // Base time to show each gradient

        // Create a single, global palette of 3 colors for the entire page.
        const pagePalette = [];

        function getRandomColor() {
            const hue = Math.floor(Math.random() * 360);
            const saturation = Math.floor(Math.random() * 40) + 60;
            const lightness = Math.floor(Math.random() * 30) + 40;
            return `hsl(${hue}, ${saturation}%, ${lightness}%)`;
        }

        function generateRandomConicGradient() {
            // 1. Define a random number of color stops for the gradient.
            const numStops = Math.floor(Math.random() * 5) + 80; // 3 to 7 stops
            const stops = [];

            // 2. Add the stops, ensuring all 3 colors from the pagePalette are used.
            for (let i = 0; i < numStops; i++) {
                // For each stop, pick a color from the global pagePalette by cycling through it.
                const color = pagePalette[i % pagePalette.length];
                stops.push(color);
            }
            stops.push(stops[0]); // Add the first color to the end to create a seamless loop
            
            const fromAngle = Math.floor(Math.random() * 360);
            return `conic-gradient(from ${fromAngle}deg, ${stops.join(', ')})`;
        }

        /**
         * Creates and manages the animation for a single grid cell.
         * @param {HTMLElement} cell - The container div for a single animation.
         */
        function animateCell(cell) {
            const layer1 = document.createElement('div');
            layer1.className = 'gradient-layer';
            const layer2 = document.createElement('div');
            layer2.className = 'gradient-layer';
            cell.appendChild(layer1);
            cell.appendChild(layer2);

            let topLayer = layer1;
            let bottomLayer = layer2;

            function changeGradient() {
                const newGradient = generateRandomConicGradient();

                // 1. Apply the new gradient to the layer that is currently on the bottom.
                bottomLayer.style.background = newGradient;

                // 2. Make the bottom layer visible (but still behind the top layer).
                bottomLayer.style.opacity = '1';

                // 3. Fade out the top layer to reveal the new gradient behind it.
                topLayer.style.opacity = '0';

                // 4. After the transition, swap their roles for the next cycle.
                // The layer that was on top is now on the bottom and hidden.
                // The layer that was on the bottom is now on top and visible.
                const temp = topLayer;
                topLayer = bottomLayer;
                bottomLayer = temp;
            }

            // Initial setup for this specific cell
            topLayer.style.background = generateRandomConicGradient();
            topLayer.style.opacity = '1';
            bottomLayer.style.opacity = '0';
            
            // Start the animation loop with a random offset to desynchronize the cells
            const randomHoldTime = baseHoldTime + (Math.random() * 4000); // 4 to 8 seconds
            setInterval(changeGradient, randomHoldTime + transitionTime);
        }

        /**
         * Creates the entire grid of animating cells.
         */
        function createGrid() {
            // Populate the global palette once at the beginning.
            for (let i = 0; i < 50; i++) {
                pagePalette.push(getRandomColor());
            }

            const cellCount = 15 * 15;
            for (let i = 0; i < cellCount; i++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                gridContainer.appendChild(cell);
                
                // Start the animation for this cell after a slight random delay
                // This staggers the initial animations for a more organic start.
                setTimeout(() => {
                    animateCell(cell);
                }, Math.random() * 20000);
            }
        }

        // Create the grid on page load
        createGrid();
    </script>

</body>
</html>
