<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penrose Tiling</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #1a1a2e; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, sans-serif;
        }
        canvas { 
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .controls {
            position: fixed;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            background: #4a4a6a;
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        button:hover { background: #6a6a8a; }
    </style>
</head>
<body>
    <div class="controls">
        <button onclick="regenerate()">New Colors</button>
        <button onclick="subdivide()">Subdivide</button>
    </div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Golden ratio
        const PHI = (1 + Math.sqrt(5)) / 2;
        
        // Set canvas size
        const size = Math.min(window.innerWidth - 40, window.innerHeight - 40, 800);
        canvas.width = size;
        canvas.height = size;
        
        // Tile types: 0 = thin rhombus, 1 = thick rhombus
        // Using P3 Penrose tiling (rhombus version)
        
        let triangles = [];
        
        // Generate random pastel-ish color
        function randomColor() {
            const h = Math.random() * 360;
            const s = 50 + Math.random() * 30;
            const l = 45 + Math.random() * 25;
            return `hsl(${h}, ${s}%, ${l}%)`;
        }
        
        // Complex number operations for easier rotation
        function cAdd(a, b) { return [a[0] + b[0], a[1] + b[1]]; }
        function cSub(a, b) { return [a[0] - b[0], a[1] - b[1]]; }
        function cMul(a, b) { return [a[0]*b[0] - a[1]*b[1], a[0]*b[1] + a[1]*b[0]]; }
        function cScale(a, s) { return [a[0] * s, a[1] * s]; }
        
        // Robinson triangle types for P3 tiling
        // type 0: small triangle (36-36-108)
        // type 1: large triangle (36-72-72)
        
        function subdivideTriangles(tris) {
            const result = [];
            
            for (const tri of tris) {
                const [type, A, B, C] = tri;
                
                if (type === 0) {
                    // Subdivide small (red) triangle
                    // A is the apex (36°), B and C are base (72° each)
                    const P = cAdd(A, cScale(cSub(B, A), 1 / PHI));
                    result.push([0, C, P, B]);
                    result.push([1, P, C, A]);
                } else {
                    // Subdivide large (blue) triangle
                    // A is the apex (36°), B is 72°, C is 72°
                    const Q = cAdd(B, cScale(cSub(A, B), 1 / PHI));
                    const R = cAdd(B, cScale(cSub(C, B), 1 / PHI));
                    result.push([1, Q, R, B]);
                    result.push([0, R, Q, A]);
                    result.push([1, R, A, C]);
                }
            }
            
            return result;
        }
        
        function initTriangles() {
            triangles = [];
            const cx = size / 2;
            const cy = size / 2;
            const radius = size * 0.48;
            
            // Create initial wheel of 10 large triangles
            for (let i = 0; i < 10; i++) {
                const angle1 = (2 * Math.PI * i) / 10 - Math.PI / 2;
                const angle2 = (2 * Math.PI * (i + 1)) / 10 - Math.PI / 2;
                
                const A = [cx, cy];
                const B = [cx + radius * Math.cos(angle1), cy + radius * Math.sin(angle1)];
                const C = [cx + radius * Math.cos(angle2), cy + radius * Math.sin(angle2)];
                
                if (i % 2 === 0) {
                    triangles.push([1, A, B, C]);
                } else {
                    triangles.push([1, A, C, B]);
                }
            }
        }
        
        let subdivisions = 0;
        const maxSubdivisions = 7;
        let tileColors = new Map();
        
        function getTileKey(tri) {
            // Create a key based on centroid (rounded to avoid floating point issues)
            const cx = ((tri[1][0] + tri[2][0] + tri[3][0]) / 3).toFixed(1);
            const cy = ((tri[1][1] + tri[2][1] + tri[3][1]) / 3).toFixed(1);
            return `${tri[0]}_${cx}_${cy}`;
        }
        
        function drawTriangles() {
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, size, size);
            
            for (const tri of triangles) {
                const [type, A, B, C] = tri;
                const key = getTileKey(tri);
                
                if (!tileColors.has(key)) {
                    tileColors.set(key, randomColor());
                }
                
                ctx.beginPath();
                ctx.moveTo(A[0], A[1]);
                ctx.lineTo(B[0], B[1]);
                ctx.lineTo(C[0], C[1]);
                ctx.closePath();
                
                ctx.fillStyle = tileColors.get(key);
                ctx.fill();
                
                ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                ctx.lineWidth = 0.5;
                ctx.stroke();
            }
        }
        
        function regenerate() {
            tileColors.clear();
            drawTriangles();
        }
        
        function subdivide() {
            if (subdivisions < maxSubdivisions) {
                triangles = subdivideTriangles(triangles);
                subdivisions++;
                tileColors.clear();
                drawTriangles();
            }
        }
        
        // Initialize
        initTriangles();
        // Do initial subdivisions for a nice starting point
        for (let i = 0; i < 5; i++) {
            triangles = subdivideTriangles(triangles);
            subdivisions++;
        }
        drawTriangles();
    </script>
</body>
</html>
