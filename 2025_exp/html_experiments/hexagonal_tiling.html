<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
}
#canvas {
    display: block;
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const colors = [
    '#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', 
    '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E2',
    '#F8B739', '#52B788', '#E63946', '#A8DADC'
];

const glyphs = ['⬢', '⬡', '⎔', '⌬', '◆', '●', '■', '▲', '★'];

function randomColor() {
    return colors[Math.floor(Math.random() * colors.length)];
}

function randomGlyph() {
    return glyphs[Math.floor(Math.random() * glyphs.length)];
}

function createHexagon(x, y, size) {
    const vertices = [];
    for (let i = 0; i < 6; i++) {
        const angle = (Math.PI / 3) * i;
        vertices.push([
            x + size * Math.cos(angle),
            y + size * Math.sin(angle)
        ]);
    }
    return vertices;
}

function hexagonCentroid(vertices) {
    let cx = 0, cy = 0;
    for (const [x, y] of vertices) {
        cx += x;
        cy += y;
    }
    return [cx / vertices.length, cy / vertices.length];
}

function hexagonArea(vertices) {
    let area = 0;
    for (let i = 0; i < vertices.length; i++) {
        const j = (i + 1) % vertices.length;
        area += vertices[i][0] * vertices[j][1];
        area -= vertices[j][0] * vertices[i][1];
    }
    return Math.abs(area / 2);
}

function drawHexagon(vertices) {
    ctx.fillStyle = randomColor();
    ctx.beginPath();
    ctx.moveTo(vertices[0][0], vertices[0][1]);
    for (let i = 1; i < vertices.length; i++) {
        ctx.lineTo(vertices[i][0], vertices[i][1]);
    }
    ctx.closePath();
    ctx.fill();
    
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // Draw glyph
    const area = hexagonArea(vertices);
    const fontSize = Math.sqrt(area) * 0.5;
    const [cx, cy] = hexagonCentroid(vertices);
    
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(Math.random() * Math.PI * 2);
    
    ctx.font = `${fontSize}px Arial`;
    ctx.fillStyle = randomColor();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(randomGlyph(), 0, 0);
    
    ctx.restore();
}

function drawHexagonalTiling() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, canvas.width, canvas.height);
    ctx.clip();
    
    const size = 50;
    const width = size * 2;
    const height = size * Math.sqrt(3);
    
    // Hexagonal grid
    for (let row = -2; row * height * 0.75 < canvas.height + height; row++) {
        for (let col = -2; col * width < canvas.width + width; col++) {
            const x = col * width * 0.75 + (row % 2) * width * 0.375;
            const y = row * height * 0.75;
            
            drawHexagon(createHexagon(x, y, size));
        }
    }
    
    ctx.restore();
}

drawHexagonalTiling();

canvas.addEventListener('click', drawHexagonalTiling);

window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    drawHexagonalTiling();
});

</script>

</body>
</html>
