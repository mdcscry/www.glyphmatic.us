<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
}
#canvas {
    display: block;
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const colors = [
    '#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', 
    '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E2',
    '#F8B739', '#52B788', '#E63946', '#A8DADC'
];

const glyphs = ['✦', '✧', '✶', '✷', '✸', '✹', '✺', '✻', '✼', '★', '☆'];

function randomColor() {
    return colors[Math.floor(Math.random() * colors.length)];
}

function randomGlyph() {
    return glyphs[Math.floor(Math.random() * glyphs.length)];
}

// Draw 8-pointed star
function draw8PointStar(x, y, outerRadius, innerRadius) {
    const points = 8;
    const vertices = [];
    
    for (let i = 0; i < points * 2; i++) {
        const radius = i % 2 === 0 ? outerRadius : innerRadius;
        const angle = (i * Math.PI / points) - Math.PI / 2;
        vertices.push([
            x + radius * Math.cos(angle),
            y + radius * Math.sin(angle)
        ]);
    }
    
    ctx.fillStyle = randomColor();
    ctx.beginPath();
    ctx.moveTo(vertices[0][0], vertices[0][1]);
    for (let i = 1; i < vertices.length; i++) {
        ctx.lineTo(vertices[i][0], vertices[i][1]);
    }
    ctx.closePath();
    ctx.fill();
    
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // Draw glyph in center
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.random() * Math.PI * 2);
    
    const fontSize = innerRadius * 0.8;
    ctx.font = `${fontSize}px Arial`;
    ctx.fillStyle = randomColor();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(randomGlyph(), 0, 0);
    
    ctx.restore();
}

// Draw octagon
function drawOctagon(x, y, radius) {
    const vertices = [];
    for (let i = 0; i < 8; i++) {
        const angle = (i * Math.PI / 4) + Math.PI / 8;
        vertices.push([
            x + radius * Math.cos(angle),
            y + radius * Math.sin(angle)
        ]);
    }
    
    ctx.fillStyle = randomColor();
    ctx.beginPath();
    ctx.moveTo(vertices[0][0], vertices[0][1]);
    for (let i = 1; i < vertices.length; i++) {
        ctx.lineTo(vertices[i][0], vertices[i][1]);
    }
    ctx.closePath();
    ctx.fill();
    
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // Draw glyph
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.random() * Math.PI * 2);
    
    const fontSize = radius * 0.6;
    ctx.font = `${fontSize}px Arial`;
    ctx.fillStyle = randomColor();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(randomGlyph(), 0, 0);
    
    ctx.restore();
}

// Draw square rotated 45 degrees
function drawDiamond(x, y, size) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.PI / 4);
    
    ctx.fillStyle = randomColor();
    ctx.fillRect(-size/2, -size/2, size, size);
    
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.strokeRect(-size/2, -size/2, size, size);
    
    ctx.restore();
    
    // Draw glyph
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.random() * Math.PI * 2);
    
    const fontSize = size * 0.4;
    ctx.font = `${fontSize}px Arial`;
    ctx.fillStyle = randomColor();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(randomGlyph(), 0, 0);
    
    ctx.restore();
}

function drawIslamicPattern() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, canvas.width, canvas.height);
    ctx.clip();
    
    const spacing = 140;
    const starOuter = 50;
    const starInner = 20;
    const octRadius = 30;
    const diamondSize = 35;
    
    // Grid of stars with octagons and diamonds filling spaces
    for (let row = -2; row * spacing < canvas.height + spacing * 2; row++) {
        for (let col = -2; col * spacing < canvas.width + spacing * 2; col++) {
            const x = col * spacing + (row % 2) * spacing / 2;
            const y = row * spacing;
            
            // Central 8-pointed star
            draw8PointStar(x, y, starOuter, starInner);
            
            // Surrounding octagons
            const offset = spacing / 2;
            if (Math.random() > 0.3) {
                drawOctagon(x + offset, y, octRadius);
                drawOctagon(x - offset, y, octRadius);
                drawOctagon(x, y + offset, octRadius);
                drawOctagon(x, y - offset, octRadius);
            }
            
            // Fill with small diamonds
            if (Math.random() > 0.4) {
                const dOffset = spacing / 3;
                drawDiamond(x + dOffset, y + dOffset, diamondSize);
                drawDiamond(x - dOffset, y + dOffset, diamondSize);
                drawDiamond(x + dOffset, y - dOffset, diamondSize);
                drawDiamond(x - dOffset, y - dOffset, diamondSize);
            }
        }
    }
    
    ctx.restore();
}

drawIslamicPattern();

canvas.addEventListener('click', drawIslamicPattern);

window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    drawIslamicPattern();
});

</script>

</body>
</html>
