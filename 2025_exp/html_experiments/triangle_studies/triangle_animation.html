<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
}
#canvas {
    display: block;
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const size = 300;
const h = size * Math.sqrt(3) / 2;
const smallSize = size / 3;
const smallH = smallSize * Math.sqrt(3) / 2;

const centerX = canvas.width / 2;
const centerY = canvas.height / 2;

let currentStep = 0;
const maxStep = 9;

function drawFrame() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw large triangle
    const topVertex = { x: centerX, y: centerY - h * 2/3 };
    const bottomLeft = { x: centerX - size/2, y: centerY + h * 1/3 };
    const bottomRight = { x: centerX + size/2, y: centerY + h * 1/3 };

    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(topVertex.x, topVertex.y);
    ctx.lineTo(bottomLeft.x, bottomLeft.y);
    ctx.lineTo(bottomRight.x, bottomRight.y);
    ctx.closePath();
    ctx.stroke();

    if (currentStep === 0) return;

    const startY = topVertex.y + smallH * 2/3;
    let triangleNum = 1;

    const colors = {
        1: '#FF6B6B', 2: '#FF6B6B', 3: '#FF6B6B',
        4: '#4ECDC4', 8: '#4ECDC4', 9: '#4ECDC4',
        5: '#F7DC6F', 6: '#F7DC6F', 7: '#F7DC6F'
    };

    function drawSmallTriangle(x, y, pointUp, number, color) {
        if (number > currentStep) return;

        const h = smallH;
        let vertices;

        if (pointUp) {
            vertices = [
                { x: x, y: y - h * 2/3 },
                { x: x - smallSize/2, y: y + h * 1/3 },
                { x: x + smallSize/2, y: y + h * 1/3 }
            ];
        } else {
            vertices = [
                { x: x, y: y + h * 2/3 },
                { x: x - smallSize/2, y: y - h * 1/3 },
                { x: x + smallSize/2, y: y - h * 1/3 }
            ];
        }

        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(vertices[0].x, vertices[0].y);
        ctx.lineTo(vertices[1].x, vertices[1].y);
        ctx.lineTo(vertices[2].x, vertices[2].y);
        ctx.closePath();
        ctx.fill();

        return vertices;
    }

    // Row 1
    drawSmallTriangle(centerX, startY, true, triangleNum++, colors[1]);

    // Row 2
    const v2 = drawSmallTriangle(centerX - smallSize/2, startY + smallH, true, triangleNum++, colors[2]);
    const v3 = drawSmallTriangle(centerX, startY + smallH * 2/3, false, triangleNum++, colors[3]);
    const v4 = drawSmallTriangle(centerX + smallSize/2, startY + smallH, true, triangleNum++, colors[4]);

    // Row 3
    drawSmallTriangle(centerX - smallSize, startY + 2*smallH, true, triangleNum++, colors[5]);
    const v6 = drawSmallTriangle(centerX - smallSize/2, startY + smallH * 5/3, false, triangleNum++, colors[6]);
    const v7 = drawSmallTriangle(centerX, startY + 2*smallH, true, triangleNum++, colors[7]);
    const v8 = drawSmallTriangle(centerX + smallSize/2, startY + smallH * 5/3, false, triangleNum++, colors[8]);
    drawSmallTriangle(centerX + smallSize, startY + 2*smallH, true, triangleNum++, colors[9]);

    // Draw borders
    if (currentStep >= 6 && v2 && v6) {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(v2[1].x, v2[1].y);
        ctx.lineTo(v6[2].x, v6[2].y);
        ctx.stroke();
    }

    if (currentStep >= 8 && v7 && v8) {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(v7[2].x, v7[2].y);
        ctx.lineTo(v8[1].x, v8[1].y);
        ctx.stroke();
    }

    if (currentStep >= 4 && v3 && v4) {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(v3[2].x, v3[2].y);
        ctx.lineTo(v4[1].x, v4[1].y);
        ctx.stroke();
    }
}

function animate() {
    drawFrame();
    currentStep++;
    if (currentStep > maxStep) {
        currentStep = 0;
    }
    setTimeout(animate, 800);
}

animate();

canvas.addEventListener('click', () => {
    currentStep = 0;
});

</script>

</body>
</html>
