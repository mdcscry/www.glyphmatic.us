<html>

<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// Set canvas to full window
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// Color palette - can randomize these
const allHtmlColors = [
  "aliceblue", "antiquewhite", "aqua", "aquamarine", "azure", "beige", "bisque", "black", "blanchedalmond", "blue",
  "blueviolet", "brown", "burlywood", "cadetblue", "chartreuse", "chocolate", "coral", "cornflowerblue", "cornsilk", "crimson",
  "cyan", "darkblue", "darkcyan", "darkgoldenrod", "darkgray", "darkgreen", "darkgrey", "darkkhaki", "darkmagenta", "darkolivegreen",
  "darkorange", "darkorchid", "darkred", "darksalmon", "darkseagreen", "darkslateblue", "darkslategray", "darkslategrey", "darkturquoise", "darkviolet",
  "deeppink", "deepskyblue", "dimgray", "dimgrey", "dodgerblue", "firebrick", "floralwhite", "forestgreen", "fuchsia", "gainsboro",
  "ghostwhite", "gold", "goldenrod", "gray", "green", "greenyellow", "grey", "honeydew", "hotpink", "indianred",
  "indigo", "ivory", "khaki", "lavender", "lavenderblush", "lawngreen", "lemonchiffon", "lightblue", "lightcoral", "lightcyan",
  "lightgoldenrodyellow", "lightgray", "lightgreen", "lightgrey", "lightpink", "lightsalmon", "lightseagreen", "lightskyblue", "lightslategray", "lightslategrey",
  "lightsteelblue", "lightyellow", "lime", "limegreen", "linen", "magenta", "maroon", "mediumaquamarine", "mediumblue", "mediumorchid",
  "mediumpurple", "mediumseagreen", "mediumslateblue", "mediumspringgreen", "mediumturquoise", "mediumvioletred", "midnightblue", "mintcream", "mistyrose", "moccasin",
  "navajowhite", "navy", "oldlace", "olive", "olivedrab", "orange", "orangered", "orchid", "palegoldenrod", "palegreen",
  "paleturquoise", "palevioletred", "papayawhip", "peachpuff", "peru", "pink", "plum", "powderblue", "purple", "rebeccapurple",
  "red", "rosybrown", "royalblue", "saddlebrown", "salmon", "sandybrown", "seagreen", "seashell", "sienna", "silver",
  "skyblue", "slateblue", "slategray", "slategrey", "snow", "springgreen", "steelblue", "tan", "teal", "thistle",
  "tomato", "turquoise", "violet", "wheat", "white", "whitesmoke", "yellow", "yellowgreen"

];

function generateSimpleRandomPalette() {
  // Define 'colors' array using a simple loop and push
  const colors = [];
  const totalColorsInSource = allHtmlColors.length;

  for (let i = 0; i < 7; i++) {
    // Get a random index from the source array
    const randomIndex = Math.floor(Math.random() * totalColorsInSource);
    
    // Push the color at that index into our new array
    colors.push(allHtmlColors[randomIndex]);
  }

  return colors;
}

// Example usage:
var colors = generateSimpleRandomPalette();
console.log(colors);


// Sample glyphs - can expand this to any Unicode block
const glyphs = [
  // Original Geometric Shapes (U+25A0–U+25FF)
  '■', '□', '▢', '▣', '▤', '▥', '▦', '▧', '▨', '▩', '▪', '▫', '▬', '▭', '▮', '▯', '▰', '▱',
  '▲', '△', '▴', '▵', '▶', '▷', '▸', '▹', '►', '▻', '▼', '▽', '▾', '▿', '◀', '◁', '◂', '◃',
  '◄', '◅', '◆', '◇', '◈', '◉', '◊', '○', '◌', '◍', '◎', '●', '◐', '◑', '◒', '◓', '◔', '◕',
  '◖', '◗', '◘', '◙', '◚', '◛', '◜', '◝', '◞', '◟', '◠', '◡', '◢', '◣', '◤', '◥', '◦', '◧',
  '◨', '◩', '◪', '◫', '◬', '◭', '◮', '◯', '◰', '◱', '◲', '◳', '◴', '◵', '◶', '◷', '◸', '◹',
  '◺', '◻', //'◼', '◾'
   '◽', '◿',
  // Geometric Shapes Extended (U+1F780–U+1F7FF)
  '🞀', '🞁', '🞂', '🞃', '🞄', '🞅', '🞆', '🞇', '🞈', '🞉', '🞊', '🞋', '🞌', '🞍', '🞎', '🞏',
  '🞐', '🞑', '🞒', '🞓', '🞔', '🞕', '🞖', '🞗', '🞘', '🞙', '🞚', '🞛', '🞜', '🞝', '🞞', '🞟',
  '🞠', '🞡', '🞢', '🞣', '🞤', '🞥', '🞦', '🞧', '🞨', '🞩', '🞪', '🞫', '🞬', '🞭', '🞮', '🞯',
  '🞰', '🞱', '🞲', '🞳', '🞴', '🞵', '🞶', '🞷', '🞸', '🞹', '🞺', '🞻', '🞼', '🞽', '🞾', '🞿',
  '🟀', '🟁', '🟂', '🟃', '🟄', '🟅', '🟆', '🟇', '🟈', '🟉', '🟊', '🟋', '🟌', '🟍', '🟎', '🟏',
  '🟐', '🟑', '🟒', '🟓', '🟔', '🟕', '🟖', '🟗', '🟘', '🟙'
];
function randomColor() {
    return colors[Math.floor(Math.random() * colors.length)];
}

function randomGlyph() {
    return glyphs[Math.floor(Math.random() * glyphs.length)];
}

function subdivideRectangle(x, y, width, height, depth,colors) {
    generateSimpleRandomPalette()
    // Base case: stop subdividing
    if (depth === 0 || (width < 60 && height < 60) || Math.random() < 0.15) {
        // Draw background
        ctx.fillStyle = randomColor();
        ctx.fillRect(x, y, width, height);
        
        // Draw border
        ctx.strokeStyle = '#999';
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y, width, height);
        
        // Check aspect ratio to determine if we should use multiple glyphs
        const aspectRatio = width / height;
        
        if (aspectRatio > 2.2) {
            // Wide rectangle - multiple glyphs horizontally
            const numGlyphs = Math.floor(width / (height * 0.8));
            const fontSize = height * 0.65;
            ctx.font = `${fontSize}px Arial`;
            ctx.fillStyle = randomColor();
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            const spacing = width / (numGlyphs + 1);
            for (let i = 1; i <= numGlyphs; i++) {
                const glyph = randomGlyph();
                ctx.fillText(glyph, x + spacing * i, y + height/2);
            }
        } else if (aspectRatio < 0.45) {
            // Tall rectangle - multiple glyphs vertically
            const numGlyphs = Math.floor(height / (width * 0.8));
            const fontSize = width * 0.65;
            ctx.font = `${fontSize}px Arial`;
            ctx.fillStyle = randomColor();
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            const spacing = height / (numGlyphs + 1);
            for (let i = 1; i <= numGlyphs; i++) {
                const glyph = randomGlyph();
                ctx.fillText(glyph, x + width/2, y + spacing * i);
            }
        } else {
            // Square-ish - single glyph
            const fontSize = Math.min(width, height) * 0.65;
            ctx.font = `${fontSize}px Arial`;
            ctx.fillStyle = randomColor();
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            const glyph = randomGlyph();
            ctx.fillText(glyph, x + width/2, y + height/2);
        }
        
        return;
    }
    
    // Decide whether to split horizontally or vertically
    // Prefer horizontal splits for wide rectangles, vertical for tall ones
    const aspectRatio = width / height;
    let splitHorizontally;
    
    if (aspectRatio > 1.5) {
        splitHorizontally = true; // Wide rectangle - split vertically into left/right
    } else if (aspectRatio < 0.67) {
        splitHorizontally = false; // Tall rectangle - split horizontally into top/bottom
    } else {
        splitHorizontally = Math.random() < 0.5; // Square-ish - random
    }
    
    if (splitHorizontally) {
        // Split vertically (into left and right parts)
        const splitRatio = 0.3 + Math.random() * 0.4; // Between 0.3 and 0.7
        const splitX = width * splitRatio;
        
        subdivideRectangle(x, y, splitX, height, depth - 1);
        subdivideRectangle(x + splitX, y, width - splitX, height, depth - 1);
    } else {
        // Split horizontally (into top and bottom parts)
        const splitRatio = 0.3 + Math.random() * 0.4;
        const splitY = height * splitRatio;
        
        subdivideRectangle(x, y, width, splitY, depth - 1);
        subdivideRectangle(x, y + splitY, width, height - splitY, depth - 1);
    }
}

// Generate the tiling
subdivideRectangle(0, 0, canvas.width, canvas.height, 8);

// Regenerate on click
canvas.addEventListener('click', () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    colors = generateSimpleRandomPalette();
    subdivideRectangle(0, 0, canvas.width, canvas.height, 8,colors);
});

// Handle window resize
window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    gcolors = generateSimpleRandomPalette();
    subdivideRectangle(0, 0, canvas.width, canvas.height, 8,colors);
});

</script>
