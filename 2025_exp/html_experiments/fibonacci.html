<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fibonacci</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        .line-v {
            position: absolute;
            top: 0;
            height: 100%;
            width: 1px;
            opacity: 0.7;
        }
        .line-h {
            position: absolute;
            left: 0;
            width: 100%;
            height: 1px;
            opacity: 0.7;
        }
        .line-v.red { background: #d03020; }
        .line-h.orange { background: #e08020; }
    </style>
</head>
<body>
    <div class="container" id="container"></div>

    <script>
        const container = document.getElementById('container');
        const width = window.innerWidth;
        const height = window.innerHeight;
        
        // Get Fibonacci numbers up to max
        function getFibonacci(max) {
            const fibs = [1, 1];
            while (fibs[fibs.length - 1] + fibs[fibs.length - 2] <= max) {
                fibs.push(fibs[fibs.length - 1] + fibs[fibs.length - 2]);
            }
            return fibs;
        }
        
        const maxVal = Math.max(width, height) * 2;
        const fibs = getFibonacci(maxVal);
        
        // Vertical lines - left to right (red)
        fibs.forEach(f => {
            const x = (f / maxVal) * width;
            if (x < width) {
                const line = document.createElement('div');
                line.className = 'line-v red';
                line.style.left = `${x}px`;
                container.appendChild(line);
            }
        });
        
        // Vertical lines - right to left (red, mirrored)
        fibs.forEach(f => {
            const x = width - (f / maxVal) * width;
            if (x > 0) {
                const line = document.createElement('div');
                line.className = 'line-v red';
                line.style.left = `${x}px`;
                container.appendChild(line);
            }
        });
        
        // Horizontal lines - from top (orange)
        fibs.forEach(f => {
            const y = (f / maxVal) * height;
            if (y < height) {
                const line = document.createElement('div');
                line.className = 'line-h orange';
                line.style.top = `${y}px`;
                container.appendChild(line);
            }
        });
        
        // Horizontal lines - from bottom (orange, mirrored)
        fibs.forEach(f => {
            const y = height - (f / maxVal) * height;
            if (y > 0) {
                const line = document.createElement('div');
                line.className = 'line-h orange';
                line.style.top = `${y}px`;
                container.appendChild(line);
            }
        });
    </script>
</body>
</html>
