<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <TITLE>4.DeGenerator-TwoBlocksOverlay</TITLE>

    <STYLE type="text/css">
        @font-face {
            font-family: 'Symbols2';
            src: url('../tff/NotoSansSymbols2-Regular.ttf');
        }

        body {
            font-family: 'Symbols2';
            margin: 0;
            overflow: hidden; /* Hide scrollbars if content slightly overflows */
            width: 100vw;
            height: 100vh;
            display: flex; /* Use flexbox to put the two main blocks side-by-side */
            background-color: #000; /* Default body background, will be randomized by JS */
        }

        .main-block {
            position: relative; /* Establishes a positioning context for absolute layers */
            width: 50vw;        /* Each block takes half the viewport width */
            height: 100vh;      /* Each block takes full viewport height */
            overflow: hidden;   /* Clip content if layers go outside its bounds */
            /* Add isolation for better blend mode control if needed, but not necessary here */
            /* isolation: isolate; */
        }

        .layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;          /* Use flex for centering the child span */
            align-items: center;    /* Center content vertically */
            justify-content: center; /* Center content horizontally */
            
            /* Default values, will be overridden by JS */
            background-color: rgba(0,0,0,0); /* Start transparent for backgrounds */
            color: #fff; /* Default character color */
            mix-blend-mode: normal; /* Default blend mode */
            opacity: 1; /* Full opacity by default */

            /* Transitions for smoother visual changes (optional but nice) */
            transition: background-color 2s ease-out, color 1s ease-out, opacity 1s ease-out;
        }

        .layer > span { /* The character element itself within a layer */
            font-size: 40vw; /* Very large, scales with viewport width (40% of viewport width) */
            line-height: 1;  /* Tightly wrap the character */
            position: absolute; /* Allows character styling without interfering with parent layer flexbox content */
        }
    </STYLE>
</head>
<body>

    <div id="leftBlock" class="main-block">
        <div id="leftLayer1" class="layer"><span></span></div>
        <div id="leftLayer2" class="layer"><span></span></div>
        <div id="leftLayer3" class="layer"><span></span></div>
    </div>

    <div id="rightBlock" class="main-block">
        <div id="rightLayer1" class="layer"><span></span></div>
        <div id="rightLayer2" class="layer"><span></span></div>
        <div id="rightLayer3" class="layer"><span></span></div>
    </div>

<script type="text/javascript">

    var mycolors = ['#000000', '#000080', '#00008B', '#0000CD', '#0000FF', '#006400', '#008000', '#008080', '#008B8B', '#00BFFF', '#00CED1'
        , '#00FA9A', '#00FF00', '#00FF7F', '#00FFFF', '#00FFFF', '#191970', '#1E90FF', '#20B2AA', '#228B22', '#2E8B57', '#2F4F4F'
        , '#2F4F4F', '#32CD32', '#3CB371', '#40E0D0', '#4169E1', '#4682B4', '#483D8B', '#48D1CC', '#4B0082', '#556B2F', '#5F9EA0'
        , '#6495ED', '#66CDAA', '#696969', '#696969', '#6A5ACD', '#6B8E23', '#708090', '#708090', '#778899', '#778899', '#7B68EE'
        , '#7CFC00', '#7FFF00', '#7FFFD4', '#800000', '#800080', '#808000', '#808080', '#808080', '#87CEEB', '#87CEFA', '#8A2BE2'
        , '#8B0000', '#8B008B', '#8B4513', '#8FBC8F', '#90EE90', '#9370DB', '#9400D3', '#98FB98', '#9932CC', '#9ACD32', '#A0522D'
        , '#A52A2A', '#A9A9A9', '#A9A9A9', '#ADD8E6', '#ADFF2F', '#AFEEEE', '#B0C4DE', '#B0E0E6', '#B22222', '#B8860B', '#BA55D3'
        , '#BC8F8F', '#BDB76B', '#C0C0C0', '#C71585', '#CD5C5C', '#CD853F', '#D2691E', '#D2B48C', '#D3D3D3', '#D3D3D3', '#D8BFD8'
        , '#DA70D6', '#DAA520', '#DB7093', '#DC143C', '#DCDCDC', '#DDA0DD', '#DEB887', '#E0FFFF', '#E6E6FA', '#E9967A', '#EE82EE'
        , '#EEE8AA', '#F08080', '#F0E68C', '#F0F8FF', '#F0FFF0', '#F0FFFF', '#F4A460', '#F5DEB3', '#F5F5DC', '#F5F5F5', '#F5FFFA'
        , '#F8F8FF', '#FA8072', '#FAEBD7', '#FAF0E6', '#FAFAD2', '#FDF5E6', '#FF0000', '#FF00FF', '#FF00FF', '#FF1493', '#FF4500'
        , '#FF6347', '#FF69B4', '#FF7F50', '#FF8C00', '#FFA07A', '#FFA500', '#FFB6C1', '#FFC0CB', '#FFD700', '#FFDAB9', '#FFDEAD'
        , '#FFE4B5', '#FFE4C4', '#FFE4E1', '#FFEBCD', '#FFEFD5', '#FFF0F5', '#FFF5EE', '#FFF8DC', '#FFFACD', '#FFFAF0', '#FFFAFA'
        , '#FFFF00', '#FFFFE0', '#FFFFF0', '#FFFFFF'];

    // List of available CSS mix-blend-mode values
    var mixBlendModes = [
        'normal', 'multiply', 'screen', 'overlay', 'darken', 'lighten', 'color-dodge', 'color-burn',
        'hard-light', 'soft-light', 'difference', 'exclusion', 'hue', 'saturation', 'color', 'luminosity'
    ];

    var myarray = ['1FB00', '1FB01', '1FB02', '1FB03', '1FB04', '1FB05', '1FB06', '1FB07', '1FB08', '1FB09', '1FB0A', '1FB0B', '1FB0C', '1FB0D', '1FB0E', '1FB0F', '1FB10', '1FB11', '1FB12', '1FB13', '1FB14', '1FB15', '1FB16', '1FB17', '1FB18', '1FB19', '1FB1A', '1FB1B', '1FB1C', '1FB1D', '1FB1E', '1FB1F', '1FB20', '1FB21', '1FB22', '1FB23', '1FB24', '1FB25', '1FB26', '1FB27', '1FB28', '1FB29', '1FB2A', '1FB2B', '1FB2C', '1FB2D', '1FB2E', '1FB2F', '1FB30', '1FB31', '1FB32', '1FB33', '1FB34', '1FB35', '1FB36', '1FB37', '1FB38', '1FB39', '1FB3A', '1FB3B', '1FB3C', '1FB3D', '1FB3E', '1FB3F', '1FB40', '1FB41', '1FB42', '1FB43', '1FB44', '1FB45', '1FB46', '1FB47', '1FB48', '1FB49', '1FB4A', '1FB4B', '1FB4C', '1FB4D', '1FB4E', '1FB4F', '1FB50', '1FB51', '1FB52', '1FB53', '1FB54', '1FB55', '1FB56', '1FB57', '1FB58', '1FB59', '1FB5A', '1FB5B', '1FB5C', '1FB5D', '1FB5E', '1FB5F', '1FB60', '1FB61', '1FB62', '1FB63', '1FB64', '1FB65', '1FB66', '1FB67', '1FB68', '1FB69', '1FB6A', '1FB6B', '1FB6C', '1FB6D', '1FB6E', '1FB6F', '1FB70', '1FB71', '1FB72', '1FB73', '1FB74', '1FB75', '1FB76', '1FB77', '1FB78', '1FB79', '1FB7A', '1FB7B', '1FB7C', '1FB7D', '1FB7E', '1FB7F', '1FB80', '1FB81', '1FB82', '1FB83', '1FB84', '1FB85', '1FB86', '1FB87', '1FB88', '1FB89', '1FB8A', '1FB8B', '1FB8C', '1FB8D', '1FB8E', '1FB8F', '1FB90', '1FB91', '1FB92', '1FB93', '1FB94', '1FB95', '1FB96', '1FB97', '1FB98', '1FB99', '1FB9A', '1FB9B', '1FB9C', '1FB9D', '1FB9E', '1FB9F', '1FBA0', '1FBA1', '1FBA2', '1FBA3', '1FBA4', '1FBA5', '1FBA6', '1FBA7', '1FBA8', '1FBA9', '1FBAA', '1FBAB', '1FBAC', '1FBAD', '1FBAE', '1FBAF', '1FBB0', '1FBB1', '1FBB2', '1FBB3', '1FBB4', '1FBB5', '1FBB6', '1FBB7', '1FBB8', '1FBB9', '1FBBA', '1FBBB', '1FBBC', '1FBBD', '1FBBE', '1FBBF', '1FBC0', '1FBC1', '1FBC2', '1FBC3', '1FBC4', '1FBC5', '1FBC6', '1FBC7', '1FBC8', '1FBC9', '1FBCA'
        , '1FBF0', '1FBF1', '1FBF2', '1FBF3', '1FBF4', '1FBF5', '1FBF6', '1FBF7', '1FBF8', '1FBF9'];

    // Set initial body background color
    document.body.style.backgroundColor = mycolors[Math.round((mycolors.length - 1) * Math.random())];

    // Array to hold references to all individual layer divs (6 in total)
    const allLayers = [];

    // Function to calculate a random color from the predefined list
    function getRandomColor() {
        return mycolors[Math.round((mycolors.length - 1) * Math.random())];
    }

    // Function to calculate a random character from the predefined list
    function getRandomChar() {
        return '&#x' + myarray[Math.round((myarray.length - 1) * Math.random())] + ';';
    }

    // Function to calculate a random blend mode
    function getRandomBlendMode() {
        return mixBlendModes[Math.floor(Math.random() * mixBlendModes.length)];
    }

    // Function to update a single layer's content and style
    function updateLayer(layerElement) {
        // Randomize layer's background color, blend mode, and opacity
        layerElement.style.backgroundColor = getRandomColor();
        layerElement.style.mixBlendMode = getRandomBlendMode();
        layerElement.style.opacity = (Math.random() * 0.7) + 0.3; // Opacity between 0.3 and 1.0

        // Find the character span inside this layer and update its color and character
        const charSpan = layerElement.querySelector('span');
        if (charSpan) {
            charSpan.style.color = getRandomColor();
            charSpan.innerHTML = getRandomChar();
        }
    }

    // Initialize all layers by populating the allLayers array and setting initial styles
    function initializeAllLayers() {
        document.querySelectorAll('.layer').forEach(layer => {
            allLayers.push(layer); // Add each layer to our array
            updateLayer(layer);    // Apply initial random styles
        });
    }

    initializeAllLayers(); // Run once when the script loads to set up everything


    // Main interval: Periodically update a random layer
    window.setInterval(function() {
        if (allLayers.length > 0) {
            const randomLayerIndex = Math.floor(Math.random() * allLayers.length);
            updateLayer(allLayers[randomLayerIndex]);
        }
    }, fontChangeRate); // Use the defined fontChangeRate (2 seconds)

    // Optional: Interval to change the body background color less frequently
    window.setInterval(function() {
        document.body.style.backgroundColor = getRandomColor();
    }, fontChangeRate * 4); // Change body background every 8 seconds

</script>
</body>
</html>
