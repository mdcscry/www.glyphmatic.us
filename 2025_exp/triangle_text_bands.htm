<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
}
#canvas {
    display: block;
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// Extend canvas beyond viewport for seamless tiling
canvas.width = window.innerWidth * 1.5;
canvas.height = window.innerHeight * 1.5;

const size = 200;
const h = size * Math.sqrt(3) / 2;
const smallSize = size / 3;
const smallH = smallSize * Math.sqrt(3) / 2;

// Color morphing state
let currentLineColor;
let targetLineColor;
let currentTextColor;
let targetTextColor;
let colorProgress = 0;
const colorTransitionTime = 15000; // 15 seconds
let lastFrameTime = Date.now();

// Glyph change state (random timing)
let cachedTextLines = [];
let glyphChangeTimer = 0;
let nextGlyphChangeTime = Math.random() * 5000 + 500; // Random 0.5-5.5 seconds

// Grayscale colors for lines (111, 222, etc. - no black)
function randomGrayscaleColor() {
    const val = Math.floor(Math.random() * 15) + 1; // 1-15, skip 0 (black)
    return { r: val * 17, g: val * 17, b: val * 17 }; // 0x11, 0x22, ... 0xFF
}

// Jewel tone colors for text
function randomJewelTone() {
    const jewelTones = [
        { r: 139, g: 0, b: 139 },     // Dark Magenta
        { r: 75, g: 0, b: 130 },      // Indigo
        { r: 0, g: 100, b: 0 },       // Dark Green
        { r: 148, g: 0, b: 211 },     // Dark Violet
        { r: 220, g: 20, b: 60 },     // Crimson
        { r: 0, g: 128, b: 128 },     // Teal
        { r: 128, g: 0, b: 128 },     // Purple
        { r: 255, g: 140, b: 0 },     // Dark Orange
        { r: 184, g: 134, b: 11 },    // Dark Goldenrod
        { r: 0, g: 139, b: 139 },     // Dark Cyan
        { r: 178, g: 34, b: 34 },     // Fire Brick
        { r: 46, g: 139, b: 87 },     // Sea Green
        { r: 199, g: 21, b: 133 },    // Medium Violet Red
        { r: 72, g: 61, b: 139 }      // Dark Slate Blue
    ];
    return jewelTones[Math.floor(Math.random() * jewelTones.length)];
}

function lerpColor(from, to, t) {
    return {
        r: Math.floor(from.r + (to.r - from.r) * t),
        g: Math.floor(from.g + (to.g - from.g) * t),
        b: Math.floor(from.b + (to.b - from.b) * t)
    };
}

function colorToString(color) {
    return `rgb(${color.r}, ${color.g}, ${color.b})`;
}

// Initialize colors
currentLineColor = randomGrayscaleColor();
targetLineColor = randomGrayscaleColor();
currentTextColor = randomJewelTone();
targetTextColor = randomJewelTone();

// Extended Latin character set including IPA - letters only, no combining forms or punctuation
const latinChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz' +
    'ÀÁÂÃÄÅÆÇÈÉÊËÌÍÎÏÐÑÒÓÔÕÖØÙÚÛÜÝÞßàáâãäåæçèéêëìíîïðñòóôõöøùúûüýþÿ' +
    'ĀāĂăĄąĆćĈĉĊċČčĎďĐđĒēĔĕĖėĘęĚěĜĝĞğĠġĢģĤĥĦħĨĩĪīĬĭĮįİıĲĳĴĵĶķĹĺĻļĽľĿŀŁł' +
    'ŃńŅņŇňŊŋŌōŎŏŐőŒœŔŕŖŗŘřŚśŜŝŞşŠšŢţŤťŦŧŨũŪūŬŭŮůŰűŲųŴŵŶŷŸŹźŻżŽž' +
    'ƁƂƃƄƅƆƇƈƉƊƋƌƍƎƏƐƑƒƓƔƕƖƗƘƙƚƛƜƝƞƟƠơƢƣƤƥƦƧƨƩƪƫƬƭƮƯưƱƲƳƴƵƶƷƸƹƺƻƼƽƾƿ' +
    'ǍǎǏǐǑǒǓǔǕǖǗǘǙǚǛǜǝǞǟǠǡǢǣǤǥǦǧǨǩǪǫǬǭǮǯǰǱǲǳǴǵǶǷǸǹǺǻǼǽǾǿ' +
    'ɐɑɒɓɔɕɖɗɘəɚɛɜɝɞɟɠɡɢɣɤɥɦɧɨɩɪɫɬɭɮɯɰɱɲɳɴɵɶɷɸɹɺɻɼɽɾɿʀʁʂʃʄʅʆʇʈʉʊʋʌʍʎʏ' +
    'ʐʑʒʓʔʕʖʗʘʙʚʛʜʝʞʟʠʡʢʣʤʥʦʧʨʩʪʫʬʭʮʯ';

function randomLatinChar() {
    return latinChars[Math.floor(Math.random() * latinChars.length)];
}

function generateTextLine(width, fontSize) {
    const numChars = Math.ceil(width / (fontSize * 1.2)); // Account for spacing
    let line = '';
    for (let i = 0; i < numChars; i++) {
        line += randomLatinChar() + ' '; // Add space between each letter
    }
    return line;
}

function drawTrapezoidTriangle(centerX, centerY, pointUp) {
    // Draw large triangle (upward or downward)
    let topVertex, bottomLeft, bottomRight;
    let startY;

    if (pointUp) {
        topVertex = { x: centerX, y: centerY - h * 2/3 };
        bottomLeft = { x: centerX - size/2, y: centerY + h * 1/3 };
        bottomRight = { x: centerX + size/2, y: centerY + h * 1/3 };
        startY = topVertex.y + smallH * 2/3;
    } else {
        // Flipped triangle
        topVertex = { x: centerX, y: centerY + h * 2/3 };
        bottomLeft = { x: centerX - size/2, y: centerY - h * 1/3 };
        bottomRight = { x: centerX + size/2, y: centerY - h * 1/3 };
        startY = topVertex.y - smallH * 2/3;
    }

    let triangleNum = 1;

    function drawSmallTriangle(x, y, triPointUp, number) {
        const h = smallH;
        let vertices;

        if (triPointUp) {
            vertices = [
                { x: x, y: y - h * 2/3 },
                { x: x - smallSize/2, y: y + h * 1/3 },
                { x: x + smallSize/2, y: y + h * 1/3 }
            ];
        } else {
            vertices = [
                { x: x, y: y + h * 2/3 },
                { x: x - smallSize/2, y: y - h * 1/3 },
                { x: x + smallSize/2, y: y - h * 1/3 }
            ];
        }

        return vertices;
    }

    // Row 1
    drawSmallTriangle(centerX, startY, pointUp, triangleNum++);

    // Row 2
    const v2 = drawSmallTriangle(centerX - smallSize/2, startY + (pointUp ? smallH : -smallH), pointUp, triangleNum++);
    const v3 = drawSmallTriangle(centerX, startY + (pointUp ? smallH * 2/3 : -smallH * 2/3), !pointUp, triangleNum++);
    const v4 = drawSmallTriangle(centerX + smallSize/2, startY + (pointUp ? smallH : -smallH), pointUp, triangleNum++);

    // Row 3
    drawSmallTriangle(centerX - smallSize, startY + (pointUp ? 2*smallH : -2*smallH), pointUp, triangleNum++);
    const v6 = drawSmallTriangle(centerX - smallSize/2, startY + (pointUp ? smallH * 5/3 : -smallH * 5/3), !pointUp, triangleNum++);
    const v7 = drawSmallTriangle(centerX, startY + (pointUp ? 2*smallH : -2*smallH), pointUp, triangleNum++);
    const v8 = drawSmallTriangle(centerX + smallSize/2, startY + (pointUp ? smallH * 5/3 : -smallH * 5/3), !pointUp, triangleNum++);
    drawSmallTriangle(centerX + smallSize, startY + (pointUp ? 2*smallH : -2*smallH), pointUp, triangleNum++);

    // Draw borders with morphing grayscale color
    const lineColor = lerpColor(currentLineColor, targetLineColor, colorProgress);
    ctx.strokeStyle = colorToString(lineColor);
    ctx.lineWidth = 2;

    // Border between 2 and 6
    ctx.beginPath();
    ctx.moveTo(v2[1].x, v2[1].y);
    ctx.lineTo(v6[2].x, v6[2].y);
    ctx.stroke();

    // Border between 7 and 8
    ctx.beginPath();
    ctx.moveTo(v7[2].x, v7[2].y);
    ctx.lineTo(v8[1].x, v8[1].y);
    ctx.stroke();

    // Border between 3 and 4
    ctx.beginPath();
    ctx.moveTo(v3[2].x, v3[2].y);
    ctx.lineTo(v4[1].x, v4[1].y);
    ctx.stroke();

    // Draw outer border (same color as inner borders)
    ctx.beginPath();
    ctx.moveTo(topVertex.x, topVertex.y);
    ctx.lineTo(bottomLeft.x, bottomLeft.y);
    ctx.lineTo(bottomRight.x, bottomRight.y);
    ctx.closePath();
    ctx.stroke();
}

function drawPattern() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const spacing = size; // Horizontal spacing between triangles
    const rowSpacing = h; // Vertical spacing between row centers

    // Calculate how many rows and columns we need to fill the extended canvas
    const numRows = Math.ceil(canvas.height / rowSpacing) + 2;
    const numCols = Math.ceil(canvas.width / spacing) + 2;

    const startX = -spacing;
    const startY = -rowSpacing;

    const fontSize = 13; // Small font size for gap text
    const gapHeight = rowSpacing * 0.35; // Height of the gap bands

    // Draw alternating rows of upward and downward triangles
    for (let row = 0; row < numRows; row++) {
        const y = startY + row * rowSpacing;
        const isUpwardRow = row % 2 === 0;

        if (isUpwardRow) {
            // Upward pointing triangles
            for (let col = 0; col < numCols; col++) {
                const x = startX + col * spacing;
                drawTrapezoidTriangle(x, y, true);
            }
        } else {
            // Downward pointing triangles (offset by half spacing)
            for (let col = 0; col < numCols; col++) {
                const x = startX + (col + 0.5) * spacing;
                drawTrapezoidTriangle(x, y, false);
            }
        }

        // Draw text in the gap bands (after each upward row) - THREE ROWS
        if (isUpwardRow) {
            const gapStartY = y + h * 0.42; // Start of gap below upward triangles
            const lineSpacing = fontSize * 1.1; // Spacing between text lines

            // Use morphing jewel tone color for text
            const textColor = lerpColor(currentTextColor, targetTextColor, colorProgress);
            ctx.fillStyle = colorToString(textColor);
            ctx.font = `${fontSize}px monospace`;
            ctx.textBaseline = 'middle';

            // Draw three rows of text in each gap band (use cached lines)
            const gapIndex = row;
            if (!cachedTextLines[gapIndex]) {
                cachedTextLines[gapIndex] = [];
            }

            for (let textRow = 0; textRow < 3; textRow++) {
                // Use cached line if exists, otherwise generate
                if (!cachedTextLines[gapIndex][textRow]) {
                    cachedTextLines[gapIndex][textRow] = generateTextLine(canvas.width * 1.2, fontSize);
                }
                const textLine = cachedTextLines[gapIndex][textRow];
                const textY = gapStartY + textRow * lineSpacing;
                ctx.fillText(textLine, 0, textY);
            }
        }
    }
}

function animate() {
    const now = Date.now();
    const deltaTime = now - lastFrameTime;
    lastFrameTime = now;

    // Update color progress
    colorProgress += deltaTime / colorTransitionTime;

    // When transition completes, pick new targets
    if (colorProgress >= 1) {
        colorProgress = 0;
        currentLineColor = lerpColor(currentLineColor, targetLineColor, 1);
        currentTextColor = lerpColor(currentTextColor, targetTextColor, 1);
        targetLineColor = randomGrayscaleColor();
        targetTextColor = randomJewelTone();
    }

    // Update glyph change timer (random intervals)
    glyphChangeTimer += deltaTime;
    if (glyphChangeTimer >= nextGlyphChangeTime) {
        glyphChangeTimer = 0;
        nextGlyphChangeTime = Math.random() * 5000 + 500; // Random 0.5-5.5 seconds
        cachedTextLines = []; // Clear cache to regenerate all glyphs
    }

    drawPattern();
    requestAnimationFrame(animate);
}

// Start animation loop
animate();

window.addEventListener('resize', () => {
    canvas.width = window.innerWidth * 1.5;
    canvas.height = window.innerHeight * 1.5;
});

</script>

</body>
</html>
