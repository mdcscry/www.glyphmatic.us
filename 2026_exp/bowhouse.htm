<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bauhaus Grid Generator</title>
    <link rel="stylesheet" href="../css_font/glyphmatic-fonts.css">
    <style>

    
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            font-family: 'BabelStone Pseudographica','Helvetica Neue', Arial, sans-serif;
        }

        .container {
            background: #f5f2eb;
            border-radius: 24px;
            padding: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(16, 80px);
            grid-template-rows: repeat(10, 80px);
            gap: 0;
            overflow: hidden;
            border-radius: 8px;
        }

        .cell {
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            line-height: 1;
            overflow: hidden;
            position: relative;
        }

        .cell span {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        button {
            margin-top: 30px;
            padding: 16px 48px;
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: #f5f2eb;
            color: #1a1a1a;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(245,242,235,0.3);
        }

        button:active {
            transform: scale(0.98);
        }

        .cell span {
            transition: opacity 5s ease-in-out;
        }

        .cell span.fading-out {
            opacity: 0;
        }

        .cell span.fading-in {
            opacity: 0;
        }

        .cell span.visible {
            opacity: 0.95;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="grid" id="grid"></div>
    </div>
    <button onclick="generate(); startAnimations();">Regenerate</button>

    <script>
        const black = '#1a1a1a';
        const white = '#f5f2eb';

        // Color palettes - 3 accent colors (black and white used for backgrounds only)
        const palettes = [
            ['#e8a435', '#2d9cd3', '#e15a33'],  // original: gold, blue, orange-red
            ['#c92a2a', '#1864ab', '#f59f00'],  // red, blue, yellow
            ['#d9480f', '#2b8a3e', '#1971c2'],  // orange, green, blue
            ['#e03131', '#fcc419', '#228be6'],  // mondrian-ish
            ['#f76707', '#12b886', '#7950f2'],  // orange, teal, purple
        ];

        // Current mode: 'round', 'grating', 'triangles', 'quarters', 'diagonals', or 'circles'
        let currentMode = 'round';

        // Store current palette and animation timer
        let currentPalette = null;
        let animationTimer = null;

        // Glyphs for round mode - quarter circles and full circle
        const roundGlyphs = [
            // Solid quarter circle wedges - U+1FBEC through U+1FBEF
            ['\u{1FBEC}', 2.0, false, -40, 40],    // upper right quarter
            ['\u{1FBED}', 2.0, false, 40, -40],   // lower left quarter
            ['\u{1FBEE}', 2.0, false, -40, -40],   // bottom right quarter
            ['\u{1FBEF}', 2.0, false, 40, 40],  // upper left quarter

            // Full circle
            ['●', 1.0, true, 0, 4],
        ];

        // Glyphs for grating mode: [character, scale, isCircle, translateX, translateY]
        const gratingGlyphs = [
            ['\u{1FB9C}', 1.0, false, 0, 0],    // upper left
            ['\u{1FB9D}', 1.0, false, 0, 0],    // upper right
            ['\u{1FB9E}', 1.0, false, 0, 0],    // lower right
            ['\u{1FB9F}', 1.0, false, 0, 0],    // lower left
        ];

        // Special glyphs for mode 2 (to replace circles) - triangles
        const gratingSpecialGlyphs = [
            ['\u{25B2}', 1.0, false, 0, 0],      // triangle pointing up
            ['\u{25B2}', 1.0, false, 0, 0, 180], // triangle pointing down (rotated 180°)
        ];

        // Glyphs for triangles mode: [character, scale, isCircle, translateX, translateY]
        const sidesGlyphs = [
            ['\u{1FB6C}', 1.0, false, 0, 0],    // left triangle
            ['\u{1FB6D}', 1.0, false, 0, 0],    // top triangle
            ['\u{1FB6E}', 1.0, false, 0, 0],    // right triangle
            ['\u{1FB6F}', 1.0, false, 0, 0],    // bottom triangle
            ['\u{1FB9A}', 1.0, false, 0, 0],    // top & bottom triangles
            ['\u{1FB9B}', 1.0, false, 0, 0],    // left & right triangles
            ['\u{1FB68}', 1.0, false, 0, 0],    // 3 triangles right
            ['\u{1FB69}', 1.0, false, 0, 0],    // 3 triangles up
            ['\u{1FB6A}', 1.0, false, 0, 0],    // 3 triangles left
            ['\u{1FB6B}', 1.0, false, 0, 0],    // 3 triangles down                                   
            // Full circle
            ['●', 1.0, true, 0, 4],
        ];

        // ells
        // [\1FB06 // open down right L
        //  \1FB0A // open down left L
        //  \1FB0C // open up right L
        //  \1FB0D // open up left L    
        

        // Glyphs for quarters mode: [character, scale, isCircle, translateX, translateY]
        const quartersGlyphs = [
            ['\u{1FB8C}', 1.0, false, 0, 0],    // upper left
            ['\u{1FB8D}', 1.0, false, 0, 0],    // upper right
            ['\u{1FB8E}', 1.0, false, 0, 0],    // lower left
            ['\u{1FB8F}', 1.0, false, 0, 0],    // lower right
        ];

        // Special glyphs for mode 4 (to replace circles)
        const quartersSpecialGlyphs = [
            ['\u{1FB90}', 1.0, false, 0, 0],    // full square grating
            ['\u{1FB91}', 1.0, false, 0, 0],
            ['\u{1FB92}', 1.0, false, 0, 0],
            ['\u{1FB94}', 1.0, false, 0, 0],
        ];

        // Glyphs for diagonals mode: [character, scale, isCircle, translateX, translateY]
        const diagonalsGlyphs = [
            ['\u{1FBE8}', 1.0, false, 0, 0],    // diagonal 1
            ['\u{1FBE9}', 1.0, false, 0, 0],    // diagonal 2
            ['\u{1FBEA}', 1.0, false, 0, 0],    // diagonal 3
            ['\u{1FBEB}', 1.0, false, 0, 0],    // diagonal 4

            // Full circle
            ['●', 1.0, true, 0, 4],
        ];

        // Glyphs for circles mode: only circles
        const circlesGlyphs = [
            // Full circle
            ['●', 1.0, true, 0, 4],
        ];

        function randomFrom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function generate() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            // Pick a random palette and store it
            currentPalette = randomFrom(palettes);

            // Choose the appropriate glyph set based on current mode
            let glyphSet;
            if (currentMode === 'round') {
                glyphSet = roundGlyphs;
            } else if (currentMode === 'grating') {
                glyphSet = gratingGlyphs;
            } else if (currentMode === 'triangles') {
                glyphSet = sidesGlyphs;
            } else if (currentMode === 'quarters') {
                glyphSet = quartersGlyphs;
            } else if (currentMode === 'diagonals') {
                glyphSet = diagonalsGlyphs;
            } else if (currentMode === 'circles') {
                glyphSet = circlesGlyphs;
            }

            for (let i = 0; i < 160; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';

                // Background is only black or white
                const bg = Math.random() < 0.5 ? black : white;
                cell.style.backgroundColor = bg;

                // Pick foreground color (accent colors plus black and white)
                const fgChoices = [...currentPalette, black, white];
                const fg = randomFrom(fgChoices);

                let glyph, scale, isCircle, translateX, translateY, rotation;

                // For circles mode, 15% empty cells, rest are circles
                if (currentMode === 'circles') {
                    const roll = Math.random();
                    if (roll < 0.15) {
                        // Empty cell - skip to next iteration
                        grid.appendChild(cell);
                        continue;
                    } else {
                        // Circle
                        [glyph, scale, isCircle, translateX, translateY] = glyphSet[0];
                    }
                } else if (currentMode === 'grating') {
                    // Mode 2: Pick pattern or triangle (no circles)
                    const roll = Math.random();
                    if (roll < 0.85) {
                        // Pattern characters
                        [glyph, scale, isCircle, translateX, translateY] = glyphSet[Math.floor(Math.random() * glyphSet.length)];
                    } else {
                        // One of the two triangle orientations
                        const triangleData = randomFrom(gratingSpecialGlyphs);
                        [glyph, scale, isCircle, translateX, translateY, rotation] = triangleData;
                    }
                } else if (currentMode === 'quarters') {
                    // Mode 4: Pick pattern or special glyph (no circles)
                    const roll = Math.random();
                    if (roll < 0.85) {
                        // Pattern characters
                        [glyph, scale, isCircle, translateX, translateY] = glyphSet[Math.floor(Math.random() * glyphSet.length)];
                    } else {
                        // One of the three special glyphs
                        [glyph, scale, isCircle, translateX, translateY] = randomFrom(quartersSpecialGlyphs);
                    }
                } else {
                    // Pick a glyph - weight toward the pattern glyphs (85%) vs circle (15%)
                    const roll = Math.random();
                    if (roll < 0.85) {
                        // Pattern characters (all but last glyph which is the circle)
                        const patternCount = glyphSet.length - 1;
                        [glyph, scale, isCircle, translateX, translateY] = glyphSet[Math.floor(Math.random() * patternCount)];
                    } else {
                        // Full circle (last glyph)
                        [glyph, scale, isCircle, translateX, translateY] = glyphSet[glyphSet.length - 1];
                    }
                }

                const span = document.createElement('span');
                span.textContent = glyph;
                span.style.color = fg;
                span.className = 'visible';

                if (isCircle) {
                    // Circle rendering
                    if (currentMode === 'circles') {
                        // Cross-hatch mode for modes 2 and 6: layer six glyphs with circles
                        // Pick two different colors for first two glyphs
                        let fg1 = randomFrom(fgChoices);
                        let fg2 = randomFrom(fgChoices);
                        // Ensure fg1 and fg2 are different
                        while (fg1 === fg2 && fgChoices.length > 1) {
                            fg2 = randomFrom(fgChoices);
                        }

                        // First layer: U+1FB90 (full square grating - different color)
                        const span1 = document.createElement('span');
                        span1.textContent = '\u{1FB90}';
                        span1.style.color = fg1;
                        span1.style.fontSize = '75px';
                        span1.style.transform = `translate(0px, 0px)`;
                        span1.className = 'visible';

                        // Second layer: U+25CE (different color from first)
                        const span2 = document.createElement('span');
                        span2.textContent = '\u{25CE}';
                        span2.style.color = fg2;
                        span2.style.fontSize = '75px';
                        span2.style.transform = `translate(0px, 0px)`;
                        span2.className = 'visible';

                        // Third layer: U+25CD at 0°
                        const span3 = document.createElement('span');
                        span3.textContent = '\u{25CD}';
                        span3.style.color = fg;
                        span3.style.fontSize = '75px';
                        span3.style.transform = `translate(0px, 0px) rotate(0deg)`;
                        span3.className = 'visible';

                        // Fourth layer: U+25CD at 45°
                        const span4 = document.createElement('span');
                        span4.textContent = '\u{25CD}';
                        span4.style.color = fg;
                        span4.style.fontSize = '75px';
                        span4.style.transform = `translate(0px, 0px) rotate(45deg)`;
                        span4.className = 'visible';

                        // Fifth layer: U+25CD at 90°
                        const span5 = document.createElement('span');
                        span5.textContent = '\u{25CD}';
                        span5.style.color = fg;
                        span5.style.fontSize = '75px';
                        span5.style.transform = `translate(0px, 0px) rotate(90deg)`;
                        span5.className = 'visible';

                        // Sixth layer: U+25CD at -45°
                        const span6 = document.createElement('span');
                        span6.textContent = '\u{25CD}';
                        span6.style.color = fg;
                        span6.style.fontSize = '75px';
                        span6.style.transform = `translate(0px, 0px) rotate(-45deg)`;
                        span6.className = 'visible';

                        cell.appendChild(span1);
                        cell.appendChild(span2);
                        cell.appendChild(span3);
                        cell.appendChild(span4);
                        cell.appendChild(span5);
                        cell.appendChild(span6);
                    } else {
                        // Regular circle for other modes
                        span.style.fontSize = '75px';
                        span.style.transform = `translate(0px, 0px)`;
                        cell.appendChild(span);
                    }
                } else {
                    if (rotation !== undefined) {
                        // Apply rotation for triangles
                        span.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale}) rotate(${rotation}deg)`;
                    } else {
                        span.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
                    }
                    cell.appendChild(span);
                }

                grid.appendChild(cell);
            }
        }

        function generateCellContent() {
            // Choose the appropriate glyph set based on current mode
            let glyphSet;
            if (currentMode === 'round') {
                glyphSet = roundGlyphs;
            } else if (currentMode === 'grating') {
                glyphSet = gratingGlyphs;
            } else if (currentMode === 'triangles') {
                glyphSet = sidesGlyphs;
            } else if (currentMode === 'quarters') {
                glyphSet = quartersGlyphs;
            } else if (currentMode === 'diagonals') {
                glyphSet = diagonalsGlyphs;
            }

            const fgChoices = [...currentPalette, black, white];
            const fg = randomFrom(fgChoices);

            let glyph, scale, isCircle, translateX, translateY, rotation;

            if (currentMode === 'grating') {
                const roll = Math.random();
                if (roll < 0.85) {
                    [glyph, scale, isCircle, translateX, translateY] = glyphSet[Math.floor(Math.random() * glyphSet.length)];
                } else {
                    const triangleData = randomFrom(gratingSpecialGlyphs);
                    [glyph, scale, isCircle, translateX, translateY, rotation] = triangleData;
                }
            } else if (currentMode === 'quarters') {
                const roll = Math.random();
                if (roll < 0.85) {
                    [glyph, scale, isCircle, translateX, translateY] = glyphSet[Math.floor(Math.random() * glyphSet.length)];
                } else {
                    [glyph, scale, isCircle, translateX, translateY] = randomFrom(quartersSpecialGlyphs);
                }
            } else {
                const roll = Math.random();
                if (roll < 0.85) {
                    const patternCount = glyphSet.length - 1;
                    [glyph, scale, isCircle, translateX, translateY] = glyphSet[Math.floor(Math.random() * patternCount)];
                } else {
                    [glyph, scale, isCircle, translateX, translateY] = glyphSet[glyphSet.length - 1];
                }
            }

            const span = document.createElement('span');
            span.textContent = glyph;
            span.style.color = fg;
            span.className = 'fading-in';

            if (isCircle) {
                span.style.fontSize = '75px';
                span.style.transform = `translate(0px, 0px)`;
            } else {
                if (rotation !== undefined) {
                    span.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale}) rotate(${rotation}deg)`;
                } else {
                    span.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
                }
            }

            return span;
        }

        function animateCell(cellIndex) {
            const grid = document.getElementById('grid');
            const cell = grid.children[cellIndex];

            if (!cell || cell.children.length === 0) return;

            // Create new glyph
            const newSpan = generateCellContent();
            cell.appendChild(newSpan);

            // Start fade in for new glyph after a tiny delay
            setTimeout(() => {
                newSpan.className = 'visible';
            }, 50);

            // Wait for fade in to be halfway (2s of the 4s transition) before starting fade out
            const oldSpans = Array.from(cell.children).slice(0, -1);
            setTimeout(() => {
                oldSpans.forEach(span => {
                    span.className = 'fading-out';
                });
            }, 2000);

            // Remove old glyphs after both transitions complete (2s + 4s + 100ms buffer)
            setTimeout(() => {
                oldSpans.forEach(span => {
                    if (span.parentNode === cell) {
                        cell.removeChild(span);
                    }
                });
            }, 6100);
        }

        function startAnimations() {
            // Clear any existing timer
            if (animationTimer) {
                clearInterval(animationTimer);
            }

            // Only animate modes 1-5, not mode 6 (circles)
            if (currentMode === 'circles') {
                return;
            }

            // Animate 1-2 cells every 3-5 seconds
            animationTimer = setInterval(() => {
                const numCells = Math.random() < 0.5 ? 1 : 2;

                // Prefer center cells (indices 60-100 in a 160-cell grid)
                // But occasionally pick from anywhere
                for (let i = 0; i < numCells; i++) {
                    let cellIndex;
                    if (Math.random() < 0.7) {
                        // Center region
                        cellIndex = Math.floor(Math.random() * 40) + 60;
                    } else {
                        // Anywhere
                        cellIndex = Math.floor(Math.random() * 160);
                    }

                    animateCell(cellIndex);
                }
            }, Math.random() * 2000 + 3000); // 3-5 seconds
        }

        // Keyboard listener for mode switching
        document.addEventListener('keydown', (e) => {
            if (e.key === '1') {
                currentMode = 'round';
                generate();
                startAnimations();
            } else if (e.key === '2') {
                currentMode = 'grating';
                generate();
                startAnimations();
            } else if (e.key === '3') {
                currentMode = 'triangles';
                generate();
                startAnimations();
            } else if (e.key === '4') {
                currentMode = 'quarters';
                generate();
                startAnimations();
            } else if (e.key === '5') {
                currentMode = 'diagonals';
                generate();
                startAnimations();
            } else if (e.key === '6') {
                currentMode = 'circles';
                generate();
                startAnimations();
            }
        });

        // Generate on load
        generate();
        startAnimations();
    </script>
</body>
</html>
