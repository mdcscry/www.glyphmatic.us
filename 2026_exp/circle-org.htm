<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organic Circles - Random</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      overflow: hidden;
    }
    svg {
      width: 100vw;
      height: 100vh;
      display: block;
    }
  </style>
</head>
<body>
  <svg id="canvas" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  </svg>

  <script>
    const svg = document.getElementById('canvas');
    
    // Random helpers
    const rand = (min, max) => Math.random() * (max - min) + min;
    const randInt = (min, max) => Math.floor(rand(min, max + 1));
    const pick = arr => arr[randInt(0, arr.length - 1)];
    
    // Generate a random warm color palette
    function generatePalette() {
      const hueBase = rand(0, 60); // reds, oranges, yellows
      const numColors = randInt(10, 15);
      const colors = [];
      
      for (let i = 0; i < numColors; i++) {
        const h = (hueBase + rand(-15, 15) + 360) % 360;
        const s = rand(70, 100);
        const l = rand(25, 65);
        colors.push(`hsl(${h}, ${s}%, ${l}%)`);
      }
      
      // Sort by lightness for layering
      return colors.sort((a, b) => {
        const lA = parseFloat(a.match(/(\d+)%\)$/)[1]);
        const lB = parseFloat(b.match(/(\d+)%\)$/)[1]);
        return lA - lB;
      });
    }
    
    // Create random filters
    function createFilters(defs, count) {
      for (let i = 0; i < count; i++) {
        const filter = document.createElementNS('http://www.w3.org/2000/svg', 'filter');
        filter.setAttribute('id', `organic-${i}`);
        filter.setAttribute('x', '-30%');
        filter.setAttribute('y', '-30%');
        filter.setAttribute('width', '160%');
        filter.setAttribute('height', '160%');
        
        const turbulence = document.createElementNS('http://www.w3.org/2000/svg', 'feTurbulence');
        turbulence.setAttribute('type', 'fractalNoise');
        turbulence.setAttribute('baseFrequency', rand(0.002, 0.008).toFixed(4));
        turbulence.setAttribute('numOctaves', randInt(1, 2));
        turbulence.setAttribute('seed', randInt(1, 1000));
        turbulence.setAttribute('result', 'noise');
        
        const blur = document.createElementNS('http://www.w3.org/2000/svg', 'feGaussianBlur');
        blur.setAttribute('in', 'noise');
        blur.setAttribute('stdDeviation', rand(6, 15).toFixed(1));
        blur.setAttribute('result', 'smoothNoise');
        
        const displacement = document.createElementNS('http://www.w3.org/2000/svg', 'feDisplacementMap');
        displacement.setAttribute('in', 'SourceGraphic');
        displacement.setAttribute('in2', 'smoothNoise');
        displacement.setAttribute('scale', rand(40, 90).toFixed(0));
        displacement.setAttribute('xChannelSelector', pick(['R', 'G', 'B']));
        displacement.setAttribute('yChannelSelector', pick(['R', 'G', 'B']));
        
        filter.appendChild(turbulence);
        filter.appendChild(blur);
        filter.appendChild(displacement);
        defs.appendChild(filter);
      }
    }
    
    // Create a wobbly circle
    function createCircle(cx, cy, r, fill, filterId) {
      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('cx', cx);
      circle.setAttribute('cy', cy);
      circle.setAttribute('r', r);
      circle.setAttribute('fill', fill);
      circle.setAttribute('filter', `url(#organic-${filterId})`);
      return circle;
    }
    
    // Main generation
    function generate() {
      svg.innerHTML = '';
      
      const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
      svg.appendChild(defs);
      
      const palette = generatePalette();
      const numFilters = randInt(3, 5);
      createFilters(defs, numFilters);
      
      // Background - darker color separate from palette
      const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      bg.setAttribute('width', '100%');
      bg.setAttribute('height', '100%');
      // Create a dark background color that won't match the circles (lightness 8-15%)
      const bgHue = rand(0, 60);
      const bgColor = `hsl(${bgHue}, ${rand(20, 40)}%, ${rand(8, 15)}%)`;
      bg.setAttribute('fill', bgColor);
      svg.appendChild(bg);
      
      // Create layers of circles
      const numLayers = randInt(1, 3);
      
      for (let layer = 0; layer < numLayers; layer++) {
        const numCircles = randInt(1, 3);
        const layerColor = palette[layer % palette.length];
        const filterId = layer % numFilters;
        
        for (let i = 0; i < numCircles; i++) {
          // Some circles at edges, some in middle
          let cx, cy;
          if (Math.random() < 0.2) {
            // Edge circles
            const edge = randInt(0, 10);
            if (edge === 0) { cx = rand(-50, 100); cy = rand(0, 600); }
            else if (edge === 1) { cx = rand(700, 850); cy = rand(0, 600); }
            else if (edge === 2) { cx = rand(0, 800); cy = rand(-50, 100); }
            else { cx = rand(0, 800); cy = rand(500, 650); }
          } else {
            cx = rand(100, 700);
            cy = rand(100, 500);
          }
          
          const r = rand(30, 180);
          svg.appendChild(createCircle(cx, cy, r, layerColor, filterId));
        }
      }
    }
    
    generate();
  </script>
</body>
</html>
