<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle Packing with Negative Space</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height: 100vh; overflow: hidden; }
    svg { width: 100vw; height: 100vh; display: block; }
  </style>
</head>
<body>
  <svg id="canvas" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice"></svg>

  <script>
    const svg = document.getElementById('canvas');
    const W = 800, H = 600;
    
    const rand = (min, max) => Math.random() * (max - min) + min;
    const randInt = (min, max) => Math.floor(rand(min, max + 1));
    const pick = arr => arr[randInt(0, arr.length - 1)];
    
    // Delaunay triangulation (Bowyer-Watson)
    function delaunay(points) {
      const margin = Math.max(W, H) * 10;
      const superTri = [
        { x: -margin, y: -margin, id: -1 },
        { x: W / 2, y: H + margin * 2, id: -2 },
        { x: W + margin * 2, y: -margin, id: -3 }
      ];
      
      let triangles = [superTri];
      
      for (const p of points) {
        const badTriangles = [];
        const polygon = [];
        
        for (const tri of triangles) {
          if (inCircumcircle(p, tri)) {
            badTriangles.push(tri);
          }
        }
        
        for (const tri of badTriangles) {
          for (let i = 0; i < 3; i++) {
            const edge = [tri[i], tri[(i + 1) % 3]];
            let shared = false;
            for (const other of badTriangles) {
              if (other === tri) continue;
              if (hasEdge(other, edge)) {
                shared = true;
                break;
              }
            }
            if (!shared) {
              polygon.push(edge);
            }
          }
        }
        
        triangles = triangles.filter(t => !badTriangles.includes(t));
        
        for (const edge of polygon) {
          triangles.push([edge[0], edge[1], p]);
        }
      }
      
      triangles = triangles.filter(tri => {
        for (const v of tri) {
          if (v.id < 0) return false;
        }
        return true;
      });
      
      return triangles;
    }
    
    function inCircumcircle(p, tri) {
      const [a, b, c] = tri;
      const ax = a.x - p.x, ay = a.y - p.y;
      const bx = b.x - p.x, by = b.y - p.y;
      const cx = c.x - p.x, cy = c.y - p.y;
      
      const det = (
        (ax * ax + ay * ay) * (bx * cy - cx * by) -
        (bx * bx + by * by) * (ax * cy - cx * ay) +
        (cx * cx + cy * cy) * (ax * by - bx * ay)
      );
      
      return det > 0;
    }
    
    function hasEdge(tri, edge) {
      for (let i = 0; i < 3; i++) {
        const e = [tri[i], tri[(i + 1) % 3]];
        if ((e[0] === edge[0] && e[1] === edge[1]) ||
            (e[0] === edge[1] && e[1] === edge[0])) {
          return true;
        }
      }
      return false;
    }
    
    function buildAdjacency(points, triangles) {
      const adj = new Map();
      for (const p of points) {
        adj.set(p.id, new Set());
      }
      
      for (const tri of triangles) {
        for (let i = 0; i < 3; i++) {
          const a = tri[i];
          const b = tri[(i + 1) % 3];
          adj.get(a.id).add(b.id);
          adj.get(b.id).add(a.id);
        }
      }
      
      return adj;
    }
    
    function packCircles(points, boundaryIds, adj, tension) {
      const radii = new Map();
      
      for (const p of points) {
        if (boundaryIds.has(p.id)) {
          radii.set(p.id, rand(180, 350));
        } else {
          radii.set(p.id, rand(50, 120));
        }
      }
      
      const pointMap = new Map(points.map(p => [p.id, p]));
      const iterations = 200;
      const targetAngleSum = 2 * Math.PI;
      
      for (let iter = 0; iter < iterations; iter++) {
        for (const p of points) {
          if (boundaryIds.has(p.id)) continue;
          
          const neighborIds = Array.from(adj.get(p.id));
          if (neighborIds.length < 3) continue;
          
          neighborIds.sort((a, b) => {
            const pa = pointMap.get(a);
            const pb = pointMap.get(b);
            return Math.atan2(pa.y - p.y, pa.x - p.x) - Math.atan2(pb.y - p.y, pb.x - p.x);
          });
          
          let angleSum = 0;
          
          for (let j = 0; j < neighborIds.length; j++) {
            const id1 = neighborIds[j];
            const id2 = neighborIds[(j + 1) % neighborIds.length];
            
            const r0 = radii.get(p.id);
            const r1 = radii.get(id1);
            const r2 = radii.get(id2);
            
            const d01 = (r0 + r1) * tension;
            const d02 = (r0 + r2) * tension;
            const d12 = (r1 + r2) * tension;
            
            const cosAngle = (d01 * d01 + d02 * d02 - d12 * d12) / (2 * d01 * d02);
            angleSum += Math.acos(Math.max(-1, Math.min(1, cosAngle)));
          }
          
          const ratio = angleSum / targetAngleSum;
          radii.set(p.id, radii.get(p.id) * Math.pow(ratio, 0.12));
          radii.set(p.id, Math.max(25, Math.min(180, radii.get(p.id))));
        }
      }
      
      return radii;
    }
    
    function positionCircles(points, radii, adj, boundaryIds, tension) {
      const positions = new Map(points.map(p => [p.id, { x: p.x, y: p.y }]));
      
      for (let iter = 0; iter < 120; iter++) {
        for (const p of points) {
          if (boundaryIds.has(p.id)) continue;
          
          const neighborIds = Array.from(adj.get(p.id));
          if (neighborIds.length === 0) continue;
          
          let fx = 0, fy = 0;
          const pos = positions.get(p.id);
          
          for (const nid of neighborIds) {
            const npos = positions.get(nid);
            const dx = npos.x - pos.x;
            const dy = npos.y - pos.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const targetDist = (radii.get(p.id) + radii.get(nid)) * tension;
            
            if (dist > 0) {
              const force = (dist - targetDist) * 0.08;
              fx += (dx / dist) * force;
              fy += (dy / dist) * force;
            }
          }
          
          positions.get(p.id).x += fx;
          positions.get(p.id).y += fy;
        }
      }
      
      return positions;
    }
    
    // Compute negative space polygons - the gaps between three tangent circles
    function computeNegativeSpacePolygons(triangles, positions, radii) {
      const polygons = [];
      
      for (const tri of triangles) {
        const [a, b, c] = tri;
        
        const pa = positions.get(a.id);
        const pb = positions.get(b.id);
        const pc = positions.get(c.id);
        
        const ra = radii.get(a.id);
        const rb = radii.get(b.id);
        const rc = radii.get(c.id);
        
        // For each edge, find the point where circles meet
        const getEdgePoint = (p1, r1, p2, r2) => {
          const dx = p2.x - p1.x;
          const dy = p2.y - p1.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist === 0) return { x: p1.x, y: p1.y };
          const t = r1 / (r1 + r2);
          return {
            x: p1.x + dx * t,
            y: p1.y + dy * t
          };
        };
        
        const points = [];
        
        // Trace arcs along each circle edge
        const addArcPoints = (center, radius, start, end, numPoints = 8) => {
          const startAngle = Math.atan2(start.y - center.y, start.x - center.x);
          let endAngle = Math.atan2(end.y - center.y, end.x - center.x);
          
          let diff = endAngle - startAngle;
          if (diff > Math.PI) diff -= 2 * Math.PI;
          if (diff < -Math.PI) diff += 2 * Math.PI;
          
          for (let i = 0; i <= numPoints; i++) {
            const t = i / numPoints;
            const angle = startAngle + diff * t;
            points.push({
              x: center.x + Math.cos(angle) * radius,
              y: center.y + Math.sin(angle) * radius
            });
          }
        };
        
        const pAB = getEdgePoint(pa, ra, pb, rb);
        const pBC = getEdgePoint(pb, rb, pc, rc);
        const pCA = getEdgePoint(pc, rc, pa, ra);
        
        addArcPoints(pa, ra, pCA, pAB, 6);
        addArcPoints(pb, rb, pAB, pBC, 6);
        addArcPoints(pc, rc, pBC, pCA, 6);
        
        if (points.length > 3) {
          polygons.push(points);
        }
      }
      
      return polygons;
    }
    
    // Compute edge regions between circles and viewport frame
    function computeEdgePolygons(positions, radii, boundaryIds) {
      const polygons = [];
      
      // For each interior circle near an edge, create a wedge shape
      for (const [id, pos] of positions) {
        if (boundaryIds.has(id)) continue;
        
        const r = radii.get(id);
        
        // Check each edge
        const edges = [
          { dist: pos.y, angle: -Math.PI/2, edgeLine: (x, y) => ({ x, y: 0 }) },           // top
          { dist: W - pos.x, angle: 0, edgeLine: (x, y) => ({ x: W, y }) },                // right
          { dist: H - pos.y, angle: Math.PI/2, edgeLine: (x, y) => ({ x, y: H }) },        // bottom
          { dist: pos.x, angle: Math.PI, edgeLine: (x, y) => ({ x: 0, y }) }               // left
        ];
        
        for (const edge of edges) {
          if (edge.dist < r + 80 && edge.dist > 0) {
            const points = [];
            const spread = rand(0.4, 0.8);
            
            // Points on the circle
            for (let i = 0; i <= 6; i++) {
              const t = i / 6;
              const angle = edge.angle - spread + t * spread * 2;
              points.push({
                x: pos.x + Math.cos(angle) * r,
                y: pos.y + Math.sin(angle) * r
              });
            }
            
            // Points on the edge
            const edgeStart = edge.edgeLine(
              pos.x + Math.cos(edge.angle + spread) * (r + edge.dist),
              pos.y + Math.sin(edge.angle + spread) * (r + edge.dist)
            );
            const edgeEnd = edge.edgeLine(
              pos.x + Math.cos(edge.angle - spread) * (r + edge.dist),
              pos.y + Math.sin(edge.angle - spread) * (r + edge.dist)
            );
            
            points.push(edgeStart);
            points.push(edgeEnd);
            
            polygons.push(points);
          }
        }
      }
      
      // Corner regions
      const corners = [
        { x: 0, y: 0 },
        { x: W, y: 0 },
        { x: W, y: H },
        { x: 0, y: H }
      ];
      
      for (const corner of corners) {
        // Find nearest circle to this corner
        let nearest = null;
        let nearestDist = Infinity;
        
        for (const [id, pos] of positions) {
          if (boundaryIds.has(id)) continue;
          const dx = pos.x - corner.x;
          const dy = pos.y - corner.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < nearestDist) {
            nearestDist = dist;
            nearest = { id, pos, r: radii.get(id) };
          }
        }
        
        if (nearest && nearestDist < nearest.r + 200) {
          const points = [];
          const angleToCorner = Math.atan2(corner.y - nearest.pos.y, corner.x - nearest.pos.x);
          
          // Arc on circle facing corner
          for (let i = 0; i <= 5; i++) {
            const t = i / 5;
            const angle = angleToCorner - 0.6 + t * 1.2;
            points.push({
              x: nearest.pos.x + Math.cos(angle) * nearest.r,
              y: nearest.pos.y + Math.sin(angle) * nearest.r
            });
          }
          
          // Corner point
          points.push(corner);
          
          polygons.push(points);
        }
      }
      
      return polygons;
    }
    
    function generatePalette() {
      const hueBase = rand(0, 45);
      const colors = [];
      const numColors = randInt(4, 6);
      
      for (let i = 0; i < numColors; i++) {
        const h = (hueBase + rand(-15, 15) + 360) % 360;
        const s = rand(75, 100);
        const l = 18 + (i / numColors) * 48;
        colors.push(`hsl(${h}, ${s}%, ${l}%)`);
      }
      
      return colors;
    }
    
    function createFilter(defs, id) {
      const filter = document.createElementNS('http://www.w3.org/2000/svg', 'filter');
      filter.setAttribute('id', id);
      filter.setAttribute('x', '-30%');
      filter.setAttribute('y', '-30%');
      filter.setAttribute('width', '160%');
      filter.setAttribute('height', '160%');
      
      const turbulence = document.createElementNS('http://www.w3.org/2000/svg', 'feTurbulence');
      turbulence.setAttribute('type', 'fractalNoise');
      turbulence.setAttribute('baseFrequency', rand(0.003, 0.006).toFixed(4));
      turbulence.setAttribute('numOctaves', '1');
      turbulence.setAttribute('seed', randInt(1, 1000));
      turbulence.setAttribute('result', 'noise');
      
      const blur = document.createElementNS('http://www.w3.org/2000/svg', 'feGaussianBlur');
      blur.setAttribute('in', 'noise');
      blur.setAttribute('stdDeviation', rand(8, 14).toFixed(1));
      blur.setAttribute('result', 'smoothNoise');
      
      const displacement = document.createElementNS('http://www.w3.org/2000/svg', 'feDisplacementMap');
      displacement.setAttribute('in', 'SourceGraphic');
      displacement.setAttribute('in2', 'smoothNoise');
      displacement.setAttribute('scale', rand(40, 70).toFixed(0));
      displacement.setAttribute('xChannelSelector', pick(['R', 'G', 'B']));
      displacement.setAttribute('yChannelSelector', pick(['R', 'G', 'B']));
      
      filter.appendChild(turbulence);
      filter.appendChild(blur);
      filter.appendChild(displacement);
      defs.appendChild(filter);
    }
    
    function pointsToPath(points) {
      if (points.length < 3) return '';
      let d = `M ${points[0].x} ${points[0].y}`;
      for (let i = 1; i < points.length; i++) {
        d += ` L ${points[i].x} ${points[i].y}`;
      }
      d += ' Z';
      return d;
    }
    
    function generate() {
      svg.innerHTML = '';
      
      const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
      svg.appendChild(defs);
      
      const numFilters = randInt(3, 5);
      for (let i = 0; i < numFilters; i++) {
        createFilter(defs, `organic-${i}`);
      }
      
      const tension = rand(0.85, 1.05);
      
      const points = [];
      const boundaryIds = new Set();
      let idCounter = 0;
      
      const numBoundary = randInt(6, 10);
      const margin = 150;
      
      for (let i = 0; i < numBoundary; i++) {
        const angle = (i / numBoundary) * Math.PI * 2 + rand(-0.2, 0.2);
        const dist = Math.max(W, H) / 2 + margin + rand(-30, 30);
        const id = idCounter++;
        points.push({
          id,
          x: W / 2 + Math.cos(angle) * dist,
          y: H / 2 + Math.sin(angle) * dist
        });
        boundaryIds.add(id);
      }
      
      const numInterior = randInt(5, 10);
      for (let i = 0; i < numInterior; i++) {
        points.push({
          id: idCounter++,
          x: rand(100, W - 100),
          y: rand(80, H - 80)
        });
      }
      
      const triangles = delaunay(points);
      const adj = buildAdjacency(points, triangles);
      const radii = packCircles(points, boundaryIds, adj, tension);
      const positions = positionCircles(points, radii, adj, boundaryIds, tension);
      
      const gapPolygons = computeNegativeSpacePolygons(triangles, positions, radii);
      const edgePolygons = computeEdgePolygons(positions, radii, boundaryIds);
      
      const palette = generatePalette();
      
      // Background
      const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      bg.setAttribute('width', '100%');
      bg.setAttribute('height', '100%');
      bg.setAttribute('fill', palette[0]);
      svg.appendChild(bg);
      
      // Draw edge polygons (behind circles)
      for (const poly of edgePolygons) {
        if (Math.random() > 0.7) continue; // Random selection
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', pointsToPath(poly));
        path.setAttribute('fill', palette[randInt(0, 2)]);
        path.setAttribute('filter', `url(#organic-${randInt(0, numFilters - 1)})`);
        svg.appendChild(path);
      }
      
      // Draw circles
      const circles = points
        .filter(p => !boundaryIds.has(p.id))
        .map(p => ({
          id: p.id,
          x: positions.get(p.id).x,
          y: positions.get(p.id).y,
          r: radii.get(p.id)
        }));
      
      circles.sort((a, b) => b.r - a.r);
      
      for (const c of circles) {
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', c.x);
        circle.setAttribute('cy', c.y);
        circle.setAttribute('r', c.r);
        circle.setAttribute('fill', palette[randInt(1, palette.length - 1)]);
        circle.setAttribute('filter', `url(#organic-${randInt(0, numFilters - 1)})`);
        svg.appendChild(circle);
      }
      
      // Draw some gap polygons on top
      for (const poly of gapPolygons) {
        if (Math.random() > 0.35) continue;
        
        const avgX = poly.reduce((s, p) => s + p.x, 0) / poly.length;
        const avgY = poly.reduce((s, p) => s + p.y, 0) / poly.length;
        if (avgX < -50 || avgX > W + 50 || avgY < -50 || avgY > H + 50) continue;
        
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', pointsToPath(poly));
        path.setAttribute('fill', palette[randInt(0, palette.length - 1)]);
        path.setAttribute('filter', `url(#organic-${randInt(0, numFilters - 1)})`);
        svg.appendChild(path);
      }
    }
    
    generate();
  </script>
</body>
</html>
