<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shape Field - Configurable</title>
  <style>
    @property --c1 {
      syntax: '<color>';
      inherits: false;
      initial-value: #000;
    }
    
    @property --c2 {
      syntax: '<color>';
      inherits: false;
      initial-value: #000;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #0a0a0f;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(40, 1fr);
      grid-template-rows: repeat(20, 1fr);
      gap: 2px;
      width: 100vw;
      height: 100vh;
      padding: 1rem;
    }

    .shape {
      width: 100%;
      height: 100%;
      background: linear-gradient(var(--angle), var(--c1), var(--c2));
      transition: --c1 8s ease, --c2 8s ease;
    }

    /* Controls panel */
    .controls {
      position: fixed;
      top: 2rem;
      left: 2rem;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 1.5rem;
      backdrop-filter: blur(10px);
      z-index: 100;
      max-width: 220px;
    }

    .controls h3 {
      color: rgba(255, 255, 255, 0.6);
      font-family: system-ui, sans-serif;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1rem;
    }

    .toggle {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
      cursor: pointer;
    }

    .toggle input {
      display: none;
    }

    .toggle .checkbox {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .toggle input:checked + .checkbox {
      background: #8338ec;
      border-color: #8338ec;
    }

    .toggle input:checked + .checkbox::after {
      content: '✓';
      color: white;
      font-size: 12px;
    }

    .toggle span {
      color: rgba(255, 255, 255, 0.7);
      font-family: system-ui, sans-serif;
      font-size: 0.85rem;
    }

    .toggle:hover span {
      color: #fff;
    }

    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
      margin: 1rem 0;
    }

    .regenerate-btn {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.7);
      padding: 0.75rem 1.5rem;
      border-radius: 2rem;
      font-family: system-ui, sans-serif;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(10px);
      z-index: 100;
    }

    .regenerate-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .palette-name {
      position: fixed;
      bottom: 2rem;
      left: 2rem;
      color: rgba(255, 255, 255, 0.4);
      font-family: system-ui, sans-serif;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <div class="controls">
    <h3>Shape Types</h3>
    
    <label class="toggle">
      <input type="checkbox" id="toggle-ellipse" checked>
      <div class="checkbox"></div>
      <span>Ellipse</span>
    </label>
    
    <label class="toggle">
      <input type="checkbox" id="toggle-circle" checked>
      <div class="checkbox"></div>
      <span>Circle</span>
    </label>
    
    <label class="toggle">
      <input type="checkbox" id="toggle-triangle">
      <div class="checkbox"></div>
      <span>Triangle ↔ Hex</span>
    </label>
    
    <label class="toggle">
      <input type="checkbox" id="toggle-star">
      <div class="checkbox"></div>
      <span>Octagon ↔ Star</span>
    </label>
    
    <label class="toggle">
      <input type="checkbox" id="toggle-diamond">
      <div class="checkbox"></div>
      <span>Diamond ↔ Rounded</span>
    </label>
    
    <label class="toggle">
      <input type="checkbox" id="toggle-cross">
      <div class="checkbox"></div>
      <span>Cross ↔ Circle</span>
    </label>
    
    <label class="toggle">
      <input type="checkbox" id="toggle-pentagon">
      <div class="checkbox"></div>
      <span>Pentagon ↔ Star</span>
    </label>
    
    <label class="toggle">
      <input type="checkbox" id="toggle-blob">
      <div class="checkbox"></div>
      <span>Amorphous Blob</span>
    </label>
  </div>

  <div class="grid" id="grid"></div>
  <button class="regenerate-btn" id="regenerate">Regenerate</button>
  <div class="palette-name" id="palette-name"></div>

  <script>
    const grid = document.getElementById('grid');
    const regenerateBtn = document.getElementById('regenerate');
    const paletteNameEl = document.getElementById('palette-name');
    
    // Shape type toggles
    const toggles = {
      ellipse: document.getElementById('toggle-ellipse'),
      circle: document.getElementById('toggle-circle'),
      triangle: document.getElementById('toggle-triangle'),
      star: document.getElementById('toggle-star'),
      diamond: document.getElementById('toggle-diamond'),
      cross: document.getElementById('toggle-cross'),
      pentagon: document.getElementById('toggle-pentagon'),
      blob: document.getElementById('toggle-blob'),
    };

    // Multiple palettes
    const palettes = {
      'Ocean Sunset': [
        { h: 220, s: 80, l: 45 },
        { h: 200, s: 70, l: 50 },
        { h: 180, s: 60, l: 45 },
        { h: 280, s: 60, l: 50 },
        { h: 320, s: 70, l: 55 },
        { h: 350, s: 75, l: 55 },
      ],
      'Forest': [
        { h: 90, s: 50, l: 30 },
        { h: 120, s: 60, l: 35 },
        { h: 150, s: 50, l: 40 },
        { h: 80, s: 70, l: 45 },
        { h: 45, s: 60, l: 50 },
        { h: 30, s: 50, l: 40 },
      ],
      'Neon Night': [
        { h: 280, s: 100, l: 60 },
        { h: 320, s: 100, l: 55 },
        { h: 180, s: 100, l: 50 },
        { h: 60, s: 100, l: 50 },
        { h: 300, s: 90, l: 65 },
        { h: 200, s: 100, l: 55 },
      ],
      'Ember': [
        { h: 0, s: 80, l: 40 },
        { h: 15, s: 90, l: 50 },
        { h: 30, s: 100, l: 55 },
        { h: 45, s: 100, l: 60 },
        { h: 350, s: 70, l: 35 },
        { h: 20, s: 85, l: 45 },
      ],
      'Arctic': [
        { h: 200, s: 30, l: 70 },
        { h: 210, s: 40, l: 80 },
        { h: 190, s: 50, l: 75 },
        { h: 220, s: 35, l: 85 },
        { h: 180, s: 25, l: 90 },
        { h: 230, s: 30, l: 65 },
      ],
      'Toxic': [
        { h: 120, s: 100, l: 45 },
        { h: 80, s: 100, l: 50 },
        { h: 150, s: 80, l: 40 },
        { h: 60, s: 90, l: 55 },
        { h: 100, s: 100, l: 35 },
        { h: 140, s: 70, l: 50 },
      ],
      'Dusk': [
        { h: 270, s: 40, l: 30 },
        { h: 290, s: 50, l: 40 },
        { h: 310, s: 45, l: 45 },
        { h: 330, s: 55, l: 50 },
        { h: 20, s: 60, l: 55 },
        { h: 40, s: 70, l: 60 },
      ],
      'Monochrome': [
        { h: 0, s: 0, l: 20 },
        { h: 0, s: 0, l: 35 },
        { h: 0, s: 0, l: 50 },
        { h: 0, s: 0, l: 65 },
        { h: 0, s: 0, l: 80 },
        { h: 0, s: 0, l: 90 },
      ],
    };

    const paletteNames = Object.keys(palettes);
    let currentPaletteIndex = 0;
    let palette = palettes[paletteNames[0]];
    let styleSheets = [];

    function getColor(index, total) {
      const x = index % 40;
      const y = Math.floor(index / 40);
      const xRatio = x / 40;
      const yRatio = y / 20;
      
      const paletteIndex = Math.floor((xRatio * 0.6 + yRatio * 0.4 + Math.random() * 0.2) * palette.length);
      const base = palette[Math.min(paletteIndex, palette.length - 1)];
      
      const h = base.h + (Math.random() - 0.5) * 20;
      const s = base.s + (Math.random() - 0.5) * 15;
      const l = base.l + (Math.random() - 0.5) * 15;
      
      return `hsl(${h}, ${s}%, ${l}%)`;
    }

    function getSecondColor(index, total) {
      const x = index % 40;
      const y = Math.floor(index / 40);
      const xRatio = x / 40;
      const yRatio = y / 20;
      
      const paletteIndex = Math.floor((xRatio * 0.6 + yRatio * 0.4 + Math.random() * 0.2) * palette.length);
      const nextIndex = Math.min(paletteIndex + 1, palette.length - 1);
      const base = palette[nextIndex];
      
      const h = base.h + (Math.random() - 0.5) * 20;
      const s = base.s + (Math.random() - 0.5) * 15;
      const l = base.l + (Math.random() - 0.5) * 15;
      
      return `hsl(${h}, ${s}%, ${l}%)`;
    }

    function getActiveShapeTypes() {
      const active = [];
      if (toggles.ellipse.checked) active.push('ellipse');
      if (toggles.circle.checked) active.push('circle');
      if (toggles.triangle.checked) active.push('triangle');
      if (toggles.star.checked) active.push('star');
      if (toggles.diamond.checked) active.push('diamond');
      if (toggles.cross.checked) active.push('cross');
      if (toggles.pentagon.checked) active.push('pentagon');
      if (toggles.blob.checked) active.push('blob');
      return active.length > 0 ? active : ['ellipse']; // fallback
    }

    function createKeyframes(id, shapeType) {
      const style = document.createElement('style');
      const duration = 2 + Math.random() * 3;
      let keyframeContent = '';

      if (shapeType === 'ellipse') {
        const startX = 45 + Math.random() * 10;
        const startY = 45 + Math.random() * 10;
        const direction = Math.random();
        let midX, midY;
        
        if (direction < 0.33) {
          midX = 25 + Math.random() * 15;
          midY = 50 + Math.random() * 10;
        } else if (direction < 0.66) {
          midX = 50 + Math.random() * 10;
          midY = 25 + Math.random() * 15;
        } else {
          midX = 25 + Math.random() * 15;
          midY = 50 + Math.random() * 10;
        }

        keyframeContent = `
          @keyframes morph-${id} {
            0%, 100% { clip-path: ellipse(${startX}% ${startY}% at center); }
            50% { clip-path: ellipse(${midX}% ${midY}% at center); }
          }
        `;
      } else if (shapeType === 'circle') {
        const startR = 35 + Math.random() * 15;
        const endR = 25 + Math.random() * 20;
        
        keyframeContent = `
          @keyframes morph-${id} {
            0%, 100% { clip-path: circle(${startR}% at center); }
            50% { clip-path: circle(${endR}% at center); }
          }
        `;
      } else if (shapeType === 'triangle') {
        keyframeContent = `
          @keyframes morph-${id} {
            0%, 100% { clip-path: polygon(50% 0%, 50% 0%, 100% 100%, 100% 100%, 0% 100%, 0% 100%); }
            50% { clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); }
          }
        `;
      } else if (shapeType === 'star') {
        keyframeContent = `
          @keyframes morph-${id} {
            0%, 100% { clip-path: polygon(25% 0%, 75% 0%, 100% 25%, 100% 75%, 75% 100%, 25% 100%, 0% 75%, 0% 25%); }
            50% { clip-path: polygon(50% 0%, 65% 35%, 100% 50%, 65% 65%, 50% 100%, 35% 65%, 0% 50%, 35% 35%); }
          }
        `;
      } else if (shapeType === 'diamond') {
        keyframeContent = `
          @keyframes morph-${id} {
            0%, 100% { clip-path: polygon(50% 0%, 50% 0%, 100% 50%, 100% 50%, 50% 100%, 50% 100%, 0% 50%, 0% 50%); }
            50% { clip-path: polygon(20% 0%, 80% 0%, 100% 20%, 100% 80%, 80% 100%, 20% 100%, 0% 80%, 0% 20%); }
          }
        `;
      } else if (shapeType === 'cross') {
        keyframeContent = `
          @keyframes morph-${id} {
            0%, 100% { clip-path: polygon(35% 0%, 65% 0%, 65% 35%, 100% 35%, 100% 65%, 65% 65%, 65% 100%, 35% 100%, 35% 65%, 0% 65%, 0% 35%, 35% 35%); }
            50% { clip-path: polygon(50% 0%, 79% 10%, 100% 35%, 100% 65%, 79% 90%, 50% 100%, 21% 90%, 0% 65%, 0% 35%, 21% 10%, 50% 0%, 50% 0%); }
          }
        `;
      } else if (shapeType === 'pentagon') {
        keyframeContent = `
          @keyframes morph-${id} {
            0%, 100% { clip-path: polygon(50% 0%, 50% 0%, 100% 38%, 100% 38%, 82% 100%, 82% 100%, 18% 100%, 18% 100%, 0% 38%, 0% 38%); }
            50% { clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
          }
        `;
      } else if (shapeType === 'blob') {
        // Generate random blob control points
        const randomOffset = () => Math.floor(Math.random() * 20 - 10);
        
        const blob1 = [
          `${30 + randomOffset()}% ${randomOffset()}%`,
          `${70 + randomOffset()}% ${randomOffset()}%`,
          `${100 + randomOffset()}% ${30 + randomOffset()}%`,
          `${100 + randomOffset()}% ${70 + randomOffset()}%`,
          `${70 + randomOffset()}% ${100 + randomOffset()}%`,
          `${30 + randomOffset()}% ${100 + randomOffset()}%`,
          `${randomOffset()}% ${70 + randomOffset()}%`,
          `${randomOffset()}% ${30 + randomOffset()}%`,
        ].join(', ');
        
        const blob2 = [
          `${40 + randomOffset()}% ${5 + randomOffset()}%`,
          `${80 + randomOffset()}% ${10 + randomOffset()}%`,
          `${95 + randomOffset()}% ${40 + randomOffset()}%`,
          `${90 + randomOffset()}% ${80 + randomOffset()}%`,
          `${60 + randomOffset()}% ${95 + randomOffset()}%`,
          `${20 + randomOffset()}% ${90 + randomOffset()}%`,
          `${5 + randomOffset()}% ${60 + randomOffset()}%`,
          `${10 + randomOffset()}% ${20 + randomOffset()}%`,
        ].join(', ');
        
        const blob3 = [
          `${50 + randomOffset()}% ${randomOffset()}%`,
          `${85 + randomOffset()}% ${15 + randomOffset()}%`,
          `${100 + randomOffset()}% ${50 + randomOffset()}%`,
          `${85 + randomOffset()}% ${85 + randomOffset()}%`,
          `${50 + randomOffset()}% ${100 + randomOffset()}%`,
          `${15 + randomOffset()}% ${85 + randomOffset()}%`,
          `${randomOffset()}% ${50 + randomOffset()}%`,
          `${15 + randomOffset()}% ${15 + randomOffset()}%`,
        ].join(', ');
        
        const blob4 = [
          `${35 + randomOffset()}% ${10 + randomOffset()}%`,
          `${75 + randomOffset()}% ${5 + randomOffset()}%`,
          `${90 + randomOffset()}% ${35 + randomOffset()}%`,
          `${95 + randomOffset()}% ${75 + randomOffset()}%`,
          `${65 + randomOffset()}% ${90 + randomOffset()}%`,
          `${25 + randomOffset()}% ${95 + randomOffset()}%`,
          `${10 + randomOffset()}% ${65 + randomOffset()}%`,
          `${5 + randomOffset()}% ${25 + randomOffset()}%`,
        ].join(', ');

        keyframeContent = `
          @keyframes morph-${id} {
            0%, 100% { clip-path: polygon(${blob1}); }
            25% { clip-path: polygon(${blob2}); }
            50% { clip-path: polygon(${blob3}); }
            75% { clip-path: polygon(${blob4}); }
          }
        `;
      }

      style.textContent = keyframeContent;
      document.head.appendChild(style);
      styleSheets.push(style);
      
      return duration;
    }

    function generate() {
      // Clear existing
      grid.innerHTML = '';
      styleSheets.forEach(s => s.remove());
      styleSheets = [];

      // Update palette
      const paletteName = paletteNames[currentPaletteIndex];
      palette = palettes[paletteName];
      paletteNameEl.textContent = paletteName;

      const activeShapes = getActiveShapeTypes();
      
      for (let i = 0; i < 800; i++) {
        const shape = document.createElement('div');
        shape.className = 'shape';
        
        // Set colors via custom properties
        const color1 = getColor(i, 800);
        const color2 = getSecondColor(i, 800);
        const angle = Math.floor(Math.random() * 360);
        
        shape.style.setProperty('--c1', color1);
        shape.style.setProperty('--c2', color2);
        shape.style.setProperty('--angle', `${angle}deg`);
        
        // Pick random shape type from active ones
        const shapeType = activeShapes[Math.floor(Math.random() * activeShapes.length)];
        const duration = createKeyframes(i, shapeType);
        
        const delay = Math.random() * 4;
        
        shape.style.animation = `morph-${i} ${duration}s ease-in-out infinite`;
        shape.style.animationDelay = `-${delay}s`;
        
        // Set initial clip-path based on shape type
        if (shapeType === 'circle') {
          shape.style.clipPath = 'circle(40% at center)';
        } else if (shapeType === 'ellipse') {
          shape.style.clipPath = 'ellipse(50% 50% at center)';
        } else {
          shape.style.clipPath = 'polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%)';
        }
        
        grid.appendChild(shape);
      }

      // Move to next palette for next regeneration
      currentPaletteIndex = (currentPaletteIndex + 1) % paletteNames.length;
    }

    regenerateBtn.addEventListener('click', generate);

    // Auto-transition every 20 seconds - Houdini animates the colors
    let autoTransitionInterval;
    
    function transitionColors() {
      // Update palette
      const paletteName = paletteNames[currentPaletteIndex];
      palette = palettes[paletteName];
      paletteNameEl.textContent = paletteName;
      currentPaletteIndex = (currentPaletteIndex + 1) % paletteNames.length;

      // Just update the custom properties - Houdini handles the transition
      const shapes = grid.querySelectorAll('.shape');
      shapes.forEach((shape, i) => {
        const color1 = getColor(i, 800);
        const color2 = getSecondColor(i, 800);
        
        shape.style.setProperty('--c1', color1);
        shape.style.setProperty('--c2', color2);
      });
    }
    
    function startAutoTransition() {
      autoTransitionInterval = setInterval(transitionColors, 20000);
    }

    // Initial generation
    generate();
    startAutoTransition();

    // Reset timer when manually regenerating
    regenerateBtn.addEventListener('click', () => {
      clearInterval(autoTransitionInterval);
      startAutoTransition();
    });

    // Regenerate when toggles change
    Object.values(toggles).forEach(toggle => {
      toggle.addEventListener('change', generate);
    });
  </script>
</body>
</html>
