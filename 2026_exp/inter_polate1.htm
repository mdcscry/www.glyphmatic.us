<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ellipse Field</title>
  <style>
    /* Houdini: register custom properties as animatable colors */
    @property --c1 {
      syntax: '<color>';
      inherits: false;
      initial-value: #000;
    }
    
    @property --c2 {
      syntax: '<color>';
      inherits: false;
      initial-value: #000;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #0a0a0f;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(40, 1fr);
      grid-template-rows: repeat(20, 1fr);
      gap: 2px;
      width: 100vw;
      height: 100vh;
      padding: 1rem;
    }

    .shape {
      width: 100%;
      height: 100%;
      background: linear-gradient(var(--angle), var(--c1), var(--c2));
      transition: --c1 8s ease, --c2 8s ease;
    }

    .regenerate-btn {
      position: fixed;
      bottom: 2rem;
      right: 5rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.7);
      padding: 0.75rem 1.5rem;
      border-radius: 2rem;
      font-family: system-ui, sans-serif;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(10px);
      z-index: 100;
    }

    .regenerate-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .palette-name {
      position: fixed;
      bottom: 2rem;
      left: 2rem;
      color: rgba(255, 255, 255, 0.4);
      font-family: system-ui, sans-serif;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .controls-toggle {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      width: 36px;
      height: 36px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
      z-index: 101;
      transition: all 0.2s ease;
    }

    .controls-toggle:hover { background: rgba(255,255,255,0.1); color: #fff; }

    .controls {
      position: fixed;
      bottom: 5.5rem;
      right: 2rem;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 1.25rem;
      backdrop-filter: blur(10px);
      z-index: 100;
      min-width: 160px;
      display: none;
    }

    .controls.open { display: block; }

    .controls h3 {
      color: rgba(255, 255, 255, 0.6);
      font-family: system-ui, sans-serif;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.75rem;
    }

    .ctrl-btn {
      width: 100%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      color: rgba(255,255,255,0.7);
      font-family: system-ui, sans-serif;
      font-size: 0.8rem;
      padding: 0.5rem;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 0.5rem;
    }

    .ctrl-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
  </style>
</head>
<body>
  <div class="grid" id="grid"></div>
  <button class="regenerate-btn" id="regenerate">Regenerate</button>
  <div class="palette-name" id="palette-name"></div>
  <button class="controls-toggle" id="controls-toggle" title="Palette options">⚙</button>
  <div class="controls" id="controls-panel">
    <h3>Palette</h3>
    <button class="ctrl-btn" id="next-palette-btn">Next Palette</button>
    <button class="ctrl-btn" id="random-palette-btn">Random Gradient</button>
  </div>

  <script>
    const grid = document.getElementById('grid');
    const regenerateBtn = document.getElementById('regenerate');
    const paletteNameEl = document.getElementById('palette-name');

    document.getElementById('controls-toggle').addEventListener('click', () => {
      document.getElementById('controls-panel').classList.toggle('open');
    });

    // ── Random gradient palette generator ───────────────────────────────────
    function generateRandomPalette() {
      const baseHue = Math.random() * 360;
      const scheme = Math.floor(Math.random() * 5);
      const profiles = [
        { sMin: 60, sMax: 90,  lMin: 40, lMax: 60  },
        { sMin: 50, sMax: 80,  lMin: 20, lMax: 45  },
        { sMin: 30, sMax: 60,  lMin: 65, lMax: 85  },
        { sMin: 80, sMax: 100, lMin: 50, lMax: 65  },
      ];
      const prof = profiles[Math.floor(Math.random() * profiles.length)];
      function makeStop(h) {
        return { h: ((h % 360) + 360) % 360,
          s: prof.sMin + Math.random() * (prof.sMax - prof.sMin),
          l: prof.lMin + Math.random() * (prof.lMax - prof.lMin) };
      }
      let hues = [];
      switch (scheme) {
        case 0: for (let i = 0; i < 6; i++) hues.push(baseHue + i*18 + (Math.random()-0.5)*10); break;
        case 1: hues = [baseHue, baseHue+30, baseHue+60, baseHue+180, baseHue+210, baseHue+240]; break;
        case 2: hues = [baseHue, baseHue+30, baseHue+120, baseHue+150, baseHue+240, baseHue+270]; break;
        case 3: hues = [baseHue, baseHue+20, baseHue+90, baseHue+110, baseHue+180, baseHue+270]; break;
        case 4: for (let i = 0; i < 6; i++) hues.push(baseHue + i*55 + (Math.random()-0.5)*20); break;
      }
      return hues.map(makeStop);
    }
    
    // Multiple palettes
    const palettes = {
      'Ocean Sunset': [
        { h: 220, s: 80, l: 45 },
        { h: 200, s: 70, l: 50 },
        { h: 180, s: 60, l: 45 },
        { h: 280, s: 60, l: 50 },
        { h: 320, s: 70, l: 55 },
        { h: 350, s: 75, l: 55 },
      ],
      'Forest': [
        { h: 90, s: 50, l: 30 },
        { h: 120, s: 60, l: 35 },
        { h: 150, s: 50, l: 40 },
        { h: 80, s: 70, l: 45 },
        { h: 45, s: 60, l: 50 },
        { h: 30, s: 50, l: 40 },
      ],
      'Neon Night': [
        { h: 280, s: 100, l: 60 },
        { h: 320, s: 100, l: 55 },
        { h: 180, s: 100, l: 50 },
        { h: 60, s: 100, l: 50 },
        { h: 300, s: 90, l: 65 },
        { h: 200, s: 100, l: 55 },
      ],
      'Ember': [
        { h: 0, s: 80, l: 40 },
        { h: 15, s: 90, l: 50 },
        { h: 30, s: 100, l: 55 },
        { h: 45, s: 100, l: 60 },
        { h: 350, s: 70, l: 35 },
        { h: 20, s: 85, l: 45 },
      ],
      'Arctic': [
        { h: 200, s: 30, l: 70 },
        { h: 210, s: 40, l: 80 },
        { h: 190, s: 50, l: 75 },
        { h: 220, s: 35, l: 85 },
        { h: 180, s: 25, l: 90 },
        { h: 230, s: 30, l: 65 },
      ],
      'Toxic': [
        { h: 120, s: 100, l: 45 },
        { h: 80, s: 100, l: 50 },
        { h: 150, s: 80, l: 40 },
        { h: 60, s: 90, l: 55 },
        { h: 100, s: 100, l: 35 },
        { h: 140, s: 70, l: 50 },
      ],
      'Dusk': [
        { h: 270, s: 40, l: 30 },
        { h: 290, s: 50, l: 40 },
        { h: 310, s: 45, l: 45 },
        { h: 330, s: 55, l: 50 },
        { h: 20, s: 60, l: 55 },
        { h: 40, s: 70, l: 60 },
      ],
      'Monochrome': [
        { h: 0, s: 0, l: 20 },
        { h: 0, s: 0, l: 35 },
        { h: 0, s: 0, l: 50 },
        { h: 0, s: 0, l: 65 },
        { h: 0, s: 0, l: 80 },
        { h: 0, s: 0, l: 90 },
      ],
    };

    const paletteNames = Object.keys(palettes);
    let currentPaletteIndex = 0;
    let palette = palettes[paletteNames[0]];
    let styleSheets = [];

    function getNextPalette() {
      if (Math.random() < 0.5) {
        const name = paletteNames[currentPaletteIndex % paletteNames.length];
        currentPaletteIndex++;
        return { name, colors: palettes[name] };
      }
      return { name: 'Random', colors: generateRandomPalette() };
    }

    document.getElementById('next-palette-btn').addEventListener('click', () => {
      const next = { name: paletteNames[currentPaletteIndex % paletteNames.length], colors: palettes[paletteNames[currentPaletteIndex % paletteNames.length]] };
      currentPaletteIndex++;
      palette = next.colors;
      paletteNameEl.textContent = next.name;
      applyTransition();
    });

    document.getElementById('random-palette-btn').addEventListener('click', () => {
      palette = generateRandomPalette();
      paletteNameEl.textContent = 'Random';
      applyTransition();
    });

    function applyTransition() {
      const shapes = grid.querySelectorAll('.shape');
      shapes.forEach((shape, i) => {
        shape.style.setProperty('--c1', getColor(i, 800));
        shape.style.setProperty('--c2', getSecondColor(i, 800));
      });
    }

    function getColor(index, total) {
      const x = index % 40;
      const y = Math.floor(index / 40);
      const xRatio = x / 40;
      const yRatio = y / 20;
      
      const paletteIndex = Math.floor((xRatio * 0.6 + yRatio * 0.4 + Math.random() * 0.2) * palette.length);
      const base = palette[Math.min(paletteIndex, palette.length - 1)];
      
      const h = base.h + (Math.random() - 0.5) * 20;
      const s = base.s + (Math.random() - 0.5) * 15;
      const l = base.l + (Math.random() - 0.5) * 15;
      
      return `hsl(${h}, ${s}%, ${l}%)`;
    }

    function getSecondColor(index, total) {
      const x = index % 40;
      const y = Math.floor(index / 40);
      const xRatio = x / 40;
      const yRatio = y / 20;
      
      const paletteIndex = Math.floor((xRatio * 0.6 + yRatio * 0.4 + Math.random() * 0.2) * palette.length);
      const nextIndex = Math.min(paletteIndex + 1, palette.length - 1);
      const base = palette[nextIndex];
      
      const h = base.h + (Math.random() - 0.5) * 20;
      const s = base.s + (Math.random() - 0.5) * 15;
      const l = base.l + (Math.random() - 0.5) * 15;
      
      return `hsl(${h}, ${s}%, ${l}%)`;
    }

    function createKeyframes(id, direction) {
      const style = document.createElement('style');
      
      const startX = 45 + Math.random() * 10;
      const startY = 45 + Math.random() * 10;
      
      let midX, midY, endX, endY;
      
      if (direction === 'horizontal') {
        midX = 25 + Math.random() * 15;
        midY = 50 + Math.random() * 10;
      } else if (direction === 'vertical') {
        midX = 50 + Math.random() * 10;
        midY = 25 + Math.random() * 15;
      } else {
        midX = 25 + Math.random() * 15;
        midY = 50 + Math.random() * 10;
      }

      style.textContent = `
        @keyframes morph-${id} {
          0%, 100% {
            clip-path: ellipse(${startX}% ${startY}% at center);
          }
          50% {
            clip-path: ellipse(${midX}% ${midY}% at center);
          }
        }
      `;
      document.head.appendChild(style);
      styleSheets.push(style);
    }

    function generate() {
      // Clear existing
      grid.innerHTML = '';
      styleSheets.forEach(s => s.remove());
      styleSheets = [];

      // Update palette
      const next = getNextPalette();
      palette = next.colors;
      paletteNameEl.textContent = next.name;

      const directions = ['horizontal', 'vertical', 'both'];
      
      for (let i = 0; i < 800; i++) {
        const shape = document.createElement('div');
        shape.className = 'shape';
        
        // Set colors via custom properties
        const color1 = getColor(i, 800);
        const color2 = getSecondColor(i, 800);
        const angle = Math.floor(Math.random() * 360);
        
        shape.style.setProperty('--c1', color1);
        shape.style.setProperty('--c2', color2);
        shape.style.setProperty('--angle', `${angle}deg`);
        
        const direction = directions[Math.floor(Math.random() * 3)];
        createKeyframes(i, direction);
        
        const duration = 2 + Math.random() * 3;
        const delay = Math.random() * 4;
        
        shape.style.animation = `morph-${i} ${duration}s ease-in-out infinite`;
        shape.style.animationDelay = `-${delay}s`;
        shape.style.clipPath = 'ellipse(50% 50% at center)';
        
        grid.appendChild(shape);
      }

    }

    regenerateBtn.addEventListener('click', generate);

    // Auto-transition every 20 seconds - Houdini animates the colors
    let autoTransitionInterval;
    
    function transitionColors() {
      const next = getNextPalette();
      palette = next.colors;
      paletteNameEl.textContent = next.name;

      const shapes = grid.querySelectorAll('.shape');
      shapes.forEach((shape, i) => {
        const color1 = getColor(i, 800);
        const color2 = getSecondColor(i, 800);
        
        shape.style.setProperty('--c1', color1);
        shape.style.setProperty('--c2', color2);
      });
    }
    
    function startAutoTransition() {
      autoTransitionInterval = setInterval(transitionColors, 20000);
    }

    // Initial generation
    generate();
    startAutoTransition();

    // Reset timer when manually regenerating
    regenerateBtn.addEventListener('click', () => {
      clearInterval(autoTransitionInterval);
      startAutoTransition();
    });
  </script>
</body>
</html>
