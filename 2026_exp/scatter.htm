<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16 Random 3D Scatterplots</title>
    <script>
        // Patch canvas getContext to add willReadFrequently for performance
        (function() {
            const originalGetContext = HTMLCanvasElement.prototype.getContext;
            HTMLCanvasElement.prototype.getContext = function(type, attributes) {
                if (type === '2d') {
                    attributes = attributes || {};
                    attributes.willReadFrequently = true;
                }
                return originalGetContext.call(this, type, attributes);
            };
        })();
    </script>
    <script src="https://cdn.plot.ly/plotly-3.3.1.min.js" charset="utf-8"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            min-height: 100vh;
            padding: 10px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 5px;
            height: calc(100vh - 20px);
            width: 100%;
        }
        .plot {
            background: #111;
            border-radius: 8px;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div class="grid" id="grid"></div>

    <script>
        const NUM_FRAMES = 60;

        function randomColor() {
            const palettes = [
                ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#54a0ff'],
                ['#00d2d3', '#ff9f43', '#ee5a24', '#9c88ff', '#badc58'],
                ['#e056fd', '#686de0', '#30336b', '#f8a5c2', '#63cdda'],
                ['#25CCF7', '#FD7272', '#54a0ff', '#00d2d3', '#1B9CFC'],
                ['#F8EFBA', '#f6e58d', '#ffbe76', '#ff7979', '#badc58'],
                ['#4834d4', '#be2edd', '#22a6b3', '#6ab04c', '#eb4d4b'],
                ['#7bed9f', '#70a1ff', '#5352ed', '#ff4757', '#ffa502'],
                ['#2ed573', '#1e90ff', '#3742fa', '#ff6348', '#eccc68']
            ];
            return palettes[Math.floor(Math.random() * palettes.length)];
        }

        function generateBaseData() {
            const n = Math.floor(Math.random() * 150) + 50;
            const points = [];
            const palette = randomColor();
            const pattern = Math.floor(Math.random() * 5);

            for (let i = 0; i < n; i++) {
                let px, py, pz;

                switch(pattern) {
                    case 0: // Random cloud
                        px = Math.random() * 10 - 5;
                        py = Math.random() * 10 - 5;
                        pz = Math.random() * 10 - 5;
                        break;
                    case 1: // Spiral
                        const t = i / n * 4 * Math.PI;
                        px = Math.cos(t) * (1 + t/3);
                        py = Math.sin(t) * (1 + t/3);
                        pz = t;
                        break;
                    case 2: // Sphere-ish
                        const phi = Math.random() * Math.PI * 2;
                        const theta = Math.random() * Math.PI;
                        const r = 3;
                        px = r * Math.sin(theta) * Math.cos(phi);
                        py = r * Math.sin(theta) * Math.sin(phi);
                        pz = r * Math.cos(theta);
                        break;
                    case 3: // Clusters
                        const cx = (Math.floor(Math.random() * 3) - 1) * 4;
                        const cy = (Math.floor(Math.random() * 3) - 1) * 4;
                        const cz = (Math.floor(Math.random() * 3) - 1) * 4;
                        px = cx + (Math.random() - 0.5) * 2;
                        py = cy + (Math.random() - 0.5) * 2;
                        pz = cz + (Math.random() - 0.5) * 2;
                        break;
                    case 4: // Wave
                        px = (i / n) * 10 - 5;
                        py = Math.sin(i / n * Math.PI * 4) * 3;
                        pz = Math.cos(i / n * Math.PI * 4) * 3;
                        break;
                }

                points.push({
                    x: px,
                    y: py,
                    z: pz,
                    color: palette[Math.floor(Math.random() * palette.length)]
                });
            }

            return { points, palette };
        }

        function rotatePoint(point, angleY, angleZ) {
            // Rotate around Y axis
            let x1 = point.x * Math.cos(angleY) - point.z * Math.sin(angleY);
            let z1 = point.x * Math.sin(angleY) + point.z * Math.cos(angleY);
            let y1 = point.y;

            // Rotate around Z axis
            let x2 = x1 * Math.cos(angleZ) - y1 * Math.sin(angleZ);
            let y2 = x1 * Math.sin(angleZ) + y1 * Math.cos(angleZ);
            let z2 = z1;

            return { x: x2, y: y2, z: z2, color: point.color };
        }

        function generateFrames(baseData) {
            const frames = [];

            for (let f = 0; f < NUM_FRAMES; f++) {
                const progress = f / NUM_FRAMES;
                const angleY = progress * Math.PI * 2;
                const angleZ = progress * Math.PI;

                const rotated = baseData.points.map(p => rotatePoint(p, angleY, angleZ));

                frames.push(rotated);
            }

            return frames;
        }

        function createPlot(containerId) {
            const baseData = generateBaseData();
            const frames = generateFrames(baseData);
            const markerSize = Math.random() * 4 + 2;
            const markerOpacity = Math.random() * 0.4 + 0.6;

            const trace = {
                x: frames[0].map(p => p.x),
                y: frames[0].map(p => p.y),
                z: frames[0].map(p => p.z),
                mode: 'markers',
                type: 'scatter3d',
                marker: {
                    size: markerSize,
                    color: frames[0].map(p => p.color),
                    opacity: markerOpacity
                },
                hoverinfo: 'none'
            };

            const layout = {
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)',
                margin: { l: 0, r: 0, t: 0, b: 0 },
                showlegend: false,
                scene: {
                    xaxis: { visible: false, showgrid: false, zeroline: false, showticklabels: false },
                    yaxis: { visible: false, showgrid: false, zeroline: false, showticklabels: false },
                    zaxis: { visible: false, showgrid: false, zeroline: false, showticklabels: false },
                    bgcolor: 'rgba(0,0,0,0)',
                    camera: {
                        eye: {
                            x: (Math.random() - 0.5) * 3,
                            y: (Math.random() - 0.5) * 3,
                            z: (Math.random() - 0.5) * 3 + 1.5
                        }
                    }
                }
            };

            const config = {
                displayModeBar: false,
                responsive: true
            };

            Plotly.newPlot(containerId, [trace], layout, config).then(() => {
                let currentFrame = 0;
                let direction = 1;

                setInterval(() => {
                    const frameData = frames[currentFrame];

                    const updatedTrace = {
                        x: [frameData.map(p => p.x)],
                        y: [frameData.map(p => p.y)],
                        z: [frameData.map(p => p.z)]
                    };

                    Plotly.restyle(containerId, updatedTrace, [0]);

                    currentFrame += direction;

                    if (currentFrame >= NUM_FRAMES - 1) {
                        direction = -1;
                    } else if (currentFrame <= 0) {
                        direction = 1;
                    }
                }, 50);
            });
        }

        // Create grid
        const grid = document.getElementById('grid');
        for (let i = 0; i < 16; i++) {
            const div = document.createElement('div');
            div.className = 'plot';
            div.id = `plot${i}`;
            grid.appendChild(div);
        }

        // Create plots
        for (let i = 0; i < 16; i++) {
            createPlot(`plot${i}`);
        }
    </script>
</body>
</html>
