<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist Palette Field</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background: #000;
            transition: background-color 3s ease;
        }

        /* ── Flavor 0: 100×100 grid ── */
        #grid.flavor-0 {
            display: grid;
            grid-template-columns: repeat(100, 1fr);
            grid-template-rows: repeat(100, 1fr);
            width: 100vw;
            height: 100vh;
            gap: 0;
        }

        /* ── Flavor 1: vertical stripes ── */
        #grid.flavor-1 {
            display: flex;
            flex-direction: row;
            width: 100vw;
            height: 100vh;
        }
        #grid.flavor-1 .c {
            width: 2px;
            flex-shrink: 0;
            height: 100%;
        }

        /* ── Flavor 2: horizontal stripes ── */
        #grid.flavor-2 {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
        }
        #grid.flavor-2 .c {
            height: 2px;
            flex-shrink: 0;
            width: 100%;
        }

        /* ── Flavor 3: prime crosshatch ── */
        #grid.flavor-3 {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #grid.flavor-3 .lv {
            position: absolute;
            top: 0;
            height: 100%;
            width: 1px;
        }
        #grid.flavor-3 .lh {
            position: absolute;
            left: 0;
            width: 100%;
            height: 1px;
        }

        /* ── Flavor 4 & 5: perfect-square crosshatch ── */
        #grid.flavor-4, #grid.flavor-5 {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #grid.flavor-4 .lv, #grid.flavor-5 .lv {
            position: absolute;
            top: 0;
            height: 100%;
            width: 1px;
        }
        #grid.flavor-4 .lh, #grid.flavor-5 .lh {
            position: absolute;
            left: 0;
            width: 100%;
            height: 1px;
        }
        #grid.flavor-5 .ld {
            position: absolute;
            width: 1px;
            height: 200vmax;
            transform-origin: center center;
        }

        /* ── Transitions ── */
        .t1 { transition: background-color 6s ease; }
        .t2 { transition: background-color 9s ease; }
        .t3 { transition: background-color 12s ease; }
        .t4 { transition: background-color 15s ease; }
        .t5 { transition: background-color 18s ease; }

        /* ── Info panel ── */
        #info {
            position: fixed;
            bottom: 16px;
            left: 16px;
            background: rgba(0,0,0,0.65);
            color: #fff;
            border-radius: 6px;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            font-size: 13px;
            cursor: pointer;
            z-index: 9999;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            overflow: hidden;
            transition: max-width 0.35s ease, max-height 0.35s ease, padding 0.25s ease;
            max-width: 36px;
            max-height: 36px;
            padding: 8px 11px;
            white-space: nowrap;
            user-select: none;
        }
        #info.open {
            max-width: 380px;
            max-height: 220px;
            padding: 14px 18px;
            white-space: normal;
        }
        #info .icon {
            font-size: 15px;
            font-weight: 600;
            line-height: 20px;
            opacity: 0.8;
        }
        #info.open .icon { display: none; }
        #info .details { display: none; }
        #info.open .details { display: block; }
        .info-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            opacity: 0.5;
            margin-top: 6px;
        }
        .info-label:first-child { margin-top: 0; }
        .info-value {
            font-size: 13px;
            line-height: 1.3;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>
    <div id="grid"></div>

    <div id="info" onclick="this.classList.toggle('open')">
        <span class="icon">i</span>
        <div class="details">
            <div class="info-label">Artist</div>
            <div class="info-value" id="info-artist">&mdash;</div>
            <div class="info-label">School</div>
            <div class="info-value" id="info-school">&mdash;</div>
            <div class="info-label">Painting</div>
            <div class="info-value" id="info-ref">&mdash;</div>
            <div class="info-label">Mode</div>
            <div class="info-value" id="info-mode">&mdash;</div>
        </div>
    </div>

    <script>window.ARTIST_PALETTES = {};</script>
    <script src="../js_funct/artist_palettes/impressionism.js"></script>
    <script src="../js_funct/artist_palettes/expressionism_fauvism.js"></script>
    <script src="../js_funct/artist_palettes/cubism_bauhaus.js"></script>
    <script src="../js_funct/artist_palettes/surrealism.js"></script>
    <script src="../js_funct/artist_palettes/abstract_expressionism.js"></script>
    <script src="../js_funct/artist_palettes/pop_minimal.js"></script>
    <script src="../js_funct/artist_palettes/old_masters.js"></script>
    <script src="../js_funct/artist_palettes/americas.js"></script>
    <script src="../js_funct/artist_palettes/contemporary.js"></script>
    <script src="../js_funct/artist_palettes/_loaded.js"></script>

    <script>
    (function() {
        'use strict';

        var FLAVORS = [
            { name: 'Grid 100\u00d7100',  batch: 80, tick: 400 },
            { name: 'Vertical Stripes',   batch: 40, tick: 350 },
            { name: 'Horizontal Stripes', batch: 30, tick: 350 },
            { name: 'Prime Crosshatch',   batch: 30, tick: 400 },
            { name: 'Squares Mirrored',   batch: 25, tick: 400 },
            { name: 'Squares + Diagonals', batch: 30, tick: 400 }
        ];

        var T_CLASSES = ['t1','t2','t3','t4','t5'];

        var cells = [];
        var total = 0;
        var palette = null;
        var flavor = 0;
        var morphTimer = null;

        /* ── helpers ── */

        function weightedColor(colors, pcts) {
            var sum = 0, i;
            for (i = 0; i < pcts.length; i++) sum += (pcts[i] || 0);
            var r = Math.random() * sum, acc = 0;
            for (i = 0; i < colors.length; i++) {
                acc += (pcts[i] || 0);
                if (r <= acc) return colors[i];
            }
            return colors[colors.length - 1];
        }

        function pickPalette() {
            var keys = Object.keys(window.ARTIST_PALETTES);
            var key = keys[Math.floor(Math.random() * keys.length)];
            palette = window.ARTIST_PALETTES[key];
        }

        function getFlavorFromURL() {
            var p = new URLSearchParams(window.location.search);
            var f = p.get('flavor');
            if (f !== null) {
                var n = parseInt(f);
                if (!isNaN(n) && n >= 0 && n < FLAVORS.length) return n;
            }
            return null;
        }

        /* ── number-theory sequences ── */

        function getSquares(max) {
            var out = [], i = 1;
            while (i * i <= max) { out.push(i * i); i++; }
            return out;
        }

        function getPrimes(max) {
            var sieve = new Array(max + 1).fill(true);
            sieve[0] = sieve[1] = false;
            for (var i = 2; i * i <= max; i++) {
                if (sieve[i]) {
                    for (var j = i * i; j <= max; j += i) sieve[j] = false;
                }
            }
            var out = [];
            for (var i = 2; i <= max; i++) { if (sieve[i]) out.push(i); }
            return out;
        }

        /* ── grid build ── */

        function cellCount() {
            if (flavor === 0) return 100 * 100;
            if (flavor === 1) return Math.ceil(window.innerWidth / 2);
            if (flavor === 2) return Math.ceil(window.innerHeight / 2);
            return 0; // flavor 3 is dynamic
        }

        function buildPrimeCrosshatch(grid) {
            var w = window.innerWidth, h = window.innerHeight;
            var maxVal = Math.max(w, h) * 2;
            var primes = getPrimes(maxVal);
            var frag = document.createDocumentFragment();

            // vertical lines at prime-scaled x
            primes.forEach(function(p) {
                var x = (p / maxVal) * w;
                if (x < w) {
                    var d = document.createElement('div');
                    d.className = 'lv ' + T_CLASSES[Math.floor(Math.random() * T_CLASSES.length)];
                    d.style.left = x + 'px';
                    frag.appendChild(d);
                    cells.push(d);
                }
            });

            // horizontal lines at prime-scaled y
            primes.forEach(function(p) {
                var y = (p / maxVal) * h;
                if (y < h) {
                    var d = document.createElement('div');
                    d.className = 'lh ' + T_CLASSES[Math.floor(Math.random() * T_CLASSES.length)];
                    d.style.top = y + 'px';
                    frag.appendChild(d);
                    cells.push(d);
                }
            });

            grid.appendChild(frag);
            total = cells.length;
        }

        function buildSquaresCrosshatch(grid, withDiagonals) {
            var w = window.innerWidth, h = window.innerHeight;
            var maxVal = Math.max(w, h) * 3;
            var squares = getSquares(maxVal);
            var frag = document.createDocumentFragment();

            function mkLine(cls, prop, val) {
                var d = document.createElement('div');
                d.className = cls + ' ' + T_CLASSES[Math.floor(Math.random() * T_CLASSES.length)];
                d.style[prop] = val + 'px';
                frag.appendChild(d);
                cells.push(d);
            }

            // vertical from left + mirrored from right
            squares.forEach(function(s) {
                var x = (s / maxVal) * w;
                if (x < w) mkLine('lv', 'left', x);
                var xm = w - x;
                if (xm > 0) mkLine('lv', 'left', xm);
            });

            // horizontal from top + mirrored from bottom
            squares.forEach(function(s) {
                var y = (s / maxVal) * h;
                if (y < h) mkLine('lh', 'top', y);
                var ym = h - y;
                if (ym > 0) mkLine('lh', 'top', ym);
            });

            if (withDiagonals) {
                var diag = w + h;

                // 45° from top-left + mirrored
                squares.forEach(function(s) {
                    var off = (s / maxVal) * diag;
                    if (off < diag) {
                        var d = document.createElement('div');
                        d.className = 'ld ' + T_CLASSES[Math.floor(Math.random() * T_CLASSES.length)];
                        d.style.left = (off - h) + 'px';
                        d.style.top = '0px';
                        d.style.transform = 'rotate(45deg)';
                        frag.appendChild(d);
                        cells.push(d);
                    }
                    var offM = diag - off;
                    if (offM > 0) {
                        var d2 = document.createElement('div');
                        d2.className = 'ld ' + T_CLASSES[Math.floor(Math.random() * T_CLASSES.length)];
                        d2.style.left = (offM - h) + 'px';
                        d2.style.top = '0px';
                        d2.style.transform = 'rotate(45deg)';
                        frag.appendChild(d2);
                        cells.push(d2);
                    }
                });

                // -45° from top-right + mirrored
                squares.forEach(function(s) {
                    var off = (s / maxVal) * diag;
                    if (off < diag) {
                        var d = document.createElement('div');
                        d.className = 'ld ' + T_CLASSES[Math.floor(Math.random() * T_CLASSES.length)];
                        d.style.left = (w - off + h) + 'px';
                        d.style.top = '0px';
                        d.style.transform = 'rotate(-45deg)';
                        frag.appendChild(d);
                        cells.push(d);
                    }
                    var offM = diag - off;
                    if (offM > 0) {
                        var d2 = document.createElement('div');
                        d2.className = 'ld ' + T_CLASSES[Math.floor(Math.random() * T_CLASSES.length)];
                        d2.style.left = (w - offM + h) + 'px';
                        d2.style.top = '0px';
                        d2.style.transform = 'rotate(-45deg)';
                        frag.appendChild(d2);
                        cells.push(d2);
                    }
                });
            }

            grid.appendChild(frag);
            total = cells.length;
        }

        function buildGrid() {
            var grid = document.getElementById('grid');
            grid.innerHTML = '';
            grid.className = 'flavor-' + flavor;
            cells = [];

            if (flavor === 3) { buildPrimeCrosshatch(grid); return; }
            if (flavor === 4) { buildSquaresCrosshatch(grid, false); return; }
            if (flavor === 5) { buildSquaresCrosshatch(grid, true); return; }

            total = cellCount();
            var frag = document.createDocumentFragment();
            for (var i = 0; i < total; i++) {
                var d = document.createElement('div');
                d.className = 'c ' + T_CLASSES[Math.floor(Math.random() * T_CLASSES.length)];
                frag.appendChild(d);
                cells.push(d);
            }
            grid.appendChild(frag);
        }

        function fillGrid() {
            var colors = palette.colors;
            var pcts = palette.pcts;
            var a = [];

            for (var i = 0; i < colors.length; i++) a.push(colors[i]);
            while (a.length < total) a.push(weightedColor(colors, pcts));

            // Fisher-Yates
            for (var i = a.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var t = a[i]; a[i] = a[j]; a[j] = t;
            }

            for (var i = 0; i < total; i++) {
                cells[i].style.backgroundColor = a[i];
            }
        }

        /* ── info panel ── */

        function updateInfo() {
            document.getElementById('info-artist').textContent = palette.artist || '\u2014';
            document.getElementById('info-school').textContent = palette.school || '\u2014';
            document.getElementById('info-ref').textContent    = palette.ref    || '\u2014';
            document.getElementById('info-mode').textContent   = FLAVORS[flavor].name;

            document.body.style.backgroundColor = palette.bg || '#000';

            var bg = palette.bg || '#000000';
            var r = parseInt(bg.slice(1,3),16),
                g = parseInt(bg.slice(3,5),16),
                b = parseInt(bg.slice(5,7),16);
            var lum = (r*299 + g*587 + b*114) / 1000;
            var panel = document.getElementById('info');
            if (lum > 140) {
                panel.style.background = 'rgba(0,0,0,0.6)';
                panel.style.color = '#fff';
            } else {
                panel.style.background = 'rgba(255,255,255,0.12)';
                panel.style.color = '#fff';
            }
        }

        /* ── morph loop ── */

        function startMorph() {
            if (morphTimer) clearInterval(morphTimer);
            var cfg = FLAVORS[flavor];
            morphTimer = setInterval(function() {
                var colors = palette.colors, pcts = palette.pcts;
                for (var n = 0; n < cfg.batch; n++) {
                    var idx = Math.floor(Math.random() * total);
                    cells[idx].style.backgroundColor = weightedColor(colors, pcts);
                }
            }, cfg.tick);
        }

        /* ── flavor switching ── */

        function switchFlavor(f) {
            flavor = f;
            buildGrid();
            fillGrid();
            updateInfo();
            startMorph();
        }

        /* ── keyboard ── */

        document.addEventListener('keydown', function(e) {
            if (e.key === '0') switchFlavor(0);
            else if (e.key === '1') switchFlavor(1);
            else if (e.key === '2') switchFlavor(2);
            else if (e.key === '3') switchFlavor(3);
            else if (e.key === '4') switchFlavor(4);
            else if (e.key === '5') switchFlavor(5);
            else if (e.key === 'Enter') {
                pickPalette();
                fillGrid();
                updateInfo();
            }
        });

        /* ── init ── */

        function init() {
            var urlFlavor = getFlavorFromURL();
            flavor = urlFlavor !== null ? urlFlavor : Math.floor(Math.random() * FLAVORS.length);
            pickPalette();
            buildGrid();
            fillGrid();
            updateInfo();
            startMorph();
        }

        (function wait() {
            if (typeof window.ARTIST_PALETTES_LOADED !== 'undefined') init();
            else setTimeout(wait, 100);
        })();
    })();
    </script>
</body>
</html>
