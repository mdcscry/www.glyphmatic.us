<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delaunay Glyphs</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #07060e; overflow: hidden; }
  svg { display: block; position: fixed; inset: 0; }
  #ui {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    z-index: 10; display: flex; gap: 12px;
  }
  button {
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; font-family: monospace; font-size: 11px; letter-spacing: 0.15em;
    text-transform: uppercase; padding: 8px 24px; cursor: pointer; transition: background 0.2s;
  }
  button:hover { background: rgba(255,255,255,0.14); }
</style>
</head>
<body>
<svg id="viz"></svg>
<div id="ui">
  <button onclick="regenerate()">&#x21BA; Regenerate</button>
  <button onclick="newColors()">&#x21BA; Colors Only</button>
</div>
<script>
const GRID = 5;
const GAP  = 3;

const GLYPHS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ\u00C0\u00C1\u00C2\u00C3\u00C4\u00C5\u00C6\u00C7\u00C8\u00C9\u00CA\u00CB\u00CC\u00CD\u00CE\u00CF\u00D0\u00D1\u00D2\u00D3\u00D4\u00D5\u00D6\u00D8\u00D9\u00DA\u00DB\u00DC\u00DD\u00DE\u0100\u0102\u0104\u0106\u0108\u010A\u010C\u010E\u0110\u0112\u0114\u0116\u0118\u011A\u011C\u011E\u0120\u0122\u0124\u0126';

/* ── Palettes ── */
const PALETTE_MODES = [
  () => { const b=Math.random()*360; return { edge: d3.hsl((b+180)%360,0.85,0.62).toString(), node: d3.hsl(b,0.95,0.70).toString(), bg: d3.hsl(b,0.4,0.06).toString() }; },
  () => { const b=Math.random()*360; return { edge: d3.hsl(b,0.88,0.60).toString(), node: '#ffffff', bg: '#07060e' }; },
  () => { const b=Math.random()*360; return { edge: d3.hsl(b,0.9,0.65).toString(), node: d3.hsl(b,0.9,0.85).toString(), bg: d3.hsl(b,0.5,0.07).toString() }; },
  () => { const b=Math.random()*360; return { edge: d3.hsl((b+60)%360,0.85,0.62).toString(), node: d3.hsl((b+120)%360,0.95,0.68).toString(), bg: '#07060e' }; },
];
function randomScheme() { return PALETTE_MODES[Math.floor(Math.random()*PALETTE_MODES.length)](); }
let scheme = randomScheme();

/* ── Point distributions ── */
function randomPoints(n, ox, oy, cellW, cellH) {
  const mode = Math.floor(Math.random()*5);
  const pad = Math.min(cellW,cellH)*0.06;
  const w=cellW-pad*2, h=cellH-pad*2;
  const pts=[];
  if (mode===0) {
    for(let i=0;i<n;i++) pts.push([ox+pad+Math.random()*w, oy+pad+Math.random()*h]);
  } else if (mode===1) {
    const nc=2+Math.floor(Math.random()*3);
    const centers=Array.from({length:nc},()=>[ox+pad+Math.random()*w,oy+pad+Math.random()*h]);
    for(let i=0;i<n;i++){const c=centers[Math.floor(Math.random()*nc)];pts.push([Math.max(ox+pad,Math.min(ox+cellW-pad,c[0]+(Math.random()-0.5)*w*0.25)),Math.max(oy+pad,Math.min(oy+cellH-pad,c[1]+(Math.random()-0.5)*h*0.25))]);}
  } else if (mode===2) {
    for(let i=0;i<n;i++){const a=(i/n)*Math.PI*2+(Math.random()-0.5)*0.3,r=Math.min(w,h)*0.35+(Math.random()-0.5)*Math.min(w,h)*0.08;pts.push([ox+cellW/2+Math.cos(a)*r,oy+cellH/2+Math.sin(a)*r]);}
  } else if (mode===3) {
    const cols=Math.ceil(Math.sqrt(n*cellW/cellH)),rows=Math.ceil(n/cols);
    for(let r=0;r<rows&&pts.length<n;r++)for(let c=0;c<cols&&pts.length<n;c++)pts.push([ox+pad+(c+0.5+(Math.random()-0.5)*0.6)*w/cols,oy+pad+(r+0.5+(Math.random()-0.5)*0.6)*h/rows]);
  } else {
    for(let i=0;i<n;i++){const t=(Math.random()+Math.random())*0.5;pts.push([ox+pad+t*w+(Math.random()-0.5)*w*0.2,oy+pad+t*h+(Math.random()-0.5)*h*0.2]);}
  }
  return pts;
}

let datasets=[];
function generateDatasets(){
  datasets=Array.from({length:GRID*GRID},()=>({n:12+Math.floor(Math.random()*28)}));
}

/* ── Draw ── */
function drawAll() {
  const W=window.innerWidth, H=window.innerHeight;
  const cellW=(W-GAP*(GRID+1))/GRID;
  const cellH=(H-GAP*(GRID+1))/GRID;

  const svg=d3.select('#viz').attr('width',W).attr('height',H);
  svg.selectAll('*').remove();
  svg.append('rect').attr('width',W).attr('height',H).attr('fill','#07060e');

  /* ── Delaunay cells ── */
  datasets.forEach((ds,idx) => {
    const row=Math.floor(idx/GRID), col=idx%GRID;
    const ox=GAP+col*(cellW+GAP);
    const oy=GAP+row*(cellH+GAP);

    const clipId='dclip-'+idx;
    svg.append('defs').append('clipPath').attr('id',clipId)
      .append('rect').attr('x',ox).attr('y',oy).attr('width',cellW).attr('height',cellH);

    svg.append('rect').attr('x',ox).attr('y',oy)
      .attr('width',cellW).attr('height',cellH)
      .attr('fill', scheme.bg).attr('opacity',0.4);

    const g=svg.append('g').attr('clip-path','url(#'+clipId+')').attr('opacity',0);

    const pts=randomPoints(ds.n, ox, oy, cellW, cellH);
    const delaunay=d3.Delaunay.from(pts);
    const {triangles}=delaunay;
    const seen=new Set();
    for(let i=0;i<triangles.length;i+=3){
      const a=triangles[i],b=triangles[i+1],c=triangles[i+2];
      [[a,b],[b,c],[a,c]].forEach(([p,q])=>{
        const key=Math.min(p,q)+'-'+Math.max(p,q);
        if(seen.has(key))return; seen.add(key);
        g.append('line')
          .attr('x1',pts[p][0]).attr('y1',pts[p][1])
          .attr('x2',pts[q][0]).attr('y2',pts[q][1])
          .attr('stroke',scheme.edge).attr('stroke-width',0.7).attr('opacity',0.6);
      });
    }
    pts.forEach(pt=>{
      g.append('circle').attr('cx',pt[0]).attr('cy',pt[1])
        .attr('r',2.5).attr('fill',scheme.node).attr('opacity',0.9);
    });

    g.transition().duration(500).delay(idx*28).attr('opacity',1);
  });

  /* ── Glyph grid on top of everything ── */
  const fontSize = 10;
  const colW = fontSize * 0.62;
  const rowH = fontSize * 1.1;
  const gcols = Math.ceil(W/colW)+1;
  const grows = Math.ceil(H/rowH)+1;
  const glyphG = svg.append('g');
  for (let r=0; r<grows; r++) {
    for (let c=0; c<gcols; c++) {
      glyphG.append('text')
        .attr('x', c*colW)
        .attr('y', r*rowH + fontSize)
        .attr('font-family','monospace')
        .attr('font-size', fontSize)
        .attr('fill', scheme.node)
        .attr('opacity', 0.55)
        .text(GLYPHS[Math.floor(Math.random()*GLYPHS.length)]);
    }
  }
}

function regenerate(){ scheme=randomScheme(); generateDatasets(); drawAll(); }
function newColors() { scheme=randomScheme(); drawAll(); }

generateDatasets();
drawAll();
window.addEventListener('resize', drawAll);
</script>
</body>
</html>
