<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Curves</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #07060e; overflow: hidden; }
  svg { display: block; position: fixed; inset: 0; }
  #ui {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    z-index: 10; display: flex; gap: 12px;
  }
  button {
    background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; font-family: monospace; font-size: 11px; letter-spacing: 0.15em;
    text-transform: uppercase; padding: 8px 24px; cursor: pointer; transition: background 0.2s;
  }
  button:hover { background: rgba(0,0,0,0.7); }
</style>
</head>
<body>
<svg id="viz"></svg>
<div id="ui">
  <button onclick="regenerate()">↺ Regenerate</button>
  <button onclick="newColors()">↺ Colors Only</button>
</div>
<script>
const GRID = 3;
const GAP  = 2;

/* ── Palettes ── */
const PALETTE_MODES = [
  () => { const b=Math.random()*360; return d3.hsl((b)%360,1,0.62).toString(); },
  () => d3.hsl(Math.random()*360,0.9,0.65).toString(),
  () => d3.hsl(200+Math.random()*160,0.95,0.60).toString(),
];
// Each cell gets ONE accent color; bg is very dark version
function randomColor() {
  const h = Math.random()*360;
  return d3.hsl(h, 0.95, 0.62).toString();
}
function randomPalette() {
  return Array.from({length: GRID*GRID}, randomColor);
}

/* ══════════════════════════════════════════════
   MDS (classical / SMACOF-lite)
   Given an n×n distance matrix, returns n {x,y} points
══════════════════════════════════════════════ */
function mds(dist, iter=120) {
  const n = dist.length;

  // Double-center the squared distance matrix → B
  const D2 = dist.map(row => row.map(d => d*d));
  const rowMean = D2.map(row => d3.mean(row));
  const totalMean = d3.mean(rowMean);

  const B = Array.from({length:n}, (_,i) =>
    Array.from({length:n}, (_,j) =>
      -0.5 * (D2[i][j] - rowMean[i] - rowMean[j] + totalMean)
    )
  );

  // Power iteration for top 2 eigenvectors
  function powerIter(M, steps=60) {
    let v = Array.from({length:n}, () => Math.random()-0.5);
    let lambda = 1;
    for (let s=0; s<steps; s++) {
      const Mv = v.map((_,i) => d3.sum(M[i].map((m,j) => m*v[j])));
      lambda = Math.sqrt(d3.sum(Mv.map(x=>x*x)));
      if (lambda < 1e-10) break;
      v = Mv.map(x => x/lambda);
    }
    return {vec: v, val: lambda};
  }

  const {vec: v1, val: l1} = powerIter(B);
  // Deflate
  const B2 = B.map((row,i) => row.map((b,j) => b - l1*v1[i]*v1[j]));
  const {vec: v2, val: l2} = powerIter(B2);

  const s1 = Math.sqrt(Math.max(0, l1));
  const s2 = Math.sqrt(Math.max(0, l2));
  return Array.from({length:n}, (_,i) => ({ x: v1[i]*s1, y: v2[i]*s2 }));
}

/* ── Random distance matrix generators ─────────────────────
   Different "personalities" produce different curve shapes
── */
function randomDistMatrix() {
  const mode = Math.floor(Math.random()*5);
  const n = 14 + Math.floor(Math.random()*18); // 14–31 time points

  let pts;

  if (mode === 0) {
    // Slow drift with one big jump
    pts = [];
    let x=0,y=0;
    const jumpAt = 3 + Math.floor(Math.random()*(n-6));
    for (let i=0;i<n;i++) {
      if (i===jumpAt) { x+=2+Math.random()*2; y+=2+Math.random()*2; }
      x += (Math.random()-0.5)*0.3;
      y += (Math.random()-0.5)*0.3;
      pts.push([x,y]);
    }
  } else if (mode === 1) {
    // Cyclic / seasonal — returns to origin periodically
    pts = Array.from({length:n}, (_,i) => {
      const t = i/n;
      const cycles = 1+Math.floor(Math.random()*3);
      return [
        Math.sin(t*Math.PI*2*cycles) + (Math.random()-0.5)*0.4,
        Math.cos(t*Math.PI*2*cycles) + (Math.random()-0.5)*0.4
      ];
    });
  } else if (mode === 2) {
    // Two clusters with transitions
    pts = Array.from({length:n}, (_,i) => {
      const inCluster = i < n*0.45 || i > n*0.75;
      const cx = inCluster ? 0 : 3;
      const cy = inCluster ? 0 : (Math.random()<0.5?1.5:-1.5);
      return [cx+(Math.random()-0.5)*0.6, cy+(Math.random()-0.5)*0.6];
    });
  } else if (mode === 3) {
    // Spiral
    pts = Array.from({length:n}, (_,i) => {
      const t = i/n;
      const r = 0.5 + t*2.5;
      return [
        r*Math.cos(t*Math.PI*4) + (Math.random()-0.5)*0.3,
        r*Math.sin(t*Math.PI*4) + (Math.random()-0.5)*0.3
      ];
    });
  } else {
    // Random walk with drift
    pts = [];
    let x=0,y=0;
    const driftX = (Math.random()-0.5)*0.15;
    const driftY = (Math.random()-0.5)*0.15;
    for (let i=0;i<n;i++) {
      x += driftX + (Math.random()-0.5)*0.5;
      y += driftY + (Math.random()-0.5)*0.5;
      pts.push([x,y]);
    }
  }

  // Build distance matrix from pts
  const dist = pts.map((a,i) => pts.map((b,j) => {
    const dx=a[0]-b[0], dy=a[1]-b[1];
    return Math.sqrt(dx*dx+dy*dy);
  }));

  return {dist, n};
}

/* ── State ── */
let palette = randomPalette();
let datasets = [];

function generateDatasets() {
  datasets = Array.from({length: GRID*GRID}, () => {
    const {dist, n} = randomDistMatrix();
    const coords = mds(dist);
    // Compute per-point "change magnitude" = dist to next point in sequence
    const change = dist.map((row,i) => i<dist.length-1 ? dist[i][i+1] : dist[i][i-1]);
    return {coords, n, change};
  });
}

/* ── Draw ── */
function drawAll() {
  const W = window.innerWidth;
  const H = window.innerHeight;
  const cellW = (W - GAP*(GRID+1)) / GRID;
  const cellH = (H - GAP*(GRID+1)) / GRID;
  const margin = 24;

  const svg = d3.select('#viz').attr('width',W).attr('height',H);
  svg.selectAll('*').remove();
  svg.append('rect').attr('width',W).attr('height',H).attr('fill','#07060e');

  datasets.forEach((ds, idx) => {
    const row = Math.floor(idx/GRID);
    const col = idx%GRID;
    const ox = GAP + col*(cellW+GAP);
    const oy = GAP + row*(cellH+GAP);
    const color = palette[idx];
    const darkBg = d3.color(color).darker(3.5).toString();
    const cellDelay = idx*80;

    // Cell background
    svg.append('rect')
      .attr('x',ox).attr('y',oy)
      .attr('width',cellW).attr('height',cellH)
      .attr('fill', darkBg);

    const {coords, n, change} = ds;

    // Scale coords to cell
    const xs = coords.map(p=>p.x), ys = coords.map(p=>p.y);
    const xExt = d3.extent(xs), yExt = d3.extent(ys);
    const xSc = d3.scaleLinear().domain(xExt).range([ox+margin, ox+cellW-margin]);
    const ySc = d3.scaleLinear().domain(yExt).range([oy+margin, oy+cellH-margin]);
    const pts = coords.map(p => [xSc(p.x), ySc(p.y)]);

    // Change magnitude → dot radius
    const changeExt = d3.extent(change);
    const rSc = d3.scaleLinear().domain(changeExt).range([3, Math.min(cellW,cellH)*0.07]);

    const g = svg.append('g');

    // ── Trail: draw line segments colored by time position ──
    for (let i=0; i<pts.length-1; i++) {
      const t = i/(pts.length-1);
      const segColor = d3.interpolateHsl(
        d3.hsl(d3.color(color).h, 0.6, 0.35),
        d3.color(color)
      )(t).toString();

      g.append('line')
        .attr('x1', pts[i][0]).attr('y1', pts[i][1])
        .attr('x2', pts[i+1][0]).attr('y2', pts[i+1][1])
        .attr('stroke', segColor)
        .attr('stroke-width', 1.5)
        .attr('stroke-linecap','round')
        .attr('opacity', 0)
        .transition().duration(400).delay(cellDelay + i*18)
        .attr('opacity', 0.7);
    }

    // ── Dots: sized by change magnitude, colored by time ──
    pts.forEach((p, i) => {
      const t = i/(pts.length-1);
      const isFirst = i===0, isLast = i===pts.length-1;
      const dotColor = isFirst ? '#ffffff'
                     : isLast  ? color
                     : d3.interpolateHsl(d3.hsl(d3.color(color).h,0.5,0.45), d3.color(color))(t).toString();

      g.append('circle')
        .attr('cx', p[0]).attr('cy', p[1])
        .attr('r', 0)
        .attr('fill', dotColor)
        .attr('opacity', 0)
        .transition().duration(300)
        .delay(cellDelay + i*18)
        .attr('r', isFirst||isLast ? rSc(changeExt[1])*0.8 : rSc(change[i]))
        .attr('opacity', isFirst||isLast ? 1 : 0.85);
    });
  });
}

function regenerate() {
  palette = randomPalette();
  generateDatasets();
  drawAll();
}

function newColors() {
  palette = randomPalette();
  drawAll();
}

generateDatasets();
drawAll();
window.addEventListener('resize', drawAll);
</script>
</body>
</html>
