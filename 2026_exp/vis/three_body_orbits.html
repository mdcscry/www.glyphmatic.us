<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three-body periodic orbits</title>
<style>
  :root {
    --bg: #0a0a0a;
    --fg: #f0e8d0;
    --muted: #888780;
    --border: rgba(255,255,255,0.18);
    --surface: #1a1a1a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 24px;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .wrap { width: 100%; max-width: 900px; }
  header { margin: 0 0 20px; }
  h1 { font-size: 22px; font-weight: 500; margin: 0 0 4px; }
  .subtitle { font-size: 13px; color: var(--muted); margin: 0; line-height: 1.5; }
  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
    margin: 0 0 16px;
    flex-wrap: wrap;
  }
  button {
    font: inherit;
    font-size: 13px;
    padding: 8px 14px;
    background: var(--surface);
    color: var(--fg);
    border: 0.5px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
  }
  button:hover { background: #2a2a2a; }
  button:active { transform: scale(0.98); }
  button.active {
    background: var(--fg);
    color: var(--bg);
    border-color: var(--fg);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
  }
  .tile {
    aspect-ratio: 1 / 1;
    border-radius: 6px;
    overflow: hidden;
    position: relative;
    background: var(--bg);
  }
  .tile canvas { display: block; width: 100%; height: 100%; }
  .tile-label {
    position: absolute;
    bottom: 4px;
    left: 6px;
    font-size: 9px;
    color: var(--muted);
    pointer-events: none;
    font-variant-caps: all-small-caps;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Three-body periodic orbits</h1>
    <p class="subtitle">Stable solutions to Newton's three-body problem.</p>
  </header>

  <div class="controls">
    <button id="reroll-orbits">Different orbits</button>
    <button id="reroll-palettes">New palettes</button>
    <button id="toggle-labels">Show names</button>
  </div>

  <div class="grid" id="grid"></div>
</div>

<script>
(function() {
  const gridEl = document.getElementById('grid');
  const ROWS = 4, COLS = 5;
  const TOTAL = ROWS * COLS;

  // Three Šuvakov-Dmitrašinović orbits with similar moderate periods.
  // Moth I, moth II, and butterfly III all have intricate trajectories
  // that look like the source image.
  const orbits = [
    { name: 'moth I',        type: 'sd', p1: 0.46444, p2: 0.39606, T: 14.8939 },
    { name: 'moth II',       type: 'sd', p1: 0.43917, p2: 0.45297, T: 28.6705 },
    { name: 'butterfly III', type: 'sd', p1: 0.40592, p2: 0.23016, T: 13.8658 }
  ];

  // ===== Velocity Verlet integrator (symplectic, energy-conserving) =====
  function accel(pos, out) {
    const x1 = pos[0], y1 = pos[1];
    const x2 = pos[2], y2 = pos[3];
    const x3 = pos[4], y3 = pos[5];
    const d12x = x2 - x1, d12y = y2 - y1;
    const d13x = x3 - x1, d13y = y3 - y1;
    const d23x = x3 - x2, d23y = y3 - y2;
    const r12sq = d12x*d12x + d12y*d12y;
    const r13sq = d13x*d13x + d13y*d13y;
    const r23sq = d23x*d23x + d23y*d23y;
    const r12 = r12sq * Math.sqrt(r12sq);
    const r13 = r13sq * Math.sqrt(r13sq);
    const r23 = r23sq * Math.sqrt(r23sq);
    out[0] = d12x/r12 + d13x/r13;
    out[1] = d12y/r12 + d13y/r13;
    out[2] = -d12x/r12 + d23x/r23;
    out[3] = -d12y/r12 + d23y/r23;
    out[4] = -d13x/r13 - d23x/r23;
    out[5] = -d13y/r13 - d23y/r23;
  }

  function verletStep(pos, vel, a, aNext, dt) {
    accel(pos, a);
    for (let i = 0; i < 6; i++) {
      pos[i] += vel[i] * dt + 0.5 * a[i] * dt * dt;
    }
    accel(pos, aNext);
    for (let i = 0; i < 6; i++) {
      vel[i] += 0.5 * (a[i] + aNext[i]) * dt;
    }
  }

  function initialState(orbit) {
    const pos = new Float64Array(6);
    const vel = new Float64Array(6);
    if (orbit.type === 'general') {
      pos[0] = orbit.pos[0][0]; pos[1] = orbit.pos[0][1];
      pos[2] = orbit.pos[1][0]; pos[3] = orbit.pos[1][1];
      pos[4] = orbit.pos[2][0]; pos[5] = orbit.pos[2][1];
      vel[0] = orbit.vel[0][0]; vel[1] = orbit.vel[0][1];
      vel[2] = orbit.vel[1][0]; vel[3] = orbit.vel[1][1];
      vel[4] = orbit.vel[2][0]; vel[5] = orbit.vel[2][1];
    } else {
      pos[0] = -1; pos[1] = 0;  vel[0] = orbit.p1;     vel[1] = orbit.p2;
      pos[2] =  1; pos[3] = 0;  vel[2] = orbit.p1;     vel[3] = orbit.p2;
      pos[4] =  0; pos[5] = 0;  vel[4] = -2*orbit.p1;  vel[5] = -2*orbit.p2;
    }
    return { pos, vel };
  }

  function integrate(orbit) {
    const { pos, vel } = initialState(orbit);
    const T = orbit.T;
    // Step density of ~600 per unit time gives smooth trails for short and
    // medium periods. Capped to keep all 20 tiles fast.
    // Higher step density for these moderate-period orbits — moth II has
    // T≈28.7 and needs ~50k steps to integrate without drift accumulating
    // enough to blow up the trajectory.
    const steps = Math.min(60000, Math.max(5000, Math.floor(T * 2000)));
    const dt = T / steps;

    const t1x = new Float64Array(steps + 1);
    const t1y = new Float64Array(steps + 1);
    const t2x = new Float64Array(steps + 1);
    const t2y = new Float64Array(steps + 1);
    const t3x = new Float64Array(steps + 1);
    const t3y = new Float64Array(steps + 1);

    t1x[0] = pos[0]; t1y[0] = pos[1];
    t2x[0] = pos[2]; t2y[0] = pos[3];
    t3x[0] = pos[4]; t3y[0] = pos[5];

    const a = new Float64Array(6);
    const aNext = new Float64Array(6);

    for (let i = 0; i < steps; i++) {
      verletStep(pos, vel, a, aNext, dt);
      t1x[i+1] = pos[0]; t1y[i+1] = pos[1];
      t2x[i+1] = pos[2]; t2y[i+1] = pos[3];
      t3x[i+1] = pos[4]; t3y[i+1] = pos[5];
    }

    return [
      { x: t1x, y: t1y },
      { x: t2x, y: t2y },
      { x: t3x, y: t3y }
    ];
  }

  const palettes = [
    { name: 'fire',     bg: '#0a0a0a', colors: ['#fac775', '#85b7eb', '#f5c4b3'] },
    { name: 'twilight', bg: '#0a0a0a', colors: ['#ef9f27', '#e6f1fb', '#d85a30'] },
    { name: 'spectrum', bg: '#0a0a0a', colors: ['#7fb6c5', '#fac775', '#d4537e'] },
    { name: 'aurora',   bg: '#0a0a0a', colors: ['#9fe1cb', '#cecbf6', '#ed93b1'] },
    { name: 'ember',    bg: '#1a0a05', colors: ['#fac775', '#f5c4b3', '#d85a30'] },
    { name: 'ocean',    bg: '#042c53', colors: ['#85b7eb', '#fac775', '#f5c4b3'] },
    { name: 'forest',   bg: '#0a1a02', colors: ['#c0dd97', '#fac775', '#f7c1c1'] },
    { name: 'iris',     bg: '#1a163d', colors: ['#cecbf6', '#fac775', '#ed93b1'] },
    { name: 'noir',     bg: '#0a0a0a', colors: ['#f0e8d0', '#85b7eb', '#d85a30'] },
    { name: 'rust',     bg: '#1a0a05', colors: ['#fac775', '#85b7eb', '#9fe1cb'] }
  ];

  function renderTile(canvas, orbit, palette) {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    const W = Math.max(Math.floor(rect.width * dpr), 100);
    const H = Math.max(Math.floor(rect.height * dpr), 100);
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = palette.bg;
    ctx.fillRect(0, 0, W, H);

    let trails;
    try { trails = integrate(orbit); } catch (e) { return; }

    // If the trajectory blew up partway through (numerical drift causing
    // bodies to fly off), find the last "good" step and truncate trails
    // to that point. Renders the well-behaved portion rather than rejecting
    // the whole tile.
    let goodSteps = trails[0].x.length;
    for (let i = 0; i < trails[0].x.length; i++) {
      let bad = false;
      for (const trail of trails) {
        const x = trail.x[i], y = trail.y[i];
        if (!isFinite(x) || !isFinite(y) || Math.abs(x) > 8 || Math.abs(y) > 8) {
          bad = true;
          break;
        }
      }
      if (bad) {
        goodSteps = i;
        break;
      }
    }
    if (goodSteps < 100) return; // not enough to render anything meaningful
    // Truncate trails to the good portion
    for (const trail of trails) {
      trail.x = trail.x.subarray(0, goodSteps);
      trail.y = trail.y.subarray(0, goodSteps);
    }

    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const trail of trails) {
      for (let i = 0; i < trail.x.length; i++) {
        const x = trail.x[i], y = trail.y[i];
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }

    const spanX = maxX - minX;
    const spanY = maxY - minY;
    if (spanX < 0.01 || spanY < 0.01) return;

    const margin = 0.08 * Math.min(W, H);
    const scale = Math.min((W - 2*margin) / spanX, (H - 2*margin) / spanY);
    const cx = (minX + maxX) / 2;
    const cy = (minY + maxY) / 2;
    const tx = x => W/2 + (x - cx) * scale;
    const ty = y => H/2 + (y - cy) * scale;

    ctx.lineWidth = 0.9 * dpr;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    for (let b = 0; b < 3; b++) {
      ctx.strokeStyle = palette.colors[b];
      ctx.globalAlpha = 0.85;
      const trail = trails[b];
      ctx.beginPath();
      for (let i = 0; i < trail.x.length; i++) {
        const x = tx(trail.x[i]);
        const y = ty(trail.y[i]);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    ctx.globalAlpha = 1.0;
    for (let b = 0; b < 3; b++) {
      const trail = trails[b];
      const lastIdx = trail.x.length - 1;
      const x = tx(trail.x[lastIdx]);
      const y = ty(trail.y[lastIdx]);
      const glowRadius = 8 * dpr;
      const grad = ctx.createRadialGradient(x, y, 0, x, y, glowRadius);
      grad.addColorStop(0, palette.colors[b]);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(x, y, glowRadius, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = palette.colors[b];
      ctx.beginPath();
      ctx.arc(x, y, 2 * dpr, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  let tileOrbits = [];
  let tilePalettes = [];
  let showLabels = false;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function pickPalettesNoAdjacent() {
    const result = [];
    for (let i = 0; i < TOTAL; i++) {
      const row = Math.floor(i / COLS);
      const col = i % COLS;
      const forbidden = new Set();
      if (col > 0) forbidden.add(result[i - 1].name);
      if (row > 0) forbidden.add(result[i - COLS].name);
      const candidates = palettes.filter(p => !forbidden.has(p.name));
      result.push(candidates[Math.floor(Math.random() * candidates.length)]);
    }
    return result;
  }

  function regenerateOrbits() {
    // Catalog has 11 orbits, grid has 20 tiles — reshuffle and tile through
    // the catalog. Each catalog orbit appears about twice with different
    // palettes per appearance.
    const result = [];
    while (result.length < TOTAL) {
      const shuffled = shuffle(orbits);
      for (const o of shuffled) {
        if (result.length < TOTAL) result.push(o);
      }
    }
    tileOrbits = result;
  }

  function build() {
    gridEl.innerHTML = '';
    for (let i = 0; i < TOTAL; i++) {
      const orbit = tileOrbits[i];
      const palette = tilePalettes[i];
      const tileEl = document.createElement('div');
      tileEl.className = 'tile';
      tileEl.style.background = palette.bg;
      const canvas = document.createElement('canvas');
      tileEl.appendChild(canvas);

      if (showLabels) {
        const label = document.createElement('div');
        label.className = 'tile-label';
        label.textContent = orbit.name;
        tileEl.appendChild(label);
      }

      gridEl.appendChild(tileEl);
      requestAnimationFrame(() => renderTile(canvas, orbit, palette));
    }
  }

  document.getElementById('reroll-orbits').addEventListener('click', () => {
    regenerateOrbits();
    build();
  });
  document.getElementById('reroll-palettes').addEventListener('click', () => {
    tilePalettes = pickPalettesNoAdjacent();
    build();
  });
  const labelsBtn = document.getElementById('toggle-labels');
  labelsBtn.addEventListener('click', () => {
    showLabels = !showLabels;
    labelsBtn.textContent = showLabels ? 'Hide names' : 'Show names';
    labelsBtn.classList.toggle('active', showLabels);
    build();
  });

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(build, 150);
  });

  regenerateOrbits();
  tilePalettes = pickPalettesNoAdjacent();
  build();
})();
</script>
</body>
</html>
