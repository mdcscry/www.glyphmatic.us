<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BioFabric</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #f5f4f0; overflow: hidden; }
  canvas { display: block; position: fixed; inset: 0; }
  #ui {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    z-index: 10; display: flex; gap: 12px;
  }
  button {
    background: rgba(0,0,0,0.08); border: 1px solid rgba(0,0,0,0.25);
    color: #222; font-family: monospace; font-size: 11px; letter-spacing: 0.15em;
    text-transform: uppercase; padding: 8px 24px; cursor: pointer; transition: background 0.2s;
  }
  button:hover { background: rgba(0,0,0,0.16); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <button onclick="regenerate()">&#x21BA; Regenerate</button>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

/* ── BioFabric color cycle (32 colors as per paper) ── */
function makePalette() {
  // Two sets: light for nodes, dark for edges
  const nodeColors = [];
  const edgeColors = [];
  for (let i = 0; i < 32; i++) {
    const h = (i * (360 / 32)) % 360;
    nodeColors.push('hsl(' + h + ',55%,72%)');
    edgeColors.push('hsl(' + h + ',65%,38%)');
  }
  return { nodeColors, edgeColors };
}

/* ── Random network generator ── */
function generateNetwork() {
  // Random number of nodes: 40–120
  const N = 40 + Math.floor(Math.random() * 80);

  // Build adjacency: random graph with some hub structure
  const adj = Array.from({length: N}, function() { return []; });
  const edges = [];

  // A few hubs with high degree
  const numHubs = 3 + Math.floor(Math.random() * 5);
  const hubs = Array.from({length: numHubs}, function() {
    return Math.floor(Math.random() * N);
  });

  // Hub connections
  hubs.forEach(function(hub) {
    const degree = 8 + Math.floor(Math.random() * 20);
    for (let d = 0; d < degree; d++) {
      const target = Math.floor(Math.random() * N);
      if (target !== hub && !adj[hub].includes(target)) {
        adj[hub].push(target);
        adj[target].push(hub);
        edges.push([hub, target]);
      }
    }
  });

  // Random sparse connections
  const extraEdges = Math.floor(N * 1.5);
  for (let e = 0; e < extraEdges; e++) {
    const a = Math.floor(Math.random() * N);
    const b = Math.floor(Math.random() * N);
    if (a !== b && !adj[a].includes(b)) {
      adj[a].push(b);
      adj[b].push(a);
      edges.push([a, b]);
    }
  }

  return { N, adj, edges };
}

/* ── BioFabric layout ──
   Node ordering: breadth-first from highest-degree node
   Edge ordering: for each node row in order, assign columns
   to unassigned edges incident on that node
── */
function layoutBioFabric(N, adj, edges) {

  // 1. Sort nodes by degree descending → BFS order
  const degree = adj.map(function(a) { return a.length; });
  const visited = new Array(N).fill(false);
  const nodeOrder = []; // nodeOrder[i] = original node id

  // Find highest degree unvisited, BFS from it
  while (nodeOrder.length < N) {
    // Find seed: highest degree unvisited
    let seed = -1;
    let maxDeg = -1;
    for (let i = 0; i < N; i++) {
      if (!visited[i] && degree[i] > maxDeg) {
        maxDeg = degree[i];
        seed = i;
      }
    }
    if (seed === -1) break;

    // BFS
    const queue = [seed];
    visited[seed] = true;
    let qi = 0;
    while (qi < queue.length) {
      const node = queue[qi++];
      nodeOrder.push(node);
      // Sort neighbors by degree desc
      const neighbors = adj[node].slice().sort(function(a, b) {
        return degree[b] - degree[a];
      });
      neighbors.forEach(function(nb) {
        if (!visited[nb]) {
          visited[nb] = true;
          queue.push(nb);
        }
      });
    }
  }

  // 2. Row assignment: node → row index
  const nodeRow = new Array(N);
  nodeOrder.forEach(function(node, row) {
    nodeRow[node] = row;
  });

  // 3. Edge column assignment: process each node row in order,
  //    assign columns to unassigned edges incident on that node
  const edgeAssigned = new Array(edges.length).fill(false);
  const edgeColumn = new Array(edges.length).fill(-1);
  let col = 0;

  for (let row = 0; row < N; row++) {
    const node = nodeOrder[row];
    // Find all unassigned edges where this node is in the lower row
    edges.forEach(function(edge, ei) {
      if (edgeAssigned[ei]) return;
      const ra = nodeRow[edge[0]];
      const rb = nodeRow[edge[1]];
      const minRow = Math.min(ra, rb);
      if (minRow === row) {
        edgeColumn[ei] = col++;
        edgeAssigned[ei] = true;
      }
    });
  }

  return { nodeOrder, nodeRow, edgeColumn, numCols: col };
}

/* ── Render ── */
function render(network, layout) {
  const W = canvas.width;
  const H = canvas.height;
  const { N, adj, edges } = network;
  const { nodeOrder, nodeRow, edgeColumn, numCols } = layout;
  const { nodeColors, edgeColors } = makePalette();

  ctx.fillStyle = '#f5f4f0';
  ctx.fillRect(0, 0, W, H);

  const PAD_X = 20;
  const PAD_Y = 20;
  const innerW = W - PAD_X * 2;
  const innerH = H - PAD_Y * 2;

  // Scale
  const rowSpacing = innerH / Math.max(1, N - 1);
  const colSpacing = innerW / Math.max(1, numCols - 1);

  // Node line thickness
  const nodeThick = Math.max(0.8, rowSpacing * 0.18);
  // Edge line thickness
  const edgeThick = Math.max(0.5, colSpacing * 0.35);

  // Draw node lines (horizontal) — light colors
  nodeOrder.forEach(function(node, row) {
    const y = PAD_Y + row * rowSpacing;
    const color = nodeColors[row % nodeColors.length];

    // Find leftmost and rightmost edge columns for this node
    let minCol = numCols, maxCol = 0;
    edges.forEach(function(edge, ei) {
      if (edge[0] === node || edge[1] === node) {
        const ec = edgeColumn[ei];
        if (ec < minCol) minCol = ec;
        if (ec > maxCol) maxCol = ec;
      }
    });

    const x0 = minCol < numCols ? PAD_X + minCol * colSpacing : PAD_X;
    const x1 = maxCol > 0      ? PAD_X + maxCol * colSpacing  : PAD_X + innerW;

    ctx.strokeStyle = color;
    ctx.lineWidth = nodeThick;
    ctx.beginPath();
    ctx.moveTo(x0, y);
    ctx.lineTo(x1, y);
    ctx.stroke();
  });

  // Draw edge lines (vertical) — dark colors, on top
  edges.forEach(function(edge, ei) {
    const col = edgeColumn[ei];
    if (col < 0) return;
    const x = PAD_X + col * colSpacing;
    const rowA = nodeRow[edge[0]];
    const rowB = nodeRow[edge[1]];
    const y0 = PAD_Y + Math.min(rowA, rowB) * rowSpacing;
    const y1 = PAD_Y + Math.max(rowA, rowB) * rowSpacing;
    const color = edgeColors[col % edgeColors.length];

    ctx.strokeStyle = color;
    ctx.lineWidth = edgeThick;
    ctx.beginPath();
    ctx.moveTo(x, y0);
    ctx.lineTo(x, y1);
    ctx.stroke();

    // Tiny endpoint squares as per paper
    const sq = Math.max(1.5, edgeThick * 1.4);
    ctx.fillStyle = color;
    ctx.fillRect(x - sq/2, y0 - sq/2, sq, sq);
    ctx.fillRect(x - sq/2, y1 - sq/2, sq, sq);
  });
}

function regenerate() {
  const network = generateNetwork();
  const layout  = layoutBioFabric(network.N, network.adj, network.edges);
  render(network, layout);
}

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  regenerate();
}

window.addEventListener('resize', resize);
resize();
</script>
</body>
</html>
