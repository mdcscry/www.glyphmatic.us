<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Composição Grid</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3-cloud/1.2.5/d3.layout.cloud.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #111; }
  #container { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; width: 100vw; height: 100vh; gap: 3px; background: #111; }
  .cell { position: relative; overflow: hidden; }
  #ui { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; gap: 12px; }
  button { background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.35); color: #fff; font-family: monospace; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; padding: 8px 20px; cursor: pointer; }
  button:hover { background: rgba(255,255,255,0.15); }
</style>
</head>
<body>
<div id="container">
  <div class="cell" id="cell-0"></div>
  <div class="cell" id="cell-1"></div>
  <div class="cell" id="cell-2"></div>
  <div class="cell" id="cell-3"></div>
</div>
<div id="ui">
  <button onclick="regenerate()">↺ Regenerate</button>
  <button onclick="newColors()">↺ Colors</button>
</div>
<script>
var SCHEMES = [
  { bg:'#3a9a2a', colors:['#cc2222','#c85a00','#d4a800','#f0e8a0','#7a1a1a','#cc6644','#f0c840'] },
  { bg:'#1a3a8a', colors:['#f0c840','#e84040','#f0e8a0','#88ccff','#cc4488','#ff8844','#ffffff'] },
  { bg:'#1a1a1a', colors:['#f0c840','#e84040','#88ddaa','#ff8844','#aaddff','#cc88ff','#ffffff'] },
  { bg:'#8a1a1a', colors:['#f0c840','#f0e8a0','#ffaa44','#88ccaa','#ffddaa','#ffffff','#ffcc00'] },
  { bg:'#f5f0e8', colors:['#cc2222','#3a7a2a','#c85a00','#1a3a8a','#7a1a1a','#c85a88','#333'] },
  { bg:'#2a1a3a', colors:['#f0c840','#ff6688','#88ffcc','#ff8844','#aabbff','#ff44aa','#ffffff'] },
  { bg:'#1a3a2a', colors:['#ffcc00','#ff4444','#ffaa44','#aaffcc','#ff88aa','#ffffff','#88ddff'] },
  { bg:'#3a2a1a', colors:['#88ddff','#44aaff','#ffcc44','#ff8844','#aaffaa','#ffffff','#ff6644'] },
];

var GLYPHS = [
  '\u002B','\u00D7','\u2212','\u00F7','\u003D','\u2260',
  '\u2200','\u2203','\u2207','\u2202','\u222B','\u220F','\u2211',
  '\u221E','\u221A','\u2248','\u2261','\u2264','\u2265',
  '\u25B2','\u25BC','\u25B6','\u25C0','\u25B3','\u25BD',
  '\u25A0','\u25A1','\u25C6','\u25C7','\u25CF','\u25CB',
  '\u2295','\u2297','\u2299','\u2296',
  '\u2190','\u2191','\u2192','\u2193',
  '\u22C5','\u2022','\u2043','\u2014',
];

function randomScheme() {
  return SCHEMES[Math.floor(Math.random()*SCHEMES.length)];
}

var currentSchemes = [randomScheme(),randomScheme(),randomScheme(),randomScheme()];

function drawCell(idx, scheme) {
  var el = document.getElementById('cell-'+idx);
  var W  = el.offsetWidth, H = el.offsetHeight;
  if (!W || !H) return;

  el.innerHTML = '';
  var svg = d3.select(el).append('svg').attr('width',W).attr('height',H);
  svg.append('rect').attr('width',W).attr('height',H).attr('fill',scheme.bg);
  var g = svg.append('g').attr('transform','translate('+W/2+','+H/2+')');

  var n = 30 + Math.floor(Math.random()*20);
  var minS = Math.min(W,H)*0.04;
  var maxS = Math.min(W,H)*0.26;

  var words = Array.from({length:n}, function(_,i) {
    var freq = Math.pow(1/(i+1), 0.6);
    return {
      text:  GLYPHS[Math.floor(Math.random()*GLYPHS.length)],
      size:  minS + freq*(maxS-minS),
      color: scheme.colors[i % scheme.colors.length],
    };
  });

  d3.layout.cloud()
    .size([W, H])
    .words(words)
    .padding(8)
    .rotate(function(){ return Math.random() < 0.35 ? 90 : 0; })
    .font('serif')
    .fontWeight('bold')
    .fontSize(function(d){ return d.size; })
    .spiral('archimedean')
    .on('end', function(placed) {
      g.selectAll('text')
        .data(placed)
        .join('text')
        .attr('transform', function(d){ return 'translate('+d.x+','+d.y+') rotate('+d.rotate+')'; })
        .attr('text-anchor','middle')
        .attr('font-family','serif')
        .attr('font-weight','bold')
        .attr('font-size', function(d){ return d.size+'px'; })
        .attr('fill', function(d){ return d.color; })
        .text(function(d){ return d.text; });
    })
    .start();
}

function regenerate() {
  currentSchemes = [randomScheme(),randomScheme(),randomScheme(),randomScheme()];
  [0,1,2,3].forEach(function(i){ drawCell(i, currentSchemes[i]); });
}

function newColors() {
  currentSchemes = [randomScheme(),randomScheme(),randomScheme(),randomScheme()];
  [0,1,2,3].forEach(function(i){ drawCell(i, currentSchemes[i]); });
}

setTimeout(function(){ [0,1,2,3].forEach(function(i){ drawCell(i,currentSchemes[i]); }); }, 50);
window.addEventListener('resize', function(){ setTimeout(function(){ [0,1,2,3].forEach(function(i){ drawCell(i,currentSchemes[i]); }); }, 50); });
</script>
</body>
</html>
