<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Optimization Landscapes</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3-contour/4.0.2/d3-contour.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #07060e; overflow: hidden; }
  svg { display: block; position: fixed; inset: 0; }
  #ui {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    z-index: 10; display: flex; gap: 12px; align-items: center;
  }
  button {
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; font-family: monospace; font-size: 11px; letter-spacing: 0.15em;
    text-transform: uppercase; padding: 8px 24px; cursor: pointer; transition: background 0.2s;
  }
  button:hover { background: rgba(255,255,255,0.14); }
</style>
</head>
<body>
<svg id="viz"></svg>
<div id="ui">
  <button onclick="newColors()">&#x21BA; Colors</button>
  <button onclick="reshuffle()">&#x21BA; Reshuffle</button>
</div>
<script>
const GRID = 5;
const GAP  = 3;
const RES  = 120;

/* ── Test functions — each returns a scalar for (x,y) in its domain ── */
const FUNCTIONS = [
  {
    name: 'Rastrigin',
    domain: [-5.12, 5.12, -5.12, 5.12],
    fn: function(x,y) { return 20 + x*x - 10*Math.cos(2*Math.PI*x) + y*y - 10*Math.cos(2*Math.PI*y); }
  },
  {
    name: 'Ackley',
    domain: [-5, 5, -5, 5],
    fn: function(x,y) {
      return -20*Math.exp(-0.2*Math.sqrt(0.5*(x*x+y*y)))
             - Math.exp(0.5*(Math.cos(2*Math.PI*x)+Math.cos(2*Math.PI*y)))
             + Math.E + 20;
    }
  },
  {
    name: 'Sphere',
    domain: [-4, 4, -4, 4],
    fn: function(x,y) { return x*x + y*y; }
  },
  {
    name: 'Rosenbrock',
    domain: [-2, 2, -1, 3],
    fn: function(x,y) { return 100*Math.pow(y-x*x,2) + Math.pow(1-x,2); }
  },
  {
    name: 'Beale',
    domain: [-4.5, 4.5, -4.5, 4.5],
    fn: function(x,y) {
      return Math.pow(1.5-x+x*y,2) + Math.pow(2.25-x+x*y*y,2) + Math.pow(2.625-x+x*y*y*y,2);
    }
  },
  {
    name: 'Goldstein–Price',
    domain: [-2, 2, -2, 2],
    fn: function(x,y) {
      const a = 1+(x+y+1)*(x+y+1)*(19-14*x+3*x*x-14*y+6*x*y+3*y*y);
      const b = 30+(2*x-3*y)*(2*x-3*y)*(18-32*x+12*x*x+48*y-36*x*y+27*y*y);
      return a*b;
    }
  },
  {
    name: 'Booth',
    domain: [-10, 10, -10, 10],
    fn: function(x,y) { return Math.pow(x+2*y-7,2)+Math.pow(2*x+y-5,2); }
  },
  {
    name: 'Matyas',
    domain: [-10, 10, -10, 10],
    fn: function(x,y) { return 0.26*(x*x+y*y)-0.48*x*y; }
  },
  {
    name: 'Lévi N.13',
    domain: [-10, 10, -10, 10],
    fn: function(x,y) {
      return Math.pow(Math.sin(3*Math.PI*x),2)
           + Math.pow(x-1,2)*(1+Math.pow(Math.sin(3*Math.PI*y),2))
           + Math.pow(y-1,2)*(1+Math.pow(Math.sin(2*Math.PI*y),2));
    }
  },
  {
    name: 'Himmelblau',
    domain: [-5, 5, -5, 5],
    fn: function(x,y) { return Math.pow(x*x+y-11,2)+Math.pow(x+y*y-7,2); }
  },
  {
    name: 'Three-Hump Camel',
    domain: [-5, 5, -5, 5],
    fn: function(x,y) { return 2*x*x - 1.05*Math.pow(x,4) + Math.pow(x,6)/6 + x*y + y*y; }
  },
  {
    name: 'Easom',
    domain: [-10, 10, -10, 10],
    fn: function(x,y) {
      return -Math.cos(x)*Math.cos(y)*Math.exp(-((x-Math.PI)*(x-Math.PI)+(y-Math.PI)*(y-Math.PI)));
    }
  },
  {
    name: 'Cross-in-Tray',
    domain: [-10, 10, -10, 10],
    fn: function(x,y) {
      return -0.0001*Math.pow(Math.abs(Math.sin(x)*Math.sin(y)*Math.exp(Math.abs(100-Math.sqrt(x*x+y*y)/Math.PI)))+1, 0.1);
    }
  },
  {
    name: 'Eggholder',
    domain: [-512, 512, -512, 512],
    fn: function(x,y) {
      return -(y+47)*Math.sin(Math.sqrt(Math.abs(x/2+(y+47))))
             - x*Math.sin(Math.sqrt(Math.abs(x-(y+47))));
    }
  },
  {
    name: 'Hölder Table',
    domain: [-10, 10, -10, 10],
    fn: function(x,y) {
      return -Math.abs(Math.sin(x)*Math.cos(y)*Math.exp(Math.abs(1-Math.sqrt(x*x+y*y)/Math.PI)));
    }
  },
  {
    name: 'McCormick',
    domain: [-1.5, 4, -3, 4],
    fn: function(x,y) { return Math.sin(x+y)+Math.pow(x-y,2)-1.5*x+2.5*y+1; }
  },
  {
    name: 'Schaffer N.2',
    domain: [-50, 50, -50, 50],
    fn: function(x,y) {
      return 0.5 + (Math.pow(Math.sin(x*x-y*y),2)-0.5)/Math.pow(1+0.001*(x*x+y*y),2);
    }
  },
  {
    name: 'Schaffer N.4',
    domain: [-50, 50, -50, 50],
    fn: function(x,y) {
      return 0.5 + (Math.pow(Math.cos(Math.sin(Math.abs(x*x-y*y))),2)-0.5)/Math.pow(1+0.001*(x*x+y*y),2);
    }
  },
  {
    name: 'Styblinski–Tang',
    domain: [-5, 5, -5, 5],
    fn: function(x,y) {
      return 0.5*(Math.pow(x,4)-16*x*x+5*x + Math.pow(y,4)-16*y*y+5*y);
    }
  },
  {
    name: 'Griewank',
    domain: [-8, 8, -8, 8],
    fn: function(x,y) {
      return 1 + (x*x+y*y)/4000 - Math.cos(x)*Math.cos(y/Math.sqrt(2));
    }
  },
  {
    name: 'Bukin N.6',
    domain: [-15, -5, -3, 3],
    fn: function(x,y) { return 100*Math.sqrt(Math.abs(y-0.01*x*x))+0.01*Math.abs(x+10); }
  },
  {
    name: 'Mishra Bird',
    domain: [-10, 0, -6.5, 0],
    fn: function(x,y) {
      return Math.sin(y)*Math.exp(Math.pow(1-Math.cos(x),2))
           + Math.cos(x)*Math.exp(Math.pow(1-Math.sin(y),2))
           + Math.pow(x-y,2);
    }
  },
  {
    name: 'Townsend',
    domain: [-2.25, 2.25, -2.5, 1.75],
    fn: function(x,y) {
      return -Math.pow(Math.cos((x-0.1)*y),2)-x*Math.sin(3*x+y);
    }
  },
  {
    name: 'Six-Hump Camel',
    domain: [-3, 3, -2, 2],
    fn: function(x,y) {
      return (4-2.1*x*x+Math.pow(x,4)/3)*x*x + x*y + (-4+4*y*y)*y*y;
    }
  },
  {
    name: 'Drop-Wave',
    domain: [-5.12, 5.12, -5.12, 5.12],
    fn: function(x,y) {
      return -(1+Math.cos(12*Math.sqrt(x*x+y*y)))/(0.5*(x*x+y*y)+2);
    }
  },
];

/* ── Color schemes ── */
const SCHEMES = [
  d3.interpolateViridis, d3.interpolatePlasma, d3.interpolateInferno,
  d3.interpolateCividis, d3.interpolateMagma, d3.interpolateWarm,
  d3.interpolateCool, d3.interpolateTurbo, d3.interpolateSpectral,
];
let currentScheme = SCHEMES[Math.floor(Math.random() * SCHEMES.length)];

/* ── Perturb domain slightly each render ── */
function perturbDomain(xMin, xMax, yMin, yMax) {
  const xRange = xMax - xMin, yRange = yMax - yMin;
  const shift = 0.15 + Math.random() * 0.25; // how much to shift center
  const scale = 0.6 + Math.random() * 0.7;   // zoom in or out
  const cx = (xMin + xMax) / 2 + (Math.random() - 0.5) * xRange * shift;
  const cy = (yMin + yMax) / 2 + (Math.random() - 0.5) * yRange * shift;
  const hw = xRange * scale / 2, hh = yRange * scale / 2;
  return [cx - hw, cx + hw, cy - hh, cy + hh];
}

/* ── Sample a function into a flat Float64Array ── */
function sampleFunction(f, xMin, xMax, yMin, yMax) {
  const vals = new Float64Array(RES * RES);
  for (let j = 0; j < RES; j++) {
    for (let i = 0; i < RES; i++) {
      const x = xMin + (xMax - xMin) * i / (RES - 1);
      const y = yMin + (yMax - yMin) * j / (RES - 1);
      let v = f(x, y);
      if (!isFinite(v)) v = 0;
      vals[j * RES + i] = v;
    }
  }
  return vals;
}

/* ── State: pick 25 functions (with repeats if needed, shuffled) ── */
let selected = [];
function pickFunctions() {
  const pool = FUNCTIONS.slice();
  // Shuffle
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  // Fill 25 slots
  selected = [];
  for (let i = 0; i < GRID * GRID; i++) {
    selected.push(pool[i % pool.length]);
  }
}

/* ── Draw ── */
function drawAll() {
  const W = window.innerWidth, H = window.innerHeight;
  const cellW = (W - GAP*(GRID+1)) / GRID;
  const cellH = (H - GAP*(GRID+1)) / GRID;

  const svg = d3.select('#viz').attr('width', W).attr('height', H);
  svg.selectAll('*').remove();
  svg.append('rect').attr('width', W).attr('height', H).attr('fill', '#07060e');

  selected.forEach(function(func, idx) {
    const row = Math.floor(idx / GRID), col = idx % GRID;
    const ox  = GAP + col * (cellW + GAP);
    const oy  = GAP + row * (cellH + GAP);

    const [xMin, xMax, yMin, yMax] = perturbDomain(...func.domain);
    const values = sampleFunction(func.fn, xMin, xMax, yMin, yMax);

    const ext = d3.extent(values);
    const vMin = ext[0], vMax = ext[1];
    const range = vMax - vMin || 1;

    const nLevels = 20;
    const thresholds = Array.from({length: nLevels}, function(_, i) {
      return vMin + range * i / nLevels;
    });

    const contours = d3.contours().size([RES, RES]).thresholds(thresholds)(values);

    const xSc = d3.scaleLinear().domain([0, RES]).range([ox, ox + cellW]);
    const ySc = d3.scaleLinear().domain([0, RES]).range([oy, oy + cellH]);

    const pathGen = d3.geoPath().projection(
      d3.geoTransform({
        point: function(x, y) { this.stream.point(xSc(x), ySc(y)); }
      })
    );

    const g = svg.append('g');

    // Cell background
    g.append('rect')
      .attr('x', ox).attr('y', oy)
      .attr('width', cellW).attr('height', cellH)
      .attr('fill', currentScheme(0));

    // Filled bands
    g.selectAll('path.band')
      .data(contours)
      .join('path')
        .attr('class', 'band')
        .attr('d', pathGen)
        .attr('fill', function(d) {
          return currentScheme((d.value - vMin) / range);
        })
        .attr('stroke', 'none')
        .attr('opacity', 0)
      .transition()
        .duration(450)
        .delay(idx * 30)
        .attr('opacity', 1);

    // Iso-lines
    g.selectAll('path.line')
      .data(contours)
      .join('path')
        .attr('class', 'line')
        .attr('d', pathGen)
        .attr('fill', 'none')
        .attr('stroke', function(d) {
          return d3.color(currentScheme((d.value - vMin) / range)).darker(0.8).toString();
        })
        .attr('stroke-width', 0.35)
        .attr('opacity', 0)
      .transition()
        .duration(450)
        .delay(idx * 30)
        .attr('opacity', 0.6);
  });
}

function newColors() {
  currentScheme = SCHEMES[Math.floor(Math.random() * SCHEMES.length)];
  drawAll();
}

function reshuffle() {
  currentScheme = SCHEMES[Math.floor(Math.random() * SCHEMES.length)];
  pickFunctions();
  drawAll();
}

pickFunctions();
drawAll();
window.addEventListener('resize', drawAll);
</script>
</body>
</html>
