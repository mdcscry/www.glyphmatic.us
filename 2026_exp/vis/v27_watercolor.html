<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watercolor</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #f5f0e8; overflow: hidden; }
  canvas { display: block; position: fixed; inset: 0; }
  #ui {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    z-index: 10; display: flex; gap: 12px;
  }
  button {
    background: rgba(0,0,0,0.06); border: 1px solid rgba(0,0,0,0.2);
    color: #333; font-family: monospace; font-size: 11px; letter-spacing: 0.15em;
    text-transform: uppercase; padding: 8px 24px; cursor: pointer; transition: background 0.2s;
  }
  button:hover { background: rgba(0,0,0,0.12); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <button onclick="regenerate()">&#x21BA; Regenerate</button>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

/* ── Gaussian random ── */
function randn() {
  let u=0,v=0;
  while(!u) u=Math.random();
  while(!v) v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}
function gauss(mean, std) { return mean + std*randn(); }

/* ── Palettes [h,s,l] ── */
const PALETTES = [
  () => [[15,0.65,0.62],[35,0.55,0.70],[200,0.50,0.58],[160,0.45,0.60]],
  () => [[210,0.60,0.55],[185,0.55,0.62],[240,0.40,0.60],[170,0.50,0.65]],
  () => [[340,0.70,0.58],[20,0.75,0.62],[50,0.65,0.70],[280,0.55,0.60]],
  () => [[120,0.50,0.48],[90,0.45,0.55],[200,0.40,0.62],[60,0.45,0.65]],
  () => [[270,0.55,0.55],[320,0.60,0.58],[30,0.65,0.65],[200,0.45,0.62]],
];

function hslStr(h,s,l,a) {
  return 'hsla('+Math.round(h)+','+(s*100|0)+'%,'+(l*100|0)+'%,'+a+')';
}

/* ── Recursive polygon deformation ── */
function deformPoly(poly, variance) {
  const out = [];
  for (let i=0; i<poly.length; i++) {
    const A = poly[i];
    const C = poly[(i+1)%poly.length];
    out.push(A);
    const mx=(A[0]+C[0])/2, my=(A[1]+C[1])/2;
    const dx=C[0]-A[0], dy=C[1]-A[1];
    const len=Math.sqrt(dx*dx+dy*dy)||1;
    const px=-dy/len, py=dx/len;
    const disp = gauss(0, len*variance);
    out.push([mx+px*disp, my+py*disp]);
  }
  return out;
}

function deformN(poly, variance, decay, n) {
  let p=poly;
  for (let i=0;i<n;i++) p=deformPoly(p, variance*Math.pow(decay,i));
  return p;
}

/* ── Polygon centroid ── */
function centroid(poly) {
  let cx=0,cy=0;
  poly.forEach(function(p){cx+=p[0];cy+=p[1];});
  return [cx/poly.length, cy/poly.length];
}

/* ── Polygon bounding radius from centroid ── */
function boundRadius(poly, cx, cy) {
  let r=0;
  poly.forEach(function(p){
    const d=Math.sqrt((p[0]-cx)*(p[0]-cx)+(p[1]-cy)*(p[1]-cy));
    if(d>r) r=d;
  });
  return r;
}

function polyPath(poly) {
  ctx.beginPath();
  ctx.moveTo(poly[0][0],poly[0][1]);
  for(let i=1;i<poly.length;i++) ctx.lineTo(poly[i][0],poly[i][1]);
  ctx.closePath();
}

/* ── Make initial blob polygon ── */
function makeBlob(cx, cy, r, n) {
  return Array.from({length:n}, function(_,i) {
    const a = (i/n)*Math.PI*2 - Math.PI/2;
    const rad = r*(0.65+Math.random()*0.7);
    return [cx+Math.cos(a)*rad, cy+Math.sin(a)*rad];
  });
}

/* ── Paint one watercolor blob ── */
function paintBlob(basePoly, colors, layers) {
  // Heavy deform → base shape
  const baseShape = deformN(basePoly, 0.18, 0.62, 7);
  const [bcx, bcy] = centroid(baseShape);
  const brad = boundRadius(baseShape, bcx, bcy);

  for (let li=0; li<layers; li++) {
    const ci = Math.floor(li/5) % colors.length;
    const [h,s,l] = colors[ci];
    const hv = h+randn()*10;
    const sv = Math.max(0.1, Math.min(1, s+randn()*0.07));
    const lv = Math.max(0.2, Math.min(0.92, l+randn()*0.04));

    // Further deform per layer
    const shape = deformN(baseShape, 0.055, 0.72, 4);
    const [cx,cy] = centroid(shape);
    const edgeR = boundRadius(shape, cx, cy);

    ctx.save();

    // ── Key technique: use shadowBlur to create soft bleeding edges ──
    // Draw the polygon as a shadow source — the shadow IS the paint stroke
    // Shadow spreads and fades just like wet paint bleeding into paper
    const bleed = edgeR * (0.12 + Math.random()*0.18);
    ctx.shadowColor = hslStr(hv, sv, lv, 0.18 + Math.random()*0.10);
    ctx.shadowBlur  = bleed;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;

    // Fill with very low opacity — shadow does the edge work
    polyPath(shape);
    ctx.fillStyle = hslStr(hv, sv, lv * 0.92, 0.035);
    ctx.fill();

    ctx.shadowColor = 'transparent';

    // ── Radial gradient fill: dense center, transparent edge ──
    // This creates the classic watercolor "bloom" — darker in middle
    const grad = ctx.createRadialGradient(cx,cy, 0, cx,cy, edgeR*1.1);
    grad.addColorStop(0,   hslStr(hv, sv, lv*0.85, 0.06));
    grad.addColorStop(0.5, hslStr(hv, sv, lv,      0.03));
    grad.addColorStop(1.0, hslStr(hv, sv, lv,      0.00));
    polyPath(shape);
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.restore();
  }

  // ── Post-blob: scatter tiny bleed dots along the perimeter ──
  // These simulate paint bleeding beyond the shape edge
  const [cx2,cy2] = centroid(baseShape);
  const er2 = boundRadius(baseShape, cx2, cy2);
  const [h0,s0,l0] = colors[0];
  const bleedDots = 300 + Math.floor(Math.random()*400);
  for (let d=0; d<bleedDots; d++) {
    const angle = Math.random()*Math.PI*2;
    // Dots clustered just beyond the edge radius
    const dist = er2*(0.85 + Math.abs(gauss(0, 0.15)));
    const dx = cx2 + Math.cos(angle)*dist;
    const dy = cy2 + Math.sin(angle)*dist;
    const dr = Math.abs(gauss(0, er2*0.012));
    ctx.shadowColor = 'transparent';
    ctx.beginPath();
    ctx.arc(dx, dy, Math.max(0.3, dr), 0, Math.PI*2);
    ctx.fillStyle = hslStr(h0+randn()*15, s0, l0, 0.015+Math.random()*0.025);
    ctx.fill();
  }
}

/* ── Render ── */
function render() {
  const W=canvas.width, H=canvas.height;

  ctx.fillStyle='#f6f1e9';
  ctx.fillRect(0,0,W,H);

  // Paper grain
  for(let i=0;i<6000;i++){
    ctx.fillStyle='rgba(0,0,0,'+(0.003+Math.random()*0.012)+')';
    ctx.fillRect(Math.random()*W, Math.random()*H, 1, 1);
  }

  const palette = PALETTES[Math.floor(Math.random()*PALETTES.length)]();
  const numBlobs = 3 + Math.floor(Math.random()*5);

  for(let b=0; b<numBlobs; b++){
    const cx = W*(0.12+Math.random()*0.76);
    const cy = H*(0.12+Math.random()*0.76);
    const r  = Math.min(W,H)*(0.08+Math.random()*0.25);
    const n  = 6+Math.floor(Math.random()*6);
    const numColors = 1+Math.floor(Math.random()*3);
    const blobColors = Array.from({length:numColors}, function(){
      return palette[Math.floor(Math.random()*palette.length)];
    });
    const base = makeBlob(cx, cy, r, n);
    paintBlob(base, blobColors, 50+Math.floor(Math.random()*35));
  }
}

function regenerate(){
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  render();
}

window.addEventListener('resize', regenerate);
regenerate();
</script>
</body>
</html>
