<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>String Art Animated</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
  #ui {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 16px; align-items: center; z-index: 100;
  }
  button { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); color: #fff; font-family: monospace; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; padding: 8px 20px; cursor: pointer; }
  label { font-family: monospace; font-size: 11px; color: #ccc; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <button onclick="toggleAnim()" id="pauseBtn">⏸ Pause</button>
  <button onclick="regenerate()">↺ Colors</button>
  <span id="info" style="font-family:monospace;font-size:10px;color:#888;align-self:center"></span>
</div>
<script>
var canvas = document.getElementById('c');
var ctx    = canvas.getContext('2d');
var bgColor   = '#0a0a0a';
var lineColor = '#f0ece0';

var COLORS = [
  { bg:'#0a0a0a',   line:'#f0ece0' },
  { bg:'#f5f0eb',   line:'#1a1a1a' },
  { bg:'#0a0a1e',   line:'#88aaff' },
  { bg:'#0a1e0a',   line:'#88ffaa' },
  { bg:'#1e0a0a',   line:'#ff8888' },
  { bg:'#1a0a1e',   line:'#dd88ff' },
];
var currentColors = COLORS[0];

function render() {
  var n = parseInt(document.getElementById('nSlider').value);
  var lw = parseFloat(document.getElementById('wSlider').value);
  document.getElementById('nLbl').textContent = n;
  document.getElementById('wLbl').textContent = lw;

  var W = canvas.width, H = canvas.height;
  var size = Math.min(W, H) * 0.82;
  var ox = (W - size) / 2;
  var oy = (H - size) / 2;

  ctx.fillStyle = currentColors.bg;
  ctx.fillRect(0, 0, W, H);

  // 7px contrasting border around the square
  ctx.strokeStyle = currentColors.line;
  ctx.lineWidth = 7;
  ctx.strokeRect(ox, oy, size, size);

  // Draw the square
  ctx.strokeStyle = currentColors.line;
  ctx.lineWidth = lw;

  /* ── String art parabola envelope ──────────────────────
     For each set, we have N evenly spaced points on two edges.
     Line i connects point i on edge A to point (N-i) on edge B.
     This creates a parabolic envelope.

     Set 1: top edge (left→right) to left edge (top→bottom)
             creates curve in top-left corner

     Set 2: bottom edge (right→left) to right edge (bottom→top)
             mirror of set 1, creates curve in bottom-right corner

     Together they form the diagonal pattern in the image.
  ── */

  // Exponential spacing with low k — starts slow, opens gradually
  // k=1.2 gives gentle opening, k=3 gives dramatic fan
  function fiboSpacing(n) {
    var k = parseFloat(document.getElementById("kSlider").value);
    var p = parseFloat(document.getElementById("pSlider").value);
    document.getElementById("kLbl").textContent = k.toFixed(1);
    document.getElementById("pLbl").textContent = p.toFixed(2);
    var pts = [];
    for (var i = 1; i < n; i++) {
      var t = (Math.exp(i/n * k) - 1) / (Math.exp(k) - 1);
      t = Math.pow(t, p);  // p<1 spreads top more, p>1 bunches top more
      pts.push(t);
    }
    return pts;
  }

  function drawSet(ax0,ay0, ax1,ay1, bx0,by0, bx1,by1) {
    var tA = fiboSpacing(n);
    var tB = fiboSpacing(n).slice().reverse();

    for (var i = 1; i < n; i++) {
      var ax = ax0 + (ax1-ax0)*tA[i];
      var ay = ay0 + (ay1-ay0)*tA[i];
      var bx = bx0 + (bx1-bx0)*tB[i];
      var by = by0 + (by1-by0)*tB[i];
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(bx, by);
      ctx.stroke();
    }
  }

  // Lines go from left edge to right edge
  // Left edge: points bunched at top, spread at bottom
  // Right edge: points spread at top, bunched at bottom (reversed)
  // This creates the diagonal sweep illusion

  drawSet(
    ox,      oy,        ox,      oy+size,   // left edge: top to bottom
    ox+size, oy+size,   ox+size, oy         // right edge: bottom to top
  );
}

/* ── Animation state ── */
var anim = {
  n:    { val: 24,  target: 24,  min: 8,   max: 50,  speed: 0.02 },
  lw:   { val: 1.5, target: 2.0, min: 0.4, max: 4.0, speed: 0.008 },
  k:    { val: 3.2, target: 3.5, min: 1.5, max: 4.5, speed: 0.005 },
  p:    { val: 0.7, target: 0.8, min: 0.3, max: 1.4, speed: 0.004 },
};

function newTarget(a) {
  a.target = a.min + Math.random() * (a.max - a.min);
}

function stepParam(a) {
  var diff = a.target - a.val;
  a.val += diff * a.speed;
  if (Math.abs(diff) < 0.01) newTarget(a);
}

var running = true;

function renderAnim() {
  stepParam(anim.n);
  stepParam(anim.lw);
  stepParam(anim.k);
  stepParam(anim.p);

  var W = canvas.width, H = canvas.height;
  var size = Math.min(W,H) * 0.82;
  var ox = (W-size)/2, oy = (H-size)/2;
  var n  = Math.round(anim.n.val);
  var lw = anim.lw.val;
  var k  = anim.k.val;
  var p  = anim.p.val;

  ctx.fillStyle = currentColors.bg;
  ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = currentColors.line;
  ctx.lineWidth = 7;
  ctx.strokeRect(ox, oy, size, size);

  // Build spacing
  var pts = [];
  for (var i = 1; i < n; i++) {
    var t = (Math.exp(i/n * k) - 1) / (Math.exp(k) - 1);
    t = Math.pow(t, p);
    pts.push(t);
  }
  var ptsR = pts.slice().reverse();

  ctx.strokeStyle = currentColors.line;
  ctx.lineWidth = lw;

  for (var i = 0; i < pts.length; i++) {
    var ax = ox,        ay = oy + pts[i]*size;
    var bx = ox+size,   by = oy + size - ptsR[i]*size;
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
  }

  document.getElementById('info').textContent =
    'n:' + n + ' lw:' + lw.toFixed(1) + ' k:' + k.toFixed(2) + ' p:' + p.toFixed(2);

  if (running) requestAnimationFrame(renderAnim);
}

function toggleAnim() {
  running = !running;
  document.getElementById('pauseBtn').textContent = running ? '⏸ Pause' : '▶ Play';
  if (running) renderAnim();
}

function regenerate() {
  currentColors = COLORS[Math.floor(Math.random() * COLORS.length)];
  // Kick all targets to new random values
  Object.values(anim).forEach(newTarget);
}

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}

window.addEventListener('resize', resize);
canvas.width  = window.innerWidth;
canvas.height = window.innerHeight;
renderAnim();
</script>
</body>
</html>
