<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chladni Figures — 3×3 Grid</title>
<style>
  :root {
    --bg: #f7f5ef;
    --fg: #1f1e1d;
    --muted: #6b6a66;
    --border: rgba(0,0,0,0.12);
    --surface: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 24px;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .wrap {
    width: 100%;
    max-width: 760px;
  }
  header {
    margin: 0 0 20px;
  }
  h1 {
    font-size: 22px;
    font-weight: 500;
    margin: 0 0 4px;
  }
  .subtitle {
    font-size: 13px;
    color: var(--muted);
    margin: 0;
  }
  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
    margin: 0 0 16px;
    flex-wrap: wrap;
  }
  button {
    font: inherit;
    font-size: 13px;
    padding: 8px 14px;
    background: var(--surface);
    color: var(--fg);
    border: 0.5px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  button:hover { background: #efece4; }
  button:active { transform: scale(0.98); }
  .palette-name {
    margin-left: auto;
    font-size: 12px;
    color: var(--muted);
    font-variant-caps: all-small-caps;
    letter-spacing: 0.05em;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .tile {
    aspect-ratio: 1 / 1;
    border-radius: 8px;
    overflow: hidden;
    position: relative;
  }
  .tile canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  .tile-label {
    position: absolute;
    bottom: 6px;
    right: 8px;
    font-size: 10px;
    font-variant-numeric: tabular-nums;
    opacity: 0.55;
    pointer-events: none;
  }
  footer {
    margin: 20px 0 0;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Chladni figures</h1>
    <p class="subtitle">Nodal patterns of standing waves on a square plate</p>
  </header>

  <div class="controls">
    <button id="reroll-patterns">New patterns</button>
    <button id="reroll-palette">New palette</button>
    <span class="palette-name" id="palette-name"></span>
  </div>

  <div class="grid" id="grid"></div>

  <footer>
    Each tile renders u(x,y) = cos(mπx)·cos(nπy) + α·cos(nπx)·cos(mπy). Sand collects where u ≈ 0.
  </footer>
</div>

<script>
(function() {
  const gridEl = document.getElementById('grid');
  const paletteNameEl = document.getElementById('palette-name');

  // Curated palettes — each is [background, sand]
  const palettes = [
    { name: 'graphite',  bg: '#f1efe8', sand: '#2c2c2a' },
    { name: 'midnight',  bg: '#042c53', sand: '#b5d4f4' },
    { name: 'teal pool', bg: '#e1f5ee', sand: '#04342c' },
    { name: 'coral',     bg: '#faece7', sand: '#4a1b0c' },
    { name: 'rose',      bg: '#fbeaf0', sand: '#4b1528' },
    { name: 'amber',     bg: '#faeeda', sand: '#412402' },
    { name: 'forest',    bg: '#173404', sand: '#c0dd97' },
    { name: 'iris',      bg: '#eeedfe', sand: '#26215c' },
    { name: 'rust',      bg: '#4a1b0c', sand: '#f5c4b3' },
    { name: 'oxblood',   bg: '#501313', sand: '#f7c1c1' },
    { name: 'mint',      bg: '#9fe1cb', sand: '#04342c' },
    { name: 'lilac',     bg: '#cecbf6', sand: '#26215c' },
    { name: 'sand',      bg: '#fac775', sand: '#412402' },
    { name: 'plum',      bg: '#3c3489', sand: '#cecbf6' },
    { name: 'noir',      bg: '#1a1a1a', sand: '#f0e8d0' },
    { name: 'paper',     bg: '#fafaf5', sand: '#1a1a1a' }
  ];

  function hexToRGB(hex) {
    const h = hex.replace('#', '');
    return [
      parseInt(h.slice(0,2), 16),
      parseInt(h.slice(2,4), 16),
      parseInt(h.slice(4,6), 16)
    ];
  }

  function randomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function randomPattern() {
    // Pick m, n with a bias toward more interesting patterns
    let m = randomInt(2, 9);
    let n = randomInt(2, 9);
    // Avoid m === n (those are visually less interesting / too symmetric)
    if (m === n) n = ((n) % 9) + 2;
    // Random coupling
    const aChoices = [-1, -0.7, -0.5, 0.5, 0.7, 1, 1, 1]; // bias toward classic
    const a = aChoices[Math.floor(Math.random() * aChoices.length)];
    return { m, n, a };
  }

  let currentPalette = palettes[Math.floor(Math.random() * palettes.length)];
  let currentPatterns = Array.from({ length: 9 }, randomPattern);

  function renderTile(canvas, pattern, palette) {
    const ctx = canvas.getContext('2d');
    // Render at a fixed resolution for crisp output
    const RES = 240;
    canvas.width = RES;
    canvas.height = RES;

    const [br, bg, bb] = hexToRGB(palette.bg);
    const [sr, sg, sb] = hexToRGB(palette.sand);

    const img = ctx.createImageData(RES, RES);
    const data = img.data;
    const PI = Math.PI;
    const { m, n, a } = pattern;

    for (let py = 0; py < RES; py++) {
      const y = py / (RES - 1);
      for (let px = 0; px < RES; px++) {
        const x = px / (RES - 1);
        const u = Math.cos(m * PI * x) * Math.cos(n * PI * y)
                + a * Math.cos(n * PI * x) * Math.cos(m * PI * y);

        // Sand intensity: high where |u| is small (near nodal lines)
        const t = Math.exp(-Math.abs(u) * 16);

        // Blend bg and sand by t
        const idx = (py * RES + px) * 4;
        data[idx]     = Math.round(br + (sr - br) * t);
        data[idx + 1] = Math.round(bg + (sg - bg) * t);
        data[idx + 2] = Math.round(bb + (sb - bb) * t);
        data[idx + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  function buildGrid() {
    gridEl.innerHTML = '';
    paletteNameEl.textContent = currentPalette.name;

    currentPatterns.forEach((pattern, i) => {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.style.background = currentPalette.bg;

      const canvas = document.createElement('canvas');
      tile.appendChild(canvas);

      const label = document.createElement('div');
      label.className = 'tile-label';
      label.style.color = currentPalette.sand;
      label.textContent = `${pattern.m},${pattern.n}`;
      tile.appendChild(label);

      gridEl.appendChild(tile);
      renderTile(canvas, pattern, currentPalette);
    });
  }

  document.getElementById('reroll-patterns').addEventListener('click', () => {
    currentPatterns = Array.from({ length: 9 }, randomPattern);
    buildGrid();
  });

  document.getElementById('reroll-palette').addEventListener('click', () => {
    // Pick a different palette than current
    let next = currentPalette;
    while (next.name === currentPalette.name) {
      next = palettes[Math.floor(Math.random() * palettes.length)];
    }
    currentPalette = next;
    buildGrid();
  });

  buildGrid();
})();
</script>
</body>
</html>
