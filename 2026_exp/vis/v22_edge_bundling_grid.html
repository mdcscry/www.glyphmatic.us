<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edge Bundling</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #f8f7f3; overflow: hidden; }
  canvas { display: block; position: fixed; inset: 0; }
  #ui {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    z-index: 10; display: flex; gap: 12px;
  }
  button {
    background: rgba(0,0,0,0.07); border: 1px solid rgba(0,0,0,0.22);
    color: #222; font-family: monospace; font-size: 11px; letter-spacing: 0.15em;
    text-transform: uppercase; padding: 8px 24px; cursor: pointer; transition: background 0.2s;
  }
  button:hover { background: rgba(0,0,0,0.14); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <button onclick="regenerate()">&#x21BA; Regenerate</button>
  <button onclick="newColors()">&#x21BA; Colors</button>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const GRID = 5;

/* ── Colors ── */
function randomColorMode() {
  const modes = [
    { a: '#c0392b', b: '#27ae60' },
    { a: '#2980b9', b: '#8e44ad' },
    { a: '#e67e22', b: '#16a085' },
    { a: '#c0392b', b: '#2471a3' },
    { a: '#6c3483', b: '#1e8449' },
    { a: '#d35400', b: '#1a5276' },
  ];
  return modes[Math.floor(Math.random() * modes.length)];
}
let colors = randomColorMode();

function hexToRgb(h) {
  return { r:parseInt(h.slice(1,3),16), g:parseInt(h.slice(3,5),16), b:parseInt(h.slice(5,7),16) };
}
function blendColor(a, b, t) {
  const ca=hexToRgb(a), cb=hexToRgb(b);
  return 'rgb('+Math.round(ca.r+(cb.r-ca.r)*t)+','+Math.round(ca.g+(cb.g-ca.g)*t)+','+Math.round(ca.b+(cb.b-ca.b)*t)+')';
}

/* ── Generate ── */
function generate() {
  const W=canvas.width, H=canvas.height;
  const PAD=24;
  const iW=W-PAD*2, iH=H-PAD*2;
  const cW=iW/GRID, cH=iH/GRID;

  const cells = Array.from({length:GRID*GRID}, function(_,i) {
    const row=Math.floor(i/GRID), col=i%GRID;
    return {
      id:i, row, col,
      cx: PAD+col*cW+cW/2,
      cy: PAD+row*cH+cH/2
    };
  });

  // Fewer nodes: 1-3 per cell, total ~25-40
  const nodes = [];
  let nid = 0;
  cells.forEach(function(cell) {
    const count = 2 + Math.floor(Math.random() * 5);
    for (let n=0; n<count; n++) {
      nodes.push({
        id: nid++,
        x: PAD + cell.col*cW + cW*0.1 + Math.random()*cW*0.8,
        y: PAD + cell.row*cH + cH*0.1 + Math.random()*cH*0.8,
        cell: cell.id,
        cx: cell.cx, cy: cell.cy,
        degree: 0
      });
    }
  });

  // Designate 3-5 extreme hubs explicitly
  const numHubs = 4 + Math.floor(Math.random() * 3);
  const hubIndices = [];
  const shuffled = nodes.map(function(n,i){return i;})
    .sort(function(){return Math.random()-0.5;})
    .slice(0, numHubs);
  shuffled.forEach(function(i){ hubIndices.push(i); });

  const edges = [];
  const edgeSet = {};

  function addEdge(a, b) {
    const key = Math.min(a.id,b.id)+'-'+Math.max(a.id,b.id);
    if (edgeSet[key] || a.id===b.id) return false;
    edgeSet[key] = true;
    a.degree++;
    b.degree++;
    edges.push({src:a, tgt:b});
    return true;
  }

  // Give each hub 15–35 connections fanning to random nodes
  hubIndices.forEach(function(hi) {
    const hub = nodes[hi];
    const fanCount = 50 + Math.floor(Math.random() * 30);
    const others = nodes.filter(function(n){return n.id!==hub.id;});
    // Shuffle others, take fanCount
    const targets = others.sort(function(){return Math.random()-0.5;}).slice(0, fanCount);
    targets.forEach(function(t){ addEdge(hub, t); });
  });

  // Non-hub nodes: only 1-2 connections each, strongly preferring hubs
  nodes.forEach(function(node) {
    if (hubIndices.indexOf(node.id) >= 0) return; // skip hubs
    // all non-hubs get connected
    // Connect to a random hub or occasionally another node
    const connectCount = 1 + (Math.random() < 0.7 ? 1 : 0) + (Math.random() < 0.3 ? 1 : 0);
    for (let c=0; c<connectCount; c++) {
      if (Math.random() < 0.75) {
        // Connect to a hub
        const hub = nodes[hubIndices[Math.floor(Math.random()*hubIndices.length)]];
        addEdge(node, hub);
      } else {
        // Connect to random other non-hub
        const others = nodes.filter(function(n){return n.id!==node.id && hubIndices.indexOf(n.id)<0;});
        if (others.length > 0) {
          addEdge(node, others[Math.floor(Math.random()*others.length)]);
        }
      }
    }
  });

  return {nodes, edges, cells, cW, cH, PAD};
}

/* ── Draw edge: node → src centroid → tgt centroid → node ── */
function drawEdge(edge, lineW, alpha) {
  const {src, tgt} = edge;
  const angle = Math.atan2(tgt.cy-src.cy, tgt.cx-src.cx);
  const t = (angle/Math.PI + 1) / 2;
  ctx.strokeStyle = blendColor(colors.a, colors.b, t);
  ctx.lineWidth = lineW;
  ctx.globalAlpha = alpha;
  ctx.beginPath();
  ctx.moveTo(src.x, src.y);
  ctx.bezierCurveTo(src.cx, src.cy, tgt.cx, tgt.cy, tgt.x, tgt.y);
  ctx.stroke();
}

function render() {
  const W=canvas.width, H=canvas.height;
  const world = generate();
  const {nodes, edges, cells, cW, cH, PAD} = world;
  const maxDeg = Math.max.apply(null, nodes.map(function(n){return n.degree;}));

  ctx.globalAlpha=1;
  ctx.fillStyle='#f8f7f3';
  ctx.fillRect(0,0,W,H);

  // Grid
  ctx.strokeStyle='rgba(0,0,0,0.09)';
  ctx.lineWidth=0.7;
  for (let i=0;i<=GRID;i++) {
    ctx.beginPath(); ctx.moveTo(PAD+i*cW,PAD); ctx.lineTo(PAD+i*cW,H-PAD); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(PAD,PAD+i*cH); ctx.lineTo(W-PAD,PAD+i*cH); ctx.stroke();
  }

  ctx.lineCap='round';

  // Sort: low degree edges first, high degree on top
  const sorted = edges.slice().sort(function(a,b){
    return (a.src.degree+a.tgt.degree)-(b.src.degree+b.tgt.degree);
  });

  // Glow
  sorted.forEach(function(e){ drawEdge(e, 7, 0.018); });
  // Medium
  sorted.forEach(function(e){ drawEdge(e, 2.5, 0.055); });
  // Core — opacity by degree
  sorted.forEach(function(e){
    const t = Math.min(1,(e.src.degree+e.tgt.degree)/(maxDeg*1.2));
    drawEdge(e, 0.75, 0.18 + t*0.65);
  });

  ctx.globalAlpha=1;

  // Nodes — fill=own color, border=opposite color, fewer small nodes
  const minR=1.5, maxR=11;
  nodes.forEach(function(node){
    if (node.degree === 0) return; // skip unconnected
    const t = maxDeg>0 ? node.degree/maxDeg : 0;
    if (t < 0.04 && Math.random() < 0.65) return; // cull most tiny nodes
    const r = minR + (maxR-minR) * Math.pow(t, 0.55);
    const nodeColor = blendColor(colors.a, colors.b, t);
    const borderColor = blendColor(colors.b, colors.a, t); // opposite blend
    ctx.globalAlpha = 0.9 + t*0.1;
    ctx.beginPath();
    ctx.arc(node.x, node.y, r, 0, Math.PI*2);
    ctx.fillStyle = nodeColor;
    ctx.fill();
    ctx.strokeStyle = borderColor;
    ctx.lineWidth = 0.8 + t * 2.2; // border thicker on big nodes
    ctx.stroke();
    ctx.globalAlpha = 1;
  });
}

function regenerate(){ colors=randomColorMode(); render(); }
function newColors() { colors=randomColorMode(); render(); }

function resize(){
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
  render();
}
window.addEventListener('resize', resize);
resize();
</script>
</body>
</html>
