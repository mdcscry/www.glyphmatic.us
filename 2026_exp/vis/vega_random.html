<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Random Vega-Lite</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; min-height: 100vh;
    background: #0d0e12;
    color: #e8e8ec;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  .page {
    max-width: 820px;
    margin: 0 auto;
    padding: 28px 20px 40px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin: 0;
    color: #b8bcc6;
  }
  header .meta {
    font-size: 11px;
    color: #6f7480;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: 0.3px;
  }
  header .meta b {
    color: #d8dce6;
    font-weight: 500;
  }
  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
  }
  button {
    appearance: none;
    background: #1a1d24;
    color: #e8e8ec;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 999px;
    padding: 8px 16px;
    font: inherit;
    font-size: 12px;
    letter-spacing: 0.4px;
    cursor: pointer;
    transition: background 0.12s ease, border-color 0.12s ease, transform 0.08s ease;
  }
  button:hover {
    background: #232730;
    border-color: rgba(255,255,255,0.18);
  }
  button:active { transform: translateY(1px); }
  .chart-wrap {
    background: #050608;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 18px;
    overflow: hidden;
    min-height: 500px;
  }
  /* Vega defaults to white text on light bg — override for dark theme */
  .chart-wrap .vega-embed { width: 100%; }
  .chart-wrap canvas { max-width: 100%; }
  footer {
    margin-top: 14px;
    font-size: 11px;
    color: #5a5e68;
    font-family: ui-monospace, Menlo, monospace;
    line-height: 1.6;
  }
  footer code {
    color: #8a8f99;
  }
</style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Random Vega-Lite</h1>
      <div class="meta" id="meta"></div>
    </header>
    <div class="controls">
      <button id="reroll">Reroll</button>
    </div>
    <div class="chart-wrap" id="chart"></div>
    <footer id="footer"></footer>
  </div>

<script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>

<script>
  // ---------- random utilities ----------
  const rand = (a, b) => a + Math.random() * (b - a);
  const irand = (a, b) => Math.floor(rand(a, b + 1));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const pickN = (arr, n) => {
    const c = arr.slice();
    for (let i = c.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [c[i], c[j]] = [c[j], c[i]];
    }
    return c.slice(0, n);
  };

  // ---------- color schemes available in Vega ----------
  // Mix of sequential, diverging, and categorical schemes that look good
  // on a dark background.
  const SEQUENTIAL = [
    'viridis', 'plasma', 'magma', 'inferno', 'cividis',
    'turbo', 'warmgreys', 'blues', 'greens', 'oranges',
    'purples', 'reds', 'tealblues', 'goldgreen', 'goldorange',
    'goldred', 'lightgreyred', 'lightgreyteal', 'purplebluegreen',
    'yelloworangered', 'sinebow', 'rainbow',
  ];
  const DIVERGING = [
    'redblue', 'redgrey', 'redyellowblue', 'redyellowgreen',
    'spectral', 'browngreen', 'pinkyellowgreen', 'purplegreen',
    'purpleorange',
  ];
  const CATEGORICAL = [
    'category10', 'category20', 'tableau10', 'tableau20',
    'set1', 'set2', 'set3', 'pastel1', 'pastel2', 'dark2',
    'accent', 'paired',
  ];

  // ---------- data generators ----------
  // Each generator returns { values, fields } where fields tells the spec
  // which columns to use for x/y/color/etc.

  function genScatter(n = 200) {
    // bivariate Gaussian-ish blobs with a third numeric dim
    const k = irand(2, 5);
    const centers = [];
    for (let i = 0; i < k; i++) {
      centers.push({ cx: rand(-50, 50), cy: rand(-50, 50), r: rand(8, 22) });
    }
    const values = [];
    for (let i = 0; i < n; i++) {
      const c = centers[irand(0, k - 1)];
      const x = c.cx + (Math.random() - 0.5) * c.r * 2;
      const y = c.cy + (Math.random() - 0.5) * c.r * 2;
      values.push({ x, y, w: rand(20, 400), category: 'g' + irand(0, k - 1) });
    }
    return values;
  }

  function genTimeSeries(n = 80, series = 1) {
    // smooth random walks
    const values = [];
    const start = new Date(2024, 0, 1);
    for (let s = 0; s < series; s++) {
      let v = rand(20, 80);
      for (let i = 0; i < n; i++) {
        v += rand(-5, 5);
        const date = new Date(start.getTime() + i * 86400000);
        values.push({
          date: date.toISOString().slice(0, 10),
          value: v,
          series: 'series ' + (s + 1),
        });
      }
    }
    return values;
  }

  function genCategorical(n = 8) {
    const cats = [
      'alpha','bravo','charlie','delta','echo','foxtrot','golf','hotel',
      'india','juliet','kilo','lima','mike','november','oscar','papa'
    ];
    const labels = pickN(cats, n);
    return labels.map(c => ({
      category: c,
      value: rand(10, 100),
      group: pick(['A', 'B', 'C']),
    }));
  }

  function genGrid(rows = 10, cols = 10) {
    // 2D heat grid
    const values = [];
    // a few random Gaussian bumps for interesting structure
    const bumps = [];
    for (let i = 0; i < irand(2, 5); i++) {
      bumps.push({
        cx: rand(0, cols), cy: rand(0, rows),
        sigma: rand(1.5, 4), amp: rand(0.5, 1.5) * (Math.random() < 0.3 ? -1 : 1),
      });
    }
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        let v = 0;
        for (const b of bumps) {
          const dx = c - b.cx, dy = r - b.cy;
          v += b.amp * Math.exp(-(dx*dx + dy*dy) / (2 * b.sigma * b.sigma));
        }
        values.push({ row: r, col: c, value: v });
      }
    }
    return values;
  }

  function genVectors(n = 250) {
    // wind-vector style: x, y on a grid, with direction + speed
    const values = [];
    // a swirl field for visually interesting directions
    const sx = rand(0, 100), sy = rand(0, 100), strength = rand(0.5, 2);
    for (let i = 0; i < n; i++) {
      const x = rand(0, 100);
      const y = rand(0, 100);
      // direction from a curl-ish field around (sx, sy)
      const dx = x - sx, dy = y - sy;
      const dir = (Math.atan2(dy, dx) * 180 / Math.PI + 90 + 360) % 360;
      const speed = Math.min(1, Math.hypot(dx, dy) / 50) * strength * rand(0.6, 1.4);
      values.push({ x, y, dir, speed });
    }
    return values;
  }

  // ---------- scenarios: (mark, data, encoding) bundles ----------
  // Each scenario builds and returns a complete Vega-Lite spec.

  const SCENARIOS = [
    {
      name: 'Scatter — point',
      build: (palette) => {
        const shape = pick(['circle','square','cross','diamond','triangle-up','triangle-down','triangle-right','triangle-left']);
        return {
          mark: { type: 'point', shape, filled: true, opacity: 0.75, size: 80 },
          data: { values: genScatter(220) },
          encoding: {
            x: { field: 'x', type: 'quantitative', axis: { grid: false } },
            y: { field: 'y', type: 'quantitative', axis: { grid: false } },
            color: { field: 'w', type: 'quantitative', scale: { scheme: palette.scheme }, legend: null },
            size: { field: 'w', type: 'quantitative', scale: { range: [20, 400] }, legend: null },
          },
        };
      },
      paletteKind: 'sequential',
    },
    {
      name: 'Wind vectors — wedge',
      build: (palette) => ({
        mark: { type: 'point', shape: 'wedge', filled: true },
        data: { values: genVectors(280) },
        encoding: {
          x: { field: 'x', type: 'quantitative', axis: null },
          y: { field: 'y', type: 'quantitative', axis: null },
          color: {
            field: 'dir', type: 'quantitative',
            scale: { domain: [0, 360], scheme: palette.scheme }, legend: null,
          },
          angle: {
            field: 'dir', type: 'quantitative',
            scale: { domain: [0, 360], range: [180, 540] },
          },
          size: { field: 'speed', type: 'quantitative', scale: { rangeMax: 600 }, legend: null },
        },
        config: { view: { stroke: null, fill: '#000' } },
      }),
      paletteKind: 'sequential',
    },
    {
      name: 'Wind vectors — arrow',
      build: (palette) => ({
        mark: { type: 'point', shape: 'arrow', filled: true },
        data: { values: genVectors(220) },
        encoding: {
          x: { field: 'x', type: 'quantitative', axis: null },
          y: { field: 'y', type: 'quantitative', axis: null },
          color: { field: 'dir', type: 'quantitative', scale: { domain: [0, 360], scheme: palette.scheme }, legend: null },
          angle: { field: 'dir', type: 'quantitative', scale: { domain: [0, 360], range: [0, 360] } },
          size: { field: 'speed', type: 'quantitative', scale: { rangeMax: 500 }, legend: null },
        },
        config: { view: { stroke: null, fill: '#000' } },
      }),
      paletteKind: 'sequential',
    },
    {
      name: 'Wind vectors — stroke',
      build: (palette) => ({
        mark: { type: 'point', shape: 'stroke', strokeWidth: 2 },
        data: { values: genVectors(300) },
        encoding: {
          x: { field: 'x', type: 'quantitative', axis: null },
          y: { field: 'y', type: 'quantitative', axis: null },
          color: { field: 'dir', type: 'quantitative', scale: { domain: [0, 360], scheme: palette.scheme }, legend: null },
          angle: { field: 'dir', type: 'quantitative', scale: { domain: [0, 360], range: [0, 360] } },
          size: { field: 'speed', type: 'quantitative', scale: { rangeMax: 600 }, legend: null },
        },
        config: { view: { stroke: null, fill: '#000' } },
      }),
      paletteKind: 'sequential',
    },
    {
      name: 'Heat grid — rect',
      build: (palette) => {
        const rows = irand(8, 14);
        const cols = irand(10, 18);
        return {
          mark: { type: 'rect' },
          data: { values: genGrid(rows, cols) },
          encoding: {
            x: { field: 'col', type: 'ordinal', axis: null },
            y: { field: 'row', type: 'ordinal', axis: null },
            color: { field: 'value', type: 'quantitative', scale: { scheme: palette.scheme }, legend: null },
          },
          config: { view: { stroke: null } },
        };
      },
      paletteKind: 'diverging',
    },
    {
      name: 'Time series — line',
      build: (palette) => ({
        mark: { type: 'line', strokeWidth: 2, interpolate: pick(['linear','monotone','basis','catmull-rom']) },
        data: { values: genTimeSeries(120, irand(2, 5)) },
        encoding: {
          x: { field: 'date', type: 'temporal', axis: { grid: false } },
          y: { field: 'value', type: 'quantitative', axis: { grid: true } },
          color: { field: 'series', type: 'nominal', scale: { scheme: palette.scheme }, legend: null },
        },
      }),
      paletteKind: 'categorical',
    },
    {
      name: 'Time series — area',
      build: (palette) => ({
        mark: { type: 'area', opacity: 0.75, interpolate: pick(['monotone','basis','catmull-rom']) },
        data: { values: genTimeSeries(80, irand(3, 5)) },
        encoding: {
          x: { field: 'date', type: 'temporal', axis: { grid: false } },
          y: { field: 'value', type: 'quantitative', stack: 'zero' },
          color: { field: 'series', type: 'nominal', scale: { scheme: palette.scheme }, legend: null },
        },
      }),
      paletteKind: 'categorical',
    },
    {
      name: 'Bars — vertical',
      build: (palette) => ({
        mark: { type: 'bar', cornerRadiusEnd: 3 },
        data: { values: genCategorical(irand(6, 12)) },
        encoding: {
          x: { field: 'category', type: 'nominal', sort: '-y', axis: { labelAngle: -30 } },
          y: { field: 'value', type: 'quantitative', axis: { grid: false } },
          color: { field: 'value', type: 'quantitative', scale: { scheme: palette.scheme }, legend: null },
        },
      }),
      paletteKind: 'sequential',
    },
    {
      name: 'Bars — horizontal',
      build: (palette) => ({
        mark: { type: 'bar', cornerRadiusEnd: 3 },
        data: { values: genCategorical(irand(6, 12)) },
        encoding: {
          y: { field: 'category', type: 'nominal', sort: '-x' },
          x: { field: 'value', type: 'quantitative', axis: { grid: false } },
          color: { field: 'category', type: 'nominal', scale: { scheme: palette.scheme }, legend: null },
        },
      }),
      paletteKind: 'categorical',
    },
    {
      name: 'Tick distribution',
      build: (palette) => ({
        mark: { type: 'tick', thickness: 2 },
        data: { values: genScatter(180) },
        encoding: {
          x: { field: 'x', type: 'quantitative', axis: { grid: false } },
          y: { field: 'category', type: 'nominal' },
          color: { field: 'category', type: 'nominal', scale: { scheme: palette.scheme }, legend: null },
        },
      }),
      paletteKind: 'categorical',
    },
    {
      name: 'Bubble — circle',
      build: (palette) => ({
        mark: { type: 'circle', opacity: 0.75 },
        data: { values: genScatter(180) },
        encoding: {
          x: { field: 'x', type: 'quantitative', axis: { grid: false } },
          y: { field: 'y', type: 'quantitative', axis: { grid: false } },
          size: { field: 'w', type: 'quantitative', scale: { range: [30, 800] }, legend: null },
          color: { field: 'w', type: 'quantitative', scale: { scheme: palette.scheme }, legend: null },
        },
      }),
      paletteKind: 'sequential',
    },
    {
      name: 'Square mosaic',
      build: (palette) => ({
        mark: { type: 'square', opacity: 0.85 },
        data: { values: genScatter(220) },
        encoding: {
          x: { field: 'x', type: 'quantitative', axis: { grid: false } },
          y: { field: 'y', type: 'quantitative', axis: { grid: false } },
          size: { field: 'w', type: 'quantitative', scale: { range: [40, 700] }, legend: null },
          color: { field: 'category', type: 'nominal', scale: { scheme: palette.scheme }, legend: null },
        },
      }),
      paletteKind: 'categorical',
    },
    {
      name: 'Text glyphs',
      build: (palette) => {
        const glyph = pick(['◆','▲','✦','★','✺','✚','◉','▣','✸','◈']);
        return {
          mark: { type: 'text', text: glyph, fontSize: 14 },
          data: { values: genVectors(250) },
          encoding: {
            x: { field: 'x', type: 'quantitative', axis: null },
            y: { field: 'y', type: 'quantitative', axis: null },
            color: { field: 'dir', type: 'quantitative', scale: { domain: [0, 360], scheme: palette.scheme }, legend: null },
            angle: { field: 'dir', type: 'quantitative', scale: { domain: [0, 360], range: [0, 360] } },
            size: { field: 'speed', type: 'quantitative', scale: { range: [60, 400] }, legend: null },
          },
          config: { view: { stroke: null, fill: '#000' } },
        };
      },
      paletteKind: 'sequential',
    },
    {
      name: 'Density rule',
      build: (palette) => ({
        mark: { type: 'rule', strokeWidth: 2, opacity: 0.6 },
        data: { values: genTimeSeries(60, irand(2, 4)) },
        encoding: {
          x: { field: 'date', type: 'temporal', axis: { grid: false } },
          y: { field: 'value', type: 'quantitative', axis: { grid: false } },
          y2: { datum: 0 },
          color: { field: 'series', type: 'nominal', scale: { scheme: palette.scheme }, legend: null },
        },
      }),
      paletteKind: 'categorical',
    },
  ];

  function pickPalette(kind) {
    let pool = SEQUENTIAL;
    if (kind === 'diverging') pool = DIVERGING;
    else if (kind === 'categorical') pool = CATEGORICAL;
    return { scheme: pick(pool), kind };
  }

  // ---------- render ----------
  function render() {
    const scenario = pick(SCENARIOS);
    const palette = pickPalette(scenario.paletteKind);
    const built = scenario.build(palette);

    // shared dark theme + dimensions
    const spec = Object.assign({
      $schema: 'https://vega.github.io/schema/vega-lite/v6.json',
      width: 720,
      height: 460,
      background: '#050608',
      config: Object.assign({
        axis: {
          domainColor: '#3a3e48',
          tickColor: '#3a3e48',
          gridColor: '#1a1d24',
          labelColor: '#8a8f99',
          titleColor: '#b8bcc6',
          labelFontSize: 11,
          titleFontSize: 11,
        },
        view: { stroke: null },
        background: '#050608',
      }, built.config || {}),
    }, built);
    delete spec.config.config; // safety in case of nested merge oddities

    document.getElementById('meta').innerHTML =
      `<b>${scenario.name}</b> &nbsp;·&nbsp; scheme: <b>${palette.scheme}</b>`;
    document.getElementById('footer').innerHTML =
      `<code>mark: ${typeof spec.mark === 'string' ? spec.mark : spec.mark.type}</code>` +
      `${spec.mark.shape ? ` &nbsp;·&nbsp; <code>shape: ${spec.mark.shape}</code>` : ''}` +
      ` &nbsp;·&nbsp; <code>${(spec.data.values || []).length} rows</code>`;

    vegaEmbed('#chart', spec, {
      actions: false,
      renderer: 'canvas',
    }).catch(err => {
      document.getElementById('chart').innerHTML =
        `<pre style="color:#f88;font-size:11px;">${err.message}</pre>`;
    });
  }

  document.getElementById('reroll').addEventListener('click', render);
  render();
</script>
</body>
</html>
