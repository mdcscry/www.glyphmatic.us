<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ridgeline Grid</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #07060e; overflow: hidden; }
  svg { display: block; position: fixed; inset: 0; }
  #ui {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    z-index: 10; display: flex; gap: 12px;
  }
  button {
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; font-family: monospace; font-size: 11px; letter-spacing: 0.15em;
    text-transform: uppercase; padding: 8px 24px; cursor: pointer; transition: background 0.2s;
  }
  button:hover { background: rgba(255,255,255,0.14); }
</style>
</head>
<body>
<svg id="viz"></svg>
<div id="ui">
  <button onclick="regenerate()">&#x21BA; Regenerate</button>
  <button onclick="newColors()">&#x21BA; Colors Only</button>
</div>
<script>
const GRID = 3;
const GAP  = 0;

/* ── Palette modes ── */
const PALETTE_MODES = [
  () => { const b=Math.random()*360; return Array.from({length:12},(_,i)=>d3.hsl((b+i*22)%360,0.85,0.55+i*0.018).toString()); },
  () => Array.from({length:12},()=>d3.hsl(Math.random()*360,0.88,0.58+Math.random()*0.15).toString()),
  () => { const b=Math.random()*360; return Array.from({length:12},(_,i)=>d3.hsl((b+i*8)%360,0.92,0.50+i*0.025).toString()); },
  () => Array.from({length:12},(_,i)=>d3.hsl(200+i*14,0.80,0.45+i*0.03).toString()),
  () => Array.from({length:12},(_,i)=>d3.hsl(340+i*10,0.85,0.48+i*0.025).toString()),
];
function randomPalette() { return PALETTE_MODES[Math.floor(Math.random()*PALETTE_MODES.length)](); }
let currentPalette = randomPalette();

/* ── Distributions ── */
function randn() {
  let u=0,v=0;
  while(!u) u=Math.random(); while(!v) v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}

const DIST_TYPES = [
  // Normal
  (mean,std) => () => mean + std*randn(),
  // Bimodal
  (m,s) => () => (Math.random()<0.5 ? m-s*1.2 : m+s*1.2) + s*0.5*randn(),
  // Skewed right
  (m,s) => () => m + Math.abs(randn())*s*1.5,
  // Uniform-ish
  (m,s) => () => m + (Math.random()-0.5)*s*3.5,
  // Sharp spike
  (m,s) => () => m + randn()*s*0.4,
  // Heavy tails
  (m,s) => () => m + randn()*s / (0.1+Math.random()*0.9),
];

/* ── KDE ── */
function kde(kernel, thresholds, data) {
  return thresholds.map(x => [x, d3.mean(data, v => kernel(x - v))]);
}
function epanechnikov(bandwidth) {
  return function(v) {
    v /= bandwidth;
    return Math.abs(v) <= 1 ? 0.75*(1-v*v)/bandwidth : 0;
  };
}

/* ── Generate one ridgeline dataset ── */
function generateRidgeline(cellW, cellH) {
  const nRidges = 6 + Math.floor(Math.random()*7); // 6–12 ridges
  const distType = DIST_TYPES[Math.floor(Math.random()*DIST_TYPES.length)];
  const nSamples = 150 + Math.floor(Math.random()*200);
  const xMin = -4, xMax = 4;
  const thresholds = Array.from({length:80}, (_,i) => xMin + (xMax-xMin)*i/79);
  const bw = 0.3 + Math.random()*0.4;

  const ridges = Array.from({length: nRidges}, (_, ri) => {
    // Each ridge has a slightly shifting mean
    const mean = (ri/(nRidges-1)-0.5)*2 * (Math.random()*0.8);
    const std  = 0.5 + Math.random()*0.8;
    const dist = distType(mean, std);
    const data = Array.from({length: nSamples}, dist);
    const density = kde(epanechnikov(bw), thresholds, data);
    return density;
  });

  return { ridges, nRidges, xMin, xMax };
}

let datasets = [];
function generateDatasets() {
  const W = window.innerWidth, H = window.innerHeight;
  const cellW = (W-GAP*(GRID+1))/GRID;
  const cellH = (H-GAP*(GRID+1))/GRID;
  datasets = Array.from({length: GRID*GRID}, () => generateRidgeline(cellW, cellH));
}

/* ── Draw ── */
function drawAll() {
  const W = window.innerWidth, H = window.innerHeight;
  const cellW = (W-GAP*(GRID+1))/GRID;
  const cellH = (H-GAP*(GRID+1))/GRID;

  const svg = d3.select('#viz').attr('width',W).attr('height',H);
  svg.selectAll('*').remove();
  svg.append('rect').attr('width',W).attr('height',H).attr('fill','#07060e');

  datasets.forEach(function(ds, idx) {
    const row = Math.floor(idx/GRID), col = idx%GRID;
    const ox = GAP+col*(cellW+GAP);
    const oy = GAP+row*(cellH+GAP);
    const { ridges, nRidges, xMin, xMax } = ds;

    // Cell bg
    svg.append('rect').attr('x',ox).attr('y',oy)
      .attr('width',cellW).attr('height',cellH)
      .attr('fill','#07060e');

    // Clip to cell so ridges don't bleed into neighbours
    const clipId = 'clip-'+idx;
    svg.append('defs').append('clipPath').attr('id', clipId)
      .append('rect')
      .attr('x', ox).attr('y', oy)
      .attr('width', cellW).attr('height', cellH);

    const PAD = 0;

    const xScale = d3.scaleLinear()
      .domain([xMin, xMax])
      .range([ox, ox+cellW]);

    // Ridges drawn bottom to top — each gets a vertical band
    // Overlap: each ridge's baseline is slightly above the previous
    const overlap = 0.55; // how much ridges overlap
    const bandH   = cellH / (nRidges * (1 - overlap) + overlap);
    const step    = bandH * (1 - overlap);

    // Max density across all ridges for normalization
    const maxDensity = d3.max(ridges.flatMap(r => r.map(d => d[1])));

    const g = svg.append('g').attr('clip-path', 'url(#'+clipId+')');

    // Draw bottom-to-top so upper ridges paint over lower
    for (let ri = nRidges-1; ri >= 0; ri--) {
      const baseY = oy + cellH - PAD*0.5 - ri*step;
      const peakH = bandH * 1.1; // max height of a ridge curve

      const density = ridges[ri];
      const color = currentPalette[ri % currentPalette.length];

      const area = d3.area()
        .x(d => xScale(d[0]))
        .y0(baseY)
        .y1(d => baseY - (d[1]/maxDensity)*peakH)
        .curve(d3.curveCatmullRom.alpha(0.5));

      const line = d3.line()
        .x(d => xScale(d[0]))
        .y(d => baseY - (d[1]/maxDensity)*peakH)
        .curve(d3.curveCatmullRom.alpha(0.5));

      // Fill — dark bg so ridges below are occluded
      g.append('path')
        .datum(density)
        .attr('d', area)
        .attr('fill', '#07060e')
        .attr('opacity', 1);

      // Colored fill with low opacity
      g.append('path')
        .datum(density)
        .attr('d', area)
        .attr('fill', color)
        .attr('opacity', 0.22);

      // Bright stroke line on top
      g.append('path')
        .datum(density)
        .attr('d', line)
        .attr('fill', 'none')
        .attr('stroke', color)
        .attr('stroke-width', 1.5)
        .attr('opacity', 0.9);
    }

    // Fade in
    g.attr('opacity',0)
      .transition().duration(500).delay(idx*45)
      .attr('opacity',1);
  });
}

function regenerate() { currentPalette=randomPalette(); generateDatasets(); drawAll(); }
function newColors()  { currentPalette=randomPalette(); drawAll(); }

generateDatasets();
drawAll();
window.addEventListener('resize', () => { generateDatasets(); drawAll(); });
</script>
</body>
</html>
