<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circular Heatmaps</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #07060e; overflow: hidden; }
  svg { display: block; position: fixed; inset: 0; }
  #ui {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    z-index: 10; display: flex; gap: 12px;
  }
  button {
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; font-family: monospace; font-size: 11px; letter-spacing: 0.15em;
    text-transform: uppercase; padding: 8px 24px; cursor: pointer; transition: background 0.2s;
  }
  button:hover { background: rgba(255,255,255,0.14); }
</style>
</head>
<body>
<svg id="viz"></svg>
<div id="ui">
  <button onclick="regenerate()">&#x21BA; Regenerate</button>
  <button onclick="newColors()">&#x21BA; Colors Only</button>
</div>
<script>
const GRID = 5;
const GAP  = 3;

/* ── Diverging color schemes ── */
const SCHEMES = [
  ['#2166ac','#f7f7f7','#b2182b'],  // blue-white-red
  ['#1b7837','#f7f7f7','#762a83'],  // green-white-purple
  ['#4575b4','#ffffbf','#d73027'],  // blue-yellow-red
  ['#542788','#f7f7f7','#b35806'],  // purple-white-orange
  ['#01665e','#f5f5f5','#8c510a'],  // teal-white-brown
  ['#053061','#f7f7f7','#67001f'],  // dark blue-white-dark red
  ['#006837','#ffffcc','#a50026'],  // green-yellow-red
  ['#2d004b','#f7f7f7','#7f3b08'],  // purple-white-brown
];

function randomScheme() { return SCHEMES[Math.floor(Math.random()*SCHEMES.length)]; }
let currentScheme = randomScheme();

function makeColorScale(scheme) {
  return d3.scaleDiverging(t =>
    t <= 0.5
      ? d3.interpolateRgb(scheme[0], scheme[1])(t*2)
      : d3.interpolateRgb(scheme[1], scheme[2])((t-0.5)*2)
  ).domain([-1, 0, 1]);
}

/* ── Random matrix data ── */
function randomMatrix() {
  const nRows = 4 + Math.floor(Math.random()*7);  // 4-10 rows (rings)
  const nCols = 6 + Math.floor(Math.random()*14); // 6-19 cols (sectors)

  // Different data patterns
  const pattern = Math.floor(Math.random()*5);
  const mat = [];

  for (let r=0; r<nRows; r++) {
    const row = [];
    for (let c=0; c<nCols; c++) {
      let v;
      const t = c/nCols, s = r/nRows;
      if (pattern===0) v = (Math.random()-0.5)*2;                          // pure random
      else if (pattern===1) v = Math.sin(t*Math.PI*2)*Math.cos(s*Math.PI);// wave
      else if (pattern===2) v = (Math.random()-0.5)*2 * (1-s);            // decay outward
      else if (pattern===3) v = Math.sin((t+s)*Math.PI*3)*(Math.random()*0.4+0.6); // diagonal waves
      else v = (t-0.5)*2 * (Math.random()*0.5+0.5);                       // gradient
      row.push(Math.max(-1, Math.min(1, v)));
    }
    mat.push(row);
  }
  return { mat, nRows, nCols };
}

/* ── Draw one circular heatmap ── */
function drawCircularHeatmap(g, data, colorScale, cx, cy, radius) {
  const { mat, nRows, nCols } = data;

  const innerR = radius * 0.15; // center hole
  const outerR = radius * 0.92;
  const ringW  = (outerR - innerR) / nRows;

  const angleStep = (Math.PI * 2) / nCols;
  const gapAngle  = 0.008; // tiny gap between sectors

  for (let r=0; r<nRows; r++) {
    const r0 = innerR + r * ringW;
    const r1 = r0 + ringW - 0.5;

    for (let c=0; c<nCols; c++) {
      const a0 = c * angleStep - Math.PI/2 + gapAngle;
      const a1 = (c+1) * angleStep - Math.PI/2 - gapAngle;
      const v  = mat[r][c];

      const arc = d3.arc()
        .innerRadius(r0)
        .outerRadius(r1)
        .startAngle(a0)
        .endAngle(a1);

      g.append('path')
        .attr('d', arc)
        .attr('transform', `translate(${cx},${cy})`)
        .attr('fill', colorScale(v))
        .attr('opacity', 0.92);
    }
  }

  // Subtle center circle
  g.append('circle')
    .attr('cx', cx).attr('cy', cy)
    .attr('r', innerR - 1)
    .attr('fill', '#07060e');

  // Subtle outer ring
  g.append('circle')
    .attr('cx', cx).attr('cy', cy)
    .attr('r', outerR + 1)
    .attr('fill', 'none')
    .attr('stroke', 'rgba(255,255,255,0.06)')
    .attr('stroke-width', 0.5);
}

/* ── State ── */
let datasets = [];
function generateDatasets() {
  datasets = Array.from({length:GRID*GRID}, randomMatrix);
}

/* ── Full render ── */
function drawAll() {
  const W=window.innerWidth, H=window.innerHeight;
  const cellW=(W-GAP*(GRID+1))/GRID;
  const cellH=(H-GAP*(GRID+1))/GRID;

  const svg=d3.select('#viz').attr('width',W).attr('height',H);
  svg.selectAll('*').remove();
  svg.append('rect').attr('width',W).attr('height',H).attr('fill','#07060e');

  const colorScale = makeColorScale(currentScheme);

  datasets.forEach((data, idx) => {
    const row=Math.floor(idx/GRID), col=idx%GRID;
    const ox=GAP+col*(cellW+GAP);
    const oy=GAP+row*(cellH+GAP);
    const cx=ox+cellW/2, cy=oy+cellH/2;
    const radius = Math.min(cellW, cellH) * 0.46;

    // Clip
    const clipId='clip-'+idx;
    svg.append('defs').append('clipPath').attr('id',clipId)
      .append('rect').attr('x',ox).attr('y',oy).attr('width',cellW).attr('height',cellH);

    svg.append('rect').attr('x',ox).attr('y',oy)
      .attr('width',cellW).attr('height',cellH)
      .attr('fill','#0c0b18');

    const g=svg.append('g')
      .attr('clip-path','url(#'+clipId+')')
      .attr('opacity',0);

    drawCircularHeatmap(g, data, colorScale, cx, cy, radius);

    g.transition().duration(500).delay(idx*25).attr('opacity',1);
  });
}

function regenerate() { currentScheme=randomScheme(); generateDatasets(); drawAll(); }
function newColors()  { currentScheme=randomScheme(); drawAll(); }

generateDatasets();
drawAll();
window.addEventListener('resize', drawAll);
</script>
</body>
</html>
