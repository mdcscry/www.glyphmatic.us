<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Curves</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #07060e; overflow: hidden; }
  svg { display: block; position: fixed; inset: 0; }
  #ui {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    z-index: 10; display: flex; gap: 12px;
  }
  button {
    background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; font-family: monospace; font-size: 11px; letter-spacing: 0.15em;
    text-transform: uppercase; padding: 8px 24px; cursor: pointer; transition: background 0.2s;
  }
  button:hover { background: rgba(0,0,0,0.7); }
</style>
</head>
<body>
<svg id="viz"></svg>
<div id="ui">
  <button onclick="regenerate()">&#x21BA; Regenerate</button>
  <button onclick="newColors()">&#x21BA; Colors Only</button>
</div>
<script>
const GRID = 3;
const GAP  = 3;

function randomColor() {
  return d3.hsl(Math.random()*360, 0.92, 0.62).toString();
}
function randomPalette() {
  return Array.from({length: GRID*GRID}, randomColor);
}

/* MDS */
function mds(dist) {
  const n = dist.length;
  const D2 = dist.map(function(row) { return row.map(function(d) { return d*d; }); });
  const rowMean = D2.map(function(row) { return d3.mean(row); });
  const totalMean = d3.mean(rowMean);
  const B = Array.from({length:n}, function(_,i) {
    return Array.from({length:n}, function(_,j) {
      return -0.5*(D2[i][j]-rowMean[i]-rowMean[j]+totalMean);
    });
  });
  function powerIter(M) {
    let v = Array.from({length:n}, function() { return Math.random()-0.5; });
    let lambda = 1;
    for (let s=0;s<80;s++) {
      const Mv = v.map(function(_,i) { return d3.sum(M[i].map(function(m,j){return m*v[j];})); });
      lambda = Math.sqrt(d3.sum(Mv.map(function(x){return x*x;})));
      if (lambda<1e-10) break;
      v = Mv.map(function(x){return x/lambda;});
    }
    return {vec:v, val:lambda};
  }
  const r1 = powerIter(B);
  const v1 = r1.vec, l1 = r1.val;
  const B2 = B.map(function(row,i){return row.map(function(b,j){return b-l1*v1[i]*v1[j];});});
  const r2 = powerIter(B2);
  const v2 = r2.vec, l2 = r2.val;
  const s1=Math.sqrt(Math.max(0,l1)), s2=Math.sqrt(Math.max(0,l2));
  return Array.from({length:n},function(_,i){return {x:v1[i]*s1, y:v2[i]*s2};});
}

/* Distance matrix generators */
function randomDistMatrix() {
  const mode = Math.floor(Math.random()*5);
  const n = 12 + Math.floor(Math.random()*14);
  let pts;
  if (mode===0) {
    pts=[]; let x=0,y=0;
    const jumpAt=3+Math.floor(Math.random()*(n-6));
    for(let i=0;i<n;i++){
      if(i===jumpAt){x+=2+Math.random()*2;y+=2+Math.random()*2;}
      x+=(Math.random()-0.5)*0.3; y+=(Math.random()-0.5)*0.3;
      pts.push([x,y]);
    }
  } else if (mode===1) {
    pts=Array.from({length:n},function(_,i){
      const t=i/n, cycles=1+Math.floor(Math.random()*3);
      return [Math.sin(t*Math.PI*2*cycles)+(Math.random()-0.5)*0.3,
              Math.cos(t*Math.PI*2*cycles)+(Math.random()-0.5)*0.3];
    });
  } else if (mode===2) {
    pts=Array.from({length:n},function(_,i){
      const inA=i<n*0.4||i>n*0.75;
      return [(inA?0:3)+(Math.random()-0.5)*0.5,
              (inA?0:(Math.random()<0.5?1.5:-1.5))+(Math.random()-0.5)*0.5];
    });
  } else if (mode===3) {
    pts=Array.from({length:n},function(_,i){
      const t=i/n, r=0.5+t*2.5;
      return [r*Math.cos(t*Math.PI*4)+(Math.random()-0.5)*0.25,
              r*Math.sin(t*Math.PI*4)+(Math.random()-0.5)*0.25];
    });
  } else {
    pts=[]; let x=0,y=0;
    for(let i=0;i<n;i++){
      x+=(Math.random()-0.5)*0.45; y+=(Math.random()-0.5)*0.45;
      pts.push([x,y]);
    }
  }
  const dist=pts.map(function(a){return pts.map(function(b){
    const dx=a[0]-b[0],dy=a[1]-b[1];
    return Math.sqrt(dx*dx+dy*dy);
  });});
  return {dist:dist,n:n};
}

/* Catmull-Rom to cubic bezier */
function catmullToBezier(pts) {
  const segs=[];
  const tension=1.4;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[Math.max(0,i-1)];
    const p1=pts[i];
    const p2=pts[i+1];
    const p3=pts[Math.min(pts.length-1,i+2)];
    segs.push({
      p0: p1,
      cp1: {x:p1.x+(p2.x-p0.x)*tension/3, y:p1.y+(p2.y-p0.y)*tension/3},
      cp2: {x:p2.x-(p3.x-p1.x)*tension/3, y:p2.y-(p3.y-p1.y)*tension/3},
      p1: p2
    });
  }
  return segs;
}

/* State */
let palette = randomPalette();
let datasets = [];

function generateDatasets() {
  datasets = Array.from({length:GRID*GRID}, function(){
    const res = randomDistMatrix();
    const coords = mds(res.dist);
    return {coords:coords};
  });
}

/* Draw */
function drawAll() {
  const W=window.innerWidth, H=window.innerHeight;
  const cellW=(W-GAP*(GRID+1))/GRID;
  const cellH=(H-GAP*(GRID+1))/GRID;
  const margin=26;
  const strokeW = Math.min(cellW,cellH) * 0.022;
  const dotR    = strokeW * 0.85;

  const svg=d3.select('#viz').attr('width',W).attr('height',H);
  svg.selectAll('*').remove();
  svg.append('rect').attr('width',W).attr('height',H).attr('fill','#07060e');

  datasets.forEach(function(ds,idx){
    const row=Math.floor(idx/GRID), col=idx%GRID;
    const ox=GAP+col*(cellW+GAP);
    const oy=GAP+row*(cellH+GAP);
    const color=palette[idx];
    const cellDelay=idx*55;

    const hue = d3.hsl(d3.color(color)).h;
    const colorLight = d3.hsl(hue, 0.70, 0.76).toString();
    const colorDark  = d3.hsl(hue, 1.00, 0.20).toString();

    svg.append('rect')
      .attr('x',ox).attr('y',oy)
      .attr('width',cellW).attr('height',cellH)
      .attr('fill', d3.color(color).darker(3.8).toString());

    const coords=ds.coords;
    const xExt=d3.extent(coords,function(p){return p.x;});
    const yExt=d3.extent(coords,function(p){return p.y;});
    const xSc=d3.scaleLinear().domain(xExt).range([ox+margin, ox+cellW-margin]);
    const ySc=d3.scaleLinear().domain(yExt).range([oy+margin, oy+cellH-margin]);
    const pts=coords.map(function(p){return {x:xSc(p.x), y:ySc(p.y)};});
    const segs=catmullToBezier(pts);
    const g=svg.append('g');

    /* Curves - gradated light to dark */
    segs.forEach(function(seg,i){
      const t = segs.length > 1 ? i/(segs.length-1) : 0;
      const segColor = d3.interpolateHsl(colorLight, colorDark)(t).toString();
      const d = 'M'+seg.p0.x+','+seg.p0.y+' C'+seg.cp1.x+','+seg.cp1.y+' '+seg.cp2.x+','+seg.cp2.y+' '+seg.p1.x+','+seg.p1.y;
      g.append('path')
        .attr('d', d)
        .attr('fill','none')
        .attr('stroke', segColor)
        .attr('stroke-width', strokeW)
        .attr('stroke-linecap','round')
        .attr('stroke-linejoin','round')
        .attr('opacity',0)
        .transition().duration(300).delay(cellDelay+i*20)
        .attr('opacity',0.92);
    });

    /* Dots - white fill, colored outline gradated */
    pts.forEach(function(p,i){
      const t = pts.length > 1 ? i/(pts.length-1) : 0;
      const outlineColor = d3.interpolateHsl(colorLight, colorDark)(t).toString();
      g.append('circle')
        .attr('cx',p.x).attr('cy',p.y).attr('r',0)
        .attr('fill', outlineColor)
        .attr('stroke', d3.hsl(d3.hsl(d3.color(outlineColor)).h, Math.min(1, d3.hsl(d3.color(outlineColor)).s + 0.15), Math.min(1, d3.hsl(d3.color(outlineColor)).l + 0.22)).toString())
        .attr('stroke-width', strokeW*0.55)
        .attr('opacity',0)
        .transition().duration(200).delay(cellDelay+i*20)
        .attr('r', dotR)
        .attr('opacity',1);
    });
  });
}

function regenerate(){palette=randomPalette();generateDatasets();drawAll();}
function newColors(){palette=randomPalette();drawAll();}

generateDatasets();
drawAll();
window.addEventListener('resize',drawAll);
</script>
</body>
</html>
