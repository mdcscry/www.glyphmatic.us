<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BioFabric Grid</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; position: fixed; inset: 0; }
  #ui {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    z-index: 10; display: flex; gap: 12px;
  }
  button {
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.22);
    color: #fff; font-family: monospace; font-size: 11px; letter-spacing: 0.15em;
    text-transform: uppercase; padding: 8px 24px; cursor: pointer; transition: background 0.2s;
  }
  button:hover { background: rgba(255,255,255,0.15); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <button onclick="regenerate()">&#x21BA; Regenerate</button>
  <button onclick="newColors()">&#x21BA; Colors Only</button>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const GRID = 2;
const GAP  = 2;

/* ── Palette: one hue, light nodes + dark edges ── */
function randomPalette() {
  const baseHue = Math.random() * 360;
  const nodeColors = [];
  const edgeColors = [];
  for (let i = 0; i < 32; i++) {
    const h = (baseHue + i * (360 / 32)) % 360;
    nodeColors.push('hsl(' + h + ',50%,55%)');
    edgeColors.push('hsl(' + h + ',80%,72%)');
  }
  return { nodeColors, edgeColors };
}

/* ── Random network ── */
function generateNetwork() {
  const N = 40 + Math.floor(Math.random() * 80);
  const adj = Array.from({length: N}, function() { return []; });
  const edges = [];

  const numHubs = 3 + Math.floor(Math.random() * 5);
  const hubs = Array.from({length: numHubs}, function() {
    return Math.floor(Math.random() * N);
  });

  hubs.forEach(function(hub) {
    const degree = 8 + Math.floor(Math.random() * 20);
    for (let d = 0; d < degree; d++) {
      const target = Math.floor(Math.random() * N);
      if (target !== hub && !adj[hub].includes(target)) {
        adj[hub].push(target);
        adj[target].push(hub);
        edges.push([hub, target]);
      }
    }
  });

  const extraEdges = Math.floor(N * 1.5);
  for (let e = 0; e < extraEdges; e++) {
    const a = Math.floor(Math.random() * N);
    const b = Math.floor(Math.random() * N);
    if (a !== b && !adj[a].includes(b)) {
      adj[a].push(b);
      adj[b].push(a);
      edges.push([a, b]);
    }
  }

  return { N, adj, edges };
}

/* ── BioFabric layout ── */
function layoutBioFabric(N, adj, edges) {
  const degree = adj.map(function(a) { return a.length; });
  const visited = new Array(N).fill(false);
  const nodeOrder = [];

  while (nodeOrder.length < N) {
    let seed = -1, maxDeg = -1;
    for (let i = 0; i < N; i++) {
      if (!visited[i] && degree[i] > maxDeg) { maxDeg = degree[i]; seed = i; }
    }
    if (seed === -1) break;
    const queue = [seed];
    visited[seed] = true;
    let qi = 0;
    while (qi < queue.length) {
      const node = queue[qi++];
      nodeOrder.push(node);
      adj[node].slice().sort(function(a,b){return degree[b]-degree[a];}).forEach(function(nb) {
        if (!visited[nb]) { visited[nb] = true; queue.push(nb); }
      });
    }
  }

  const nodeRow = new Array(N);
  nodeOrder.forEach(function(node, row) { nodeRow[node] = row; });

  const edgeAssigned = new Array(edges.length).fill(false);
  const edgeColumn = new Array(edges.length).fill(-1);
  let col = 0;

  for (let row = 0; row < N; row++) {
    const node = nodeOrder[row];
    edges.forEach(function(edge, ei) {
      if (edgeAssigned[ei]) return;
      const minRow = Math.min(nodeRow[edge[0]], nodeRow[edge[1]]);
      if (minRow === row) { edgeColumn[ei] = col++; edgeAssigned[ei] = true; }
    });
  }

  return { nodeOrder, nodeRow, edgeColumn, numCols: col };
}

/* ── Draw one cell ── */
function drawCell(network, layout, palette, ox, oy, cellW, cellH) {
  const { N, adj, edges } = network;
  const { nodeOrder, nodeRow, edgeColumn, numCols } = layout;
  const { nodeColors, edgeColors } = palette;

  const PAD = 12;
  const innerW = cellW - PAD * 2;
  const innerH = cellH - PAD * 2;

  const rowSpacing = innerH / Math.max(1, N - 1);
  const colSpacing = innerW / Math.max(1, numCols - 1);
  const nodeThick  = Math.max(0.6, rowSpacing * 0.18);
  const edgeThick  = Math.max(0.4, colSpacing * 0.35);

  // Node lines
  nodeOrder.forEach(function(node, row) {
    const y = oy + PAD + row * rowSpacing;
    let minCol = numCols, maxCol = 0;
    edges.forEach(function(edge, ei) {
      if (edge[0] === node || edge[1] === node) {
        const ec = edgeColumn[ei];
        if (ec < minCol) minCol = ec;
        if (ec > maxCol) maxCol = ec;
      }
    });
    const x0 = minCol < numCols ? ox + PAD + minCol * colSpacing : ox + PAD;
    const x1 = maxCol > 0      ? ox + PAD + maxCol * colSpacing  : ox + PAD + innerW;

    ctx.strokeStyle = nodeColors[row % nodeColors.length];
    ctx.lineWidth = nodeThick;
    ctx.beginPath();
    ctx.moveTo(x0, y);
    ctx.lineTo(x1, y);
    ctx.stroke();
  });

  // Edge lines
  edges.forEach(function(edge, ei) {
    const col = edgeColumn[ei];
    if (col < 0) return;
    const x  = ox + PAD + col * colSpacing;
    const y0 = oy + PAD + Math.min(nodeRow[edge[0]], nodeRow[edge[1]]) * rowSpacing;
    const y1 = oy + PAD + Math.max(nodeRow[edge[0]], nodeRow[edge[1]]) * rowSpacing;
    const color = edgeColors[col % edgeColors.length];

    ctx.strokeStyle = color;
    ctx.lineWidth = edgeThick;
    ctx.beginPath();
    ctx.moveTo(x, y0);
    ctx.lineTo(x, y1);
    ctx.stroke();

    const sq = Math.max(1.2, edgeThick * 1.4);
    ctx.fillStyle = color;
    ctx.fillRect(x - sq/2, y0 - sq/2, sq, sq);
    ctx.fillRect(x - sq/2, y1 - sq/2, sq, sq);
  });
}

/* ── State ── */
let palette  = randomPalette();
let datasets = [];

function generateDatasets() {
  datasets = Array.from({length: GRID * GRID}, function() {
    const net = generateNetwork();
    const lay = layoutBioFabric(net.N, net.adj, net.edges);
    return { net, lay };
  });
}

/* ── Full render ── */
function drawAll() {
  const W = canvas.width, H = canvas.height;
  const cellW = (W - GAP * (GRID + 1)) / GRID;
  const cellH = (H - GAP * (GRID + 1)) / GRID;

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  datasets.forEach(function(ds, idx) {
    const row = Math.floor(idx / GRID), col = idx % GRID;
    const ox  = GAP + col * (cellW + GAP);
    const oy  = GAP + row * (cellH + GAP);

    // Slightly off-black cell bg
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(ox, oy, cellW, cellH);

    drawCell(ds.net, ds.lay, palette, ox, oy, cellW, cellH);
  });
}

function regenerate() {
  palette = randomPalette();
  generateDatasets();
  drawAll();
}

function newColors() {
  palette = randomPalette();
  drawAll();
}

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  drawAll();
}

generateDatasets();
window.addEventListener('resize', resize);
resize();
</script>
</body>
</html>
