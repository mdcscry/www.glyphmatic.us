<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wind Vector Map — Vega-Lite</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; min-height: 100vh;
    background: #0d0e12;
    color: #e8e8ec;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  .page {
    max-width: 760px;
    margin: 0 auto;
    padding: 28px 20px 40px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin: 0;
    color: #b8bcc6;
  }
  header .meta {
    font-size: 11px;
    color: #6f7480;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: 0.3px;
  }
  header .meta b {
    color: #d8dce6;
    font-weight: 500;
  }
  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
  }
  button {
    appearance: none;
    background: #1a1d24;
    color: #e8e8ec;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 999px;
    padding: 8px 16px;
    font: inherit;
    font-size: 12px;
    letter-spacing: 0.4px;
    cursor: pointer;
    transition: background 0.12s ease, border-color 0.12s ease, transform 0.08s ease;
  }
  button:hover {
    background: #232730;
    border-color: rgba(255,255,255,0.18);
  }
  button:active { transform: translateY(1px); }
  .chart-wrap {
    background: #000;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 580px;
  }
  .chart-wrap canvas { max-width: 100%; height: auto; display: block; }
  footer {
    margin-top: 14px;
    font-size: 11px;
    color: #5a5e68;
    font-family: ui-monospace, Menlo, monospace;
    line-height: 1.6;
  }
  footer code { color: #8a8f99; }
</style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Wind Vector Map</h1>
      <div class="meta" id="meta"></div>
    </header>
    <div class="controls">
      <button id="reroll">Reroll mark + palette</button>
    </div>
    <div class="chart-wrap" id="chart"></div>
    <footer id="footer"></footer>
  </div>

<script src="https://cdn.jsdelivr.net/npm/vega@6"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-lite@6"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-embed@7"></script>



<script>
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  // ---------- procedural vector field ----------
  // Pick a random field topology each render. Each mode produces a
  // distinct visual texture.
  function generateWindField() {
    const cols = 50 + Math.floor(Math.random() * 40);  // 50..89
    const rows = 38 + Math.floor(Math.random() * 32);  // 38..69
    const lonMin = -180 + Math.random() * 40;
    const lonMax = lonMin + 80 + Math.random() * 100;
    const latMin = -70 + Math.random() * 30;
    const latMax = latMin + 50 + Math.random() * 50;

    const mode = pick(['centers', 'centers', 'sinusoidal', 'braided', 'spiral', 'double-rotation', 'shockwave']);

    let fieldFn;

    if (mode === 'centers') {
      // Random vortex/source/sink/saddle centers
      const n = 3 + Math.floor(Math.random() * 5);
      const centers = [];
      for (let i = 0; i < n; i++) {
        centers.push({
          cx: lonMin + Math.random() * (lonMax - lonMin),
          cy: latMin + Math.random() * (latMax - latMin),
          kind: pick(['vortex', 'vortex', 'source', 'sink', 'saddle']),
          sign: Math.random() < 0.5 ? -1 : 1,
          strength: 0.5 + Math.random() * 1.5,
          falloff: 8 + Math.random() * 30,
        });
      }
      fieldFn = (lon, lat) => {
        let vx = 0, vy = 0;
        for (const c of centers) {
          const dx = lon - c.cx, dy = lat - c.cy;
          const r2 = dx*dx + dy*dy;
          const w = Math.exp(-r2 / (c.falloff * c.falloff));
          if (c.kind === 'vortex')      { vx += -c.sign*dy*w*c.strength; vy +=  c.sign*dx*w*c.strength; }
          else if (c.kind === 'source') { vx += dx*w*c.strength;          vy += dy*w*c.strength; }
          else if (c.kind === 'sink')   { vx += -dx*w*c.strength;         vy += -dy*w*c.strength; }
          else if (c.kind === 'saddle') { vx +=  dx*w*c.strength*c.sign;  vy += -dy*w*c.strength*c.sign; }
        }
        return [vx, vy];
      };
    } else if (mode === 'sinusoidal') {
      // Sin/cos waves crossed in two directions
      const a = 0.04 + Math.random()*0.08;
      const b = 0.04 + Math.random()*0.08;
      const phaseA = Math.random()*Math.PI*2;
      const phaseB = Math.random()*Math.PI*2;
      fieldFn = (lon, lat) => [
        Math.sin(lon*a + phaseA) * Math.cos(lat*b + phaseB),
        Math.cos(lon*a + phaseA) * Math.sin(lat*b + phaseB),
      ];
    } else if (mode === 'braided') {
      // Two interleaved sine bands at different frequencies
      const f1 = 0.05 + Math.random()*0.05;
      const f2 = 0.08 + Math.random()*0.06;
      const phase = Math.random()*Math.PI*2;
      fieldFn = (lon, lat) => [
        Math.sin(lat*f1 + phase) + 0.5*Math.cos(lat*f2),
        Math.cos(lon*f1) - 0.4*Math.sin(lon*f2 + phase),
      ];
    } else if (mode === 'spiral') {
      // Single grand spiral around a random center
      const cx = lonMin + (lonMax - lonMin) * (0.3 + Math.random()*0.4);
      const cy = latMin + (latMax - latMin) * (0.3 + Math.random()*0.4);
      const sign = Math.random() < 0.5 ? -1 : 1;
      const tightness = 0.05 + Math.random() * 0.15;
      fieldFn = (lon, lat) => {
        const dx = lon - cx, dy = lat - cy;
        const r = Math.hypot(dx, dy);
        const angle = Math.atan2(dy, dx) + sign*tightness*r;
        return [Math.cos(angle), Math.sin(angle)];
      };
    } else if (mode === 'double-rotation') {
      // Two counter-rotating vortices for a yin-yang flow
      const cx1 = lonMin + (lonMax - lonMin) * 0.3;
      const cy1 = latMin + (latMax - latMin) * 0.5;
      const cx2 = lonMin + (lonMax - lonMin) * 0.7;
      const cy2 = latMin + (latMax - latMin) * 0.5;
      const falloff = 30 + Math.random()*20;
      fieldFn = (lon, lat) => {
        const dx1 = lon - cx1, dy1 = lat - cy1;
        const dx2 = lon - cx2, dy2 = lat - cy2;
        const w1 = Math.exp(-(dx1*dx1+dy1*dy1)/(falloff*falloff));
        const w2 = Math.exp(-(dx2*dx2+dy2*dy2)/(falloff*falloff));
        return [
          -dy1*w1 + dy2*w2,
           dx1*w1 - dx2*w2,
        ];
      };
    } else if (mode === 'shockwave') {
      // Concentric rings — like ripples on water
      const cx = lonMin + (lonMax - lonMin) * (0.2 + Math.random()*0.6);
      const cy = latMin + (latMax - latMin) * (0.2 + Math.random()*0.6);
      const freq = 0.15 + Math.random()*0.15;
      fieldFn = (lon, lat) => {
        const dx = lon - cx, dy = lat - cy;
        const r = Math.hypot(dx, dy) + 0.001;
        const phase = Math.sin(r*freq);
        return [(dx/r)*phase, (dy/r)*phase];
      };
    }

    const out = [];
    for (let j = 0; j < rows; j++) {
      const lat = latMin + ((latMax - latMin) * j) / (rows - 1);
      for (let i = 0; i < cols; i++) {
        const lon = lonMin + ((lonMax - lonMin) * i) / (cols - 1);
        const [vx, vy] = fieldFn(lon, lat);
        let dir = (Math.atan2(vy, vx) * 180) / Math.PI;
        dir = (dir + 360) % 360;
        const speed = Math.hypot(vx, vy);
        out.push({ longitude: lon, latitude: lat, dir, speed });
      }
    }
    return out;
  }

  // Built-in Vega schemes plus hand-tuned custom palettes for more
  // dramatic/painterly results.
  const SCHEMES = [
    'rainbow', 'sinebow',
    'viridis', 'plasma', 'magma', 'inferno', 'turbo', 'cividis',
    'spectral', 'redyellowblue', 'redyellowgreen',
    'brownbluegreen', 'pinkyellowgreen', 'purplegreen',
    'blueorange', 'purpleorange', 'redblue',
  ];

  // Custom hand-curated palettes — interpreted as a range array, which
  // Vega-Lite will interpolate across the [0, 360] domain.
  const CUSTOM_PALETTES = [
    // sunset
    ['#0a0033', '#3b0f6f', '#a02c5d', '#f56b3a', '#ffd166', '#fff8ad'],
    // neon dream
    ['#0d0221', '#5a189a', '#e500a4', '#ff5c8a', '#ffcc00', '#7ef9ff'],
    // ice and fire
    ['#001233', '#0353a4', '#33a1c9', '#ffba08', '#dc2f02', '#9d0208'],
    // forest at night
    ['#0b132b', '#1c2541', '#3a506b', '#5bc0be', '#6fffe9', '#cfffe5'],
    // copper bloom
    ['#1a0b00', '#5e1a00', '#a8431f', '#e98a36', '#f6c453', '#fff7d6'],
    // electric coral
    ['#001219', '#005f73', '#94d2bd', '#ee9b00', '#ca6702', '#9b2226'],
    // candy pop
    ['#03071e', '#9d0208', '#dc2f02', '#f48c06', '#ffba08', '#faf3dd'],
    // deep sea
    ['#03045e', '#0077b6', '#00b4d8', '#90e0ef', '#caf0f8', '#ffffff'],
    // ultraviolet
    ['#10002b', '#240046', '#5a189a', '#9d4edd', '#c77dff', '#e0aaff'],
    // bauhaus
    ['#1d1d1f', '#f44336', '#ffeb3b', '#1976d2', '#ffffff', '#1d1d1f'],
    // mono ink
    ['#000000', '#1a1a1a', '#404040', '#808080', '#c0c0c0', '#ffffff'],
    // vapor
    ['#5f0f40', '#9a031e', '#fb8b24', '#e36414', '#0f4c5c', '#283d3b'],
    // chrome
    ['#000814', '#001d3d', '#003566', '#ffc300', '#ffd60a', '#ffffff'],
    // botanical
    ['#264653', '#2a9d8f', '#e9c46a', '#f4a261', '#e76f51', '#fefae0'],
  ];

  function pickPalette() {
    if (Math.random() < 0.45) {
      return { kind: 'scheme', value: pick(SCHEMES) };
    }
    return { kind: 'custom', value: pick(CUSTOM_PALETTES) };
  }

  // Mark variants — each must support both `angle` and `size` encodings,
  // which restricts us to `point` (with various shapes) and `text`.
  const MARK_VARIANTS = [
    { name: 'wedge',         mark: { type: 'point', shape: 'wedge', filled: true },
      angleRange: [180, 540], sizeMax: 500 },
    { name: 'arrow',         mark: { type: 'point', shape: 'arrow', filled: true },
      angleRange: [0, 360],   sizeMax: 500 },
    { name: 'stroke',        mark: { type: 'point', shape: 'stroke', strokeWidth: 1.5 },
      angleRange: [0, 360],   sizeMax: 700 },
    { name: 'stroke (thick)', mark: { type: 'point', shape: 'stroke', strokeWidth: 3 },
      angleRange: [0, 360],   sizeMax: 800 },
    { name: 'triangle-up',   mark: { type: 'point', shape: 'triangle-up', filled: true },
      angleRange: [180, 540], sizeMax: 350 },
    { name: 'triangle',      mark: { type: 'point', shape: 'triangle', filled: true },
      angleRange: [180, 540], sizeMax: 350 },
    { name: 'cross',         mark: { type: 'point', shape: 'cross', filled: true },
      angleRange: [0, 360],   sizeMax: 400 },
    { name: 'diamond',       mark: { type: 'point', shape: 'diamond', filled: true },
      angleRange: [0, 360],   sizeMax: 350 },
    { name: 'square',        mark: { type: 'point', shape: 'square', filled: true },
      angleRange: [0, 360],   sizeMax: 300 },
    { name: 'circle',        mark: { type: 'point', shape: 'circle', filled: true },
      angleRange: [0, 360],   sizeMax: 250 },
    { name: 'circle (open)', mark: { type: 'point', shape: 'circle', filled: false, strokeWidth: 1.5 },
      angleRange: [0, 360],   sizeMax: 350 },
    // Text glyphs — produce striking painterly variations
    { name: 'text · ➤',  mark: { type: 'text', text: '➤', fontSize: 14 },
      angleRange: [0, 360],   sizeMax: 400 },
    { name: 'text · ↑',  mark: { type: 'text', text: '↑', fontSize: 14, fontWeight: 'bold' },
      angleRange: [180, 540], sizeMax: 400 },
    { name: 'text · ▲',  mark: { type: 'text', text: '▲', fontSize: 14 },
      angleRange: [180, 540], sizeMax: 400 },
    { name: 'text · ✦',  mark: { type: 'text', text: '✦', fontSize: 14 },
      angleRange: [0, 360],   sizeMax: 400 },
    { name: 'text · ✺',  mark: { type: 'text', text: '✺', fontSize: 14 },
      angleRange: [0, 360],   sizeMax: 500 },
    { name: 'text · ❋',  mark: { type: 'text', text: '❋', fontSize: 14 },
      angleRange: [0, 360],   sizeMax: 500 },
    { name: 'text · ✿',  mark: { type: 'text', text: '✿', fontSize: 14 },
      angleRange: [0, 360],   sizeMax: 500 },
    { name: 'text · ✱',  mark: { type: 'text', text: '✱', fontSize: 14 },
      angleRange: [0, 360],   sizeMax: 500 },
    { name: 'text · •',  mark: { type: 'text', text: '•', fontSize: 18, fontWeight: 'bold' },
      angleRange: [0, 360],   sizeMax: 600 },
    { name: 'text · /',  mark: { type: 'text', text: '/', fontSize: 14, fontWeight: 'bold' },
      angleRange: [0, 360],   sizeMax: 500 },
    { name: 'text · ━',  mark: { type: 'text', text: '━', fontSize: 16 },
      angleRange: [0, 360],   sizeMax: 600 },
    { name: 'text · ◆',  mark: { type: 'text', text: '◆', fontSize: 14 },
      angleRange: [0, 360],   sizeMax: 400 },
  ];

  // Random projection — different geometries warp the field in interesting ways.
  // Restricted to projections that handle wide lon/lat coverage gracefully.
  const PROJECTIONS = [
    { type: 'equalEarth' },
    { type: 'naturalEarth1' },
    { type: 'mercator' },
    { type: 'orthographic',
      rotate: () => [Math.random()*360 - 180, Math.random()*60 - 30, 0] },
    { type: 'azimuthalEqualArea',
      rotate: () => [Math.random()*360 - 180, Math.random()*60 - 30, 0] },
    { type: 'conicEqualArea',
      parallels: () => [10 + Math.random()*30, 40 + Math.random()*30] },
    { type: 'conicConformal',
      parallels: () => [10 + Math.random()*30, 40 + Math.random()*30] },
    { type: 'conicEquidistant',
      parallels: () => [10 + Math.random()*30, 40 + Math.random()*30] },
    { type: 'equirectangular' },
  ];

  function pickProjection() {
    const p = pick(PROJECTIONS);
    const out = { type: p.type };
    if (p.rotate) out.rotate = p.rotate();
    if (p.parallels) out.parallels = p.parallels();
    return out;
  }

  // Slight background variations — sometimes pure black, sometimes a
  // deep tinted black for mood.
  const BACKGROUNDS = [
    '#000',
    '#000',           // most often pure black
    '#080110',        // deep purple-black
    '#000814',        // navy-black
    '#0a0500',        // burnt-black
    '#0a0010',        // wine-black
    '#04080a',        // ink
  ];

  function render() {
    const variant = pick(MARK_VARIANTS);
    const palette = pickPalette();
    const projection = pickProjection();
    const background = pick(BACKGROUNDS);
    const data = generateWindField();

    // Build the color scale based on palette kind
    const colorScale = { domain: [0, 360] };
    if (palette.kind === 'scheme') {
      colorScale.scheme = palette.value;
    } else {
      // Custom palette: use as range. Vega-Lite will interpolate.
      colorScale.range = palette.value;
    }

    const spec = {
      $schema: 'https://vega.github.io/schema/vega-lite/v6.json',
      description: 'Vector array map showing wind speed and direction.',
      width: 700,
      height: 560,
      data: { values: data },
      projection: projection,
      mark: variant.mark,
      encoding: {
        longitude: { field: 'longitude', type: 'quantitative' },
        latitude:  { field: 'latitude',  type: 'quantitative' },
        color: {
          field: 'dir',
          type: 'quantitative',
          scale: colorScale,
          legend: null,
        },
        angle: {
          field: 'dir',
          type: 'quantitative',
          scale: { domain: [0, 360], range: variant.angleRange },
        },
        size: {
          field: 'speed',
          type: 'quantitative',
          scale: { rangeMax: variant.sizeMax },
          legend: null,
        },
      },
      config: {
        aria: false,
        background: background,
        view: { step: 10, fill: background, stroke: null },
      },
    };

    const paletteLabel = palette.kind === 'scheme'
      ? palette.value
      : 'custom (' + palette.value.length + ' stops)';

    document.getElementById('meta').innerHTML =
      `mark: <b>${variant.name}</b>` +
      ` &nbsp;·&nbsp; palette: <b>${paletteLabel}</b>` +
      ` &nbsp;·&nbsp; projection: <b>${projection.type}</b>`;
    document.getElementById('footer').innerHTML =
      `<code>${data.length} samples · ${variant.name}</code>`;

    vegaEmbed('#chart', spec, {
      actions: false,
      renderer: 'canvas',
    }).catch(err => {
      document.getElementById('chart').innerHTML =
        `<pre style="color:#f88;font-size:11px;padding:20px;">${err.message}</pre>`;
    });
  }

  document.getElementById('reroll').addEventListener('click', render);
  render();
</script>
</body>
</html>
