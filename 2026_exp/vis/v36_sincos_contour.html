<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sin(x)cos(y)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3-contour/4.0.2/d3-contour.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #fff; overflow: hidden; }
  canvas { display: block; position: fixed; inset: 0; }
  #ui {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    z-index: 10; display: flex; gap: 12px;
  }
  button {
    background: rgba(0,0,0,0.07); border: 1px solid rgba(0,0,0,0.2);
    color: #333; font-family: monospace; font-size: 11px; letter-spacing: 0.15em;
    text-transform: uppercase; padding: 8px 24px; cursor: pointer; transition: background 0.2s;
  }
  button:hover { background: rgba(0,0,0,0.13); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <button onclick="nextFn()">&#x21BA; Function</button>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

/* ── Function library — all produce nice tiling diverging patterns ── */
const FUNCTIONS = [
  { label: 'sin(x)·cos(y)',           fn: (x,y) => Math.sin(x)*Math.cos(y) },
  { label: 'cos(x)·cos(y)',           fn: (x,y) => Math.cos(x)*Math.cos(y) },
  { label: 'sin(x+y)',                fn: (x,y) => Math.sin(x+y) },
  { label: 'sin(x)·sin(y)',           fn: (x,y) => Math.sin(x)*Math.sin(y) },
  { label: 'sin(x²+y²)',             fn: (x,y) => Math.sin(x*x*0.25+y*y*0.25) },
  { label: 'cos(x)·sin(x+y)',         fn: (x,y) => Math.cos(x)*Math.sin(x+y) },
  { label: 'sin(2x)·cos(2y)',         fn: (x,y) => Math.sin(2*x)*Math.cos(2*y) },
  { label: 'sin(x+cos(y))',           fn: (x,y) => Math.sin(x+Math.cos(y)) },
];

let fnIdx = 0;

/* ── Diverging color scale: -1 → blue, 0 → white, +1 → red ── */
// Matches the Observable Plot "diverging" color scheme
const colorScale = d3.scaleDiverging(d3.interpolateRdBu).domain([1, 0, -1]);

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return [r,g,b];
}

/* ── Render ── */
function render() {
  const W = canvas.width, H = canvas.height;
  const fn = FUNCTIONS[fnIdx].fn;

  // Map viewport to 6π × 4π domain (same as the Observable example)
  // Tile by repeating the domain across the viewport
  const xDomain = 6 * Math.PI;
  const yDomain = 4 * Math.PI;

  const imgData = ctx.createImageData(W, H);
  const px = imgData.data;

  for (let py2 = 0; py2 < H; py2++) {
    for (let px2 = 0; px2 < W; px2++) {
      // Map pixel to domain, tiling seamlessly
      const x = (px2 / W) * xDomain;
      const y = (py2 / H) * yDomain;
      const v = fn(x, y); // in [-1, 1]

      const col = colorScale(v);
      const [r,g,b] = hexToRgb(d3.color(col).formatHex());
      const i = (py2 * W + px2) * 4;
      px[i]   = r;
      px[i+1] = g;
      px[i+2] = b;
      px[i+3] = 255;
    }
  }

  ctx.putImageData(imgData, 0, 0);

  /* ── Faint contour lines on top ── */
  const RES = 200;
  const vals = new Float64Array(RES * RES);
  for (let j=0; j<RES; j++) {
    for (let i=0; i<RES; i++) {
      const x = (i/RES) * xDomain;
      const y = (j/RES) * yDomain;
      vals[j*RES+i] = fn(x,y);
    }
  }

  const nLevels = 16;
  const thresholds = Array.from({length:nLevels}, (_,i) => -1 + 2*(i+0.5)/nLevels);
  const contours = d3.contours().size([RES,RES]).thresholds(thresholds)(vals);

  const xSc = d3.scaleLinear().domain([0,RES]).range([0,W]);
  const ySc = d3.scaleLinear().domain([0,RES]).range([0,H]);

  // Draw contour lines onto canvas via path2D
  const pathGen = d3.geoPath().projection(
    d3.geoTransform({ point: function(x,y){ this.stream.point(xSc(x),ySc(y)); } })
  );

  // Use a temp SVG to get path strings, then draw on canvas
  const svgNS = 'http://www.w3.org/2000/svg';
  const svgEl = document.createElementNS(svgNS,'svg');
  svgEl.style.display='none';
  document.body.appendChild(svgEl);

  ctx.save();
  ctx.strokeStyle = 'rgba(0,0,0,0.18)';
  ctx.lineWidth   = 0.5;
  ctx.fillStyle   = 'none';

  contours.forEach(c => {
    const pathEl = document.createElementNS(svgNS,'path');
    pathEl.setAttribute('d', pathGen(c));
    svgEl.appendChild(pathEl);
    const p = new Path2D(pathGen(c));
    ctx.stroke(p);
  });

  document.body.removeChild(svgEl);
  ctx.restore();
}

let currentFnIdx = 0;
function nextFn() {
  fnIdx = (fnIdx + 1) % FUNCTIONS.length;
  render();
}

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  render();
}

window.addEventListener('resize', resize);
resize();
</script>
</body>
</html>
