<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Albers study v3 — subtle paper texture</title>
<style>
  :root { --bg: #efe9d9; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 24px;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  .wrap { width: 100%; max-width: 720px; }
  .controls {
    display: flex;
    gap: 12px;
    margin: 0 0 16px;
    flex-wrap: wrap;
    align-items: center;
  }
  button {
    font: inherit;
    font-size: 13px;
    padding: 8px 14px;
    background: #fff;
    color: #1f1e1d;
    border: 0.5px solid rgba(0,0,0,0.12);
    border-radius: 8px;
    cursor: pointer;
  }
  button:hover { background: #f6f3ea; }
  button:active { transform: scale(0.98); }
  .stage {
    aspect-ratio: 1 / 1;
    width: 100%;
    background: var(--bg);
  }
  svg { display: block; width: 100%; height: 100%; }
  .slider-group {
    display: flex;
    gap: 8px;
    align-items: center;
    font-size: 12px;
    color: #6b6a66;
  }
  input[type="range"] { width: 90px; accent-color: #1f1e1d; }
  .val { font-variant-numeric: tabular-nums; min-width: 30px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="controls">
    <button id="reroll">Re-shuffle</button>
    <div class="slider-group">
      <label>edge</label>
      <input type="range" id="displacement" min="0" max="6" value="2" step="0.25"/>
      <span class="val" id="displacement-val">2</span>
    </div>
    <div class="slider-group">
      <label>mottle</label>
      <input type="range" id="mottle" min="0" max="0.5" value="0.18" step="0.02"/>
      <span class="val" id="mottle-val">0.18</span>
    </div>
    <div class="slider-group">
      <label>grain</label>
      <input type="range" id="grain" min="0.01" max="0.15" value="0.05" step="0.005"/>
      <span class="val" id="grain-val">0.05</span>
    </div>
  </div>
  <div class="stage">
    <svg id="canvas" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet"></svg>
  </div>
</div>

<script>
(function() {
  const svg = document.getElementById('canvas');
  const SVG_NS = 'http://www.w3.org/2000/svg';

  const COLORS = {
    paper:      '#efe9d9',
    magenta:    '#c2317d',
    red:        '#dc3a26',
    chartreuse: '#bcc637',
    babyBlue:   '#7fb6c5'
  };

  function el(name, attrs, children) {
    const e = document.createElementNS(SVG_NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (children) for (const c of children) e.appendChild(c);
    return e;
  }

  /**
   * Single combined filter for painted shapes:
   *   1. Generate fractal noise (low frequency, few octaves) — the "mottle"
   *   2. Composite the noise onto the source using arithmetic blend
   *      (technique from the example you sent: k1=0, k2=1, k3=mottle, k4=0
   *       which means output = noise + mottle * source. We invert this so
   *       the source dominates and noise just adds tonal variation.)
   *   3. Generate a SECOND finer noise for edge displacement
   *   4. Apply feDisplacementMap with very small scale — subtle fiber
   *
   * Result: paint that has slight tonal mottling on the surface and
   * gently fibered edges, without overwhelming the shape.
   */
  function buildFilter(seed, edgeScale, mottleAmount, grainFreq) {
    const defs = el('defs');

    const f = el('filter', {
      id: 'paint',
      x: '-5%', y: '-5%', width: '110%', height: '110%',
      filterUnits: 'objectBoundingBox'
    });

    // Step 1: surface mottling noise (the "lightPaint" recipe from your example)
    f.appendChild(el('feTurbulence', {
      type: 'fractalNoise',
      baseFrequency: grainFreq,
      numOctaves: '2',
      seed: seed,
      result: 'mottleNoise'
    }));

    // Step 2: arithmetic composite —
    //   output = k1*in*in2 + k2*in + k3*in2 + k4
    // With k1=0, k2=1, k3=mottleAmount, k4=0 we get: source + mottleAmount * noise
    // This adds the noise as a subtle tonal overlay on the paint.
    // Note: in1 is SourceGraphic (the paint), in2 is the noise.
    f.appendChild(el('feComposite', {
      in: 'SourceGraphic',
      in2: 'mottleNoise',
      operator: 'arithmetic',
      k1: '0',
      k2: '1',
      k3: mottleAmount,
      k4: '0',
      result: 'mottled'
    }));

    // Step 3: edge displacement noise — finer scale, slightly stretched
    // so the displacement runs vaguely vertically (like brushstrokes)
    f.appendChild(el('feTurbulence', {
      type: 'fractalNoise',
      baseFrequency: '0.04 0.08',
      numOctaves: '2',
      seed: seed + 1,
      result: 'edgeNoise'
    }));

    // Step 4: very subtle edge displacement
    f.appendChild(el('feDisplacementMap', {
      in: 'mottled',
      in2: 'edgeNoise',
      scale: edgeScale,
      xChannelSelector: 'R',
      yChannelSelector: 'G'
    }));

    defs.appendChild(f);
    return defs;
  }

  // Light polygonal pre-jitter — much more subtle than before since
  // the displacement filter handles most of the edge break-up
  function paintedRect(x, y, w, h, jitter, segments) {
    segments = segments || 10;
    jitter = jitter == null ? 1.5 : jitter;
    const points = [];
    function jit() { return (Math.random() - 0.5) * 2 * jitter; }

    for (let i = 0; i <= segments; i++) {
      const t = i / segments;
      points.push([x + t * w, y + jit()]);
    }
    for (let i = 1; i <= segments; i++) {
      const t = i / segments;
      points.push([x + w + jit(), y + t * h]);
    }
    for (let i = 1; i <= segments; i++) {
      const t = i / segments;
      points.push([x + w - t * w, y + h + jit()]);
    }
    for (let i = 1; i < segments; i++) {
      const t = i / segments;
      points.push([x + jit(), y + h - t * h]);
    }

    let d = 'M ' + points[0][0] + ' ' + points[0][1];
    for (let i = 1; i < points.length; i++) {
      d += ' L ' + points[i][0] + ' ' + points[i][1];
    }
    d += ' Z';
    return d;
  }

  function build() {
    while (svg.firstChild) svg.removeChild(svg.firstChild);

    const seed = Math.floor(Math.random() * 1000);
    const edgeScale = parseFloat(document.getElementById('displacement').value);
    const mottleAmount = parseFloat(document.getElementById('mottle').value);
    const grainFreq = parseFloat(document.getElementById('grain').value);

    svg.appendChild(buildFilter(seed, edgeScale, mottleAmount, grainFreq));

    // Paper background — plain cream rectangle, NO filter applied here
    svg.appendChild(el('rect', {
      x: 0, y: 0, width: 1000, height: 1000, fill: COLORS.paper
    }));

    // All painted shapes go in this group with the paint filter applied
    const paintGroup = el('g', { filter: 'url(#paint)' });

    const W = 1000, H = 1000;
    const paperMargin = 70;
    // No center gap — panels touch directly
    const leftX = paperMargin;
    const leftY = paperMargin;
    const leftW = (W / 2) - paperMargin;
    const leftH = H - 2 * paperMargin;
    const rightX = W / 2;
    const rightY = paperMargin;
    const rightW = (W / 2) - paperMargin;
    const rightH = H - 2 * paperMargin;

    // Magenta and red fields touching at the center seam
    paintGroup.appendChild(el('path', {
      d: paintedRect(leftX, leftY, leftW, leftH, 3, 20),
      fill: COLORS.magenta
    }));
    paintGroup.appendChild(el('path', {
      d: paintedRect(rightX, rightY, rightW, rightH, 3, 20),
      fill: COLORS.red
    }));

    // ---- Left: nested downward-opening brackets ----
    const leftCx = leftX + leftW * 0.50;

    const bar1W = leftW * 0.42;
    const bar1H = leftH * 0.85;
    const bar1X = leftCx - bar1W / 2;
    const bar1Y = leftY + leftH * 0.12;

    const bar2W = bar1W * 0.55;
    const bar2H = leftH * 0.78;
    const bar2X = leftCx - bar2W / 2 + bar1W * 0.04;
    const bar2Y = leftY + leftH * 0.18;

    const bar3W = bar2W * 0.36;
    const bar3H = leftH * 0.71;
    const bar3X = leftCx - bar3W / 2 + bar1W * 0.02;
    const bar3Y = leftY + leftH * 0.25;

    paintGroup.appendChild(el('path', { d: paintedRect(bar1X, bar1Y, bar1W, bar1H, 1, 10), fill: COLORS.chartreuse }));
    paintGroup.appendChild(el('path', { d: paintedRect(bar2X, bar2Y, bar2W, bar2H, 1, 10), fill: COLORS.babyBlue }));
    paintGroup.appendChild(el('path', { d: paintedRect(bar3X, bar3Y, bar3W, bar3H, 1, 10), fill: COLORS.chartreuse }));

    // ---- Right: nested upward-opening brackets ----
    const rightCx = rightX + rightW * 0.50;

    const rbar1W = rightW * 0.42;
    const rbar1H = rightH * 0.85;
    const rbar1X = rightCx - rbar1W / 2;
    const rbar1Bottom = rightY + rightH * 0.88;
    const rbar1Y = rbar1Bottom - rbar1H;

    const rbar2W = rbar1W * 0.55;
    const rbar2H = rightH * 0.78;
    const rbar2X = rightCx - rbar2W / 2 - rbar1W * 0.04;
    const rbar2Bottom = rightY + rightH * 0.82;
    const rbar2Y = rbar2Bottom - rbar2H;

    const rbar3W = rbar2W * 0.36;
    const rbar3H = rightH * 0.71;
    const rbar3X = rightCx - rbar3W / 2 - rbar1W * 0.02;
    const rbar3Bottom = rightY + rightH * 0.75;
    const rbar3Y = rbar3Bottom - rbar3H;

    paintGroup.appendChild(el('path', { d: paintedRect(rbar1X, rbar1Y, rbar1W, rbar1H, 1, 10), fill: COLORS.babyBlue }));
    paintGroup.appendChild(el('path', { d: paintedRect(rbar2X, rbar2Y, rbar2W, rbar2H, 1, 10), fill: COLORS.chartreuse }));
    paintGroup.appendChild(el('path', { d: paintedRect(rbar3X, rbar3Y, rbar3W, rbar3H, 1, 10), fill: COLORS.babyBlue }));

    svg.appendChild(paintGroup);
  }

  // Wire up controls
  function bindSlider(id, valId, formatter) {
    const slider = document.getElementById(id);
    const val = document.getElementById(valId);
    slider.addEventListener('input', () => {
      val.textContent = formatter ? formatter(slider.value) : slider.value;
      build();
    });
  }
  bindSlider('displacement', 'displacement-val');
  bindSlider('mottle', 'mottle-val', v => parseFloat(v).toFixed(2));
  bindSlider('grain', 'grain-val', v => parseFloat(v).toFixed(3));
  document.getElementById('reroll').addEventListener('click', build);

  build();
})();
</script>
</body>
</html>
