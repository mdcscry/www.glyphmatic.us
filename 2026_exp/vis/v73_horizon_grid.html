<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horizon Grid</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  #ui {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    z-index: 100; display: flex; gap: 12px;
  }
  button { background: rgba(0,0,0,0.15); border: 1px solid rgba(0,0,0,0.3); color: #fff; font-family: monospace; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; padding: 8px 20px; cursor: pointer; }
  button:hover { background: rgba(0,0,0,0.3); }
</style>
</head>
<body>
<canvas id="c" style="display:block;position:fixed;inset:0"></canvas>
<div id="ui">
  <button onclick="regenerate()">↺ Regenerate</button>
</div>
<script>
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

var SCHEMES = [
  { top: '#2233cc', bottom: '#11aa44', sq1: '#11aa44', sq2: '#f5f0e0', sq3: '#2233cc' },
  { top: '#cc2211', bottom: '#f5c800', sq1: '#f5c800', sq2: '#ffffff', sq3: '#cc2211' },
  { top: '#111188', bottom: '#cc4400', sq1: '#cc4400', sq2: '#f0e8d0', sq3: '#111188' },
  { top: '#006644', bottom: '#cc2244', sq1: '#cc2244', sq2: '#f5f0e0', sq3: '#006644' },
  { top: '#440066', bottom: '#cc8800', sq1: '#cc8800', sq2: '#f5f0e0', sq3: '#440066' },
];

var current = SCHEMES[0];

function render() {
  var W = canvas.width, H = canvas.height;

  // 35/65 split
  var splitY = Math.floor(H * 0.35);

  // Top color
  ctx.fillStyle = current.top;
  ctx.fillRect(0, 0, W, splitY);

  // Bottom color
  ctx.fillStyle = current.bottom;
  ctx.fillRect(0, splitY, W, H - splitY);

  /* ── Square grid at boundary ──
     Two rows of squares sitting at the split line.
     Row A (top): squares sit WITH their top half in top color zone
                  color = bottom color (so they're visible against top)
     Row B (bottom): squares sit WITH their bottom half in bottom color zone
                  alternating sq2 and sq3 colors
     Row B is offset by half a square width from Row A.
  ── */

  var sqSize = Math.floor(W / 18); // ~10-12 squares across
  var gap    = Math.floor(sqSize * 0.15); // small gap between squares
  var step   = sqSize + gap;
  var nCols  = Math.ceil(W / step) + 1;

  // Row A — top half sits above split, bottom half below
  // Squares are sq1 color (bottom color) against the top background
  var rowAY = splitY - sqSize; // top of square just above split
  for (var c = 0; c < nCols; c++) {
    var x = c * step - gap;
    ctx.fillStyle = current.sq1;
    ctx.fillRect(x, rowAY, sqSize, sqSize);
  }

  // Row B — offset by half step, sits below split
  // Alternating sq2 and sq3
  var rowBY = splitY; // top of square at split
  for (var c2 = 0; c2 < nCols; c2++) {
    var x2 = c2 * step - gap + step * 0.5; // offset by half
    ctx.fillStyle = c2 % 2 === 0 ? current.sq2 : current.sq3;
    ctx.fillRect(x2, rowBY, sqSize, sqSize);
  }

  // Row C — another row below B, same offset as A
  var rowCY = splitY + sqSize + gap;
  for (var c3 = 0; c3 < nCols; c3++) {
    var x3 = c3 * step - gap;
    ctx.fillStyle = c3 % 2 === 0 ? current.sq3 : current.sq2;
    ctx.fillRect(x3, rowCY, sqSize, sqSize);
  }
}

function regenerate() {
  current = SCHEMES[Math.floor(Math.random() * SCHEMES.length)];
  render();
}

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  render();
}

window.addEventListener('resize', resize);
resize();
</script>
</body>
</html>
