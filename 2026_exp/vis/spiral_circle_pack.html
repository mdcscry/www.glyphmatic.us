<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spiral circle pack</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0d0d0d;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:100vh;padding:24px;font-family:system-ui,sans-serif}
  #controls{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
  button{font-size:12px;padding:6px 14px;cursor:pointer;border-radius:6px;border:1px solid #444;background:#1a1a1a;color:#ccc;transition:background .15s}
  button:hover{background:#2a2a2a}
  select{font-size:12px;padding:6px 10px;border-radius:6px;border:1px solid #444;background:#1a1a1a;color:#ccc}
  canvas{border-radius:50%;display:block}
</style>
</head>
<body>

<div id="controls">
  <select id="palSel">
    <option value="coral">Coral</option>
    <option value="electric">Electric blue</option>
    <option value="gold">Gold</option>
    <option value="mint">Mint</option>
    <option value="violet">Violet</option>
    <option value="crimson">Crimson</option>
    <option value="cyan">Cyan</option>
  </select>
  <button id="palBtn">Change palette</button>
  <button id="regenBtn">Regenerate</button>
</div>
<canvas id="c"></canvas>

<script>
const PALS={
  coral:    {a:'#FF6B6B', b:'#FF8E53', bg:'#0d0d0d'},
  electric: {a:'#4CC9F0', b:'#4361EE', bg:'#0a0a12'},
  gold:     {a:'#F4A261', b:'#E9C46A', bg:'#0d0b00'},
  mint:     {a:'#2EC4B6', b:'#80ED99', bg:'#020d0b'},
  violet:   {a:'#C77DFF', b:'#7B2FBE', bg:'#0a0010'},
  crimson:  {a:'#E63946','b':'#FF006E', bg:'#0d0005'},
  cyan:     {a:'#00F5D4', b:'#00BBF9', bg:'#000d10'},
};

const cvs=document.getElementById('c');
const ctx=cvs.getContext('2d');
const SIZE=640;
cvs.width=cvs.height=SIZE;

function getPal(){
  return PALS[document.getElementById('palSel').value];
}

function rnd(a,b){return a+Math.random()*(b-a);}
function rndInt(a,b){return Math.floor(rnd(a,b+1));}

function hexToRgb(h){
  const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);
  return[r,g,b];
}

function lerpColor(c1,c2,t){
  return c1.map((v,i)=>Math.round(v+(c2[i]-v)*t));
}

function rgbStr(c){return`rgb(${c[0]},${c[1]},${c[2]})`;}

// Draw an Archimedean spiral inside a circle
function drawSpiral(cx,cy,r,pal,seed){
  const ca=hexToRgb(pal.a),cb=hexToRgb(pal.b);
  const spacing=rnd(1.8,3.5);
  const turns=r/spacing;
  const totalAngle=turns*Math.PI*2;
  const steps=Math.ceil(totalAngle*8);
  const startAngle=seed*Math.PI*2;
  const lineW=Math.max(0.4,r*0.018);

  ctx.save();
  ctx.beginPath();
  ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.clip();

  ctx.lineWidth=lineW;
  ctx.lineCap='round';

  ctx.beginPath();
  let first=true;
  for(let i=0;i<=steps;i++){
    const t=i/steps;
    const angle=startAngle+t*totalAngle;
    const rad=t*r;
    const x=cx+rad*Math.cos(angle);
    const y=cy+rad*Math.sin(angle);
    const col=lerpColor(ca,cb,t);
    if(first){ctx.moveTo(x,y);first=false;}
    else ctx.lineTo(x,y);
  }
  ctx.strokeStyle=rgbStr(ca);
  ctx.stroke();

  // Redraw in segments for color gradient
  for(let i=0;i<steps;i++){
    const t0=i/steps,t1=(i+1)/steps;
    const a0=startAngle+t0*totalAngle,a1=startAngle+t1*totalAngle;
    const r0=t0*r,r1=t1*r;
    ctx.beginPath();
    ctx.moveTo(cx+r0*Math.cos(a0),cy+r0*Math.sin(a0));
    ctx.lineTo(cx+r1*Math.cos(a1),cy+r1*Math.sin(a1));
    ctx.strokeStyle=rgbStr(lerpColor(ca,cb,(t0+t1)/2));
    ctx.lineWidth=lineW;
    ctx.stroke();
  }

  ctx.restore();
}

// Circle packing using spiral placement
function packCircles(W,H,outerR,count){
  const circles=[];
  const cx=W/2,cy=H/2;
  let attempts=0;
  const maxA=count*80;

  // Spiral search for placement
  let angle=0,dist=0;
  const step=2.5;

  while(circles.length<count && attempts<maxA){
    attempts++;
    angle+=0.5;
    dist+=step/(2*Math.PI);
    const px=cx+dist*Math.cos(angle);
    const py=cy+dist*Math.sin(angle);

    const maxR=Math.min(
      outerR-Math.hypot(px-cx,py-cy),
      rnd(8,outerR*0.38)
    );
    if(maxR<6)continue;

    let r=maxR;
    for(const c of circles){
      const d=Math.hypot(px-c.x,py-c.y)-c.r;
      if(d<r)r=d;
    }
    r=Math.min(r,maxR);
    if(r<6)continue;

    circles.push({x:px,y:py,r:r-1.5});
  }
  return circles;
}

function render(){
  const pal=getPal();
  ctx.fillStyle=pal.bg;
  ctx.fillRect(0,0,SIZE,SIZE);

  const outerR=SIZE/2-10;
  const cx=SIZE/2,cy=SIZE/2;

  // Draw background fill of outer circle
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx,cy,outerR,0,Math.PI*2);
  ctx.fillStyle=pal.bg;
  ctx.fill();
  ctx.restore();

  const count=rndInt(28,52);
  const circles=packCircles(SIZE,SIZE,outerR,count);

  // Sort largest first for visual weight
  circles.sort((a,b)=>b.r-a.r);

  circles.forEach((c,i)=>{
    const seed=Math.random();
    // Fill circle background white or dark
    const useDark=Math.random()>0.35;
    ctx.save();
    ctx.beginPath();
    ctx.arc(c.x,c.y,c.r,0,Math.PI*2);
    ctx.fillStyle=useDark?pal.bg:'#ffffff';
    ctx.fill();
    ctx.restore();

    // Draw spiral
    if(useDark){
      drawSpiral(c.x,c.y,c.r,pal,seed);
    } else {
      // White bg: use darker stroke
      const invPal={a:pal.a,b:pal.bg,bg:'#ffffff'};
      drawSpiral(c.x,c.y,c.r,invPal,seed);
    }

    // Circle border
    ctx.beginPath();
    ctx.arc(c.x,c.y,c.r,0,Math.PI*2);
    ctx.strokeStyle='rgba(255,255,255,0.08)';
    ctx.lineWidth=0.5;
    ctx.stroke();
  });

  // Outer ring
  ctx.beginPath();
  ctx.arc(cx,cy,outerR,0,Math.PI*2);
  ctx.strokeStyle='rgba(255,255,255,0.12)';
  ctx.lineWidth=1;
  ctx.stroke();
}

document.getElementById('palBtn').addEventListener('click',()=>{
  const sel=document.getElementById('palSel');
  const keys=Object.keys(PALS);
  sel.selectedIndex=(sel.selectedIndex+1)%keys.length;
  render();
});
document.getElementById('regenBtn').addEventListener('click',render);
document.getElementById('palSel').addEventListener('change',render);

render();
</script>
</body>
</html>
