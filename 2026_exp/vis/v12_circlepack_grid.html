<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glowing Orbs</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #07060e; overflow: hidden; }
  svg { display: block; position: fixed; inset: 0; }
  #ui {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    z-index: 10; display: flex; gap: 12px;
  }
  button {
    background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.18);
    color: #fff; font-family: monospace; font-size: 11px; letter-spacing: 0.15em;
    text-transform: uppercase; padding: 8px 24px; cursor: pointer; transition: background 0.2s;
  }
  button:hover { background: rgba(0,0,0,0.7); }
</style>
</head>
<body>
<svg id="viz"></svg>
<div id="ui">
  <button onclick="regenerate()">↺ Regenerate</button>
  <button onclick="newColors()">↺ Colors Only</button>
</div>

<script>
const GRID = 3;

/* ── Palettes — warm, vivid, glowable ── */
const PALETTE_MODES = [
  () => ['#ff2d55','#ff6b35','#ffd60a','#34c759','#5ac8fa','#bf5af2','#ff9f0a'],
  () => ['#ff3b30','#ff9500','#ffcc02','#4cd964','#5ac8fa','#007aff','#ff2d55'],
  () => { const b=Math.random()*360; return Array.from({length:7},(_,i)=>d3.hsl((b+i*51)%360,1.0,0.62).toString()); },
  () => ['#f72585','#b5179e','#7209b7','#3a0ca3','#4361ee','#4cc9f0','#f77f00'],
  () => { const b=Math.random()*360; return Array.from({length:7},(_,i)=>d3.hsl((b+i*28)%360,0.95,0.60+i*0.02).toString()); },
  () => ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff922b','#cc5de8','#20c997'],
];

function randomPalette() {
  return PALETTE_MODES[Math.floor(Math.random() * PALETTE_MODES.length)]();
}

/* ── Parse hex/hsl to rgb components for gradient stops ── */
function toRgb(colorStr) {
  const c = d3.color(colorStr);
  return c ? c.rgb() : d3.rgb(255,100,100);
}

/* ── Random hierarchy ── */
function randomHierarchy() {
  const numGroups = 2 + Math.floor(Math.random() * 3);
  return {
    name: 'root',
    children: Array.from({length: numGroups}, (_, gi) => ({
      name: `g${gi}`, group: gi,
      children: Array.from({length: 3 + Math.floor(Math.random() * 7)}, (_, ci) => {
        const hasSubs = Math.random() < 0.3;
        if (hasSubs) {
          return {
            name: `g${gi}c${ci}`, group: gi,
            children: Array.from({length: 2 + Math.floor(Math.random() * 4)}, (_, si) => ({
              name: `g${gi}c${ci}s${si}`, group: gi,
              value: Math.pow(Math.random(), 0.5) * 70 + 8
            }))
          };
        }
        return { name: `g${gi}c${ci}`, group: gi, value: Math.pow(Math.random(), 0.5) * 80 + 8 };
      })
    }))
  };
}

/* ── State ── */
let currentPalette = randomPalette();
let datasets = [];

function generateDatasets() {
  datasets = Array.from({length: GRID * GRID}, () => randomHierarchy());
}

/* ── Draw ── */
function drawAll() {
  const W = window.innerWidth;
  const H = window.innerHeight;
  const cellW = W / GRID;
  const cellH = H / GRID;
  const r = Math.min(cellW, cellH) * 0.46;

  const svg = d3.select('#viz').attr('width', W).attr('height', H);
  svg.selectAll('*').remove();

  /* ── Defs: one radial gradient + glow filter per group color ── */
  const defs = svg.append('defs');

  // Soft glow blur filter
  const filter = defs.append('filter')
    .attr('id', 'glow')
    .attr('x', '-50%').attr('y', '-50%')
    .attr('width', '200%').attr('height', '200%');
  filter.append('feGaussianBlur')
    .attr('stdDeviation', '4')
    .attr('result', 'blur');
  const merge = filter.append('feMerge');
  merge.append('feMergeNode').attr('in', 'blur');
  merge.append('feMergeNode').attr('in', 'SourceGraphic');

  // Stronger bloom for parent orbs
  const filterStrong = defs.append('filter')
    .attr('id', 'glow-strong')
    .attr('x', '-80%').attr('y', '-80%')
    .attr('width', '260%').attr('height', '260%');
  filterStrong.append('feGaussianBlur')
    .attr('stdDeviation', '8')
    .attr('result', 'blur');
  const merge2 = filterStrong.append('feMerge');
  merge2.append('feMergeNode').attr('in', 'blur');
  merge2.append('feMergeNode').attr('in', 'SourceGraphic');

  // Radial gradients for each palette color
  currentPalette.forEach((color, i) => {
    const rgb = toRgb(color);
    const grad = defs.append('radialGradient')
      .attr('id', `rg-${i}`)
      .attr('cx', '38%').attr('cy', '35%')
      .attr('r', '65%');
    grad.append('stop').attr('offset', '0%')
      .attr('stop-color', `rgb(${Math.min(255,rgb.r+80)},${Math.min(255,rgb.g+80)},${Math.min(255,rgb.b+80)})`)
      .attr('stop-opacity', 1);
    grad.append('stop').attr('offset', '55%')
      .attr('stop-color', color)
      .attr('stop-opacity', 0.95);
    grad.append('stop').attr('offset', '100%')
      .attr('stop-color', `rgb(${Math.max(0,rgb.r-60)},${Math.max(0,rgb.g-60)},${Math.max(0,rgb.b-60)})`)
      .attr('stop-opacity', 0.85);
  });

  datasets.forEach((data, idx) => {
    const row = Math.floor(idx / GRID);
    const col = idx % GRID;
    const cx = col * cellW + cellW / 2;
    const cy = row * cellH + cellH / 2;
    const cellDelay = idx * 55;

    const root = d3.hierarchy(data)
      .sum(d => d.value || 0)
      .sort((a, b) => b.value - a.value);

    d3.pack().size([r * 2, r * 2]).padding(3)(root);

    const cell = svg.append('g')
      .attr('transform', `translate(${cx - r},${cy - r})`);

    const nodes = root.descendants().slice(1);

    // Draw parent (non-leaf) nodes first — ghosted glow shells
    cell.selectAll('circle.parent')
      .data(nodes.filter(d => d.children))
      .join('circle')
        .attr('class', 'parent')
        .attr('cx', d => d.x)
        .attr('cy', d => d.y)
        .attr('r', d => d.r)
        .attr('fill', d => {
          const gi = d.ancestors().slice(-2)[0]?.data?.group ?? 0;
          return `url(#rg-${gi % currentPalette.length})`;
        })
        .attr('opacity', 0)
        .attr('filter', 'url(#glow-strong)')
      .transition()
        .duration(800)
        .delay(cellDelay)
        .attr('opacity', 0.22);

    // Draw leaf nodes — bright glowing orbs
    cell.selectAll('circle.leaf')
      .data(nodes.filter(d => !d.children))
      .join('circle')
        .attr('class', 'leaf')
        .attr('cx', d => d.x)
        .attr('cy', d => d.y)
        .attr('r', 0)
        .attr('fill', d => {
          const gi = d.ancestors().slice(-2)[0]?.data?.group ?? 0;
          return `url(#rg-${gi % currentPalette.length})`;
        })
        .attr('filter', 'url(#glow)')
        .attr('opacity', 0)
      .transition()
        .duration(700)
        .delay((d, i) => cellDelay + i * 10)
        .ease(d3.easeBounceOut)
        .attr('r', d => d.r)
        .attr('opacity', 0.92);
  });
}

function regenerate() {
  currentPalette = randomPalette();
  generateDatasets();
  drawAll();
}

function newColors() {
  currentPalette = randomPalette();
  drawAll();
}

generateDatasets();
drawAll();
window.addEventListener('resize', drawAll);
</script>
</body>
</html>
