<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vector Field Grid</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100vw; height: 100vh;
    background: #000;
    color: #e8e8ec;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }
  .grid {
    position: fixed; inset: 0;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 1px;
    background: #1a1c22;
  }
  .cell {
    position: relative;
    background: #000;
    overflow: hidden;
  }
  .mark {
    position: absolute;
    top: 0; left: 0;
    transform-origin: center;
    will-change: transform;
    pointer-events: none;
    line-height: 1;
  }
  .toolbar {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 10;
  }
  .toolbar button {
    appearance: none;
    background: rgba(15, 17, 22, 0.9);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #e8e8ec;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px;
    padding: 9px 18px;
    font: inherit;
    font-size: 12px;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: background 0.12s ease, border-color 0.12s ease, transform 0.08s ease;
  }
  .toolbar button:hover {
    background: rgba(35, 39, 48, 0.95);
    border-color: rgba(255,255,255,0.25);
  }
  .toolbar button:active { transform: translateY(1px); }
</style>
</head>
<body>

<div class="grid" id="grid"></div>

<div class="toolbar">
  <button id="btnPalette">Change palette</button>
  <button id="btnShapes">Change shapes</button>
</div>

<script>
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const rand = (a, b) => a + Math.random() * (b - a);

  // ---------- palettes ----------
  // Each palette is an array of hex colors; cell direction (0..360) maps
  // to a position along the array and we lerp between adjacent stops.
  const PALETTES = [
    ['#0a0033', '#3b0f6f', '#a02c5d', '#f56b3a', '#ffd166', '#fff8ad'],     // sunset
    ['#0d0221', '#5a189a', '#e500a4', '#ff5c8a', '#ffcc00', '#7ef9ff'],     // neon
    ['#001233', '#0353a4', '#33a1c9', '#ffba08', '#dc2f02', '#9d0208'],     // ice and fire
    ['#0b132b', '#1c2541', '#3a506b', '#5bc0be', '#6fffe9', '#cfffe5'],     // forest at night
    ['#1a0b00', '#5e1a00', '#a8431f', '#e98a36', '#f6c453', '#fff7d6'],     // copper
    ['#001219', '#005f73', '#94d2bd', '#ee9b00', '#ca6702', '#9b2226'],     // coral
    ['#03071e', '#9d0208', '#dc2f02', '#f48c06', '#ffba08', '#faf3dd'],     // candy
    ['#03045e', '#0077b6', '#00b4d8', '#90e0ef', '#caf0f8', '#ffffff'],     // deep sea
    ['#10002b', '#240046', '#5a189a', '#9d4edd', '#c77dff', '#e0aaff'],     // ultraviolet
    ['#5f0f40', '#9a031e', '#fb8b24', '#e36414', '#0f4c5c', '#283d3b'],     // vapor
    ['#000814', '#001d3d', '#003566', '#ffc300', '#ffd60a', '#ffffff'],     // chrome
    ['#264653', '#2a9d8f', '#e9c46a', '#f4a261', '#e76f51', '#fefae0'],     // botanical
    ['#000','#ff006e','#fb5607','#ffbe0b','#8338ec','#3a86ff'],             // bauhaus pop
    ['#0d0d0d','#1a1a2e','#16213e','#0f3460','#e94560','#f9ed69'],          // dusk
    ['#000','#1a1a1a','#404040','#808080','#c0c0c0','#ffffff'],             // mono
    // viridis-ish
    ['#440154','#3b528b','#21908c','#5dc863','#fde725'],
    // plasma-ish
    ['#0d0887','#6a00a8','#b12a90','#e16462','#fca636','#f0f921'],
    // turbo-ish
    ['#30123b','#4662d8','#36abdf','#36e29b','#e3d52e','#fa6f30','#7a0403'],
    // rainbow
    ['#9400d3','#4b0082','#0000ff','#00ff00','#ffff00','#ff7f00','#ff0000'],
  ];

  function hexToRgb(h) {
    h = h.replace('#','');
    if (h.length === 3) h = h.split('').map(c=>c+c).join('');
    return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
  }
  function rgbToCss(rgb) { return `rgb(${rgb[0]|0}, ${rgb[1]|0}, ${rgb[2]|0})`; }
  function lerpRgb(a, b, t) {
    return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
  }
  function sampleColor(palette, t) {
    // t in [0,1]
    t = Math.max(0, Math.min(1, t));
    const n = palette.length - 1;
    const scaled = t * n;
    const i = Math.floor(scaled);
    const f = scaled - i;
    if (i >= n) return rgbToCss(hexToRgb(palette[n]));
    return rgbToCss(lerpRgb(hexToRgb(palette[i]), hexToRgb(palette[i+1]), f));
  }

  // ---------- shape variants ----------
  // Each variant describes how to render one mark: an HTML element
  // (often just text) that gets sized and rotated. We also note whether
  // angle is the natural direction or needs +180 offset.
  const SHAPES = [
    { glyph: '➤',  fontSize: [8, 20] },
    { glyph: '↑',  fontSize: [10, 24], bold: true },
    { glyph: '▲',  fontSize: [6, 18] },
    { glyph: '✦',  fontSize: [6, 18] },
    { glyph: '✺',  fontSize: [8, 22] },
    { glyph: '❋',  fontSize: [8, 22] },
    { glyph: '✿',  fontSize: [8, 22] },
    { glyph: '✱',  fontSize: [8, 22] },
    { glyph: '•',  fontSize: [4, 16], bold: true },
    { glyph: '/',  fontSize: [8, 22], bold: true },
    { glyph: '━',  fontSize: [10, 26] },
    { glyph: '◆',  fontSize: [6, 18] },
    { glyph: '▶',  fontSize: [8, 22] },
    { glyph: '◢',  fontSize: [8, 22] },
    { glyph: '■',  fontSize: [4, 16] },
    { glyph: '●',  fontSize: [4, 14] },
    { glyph: '◯',  fontSize: [6, 18] },
    { glyph: '✧',  fontSize: [8, 22] },
    { glyph: '✶',  fontSize: [8, 22] },
    { glyph: '➜',  fontSize: [8, 22] },
    { glyph: '⟶',  fontSize: [10, 26] },
    { glyph: '〉', fontSize: [10, 24], bold: true },
  ];

  // ---------- field generators ----------
  // Each returns a function that takes normalized (x, y) in [0,1] and
  // returns [vx, vy]. We then derive dir = atan2(vy, vx) and speed = mag.
  function makeField() {
    const mode = pick(['centers', 'centers', 'sinusoidal', 'braided', 'spiral', 'double-rotation', 'shockwave']);

    if (mode === 'centers') {
      const n = 2 + Math.floor(Math.random() * 4);
      const centers = [];
      for (let i = 0; i < n; i++) {
        centers.push({
          cx: rand(0, 1), cy: rand(0, 1),
          kind: pick(['vortex','vortex','source','sink','saddle']),
          sign: Math.random() < 0.5 ? -1 : 1,
          strength: rand(0.5, 2),
          falloff: rand(0.15, 0.5),
        });
      }
      return (x, y) => {
        let vx = 0, vy = 0;
        for (const c of centers) {
          const dx = x - c.cx, dy = y - c.cy;
          const r2 = dx*dx + dy*dy;
          const w = Math.exp(-r2 / (c.falloff * c.falloff));
          if (c.kind === 'vortex')      { vx += -c.sign*dy*w*c.strength; vy +=  c.sign*dx*w*c.strength; }
          else if (c.kind === 'source') { vx +=  dx*w*c.strength;         vy +=  dy*w*c.strength; }
          else if (c.kind === 'sink')   { vx += -dx*w*c.strength;         vy += -dy*w*c.strength; }
          else                          { vx +=  dx*w*c.strength*c.sign;  vy += -dy*w*c.strength*c.sign; }
        }
        return [vx, vy];
      };
    }
    if (mode === 'sinusoidal') {
      const a = rand(3, 9), b = rand(3, 9);
      const phaseA = Math.random()*Math.PI*2, phaseB = Math.random()*Math.PI*2;
      return (x, y) => [
        Math.sin(x*a + phaseA) * Math.cos(y*b + phaseB),
        Math.cos(x*a + phaseA) * Math.sin(y*b + phaseB),
      ];
    }
    if (mode === 'braided') {
      const f1 = rand(5, 12), f2 = rand(7, 15);
      const phase = Math.random()*Math.PI*2;
      return (x, y) => [
        Math.sin(y*f1 + phase) + 0.5*Math.cos(y*f2),
        Math.cos(x*f1) - 0.4*Math.sin(x*f2 + phase),
      ];
    }
    if (mode === 'spiral') {
      const cx = rand(0.3, 0.7), cy = rand(0.3, 0.7);
      const sign = Math.random() < 0.5 ? -1 : 1;
      const tightness = rand(2, 8);
      return (x, y) => {
        const dx = x - cx, dy = y - cy;
        const r = Math.hypot(dx, dy);
        const angle = Math.atan2(dy, dx) + sign*tightness*r;
        return [Math.cos(angle), Math.sin(angle)];
      };
    }
    if (mode === 'double-rotation') {
      const cx1 = 0.3, cy1 = 0.5, cx2 = 0.7, cy2 = 0.5;
      const falloff = rand(0.25, 0.5);
      return (x, y) => {
        const dx1 = x - cx1, dy1 = y - cy1;
        const dx2 = x - cx2, dy2 = y - cy2;
        const w1 = Math.exp(-(dx1*dx1+dy1*dy1)/(falloff*falloff));
        const w2 = Math.exp(-(dx2*dx2+dy2*dy2)/(falloff*falloff));
        return [-dy1*w1 + dy2*w2, dx1*w1 - dx2*w2];
      };
    }
    // shockwave
    const cx = rand(0.3, 0.7), cy = rand(0.3, 0.7);
    const freq = rand(10, 25);
    return (x, y) => {
      const dx = x - cx, dy = y - cy;
      const r = Math.hypot(dx, dy) + 0.001;
      const phase = Math.sin(r*freq);
      return [(dx/r)*phase, (dy/r)*phase];
    };
  }

  // ---------- cell state ----------
  const NCELLS = 25;
  const cellEls = [];
  const cellState = [];

  const gridEl = document.getElementById('grid');
  for (let i = 0; i < NCELLS; i++) {
    const d = document.createElement('div');
    d.className = 'cell';
    gridEl.appendChild(d);
    cellEls.push(d);
    cellState.push(makeCellState());
  }

  function makeCellState() {
    // Each cell has its own field, shape, density, and rotation offset.
    return {
      field: makeField(),
      shape: pick(SHAPES),
      density: pick([12, 14, 16, 18, 20, 24]), // grid resolution within cell
      angleOffset: pick([0, 90, 180, 270]) + (Math.random() < 0.3 ? rand(-30, 30) : 0),
    };
  }

  // Current shared palette across all cells.
  let currentPalette = pick(PALETTES);

  function renderCell(idx) {
    const el = cellEls[idx];
    const state = cellState[idx];
    const w = el.clientWidth;
    const h = el.clientHeight;
    if (w === 0 || h === 0) return;

    const n = state.density;
    const cw = w / n;     // cell column width
    const ch = h / n;     // cell row height
    const cellSize = Math.min(cw, ch);
    const minFs = state.shape.fontSize[0];
    const maxFs = state.shape.fontSize[1];

    // First pass: compute speeds to normalize sizing
    const samples = [];
    let maxSpeed = 0.001;
    for (let j = 0; j < n; j++) {
      for (let i = 0; i < n; i++) {
        const x = (i + 0.5) / n;
        const y = (j + 0.5) / n;
        const [vx, vy] = state.field(x, y);
        const speed = Math.hypot(vx, vy);
        const dir = Math.atan2(vy, vx);  // radians
        samples.push({ i, j, x, y, dir, speed });
        if (speed > maxSpeed) maxSpeed = speed;
      }
    }

    // Build HTML in one shot for performance
    const parts = [];
    for (const s of samples) {
      const speedNorm = s.speed / maxSpeed;
      // direction normalized to [0,1] for color
      const dirNorm = ((s.dir / (Math.PI*2)) + 1) % 1;
      const color = sampleColor(currentPalette, dirNorm);
      const fontSize = minFs + speedNorm * (maxFs - minFs);
      const angleDeg = (s.dir * 180 / Math.PI) + state.angleOffset;
      const cx = s.x * w;
      const cy = s.y * h;
      // Bold flag if any
      const weight = state.shape.bold ? 'font-weight:bold;' : '';
      // Use translate(-50%,-50%) so the glyph centers on (cx, cy) regardless of font box.
      parts.push(
        `<span class="mark" style="left:${cx.toFixed(1)}px;top:${cy.toFixed(1)}px;`+
        `font-size:${fontSize.toFixed(2)}px;color:${color};${weight}`+
        `transform:translate(-50%,-50%) rotate(${angleDeg.toFixed(2)}deg);">`+
        `${state.shape.glyph}</span>`
      );
    }
    el.innerHTML = parts.join('');
  }

  function renderAll() {
    for (let i = 0; i < NCELLS; i++) renderCell(i);
  }

  document.getElementById('btnPalette').addEventListener('click', () => {
    currentPalette = pick(PALETTES);
    renderAll();
  });

  document.getElementById('btnShapes').addEventListener('click', () => {
    for (let i = 0; i < NCELLS; i++) cellState[i] = makeCellState();
    renderAll();
  });

  // Re-render on resize so positions snap to new cell sizes.
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(renderAll, 100);
  });

  // Initial render after layout is ready.
  requestAnimationFrame(() => requestAnimationFrame(renderAll));
</script>
</body>
</html>
