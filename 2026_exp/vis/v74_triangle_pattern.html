<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Triangle Pinwheel</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #f5f5f0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
  #ui { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; gap: 12px; }
  button { background: rgba(0,0,0,0.08); border: 1px solid rgba(0,0,0,0.25); color: #333; font-family: monospace; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; padding: 8px 20px; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <button onclick="toggleInvert()">Invert</button>
</div>
<script>
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var inv = false;

// Unicode isosceles right triangles
var TRI = {
  right: String.fromCodePoint(0x1F782),  // 🞂
  left:  String.fromCodePoint(0x1F780),  // 🞀
  up:    String.fromCodePoint(0x1F781),  // 🞁
  down:  String.fromCodePoint(0x1F783),  // 🞃
};

/* ── Draw panel at origin (0,0), w x h
   3 vertical lines of 4 triangles each
   Alternates dir1/dir2 down each line
   Lines offset by half a glyph height
── */
function drawPanel(w, h, sz, dir1, dir2, color) {
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  var nLines = 3, nTris = 4;
  var stepY  = h / (nTris + 1);
  var halfTri = sz * 0.5;

  var xs = [w * 0.28, w * 0.50, w * 0.72];

  for (var li = 0; li < nLines; li++) {
    var lx  = xs[li];
    var off = (2 - li) * halfTri;

    for (var ti = 0; ti < nTris; ti++) {
      var cy = off + stepY * 0.5 + ti * stepY;
      if (cy > h - sz * 0.5) break;
      ctx.font = 'bold ' + Math.round(sz) + 'px serif';

      var glyph = (ti % 2 === 0) ? TRI[dir1] : TRI[dir2];

      // Measure glyph width to align BASE edge to the column line
      // For right-pointing: base is LEFT edge → shift right by half width
      // For left-pointing:  base is RIGHT edge → shift left by half width
      var gw = ctx.measureText(glyph).width;
      var dx = (glyph === TRI.right || glyph === TRI.up)   ?  gw / 2 :
               (glyph === TRI.left  || glyph === TRI.down) ? -gw / 2 : 0;

      ctx.fillText(glyph, lx + dx, cy);
    }
  }
}

function render() {
  var W = canvas.width, H = canvas.height;
  var S    = Math.min(W, H) * 0.88;
  var ox   = (W - S) / 2, oy = (H - S) / 2;
  var cell = S / 3;

  var color = inv ? '#f0f0ec' : '#1a1a18';
  var bg    = inv ? '#1a1a18' : '#f5f5f0';

  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = color;
  ctx.lineWidth = 0.8;
  ctx.strokeRect(ox, oy, S, S);

  // Base size — grows 2x per panel around the pinwheel
  var base = cell * 0.05;
  var szs  = [base * 2, base * 4, base * 6, base * 8];

  // LEFT panel: cells (1,1)+(2,1) — col 0, rows 0-1
  // right/left triangles
  ctx.save();
  ctx.translate(ox, oy);
  drawPanel(cell, 2 * cell, szs[0], 'right', 'left', color);
  ctx.restore();

  // TOP panel: cells (1,2)+(1,3) — cols 1-2, row 0
  // Rotate 90° CW: translate to top-right of area then rotate
  ctx.save();
  ctx.translate(ox + 3 * cell, oy);
  ctx.rotate(Math.PI / 2);
  drawPanel(cell, 2 * cell, szs[1], 'right', 'left', color);
  ctx.restore();

  // RIGHT panel: cells (2,3)+(3,3) — col 2, rows 1-2
  // Rotate 180°
  ctx.save();
  ctx.translate(ox + 3 * cell, oy + 3 * cell);
  ctx.rotate(Math.PI);
  drawPanel(cell, 2 * cell, szs[2], 'right', 'left', color);
  ctx.restore();

  // BOTTOM panel: cells (3,1)+(3,2) — cols 0-1, row 2
  // Rotate 270° CW
  ctx.save();
  ctx.translate(ox, oy + 3 * cell);
  ctx.rotate(-Math.PI / 2);
  drawPanel(cell, 2 * cell, szs[3], 'right', 'left', color);
  ctx.restore();
}

function toggleInvert() {
  inv = !inv;
  render();
}

function resize() {
  var s = Math.min(window.innerWidth, window.innerHeight) * 0.95;
  canvas.width  = Math.round(s);
  canvas.height = Math.round(s);
  render();
}

window.addEventListener('resize', resize);
resize();
</script>
</body>
</html>
