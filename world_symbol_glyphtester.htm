body {

    margin-bottom: 30px;

    padding-bottom: 20px;

    font-size: 14px;
    margin-bottom: 10px;
    color: #888;
}

.font-samples {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
}

.glyph-sample {
    text-align: center;
    padding: 10px;
    background: #2a2a2a;
    border-radius: 4px;
    min-width: 80px;
}

.glyph-char {
    font-size: 48px;
    display: block;
    margin-bottom: 5px;
}

    font-size: 11px;

<h1>Glyph/Font Tester</h1>
<div id="output"></div>

<script>
const output = document.getElementById('output');

myFontSet.forEach((fontData, index) => {
    if (!fontData) return;
    
    const codePoint = fontData[0];
    const fonts = fontData.slice(1);
    
    const char = codePoint.startsWith('x') 
        ? String.fromCodePoint(parseInt(codePoint.substring(1), 16))
        : String.fromCodePoint(parseInt(codePoint));
    
    const row = document.createElement('div');
    row.className = 'glyph-row';
    
    const header = document.createElement('div');
    header.className = 'glyph-header';
    header.textContent = `U+${codePoint.startsWith('x') ? codePoint.substring(1) : parseInt(codePoint).toString(16).toUpperCase()} (${codePoint})`;
    row.appendChild(header);
    
    const samples = document.createElement('div');
    samples.className = 'font-samples';
    
    fonts.forEach(font => {
        const sample = document.createElement('div');
        sample.className = 'glyph-sample';
        
        const charSpan = document.createElement('span');
        charSpan.className = 'glyph-char';
        charSpan.style.fontFamily = `'${font}'`;
        charSpan.textContent = char;
        
        const fontLabel = document.createElement('div');
        fontLabel.className = 'font-name';
        fontLabel.textContent = font;
        
        sample.appendChild(charSpan);
        sample.appendChild(fontLabel);
        samples.appendChild(sample);
    });
    
    row.appendChild(samples);
    output.appendChild(row);
});
</script>
